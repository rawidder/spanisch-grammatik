:root[data-theme="dark"]{
  --paper:#11151d; --sheet:#171c26; --grid:#1f2633; --ink:#e7ebf2; --muted:#9aa4b5;
  --blue:#6fd6c4; --blue-soft:#15302c; --red:#ff7b82; --red-soft:#3a1d22;
  --green:#6fd3a0; --green-soft:#16302a; --amber:#f1b95b; --amber-soft:#36290f; --line:#2a3242; color-scheme:dark; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-attachment:fixed}
button{font:inherit;color:inherit}
a{color:var(--blue)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
em{font-style:normal;color:var(--blue)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:52px}
.back{border:0;background:none;color:var(--blue);font-size:17px;padding:6px 4px;cursor:pointer;display:flex;align-items:center;gap:2px}
.top .t{font-family:var(--f-display);font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .num{font-family:var(--f-display);color:var(--amber);font-size:18px}

/* home */
.hero{padding:22px 0 10px}
.hero h1{font-size:34px;line-height:1.1}
.hero p{color:var(--muted);margin:.5em 0 0;max-width:34em}
.stats{display:flex;gap:10px;margin:16px 0 4px;flex-wrap:wrap}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--muted)}
.stat b{display:block;color:var(--ink);font-size:20px;font-family:var(--f-display);font-weight:400}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.qbtn{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font-weight:700;font-size:15px}
.qbtn small{display:block;font-weight:400;opacity:.85;font-size:13px;margin-top:2px}
.qbtn.alt{background:var(--sheet);color:var(--ink);border:1px solid var(--line)}
:root[data-theme="dark"] .qbtn:not(.alt){color:#0e1420}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .qbtn:not(.alt){color:#0e1420} }
.search{width:100%;margin:12px 0 4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);font:inherit;color:var(--ink)}
.teil{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:700}
.list{background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.list::before{content:"";position:absolute;left:52px;top:0;bottom:0;width:1.5px;background:var(--amber);opacity:.55}
.row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row .n{width:26px;text-align:right;font-family:var(--f-display);color:var(--amber);font-size:18px;flex:none;font-variant-numeric:tabular-nums}
.row .tt{flex:1;min-width:0;padding-left:8px}
.row .tt b{display:block;font-weight:700}
.row .tt small{color:var(--muted);font-size:13px}
.ring{flex:none;width:30px;height:30px}
.hit{padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.hit small{color:var(--muted);display:block;font-size:13px}

/* chapter */
.chhead{padding:18px 0 6px}
.chhead .kn{color:var(--amber);font-family:var(--f-display);font-size:15px}
.chhead h1{font-size:30px;line-height:1.12;margin-top:2px}
.chhead p{color:var(--muted);margin:.55em 0 0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--sheet) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:0;background:none;padding:8px 4px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--blue);background:var(--blue-soft)}

.toc{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.sec{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;scroll-margin-top:70px}
.sec h2{font-size:21px;line-height:1.2;margin-bottom:8px}
.sec p{margin:.5em 0}
.sec ul,.sec ol{padding-left:1.2em;margin:.5em 0}
.sec li{margin:.2em 0}
.sec small{color:var(--muted);font-size:.88em}
.tw{overflow-x:auto;margin:10px -4px}
.sec table{border-collapse:collapse;width:100%;font-size:15px}
.sec th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line);font-weight:700}
.sec td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tip,.warn{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15.5px}
.tip{background:var(--blue-soft)}
.tip::before{content:"Merke";display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--blue);margin-bottom:2px}
.warn{background:var(--red-soft)}
.warn::before{content:"Achtung";display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--red);margin-bottom:2px}
.next{display:flex;gap:10px;margin:18px 0}
.next button{flex:1}

/* exercises */
.ex{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.ex h2{font-size:20px}
.ex .task{color:var(--muted);margin:.3em 0 .8em;font-size:15px}
.ex .score{font-size:13px;color:var(--muted);float:right;margin-top:4px}
.it{padding:10px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.q{line-height:1.9}
.q .ix{color:var(--muted);font-size:14px;margin-right:6px}
.gap{font:inherit;font-size:16px;color:var(--blue);border:0;border-bottom:2px solid var(--muted);background:transparent;min-width:5.5em;width:7em;padding:0 2px;border-radius:0;outline:none}
.gap:focus{border-bottom-color:var(--blue)}
.gap.ok{border-bottom-color:var(--green);color:var(--green)}
.gap.bad{border-bottom-color:var(--red);color:var(--red)}
.gap.near{border-bottom-color:var(--amber);color:var(--amber)}
.de{color:var(--muted);font-size:14px;display:block}
.fb{font-size:14px;margin-top:4px}
.fb.ok{color:var(--green)} .fb.bad{color:var(--red)} .fb.near{color:var(--amber)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:15.5px;color:var(--blue)}
.opt.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt.bad{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.opt[disabled]{cursor:default}
.why{font-size:14px;color:var(--muted);margin-top:6px}
.bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:700;font-size:15px;background:var(--blue);color:var(--sheet)}
.btn.sec2{background:var(--blue-soft);color:var(--blue)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:400}
.btn:focus-visible,.opt:focus-visible,.row:focus-visible,.tab:focus-visible,.chip:focus-visible,.qbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* cards */
.cardwrap{padding:14px 0}
.cardmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}
.fc{perspective:1200px;height:min(56vh,380px);cursor:pointer;-webkit-tap-highlight-color:transparent}
.fc .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);
  background:var(--sheet);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;overflow:auto}
.face .lab{position:absolute;top:12px;left:16px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.face .tx{font-size:22px;line-height:1.35;font-family:var(--f-display)}
.face.back{transform:rotateY(180deg);background:var(--blue-soft)}
.face.back .tx{color:var(--blue);font-family:var(--f-body);font-weight:700}
.face .src{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cardbtns .btn{padding:14px}
.btn.no{background:var(--red-soft);color:var(--red)}
.btn.yes{background:var(--green-soft);color:var(--green)}
.done{text-align:center;padding:40px 10px}
.done h2{font-size:26px}
.empty{color:var(--muted)}
@media (prefers-reduced-motion: reduce){ .fc .inner{transition:none} }
</style>
</head>

<script type="application/json" id="data">[{"nr":1,"title":"Aussprache und Schreibung","teil":"Einführung","intro":"Spanisch wird weitgehend so gesprochen, wie es geschrieben wird – wer die wenigen Laut- und Akzentregeln kennt, kann jedes Wort richtig lesen und schreiben. Dieses Kapitel legt dafür das Fundament.","sections":[{"h":"Das Alphabet und Buchstabieren","html":"<p>Das spanische Alphabet hat 27 Buchstaben: die 26 bekannten plus <em>ñ<\/em>. <em>ch<\/em> und <em>ll<\/em> sind seit 2010 offiziell keine eigenen Buchstaben mehr, werden aber als ein Laut gesprochen. Die Buchstaben sind feminin: <em>la a, la be, la eñe<\/em>.<\/p><table><tr><th>Buchstabe<\/th><th>Name<\/th><th>Buchstabe<\/th><th>Name<\/th><\/tr><tr><td>a<\/td><td><em>a<\/em><\/td><td>ñ<\/td><td><em>eñe<\/em><\/td><\/tr><tr><td>b<\/td><td><em>be<\/em><\/td><td>o<\/td><td><em>o<\/em><\/td><\/tr><tr><td>c<\/td><td><em>ce<\/em><\/td><td>p<\/td><td><em>pe<\/em><\/td><\/tr><tr><td>d<\/td><td><em>de<\/em><\/td><td>q<\/td><td><em>cu<\/em><\/td><\/tr><tr><td>e<\/td><td><em>e<\/em><\/td><td>r<\/td><td><em>erre<\/em><\/td><\/tr><tr><td>f<\/td><td><em>efe<\/em><\/td><td>s<\/td><td><em>ese<\/em><\/td><\/tr><tr><td>g<\/td><td><em>ge<\/em><\/td><td>t<\/td><td><em>te<\/em><\/td><\/tr><tr><td>h<\/td><td><em>hache<\/em><\/td><td>u<\/td><td><em>u<\/em><\/td><\/tr><tr><td>i<\/td><td><em>i<\/em><\/td><td>v<\/td><td><em>uve<\/em><\/td><\/tr><tr><td>j<\/td><td><em>jota<\/em><\/td><td>w<\/td><td><em>uve doble<\/em><\/td><\/tr><tr><td>k<\/td><td><em>ka<\/em><\/td><td>x<\/td><td><em>equis<\/em><\/td><\/tr><tr><td>l<\/td><td><em>ele<\/em><\/td><td>y<\/td><td><em>ye<\/em><\/td><\/tr><tr><td>m<\/td><td><em>eme<\/em><\/td><td>z<\/td><td><em>zeta<\/em><\/td><\/tr><tr><td>n<\/td><td><em>ene<\/em><\/td><td><\/td><td><\/td><\/tr><\/table><p>Buchstabieren: <em>¿Cómo se escribe su apellido?<\/em> – <em>Hache, u, be, e, erre.<\/em> (Huber). Doppelbuchstaben: <em>doble ele<\/em> oder <em>dos eles<\/em>; Akzent: <em>con tilde<\/em> („mit Akzent“).<\/p><div class=\"tip\">Merke: In Lateinamerika hört man für <em>v<\/em> oft <em>ve corta<\/em> und für <em>b<\/em> <em>be larga<\/em>; für <em>w<\/em> auch <em>doble ve<\/em>.<\/div>"},{"h":"Konsonanten I: c, z, qu, g, j, gue/gui/güe","html":"<p><b>c und z<\/b>: <em>c<\/em> vor <em>e, i<\/em> und <em>z<\/em> werden in Nord- und Zentralspanien wie englisches „th“ gesprochen (<b>distinción<\/b>, umgangssprachlich oft „ceceo“ genannt; streng genommen meint <em>ceceo<\/em>, dass auch das s wie th klingt, wie in Teilen Andalusiens): <em>cena, cine, zapato, luz<\/em>. In weiten Teilen Andalusiens, auf den Kanaren und in ganz Lateinamerika klingt es wie ein stimmloses s (<b>seseo<\/b>): <em>cena<\/em> = „sena“. Vor <em>a, o, u<\/em> und vor Konsonant ist <em>c<\/em> ein k: <em>casa, cosa, cuna, clase<\/em>.<\/p><p><b>qu<\/b>: Für den k-Laut vor <em>e, i<\/em> schreibt man <em>qu<\/em>, das u ist stumm: <em>queso, quince, aquí<\/em>.<\/p><p><b>g und j<\/b>: <em>j<\/em> immer und <em>g<\/em> vor <em>e, i<\/em> sind ein rauer Rachenlaut wie in „ach“: <em>jamón, jefe, gente, girar<\/em>. Vor <em>a, o, u<\/em> ist <em>g<\/em> ein normales g: <em>gato, gol, gusto<\/em>.<\/p><table><tr><th>Laut<\/th><th>vor a, o, u<\/th><th>vor e, i<\/th><\/tr><tr><td>k<\/td><td><em>ca, co, cu<\/em><\/td><td><em>que, qui<\/em><\/td><\/tr><tr><td>th / s<\/td><td><em>za, zo, zu<\/em><\/td><td><em>ce, ci<\/em><\/td><\/tr><tr><td>g<\/td><td><em>ga, go, gu<\/em><\/td><td><em>gue, gui<\/em><\/td><\/tr><tr><td>ch (ach)<\/td><td><em>ja, jo, ju<\/em><\/td><td><em>ge, gi / je, ji<\/em><\/td><\/tr><tr><td>gw<\/td><td><em>gua, guo<\/em><\/td><td><em>güe, güi<\/em><\/td><\/tr><\/table><p><b>gue, gui<\/b>: Das u ist stumm, es sorgt nur für ein hartes g: <em>guerra, guitarra<\/em>. Soll das u hörbar sein, bekommt es Trema: <em>pingüino, vergüenza, bilingüe<\/em>.<\/p><div class=\"warn\">Achtung: Diese Regeln erzwingen Schreibänderungen bei Verben: <em>sacar → saqué<\/em>, <em>llegar → llegué<\/em>, <em>empezar → empecé<\/em>, <em>coger → cojo<\/em>, <em>averiguar → averigüé<\/em>.<\/div>"},{"h":"Konsonanten II: ll/y, ñ, h, r/rr, b/v, x, ch","html":"<ul><li><b>ll und y<\/b>: Heute sprechen fast alle Spanier beide gleich, etwa wie ein kräftiges deutsches j (<b>yeísmo<\/b>): <em>calle, playa, yo, llamar<\/em>. In Argentinien und Uruguay klingen sie wie „sch“ oder „dsch“. Am Wortende und als „und“ ist <em>y<\/em> ein i: <em>hoy, rey, y<\/em>.<\/li><li><b>ñ<\/b>: wie „nj“ in „Cognac“: <em>España, niño, mañana<\/em>.<\/li><li><b>h<\/b>: immer stumm: <em>hola<\/em> = „ola“, <em>ahora<\/em> = „aora“. Ausnahme: <em>ch<\/em> = „tsch“: <em>chico, mucho<\/em>.<\/li><li><b>r und rr<\/b>: Einfaches <em>r<\/em> zwischen Vokalen ist ein einmaliger Zungenschlag: <em>pero<\/em> „aber“. <em>rr<\/em> sowie <em>r<\/em> am Wortanfang und nach <em>l, n, s<\/em> wird gerollt: <em>perro<\/em> „Hund“, <em>rosa, Enrique, alrededor<\/em>.<\/li><li><b>b und v<\/b>: klingen gleich. Am Wortanfang und nach <em>m/n<\/em> wie deutsches b (<em>vino, ambos, invierno<\/em>), zwischen Vokalen weicher, mit kaum geschlossenen Lippen (<em>uva, sabe<\/em>). Nie wie deutsches w!<\/li><li><b>x<\/b>: meist „ks“ (<em>taxi, examen<\/em>), vor Konsonant oft nur „s“ (<em>explicar, texto<\/em>). In einigen mexikanischen Namen wie j: <em>México, Oaxaca<\/em>.<\/li><li><b>d<\/b> am Wortende und zwischen Vokalen sehr weich, fast verschluckt: <em>Madrid, cansado<\/em>.<\/li><li><b>s<\/b> immer stimmlos wie in „Bus“, auch am Wortanfang: <em>sol, casa<\/em>.<\/li><\/ul><div class=\"warn\">Achtung: <em>pero<\/em> (aber) und <em>perro<\/em> (Hund), <em>caro<\/em> (teuer) und <em>carro<\/em> (Karren/Auto in Lateinamerika) sind verschiedene Wörter – das rr unbedingt rollen.<\/div>"},{"h":"Vokale, Diphthong und Hiat","html":"<p>Die fünf Vokale <em>a, e, i, o, u<\/em> werden immer klar und eher kurz gesprochen, auch in unbetonten Silben – kein „ö“-artiges Verschlucken wie im deutschen „bitte“.<\/p><p><b>Diphthong<\/b>: Ein schwacher Vokal (<em>i, u<\/em>) neben einem starken (<em>a, e, o<\/em>) oder zwei schwache bilden eine Silbe: <em>bien, cau-sa, cui-da-do, ciu-dad<\/em>.<\/p><p><b>Hiat<\/b>: Zwei starke Vokale gehören zu zwei Silben: <em>le-er, po-e-ta, ca-er<\/em>. Wird der schwache Vokal betont, wird der Diphthong aufgebrochen – das zeigt ein Akzent auf <em>í/ú<\/em>, und zwar <b>immer<\/b>, egal was die übrigen Regeln sagen:<\/p><table><tr><th>Diphthong<\/th><th>Hiat mit Akzent<\/th><\/tr><tr><td><em>pie<\/em> (1 Silbe)<\/td><td><em>dí-a<\/em> (Tag)<\/td><\/tr><tr><td><em>paisaje<\/em><\/td><td><em>pa-ís<\/em> (Land)<\/td><\/tr><tr><td><em>continuo<\/em> (adj.)<\/td><td><em>continúo<\/em> (ich fahre fort)<\/td><\/tr><tr><td><em>baile<\/em><\/td><td><em>ba-úl<\/em> (Truhe), <em>re-ír<\/em><\/td><\/tr><\/table><div class=\"tip\">Merke: <em>-ía<\/em> in Verbformen wie <em>tenía, vivía, comería<\/em> trägt immer den Akzent.<\/div>"},{"h":"Wo liegt die Betonung? Die Grundregeln","html":"<p>Ohne geschriebenen Akzent gelten zwei einfache Regeln:<\/p><ol><li>Endet das Wort auf <b>Vokal, -n oder -s<\/b>, wird die <b>vorletzte<\/b> Silbe betont: <em>ca-sa, ha-blan, li-bros, e-xa-men<\/em>.<\/li><li>Endet es auf einen <b>anderen Konsonanten<\/b> (auch -y), wird die <b>letzte<\/b> Silbe betont: <em>ha-blar, ciu-dad, es-pa-ñol, re-loj, es-toy<\/em>.<\/li><\/ol><p>Weicht die Betonung davon ab, steht ein Akzent (<em>tilde<\/em>) auf dem betonten Vokal. Es gibt nur den Akut (´).<\/p><table><tr><th>Typ<\/th><th>Betonung<\/th><th>Akzent, wenn …<\/th><\/tr><tr><td><em>agudas<\/em><\/td><td>letzte Silbe<\/td><td>Endung Vokal, n, s: <em>café, canción, después<\/em><\/td><\/tr><tr><td><em>llanas<\/em><\/td><td>vorletzte<\/td><td>andere Endung: <em>árbol, fácil, lápiz, móvil<\/em><\/td><\/tr><tr><td><em>esdrújulas<\/em><\/td><td>drittletzte<\/td><td>immer: <em>música, teléfono, rápido<\/em><\/td><\/tr><tr><td><em>sobresdrújulas<\/em><\/td><td>davor<\/td><td>immer: <em>dígamelo, cuéntaselo<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: Durch Plural oder angehängte Pronomen kann ein Akzent wegfallen oder neu nötig werden: <em>canción → canciones<\/em>, <em>examen → exámenes<\/em>, <em>compra → cómpralo<\/em>.<\/div><p>Großbuchstaben bekommen ebenfalls einen Akzent: <em>Álvaro, ÉXITO<\/em>. Einsilbige Wörter tragen grundsätzlich keinen Akzent (<em>fue, vio, dio, pie, fe<\/em>), außer zur Unterscheidung (nächster Abschnitt).<\/p>"},{"h":"Der diakritische Akzent und Fragewörter","html":"<p>Einige gleich geschriebene Wörter werden durch den Akzent unterschieden. Meist trägt das betonte (Pronomen, Verb, Adverb) den Akzent:<\/p><table><tr><th>mit Akzent<\/th><th>ohne Akzent<\/th><\/tr><tr><td><em>tú<\/em> du<\/td><td><em>tu<\/em> dein<\/td><\/tr><tr><td><em>él<\/em> er<\/td><td><em>el<\/em> der<\/td><\/tr><tr><td><em>mí<\/em> mir/mich (nach Präp.)<\/td><td><em>mi<\/em> mein<\/td><\/tr><tr><td><em>sí<\/em> ja; sich<\/td><td><em>si<\/em> wenn, ob<\/td><\/tr><tr><td><em>té<\/em> Tee<\/td><td><em>te<\/em> dir/dich<\/td><\/tr><tr><td><em>más<\/em> mehr<\/td><td><em>mas<\/em> aber (literarisch)<\/td><\/tr><tr><td><em>sé<\/em> ich weiß; sei!<\/td><td><em>se<\/em> sich<\/td><\/tr><tr><td><em>dé<\/em> gebe (subj.)<\/td><td><em>de<\/em> von<\/td><\/tr><\/table><p>Beispiel: <em>Tú sabes que tu hermano no toma té.<\/em> – Du weißt, dass dein Bruder keinen Tee trinkt.<\/p><p><b>Fragewörter<\/b> tragen in direkten und indirekten Fragen und Ausrufen einen Akzent: <em>qué, quién, cuál, cómo, dónde, cuándo, cuánto, adónde<\/em>. Als Relativwort oder Konjunktion stehen sie ohne Akzent:<\/p><ul><li><em>¿Dónde vives?<\/em> – <em>No sé dónde vive.<\/em> (indirekte Frage)<\/li><li><em>La casa donde vivo es pequeña.<\/em> (Relativwort)<\/li><li><em>¡Qué frío!<\/em> – <em>Dice que tiene frío.<\/em><\/li><\/ul><div class=\"tip\">Merke: <em>solo<\/em> (nur/allein) und die Demonstrativpronomen <em>este, ese, aquel<\/em> schreibt man nach den RAE-Regeln von 2010 ohne Akzent. Auch <em>aun<\/em> (sogar) vs. <em>aún<\/em> (noch) wird unterschieden.<\/div><div class=\"warn\">Achtung: <em>por qué<\/em> (warum, getrennt mit Akzent) – <em>porque<\/em> (weil) – <em>el porqué<\/em> (der Grund).<\/div>"},{"h":"Satzzeichen, Groß- und Kleinschreibung","html":"<p>Frage- und Ausrufesätze haben ein umgedrehtes Zeichen am Anfang – auch mitten im Satz, genau dort, wo die Frage beginnt:<\/p><ul><li><em>¿Vienes mañana?<\/em><\/li><li><em>Si llueve, ¿qué hacemos?<\/em><\/li><li><em>¡Qué bonito!<\/em><\/li><\/ul><p><b>Kleingeschrieben<\/b> werden im Spanischen – anders als im Deutschen:<\/p><ul><li>alle Substantive außer Eigennamen: <em>la mesa, el amor<\/em><\/li><li>Monate und Wochentage: <em>el lunes, en mayo<\/em><\/li><li>Nationalitäten, Sprachen, Religionen: <em>un alemán, hablo inglés, los católicos<\/em><\/li><li>Anreden und Titel im Satz: <em>el señor Ruiz, la doctora Pérez<\/em> (abgekürzt groß: <em>Sr., Dra.<\/em>)<\/li><li><em>usted<\/em> (abgekürzt <em>Ud.<\/em>)<\/li><\/ul><p>Großgeschrieben werden Satzanfänge, Eigennamen, Länder und Städte (<em>Alemania, Sevilla<\/em>), Institutionen und bei Buchtiteln nur das erste Wort: <em>Cien años de soledad<\/em>.<\/p><div class=\"warn\">Achtung: <em>los alemanes<\/em> (die Deutschen), aber <em>Alemania<\/em> (Deutschland).<\/div>"},{"h":"Silbentrennung","html":"<p>Getrennt wird nach Sprechsilben:<\/p><ul><li>Ein Konsonant zwischen Vokalen kommt zur folgenden Silbe: <em>ca-sa, pe-lo<\/em>.<\/li><li><em>ch, ll, rr<\/em> sind untrennbar: <em>co-che, ca-lle, pe-rro<\/em>.<\/li><li>Zwei Konsonanten werden getrennt: <em>ar-te, cam-po, lec-ción<\/em> – außer Verbindungen aus <em>b, c, f, g, k, p<\/em> + <em>l<\/em> und <em>b, c, d, f, g, k, p, t<\/em> + <em>r<\/em>: <em>ha-blar, o-tro, si-glo, ca-bra<\/em>.<\/li><li>Drei Konsonanten: meist zwei nach links, außer bei Verbindung mit l/r: <em>ins-tan-te<\/em>, aber <em>en-tre, hom-bre<\/em>.<\/li><li>Diphthonge bleiben zusammen (<em>bue-no<\/em>), Hiate werden getrennt (<em>dí-a, le-er<\/em>), am Zeilenende vermeidet man aber, einen einzelnen Vokal abzutrennen.<\/li><\/ul><div class=\"tip\">Merke: <em>s<\/em> + Konsonant am Silbenanfang gibt es nicht: <em>Es-pa-ña, es-tu-diar<\/em> – daher das „e“ vor Wörtern wie <em>escuela, España<\/em>.<\/div>"}],"exercises":[{"type":"choice","title":"Wie wird es ausgesprochen?","task":"Welcher Laut steckt im markierten Buchstaben? Wähle die richtige Beschreibung.","items":[{"q":"gente – das g klingt wie …","options":["g in „Garten“","ch in „ach“","j in „Jahr“"],"a":1,"why":"g vor e, i wird wie j gesprochen (Rachenlaut)."},{"q":"guitarra – das u …","options":["wird gesprochen","ist stumm"],"a":1,"why":"In gue/gui ist das u stumm; ohne Trema hört man es nicht."},{"q":"pingüino – das u …","options":["wird gesprochen","ist stumm"],"a":0,"why":"Das Trema (ü) zeigt, dass das u hörbar ist."},{"q":"hotel – das h …","options":["wird gehaucht","ist stumm","klingt wie ch"],"a":1,"why":"h ist im Spanischen immer stumm."},{"q":"vaso – das v klingt wie …","options":["w in „Wasser“","f in „Vater“","b in „Ball“"],"a":2,"why":"v und b klingen gleich, am Wortanfang wie deutsches b."},{"q":"queso – qu klingt wie …","options":["kw","k"],"a":1,"why":"In que/qui ist das u stumm: k-Laut."},{"q":"cine (in Madrid) – das c klingt wie …","options":["k","englisches th","ts"],"a":1,"why":"In Nord-/Zentralspanien wird c vor e/i wie th gesprochen; mit seseo wie s."},{"q":"Ramón – das r am Wortanfang wird …","options":["einmal angeschlagen","gerollt wie rr"],"a":1,"why":"r am Wortanfang wird immer mehrfach gerollt."}]},{"type":"gap","title":"c, qu, z, g, gu oder j?","task":"Ergänze den fehlenden Buchstaben bzw. die Buchstabengruppe.","items":[{"q":"Mi hermano tiene ___ince años. (k-Laut)","a":["qu"],"de":"Mein Bruder ist fünfzehn Jahre alt."},{"q":"Necesito unos ___apatos nuevos.","a":["z"],"de":"Ich brauche neue Schuhe."},{"q":"Ayer lle___é tarde al trabajo. (llegar)","a":["gu"],"de":"Gestern kam ich zu spät zur Arbeit."},{"q":"Esta mañana empe___é a estudiar a las ocho. (empezar)","a":["c"],"de":"Heute Morgen habe ich um acht angefangen zu lernen."},{"q":"Ayer sa___é muchas fotos. (sacar)","a":["qu"],"de":"Gestern habe ich viele Fotos gemacht."},{"q":"Siempre co___o el autobús de las siete. (coger)","a":["j"],"de":"Ich nehme immer den Bus um sieben."},{"q":"Me da ver___üenza hablar en público.","a":["g"],"de":"Es ist mir peinlich, öffentlich zu sprechen."},{"q":"¿Tienes un lápi___? – No, pero tengo dos lápices.","a":["z"],"de":"Hast du einen Bleistift? – Nein, aber ich habe zwei Bleistifte."}]},{"type":"choice","title":"aguda, llana oder esdrújula?","task":"Bestimme die Betonung des Wortes.","items":[{"q":"ventana","options":["aguda","llana","esdrújula"],"a":1,"why":"Endung auf Vokal ohne Akzent → vorletzte Silbe: ven-TA-na."},{"q":"ciudad","options":["aguda","llana","esdrújula"],"a":0,"why":"Endung auf -d (nicht n/s) ohne Akzent → letzte Silbe."},{"q":"pájaro","options":["aguda","llana","esdrújula"],"a":2,"why":"Akzent auf der drittletzten Silbe: PÁ-ja-ro."},{"q":"azúcar","options":["aguda","llana","esdrújula"],"a":1,"why":"Betonung auf der vorletzten Silbe; Akzent, weil das Wort auf -r endet."},{"q":"jardín","options":["aguda","llana","esdrújula"],"a":0,"why":"Betonung auf der letzten Silbe, Akzent wegen Endung -n."},{"q":"joven","options":["aguda","llana","esdrújula"],"a":1,"why":"Endung -n ohne Akzent → vorletzte Silbe: JO-ven."},{"q":"jóvenes","options":["aguda","llana","esdrújula"],"a":2,"why":"Im Plural rückt die Betonung auf die drittletzte Silbe, daher der Akzent."},{"q":"reloj","options":["aguda","llana","esdrújula"],"a":0,"why":"Endung -j (Konsonant außer n/s) → letzte Silbe, kein Akzent nötig."}]},{"type":"choice","title":"Akzent ja oder nein?","task":"Welche Schreibung ist richtig?","items":[{"q":"Mañana vamos al ___ de la esquina.","options":["cafe","café"],"a":1,"why":"Betont auf der letzten Silbe, Endung Vokal → Akzent."},{"q":"Este ejercicio es muy ___.","options":["facil","fácil"],"a":1,"why":"Betont auf der vorletzten Silbe, Endung -l → Akzent."},{"q":"Ayer ___ a mis abuelos.","options":["vi","ví"],"a":0,"why":"Einsilbige Wörter tragen normalerweise keinen Akzent."},{"q":"Tenemos tres ___ de inglés esta semana.","options":["examenes","exámenes"],"a":1,"why":"Im Plural wird es zur esdrújula: e-XÁ-me-nes."},{"q":"Me gustan las ___ de este grupo.","options":["canciones","cancíones"],"a":0,"why":"can-cio-nes ist llana mit Endung -s → kein Akzent."},{"q":"Mi abuela ___ en un pueblo pequeño. (vivir, imperfecto)","options":["vivia","vivía"],"a":1,"why":"Betontes i neben a bildet einen Hiat → Akzent auf í."},{"q":"¿De qué ___ eres?","options":["pais","país"],"a":1,"why":"pa-ís: betontes i im Hiat bekommt immer einen Akzent."},{"q":"Mi madre vive en una ___ pequeña.","options":["ciudad","ciúdad"],"a":0,"why":"ciu-DAD: aguda auf -d, kein Akzent."},{"q":"Dame el libro y ___ en la mesa. (poner + lo, Imperativ tú)","options":["ponlo","pónlo"],"a":0,"why":"pon-lo ist llana auf Vokal → kein Akzent."}]},{"type":"gap","title":"Diakritischer Akzent","task":"Setze das passende Wort ein (mit oder ohne Akzent).","items":[{"q":"¿___ quieres un café? (du)","a":["Tú"],"de":"Willst du einen Kaffee?"},{"q":"Este regalo es para ___. (mich)","a":["mí"],"de":"Dieses Geschenk ist für mich."},{"q":"___ tienes tiempo, llámame. (wenn)","a":["Si"],"de":"Wenn du Zeit hast, ruf mich an."},{"q":"No ___ dónde está la estación. (ich weiß)","a":["sé"],"de":"Ich weiß nicht, wo der Bahnhof ist."},{"q":"¿Quieres ___ o café? (Tee)","a":["té"],"de":"Möchtest du Tee oder Kaffee?"},{"q":"___ es mi profesor de historia. (er)","a":["Él"],"de":"Er ist mein Geschichtslehrer."},{"q":"Quiero un poco ___ de agua, por favor. (mehr)","a":["más"],"de":"Ich möchte bitte etwas mehr Wasser."},{"q":"Espero que me ___ una respuesta pronto. (er gibt, subj.)","a":["dé"],"de":"Ich hoffe, dass er mir bald eine Antwort gibt."},{"q":"Ella dijo que ___, que venía con nosotros. (ja)","a":["sí"],"de":"Sie sagte ja, sie komme mit uns."}]},{"type":"choice","title":"Fragewort oder nicht?","task":"Mit oder ohne Akzent?","items":[{"q":"¿___ hora es?","options":["Que","Qué"],"a":1,"why":"Direkte Frage → Fragewort mit Akzent."},{"q":"Creo ___ va a llover.","options":["que","qué"],"a":0,"why":"Konjunktion „dass“ → ohne Akzent."},{"q":"No sé ___ se llama tu amiga.","options":["como","cómo"],"a":1,"why":"Indirekte Frage → Akzent."},{"q":"Hazlo ___ quieras.","options":["como","cómo"],"a":0,"why":"„wie (auch immer)“ als Konjunktion, keine Frage → ohne Akzent."},{"q":"Ese es el bar ___ nos conocimos.","options":["donde","dónde"],"a":0,"why":"Relativwort → ohne Akzent."},{"q":"No vino ___ estaba enfermo.","options":["porque","por qué","porqué"],"a":0,"why":"„weil“ → porque, zusammen und ohne Akzent."},{"q":"¿___ no viniste ayer?","options":["Porque","Por qué","Porqué"],"a":1,"why":"„warum“ in der Frage → por qué, getrennt mit Akzent."},{"q":"Me preguntó ___ llegaba el tren.","options":["cuando","cuándo"],"a":1,"why":"Indirekte Frage (preguntar) → Akzent."},{"q":"Nadie entiende el ___ de su decisión.","options":["porque","por qué","porqué"],"a":2,"why":"Substantiv „der Grund“ → el porqué."}]},{"type":"choice","title":"Groß-/Kleinschreibung und Silbentrennung","task":"Wähle die korrekte Schreibung bzw. Trennung.","items":[{"q":"Mi cumpleaños es en ___.","options":["Marzo","marzo"],"a":1,"why":"Monate werden kleingeschrieben."},{"q":"Los ___ son muy puntuales.","options":["Alemanes","alemanes"],"a":1,"why":"Nationalitäten werden kleingeschrieben."},{"q":"Vivimos en ___ desde 2019.","options":["Alemania","alemania"],"a":0,"why":"Ländernamen sind Eigennamen → groß."},{"q":"El ___ tenemos clase de yoga.","options":["Jueves","jueves"],"a":1,"why":"Wochentage werden kleingeschrieben."},{"q":"Mi hija estudia ___ en la universidad.","options":["Francés","francés"],"a":1,"why":"Sprachen werden kleingeschrieben."},{"q":"perro","options":["per-ro","pe-rro"],"a":1,"why":"rr ist untrennbar."},{"q":"hablar","options":["hab-lar","ha-blar"],"a":1,"why":"b + l bildet eine untrennbare Verbindung."},{"q":"campo","options":["cam-po","ca-mpo"],"a":0,"why":"Zwei Konsonanten (m, p) werden getrennt."},{"q":"calle","options":["cal-le","ca-lle"],"a":1,"why":"ll ist untrennbar."},{"q":"poeta","options":["poe-ta","po-e-ta"],"a":1,"why":"o und e sind starke Vokale → Hiat, zwei Silben."}]}],"cards":[{"f":"ce, ci, za, zo, zu – Aussprache in Madrid / Lateinamerika","b":"Madrid: wie engl. th (distinción) · große Teile Andalusiens, Kanaren, Lateinamerika: wie stimmloses s (seseo)"},{"f":"g vor e, i und j","b":"Rachenlaut wie in „ach“: gente, jefe"},{"f":"gue, gui – wird das u gesprochen?","b":"Nein, stumm (guerra). Hörbar nur mit Trema: güe, güi (pingüino)"},{"f":"k-Laut vor e, i schreibt man …","b":"qu: queso, aquí"},{"f":"yeísmo","b":"ll und y klingen gleich (wie kräftiges j): calle, playa"},{"f":"h im Spanischen","b":"immer stumm: hola = „ola“ (ch = tsch)"},{"f":"r oder rr? pero / perro","b":"pero = aber (einfach angeschlagen), perro = Hund (gerollt)"},{"f":"b und v","b":"klingen gleich, nie wie deutsches w: vino = „bino“"},{"f":"Betonung ohne Akzent: Endung Vokal, -n, -s","b":"vorletzte Silbe: casa, hablan, libros"},{"f":"Betonung ohne Akzent: andere Konsonanten","b":"letzte Silbe: hablar, ciudad, reloj"},{"f":"aguda – wann Akzent?","b":"wenn sie auf Vokal, -n oder -s endet: café, canción, inglés"},{"f":"llana – wann Akzent?","b":"wenn sie NICHT auf Vokal, -n, -s endet: árbol, fácil, lápiz"},{"f":"esdrújula – wann Akzent?","b":"immer: música, teléfono"},{"f":"Hiat mit betontem i/u","b":"immer Akzent: día, país, reír, continúo"},{"f":"tú / tu","b":"tú = du · tu = dein"},{"f":"él / el","b":"él = er · el = der"},{"f":"sí / si","b":"sí = ja, sich · si = wenn, ob"},{"f":"sé / se","b":"sé = ich weiß, sei! · se = sich"},{"f":"mí / mi","b":"mí = mich/mir (para mí) · mi = mein"},{"f":"té / te, dé / de, más / mas","b":"Tee / dich · gebe (subj.) / von · mehr / aber (lit.)"},{"f":"por qué / porque / el porqué","b":"warum / weil / der Grund"},{"f":"Fragewörter in indirekten Fragen","b":"behalten den Akzent: No sé dónde vive."},{"f":"solo, este, ese – mit Akzent?","b":"Nein, nach RAE 2010 ohne Akzent"},{"f":"¿ ¡ – wo setzt man sie?","b":"dort, wo Frage/Ausruf beginnt: Si llueve, ¿qué hacemos?"},{"f":"Kleinschreibung im Spanischen","b":"Monate, Wochentage, Nationalitäten, Sprachen: el lunes, en mayo, un alemán, el inglés"},{"f":"Untrennbare Buchstabengruppen","b":"ch, ll, rr sowie bl, cl, fl, gl, pl und br, cr, dr, fr, gr, pr, tr: co-che, ca-lle, pe-rro, ha-blar"},{"f":"sacar, llegar, empezar → indefinido yo","b":"saqué, llegué, empecé (Schreibänderung, gleicher Laut)"},{"f":"Akzent bei Großbuchstaben?","b":"Ja: Álvaro, ÁFRICA"}],"id":"k01"},{"nr":2,"title":"Das Substantiv","teil":"Das Substantiv und seine Begleiter","intro":"Jedes spanische Substantiv ist entweder maskulin oder feminin – ein Neutrum gibt es nicht. Genus und Plural bestimmen die Form von Artikel und Adjektiv, deshalb lohnt es sich, sie von Anfang an sicher zu beherrschen.","sections":[{"h":"Genus: die Grundregel -o / -a","html":"<p>Substantive auf <em>-o<\/em> sind meist maskulin, Substantive auf <em>-a<\/em> meist feminin:<\/p><table><tr><th>maskulin<\/th><th>feminin<\/th><\/tr><tr><td><em>el libro<\/em> das Buch<\/td><td><em>la mesa<\/em> der Tisch<\/td><\/tr><tr><td><em>el vaso<\/em> das Glas<\/td><td><em>la ventana<\/em> das Fenster<\/td><\/tr><tr><td><em>el queso<\/em> der Käse<\/td><td><em>la playa<\/em> der Strand<\/td><\/tr><\/table><p>Das deutsche Genus hilft nicht weiter: <em>la mesa<\/em> (der Tisch), <em>el coche<\/em> (das Auto), <em>la leche<\/em> (die Milch), <em>el sol<\/em> (die Sonne).<\/p><div class=\"warn\">Achtung – wichtige Ausnahmen:<br><b>maskulin auf -a<\/b>: <em>el día, el mapa, el sofá, el planeta<\/em> sowie viele griechische Wörter auf <em>-ma<\/em>: <em>el problema, el tema, el sistema, el programa, el idioma, el clima<\/em>.<br><b>feminin auf -o<\/b>: <em>la mano<\/em> sowie Kurzwörter: <em>la foto<\/em> (fotografía), <em>la moto<\/em> (motocicleta), <em>la radio<\/em>.<\/div><div class=\"tip\">Merke: <em>la cama, la crema, la forma<\/em> sind trotz -ma feminin – die Ausnahme betrifft nur die griechischen Lehnwörter.<\/div>"},{"h":"Genus an weiteren Endungen erkennen","html":"<table><tr><th>Endung<\/th><th>Genus<\/th><th>Beispiele<\/th><\/tr><tr><td><em>-ción, -sión<\/em><\/td><td>f<\/td><td><em>la canción, la decisión<\/em><\/td><\/tr><tr><td><em>-dad, -tad<\/em><\/td><td>f<\/td><td><em>la ciudad, la libertad<\/em><\/td><\/tr><tr><td><em>-tud<\/em><\/td><td>f<\/td><td><em>la juventud, la actitud<\/em><\/td><\/tr><tr><td><em>-umbre<\/em><\/td><td>f<\/td><td><em>la costumbre<\/em><\/td><\/tr><tr><td><em>-ez, -eza<\/em><\/td><td>f<\/td><td><em>la vejez, la belleza<\/em><\/td><\/tr><tr><td><em>-is<\/em><\/td><td>meist f<\/td><td><em>la crisis, la tesis<\/em><\/td><\/tr><tr><td><em>-aje<\/em><\/td><td>m<\/td><td><em>el viaje, el garaje, el paisaje<\/em><\/td><\/tr><tr><td><em>-or<\/em><\/td><td>m<\/td><td><em>el color, el amor, el calor<\/em><\/td><\/tr><tr><td><em>-ma<\/em> (griech.)<\/td><td>m<\/td><td><em>el problema, el drama<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: Ausnahmen bei <em>-or<\/em>: <em>la flor, la labor<\/em>. Bei <em>-is<\/em> maskulin: <em>el análisis, el paréntesis<\/em>.<\/div><p>Bei Substantiven auf <em>-e<\/em> oder anderen Konsonanten gibt es keine verlässliche Regel – lernen Sie den Artikel immer mit: <em>el coche, la noche, el hotel, la piel, el mes, la vez<\/em>.<\/p><p>Maskulin sind außerdem Wochentage, Monate, Flüsse, Meere, Berge, Farben und Zahlen: <em>el lunes, el Rin, el Mediterráneo, el rojo, el siete<\/em>. Buchstaben sind feminin: <em>la eme<\/em>.<\/p>"},{"h":"Lebewesen: männlich und weiblich","html":"<p>Bei Personen und vielen Tieren entspricht das Genus meist dem biologischen Geschlecht. Es gibt mehrere Muster:<\/p><table><tr><th>Muster<\/th><th>männlich<\/th><th>weiblich<\/th><\/tr><tr><td>-o → -a<\/td><td><em>el hijo, el gato<\/em><\/td><td><em>la hija, la gata<\/em><\/td><\/tr><tr><td>Konsonant + -a<\/td><td><em>el profesor, el señor<\/em><\/td><td><em>la profesora, la señora<\/em><\/td><\/tr><tr><td>gleiche Form<\/td><td><em>el estudiante, el periodista<\/em><\/td><td><em>la estudiante, la periodista<\/em><\/td><\/tr><tr><td>-esa, -isa, -triz<\/td><td><em>el alcalde, el poeta, el actor<\/em><\/td><td><em>la alcaldesa, la poetisa, la actriz<\/em><\/td><\/tr><tr><td>eigenes Wort<\/td><td><em>el padre, el hombre, el yerno<\/em><\/td><td><em>la madre, la mujer, la nuera<\/em><\/td><\/tr><\/table><p>Gleiche Form, nur der Artikel zeigt das Geschlecht: Wörter auf <em>-ista<\/em> (<em>el/la turista<\/em>), auf <em>-nte<\/em> (<em>el/la cantante<\/em>), dazu <em>el/la joven, el/la testigo<\/em>.<\/p><p>Weitere Paare mit eigenem Wort: <em>el rey – la reina, el príncipe – la princesa, el toro – la vaca, el caballo – la yegua<\/em>.<\/p><div class=\"tip\">Merke: Bei vielen Berufen ist heute die Form auf -a üblich: <em>la médica, la jueza, la presidenta<\/em>; daneben hört man auch <em>la médico, la juez<\/em>. Für <em>la poetisa<\/em> wird heute oft <em>la poeta<\/em> verwendet.<\/div><p>Manche Tiere haben nur ein Genus; das Geschlecht zeigt man mit <em>macho/hembra<\/em>: <em>la jirafa macho, el ratón hembra<\/em>. Auch <em>la persona, la víctima<\/em> sind immer feminin – auch für Männer.<\/p>"},{"h":"Gleiches Wort – anderes Genus, andere Bedeutung","html":"<table><tr><th>maskulin<\/th><th>feminin<\/th><\/tr><tr><td><em>el capital<\/em> das Kapital (Geld)<\/td><td><em>la capital<\/em> die Hauptstadt<\/td><\/tr><tr><td><em>el orden<\/em> die Ordnung, Reihenfolge<\/td><td><em>la orden<\/em> der Befehl, Orden<\/td><\/tr><tr><td><em>el cura<\/em> der Pfarrer<\/td><td><em>la cura<\/em> die Heilung, Kur<\/td><\/tr><tr><td><em>el frente<\/em> die Front<\/td><td><em>la frente<\/em> die Stirn<\/td><\/tr><tr><td><em>el cometa<\/em> der Komet<\/td><td><em>la cometa<\/em> der Drachen<\/td><\/tr><tr><td><em>el pendiente<\/em> der Ohrring<\/td><td><em>la pendiente<\/em> der Abhang<\/td><\/tr><tr><td><em>el corte<\/em> der Schnitt<\/td><td><em>la corte<\/em> der Hof (Königshof)<\/td><\/tr><\/table><p>Ähnlich bei Paaren mit -o/-a, die keine Geschlechterpaare sind: <em>el puerto<\/em> (Hafen) – <em>la puerta<\/em> (Tür), <em>el bolso<\/em> (Handtasche) – <em>la bolsa<\/em> (Tüte), <em>el manzano<\/em> (Apfelbaum) – <em>la manzana<\/em> (Apfel).<\/p><p>Beispiel: <em>Madrid es la capital de España.<\/em> – <em>La empresa necesita más capital.<\/em><\/p><div class=\"tip\">Merke: Viele Obstbäume sind maskulin, die Frucht feminin: <em>el naranjo – la naranja, el cerezo – la cereza<\/em>.<\/div>"},{"h":"Pluralbildung","html":"<table><tr><th>Singular endet auf<\/th><th>Plural<\/th><th>Beispiele<\/th><\/tr><tr><td>unbetonten Vokal<\/td><td>+ <em>-s<\/em><\/td><td><em>casa → casas, coche → coches<\/em><\/td><\/tr><tr><td>betontes <em>-á, -é, -ó<\/em><\/td><td>+ <em>-s<\/em><\/td><td><em>sofá → sofás, café → cafés<\/em><\/td><\/tr><tr><td>Konsonant (auch -y)<\/td><td>+ <em>-es<\/em><\/td><td><em>árbol → árboles, rey → reyes<\/em><\/td><\/tr><tr><td><em>-z<\/em><\/td><td><em>-ces<\/em><\/td><td><em>luz → luces, vez → veces<\/em><\/td><\/tr><tr><td>betontes <em>-í, -ú<\/em><\/td><td><em>-es<\/em> oder <em>-s<\/em><\/td><td><em>jabalí → jabalíes / jabalís<\/em><\/td><\/tr><\/table><p><b>Akzent im Plural<\/b>: Da eine Silbe hinzukommt, kann ein Akzent wegfallen oder nötig werden. Die betonte Silbe selbst bleibt gleich:<\/p><ul><li>Akzent fällt weg: <em>canción → canciones, inglés → ingleses, autobús → autobuses<\/em><\/li><li>Akzent kommt hinzu: <em>joven → jóvenes, examen → exámenes, orden → órdenes<\/em><\/li><\/ul><div class=\"warn\">Ausnahmen: <em>el carácter → los caracteres<\/em>, <em>el régimen → los regímenes<\/em> (Betonung verschiebt sich). Wörter auf -y aus Fremdsprachen: <em>el jersey → los jerséis<\/em>.<\/div><p>Fremdwörter auf Konsonant schwanken: <em>el club → los clubes / los clubs<\/em>; eingebürgerte folgen der Regel: <em>el bar → los bares, el líder → los líderes<\/em>.<\/p>"},{"h":"Unveränderliche Substantive","html":"<p>Mehrsilbige Wörter, die auf <em>-s<\/em> oder <em>-x<\/em> enden und nicht auf der letzten Silbe betont sind, bleiben im Plural gleich – nur der Artikel ändert sich:<\/p><ul><li>Wochentage: <em>el lunes → los lunes<\/em>, <em>el viernes → los viernes<\/em> (aber <em>el sábado → los sábados<\/em>)<\/li><li>Wörter auf <em>-is<\/em>: <em>la crisis → las crisis, el análisis → los análisis<\/em><\/li><li>Zusammensetzungen aus Verb + Plural-Substantiv: <em>el paraguas, el cumpleaños, el sacacorchos, el lavaplatos<\/em><\/li><li>Weitere: <em>el virus, el tórax<\/em><\/li><\/ul><p>Einsilbige oder endbetonte Wörter auf -s bilden dagegen den Plural mit <em>-es<\/em>: <em>el mes → los meses, el país → los países, el autobús → los autobuses<\/em>.<\/p><div class=\"tip\">Merke: <em>Los lunes voy al gimnasio.<\/em> heißt „Montags gehe ich ins Fitnessstudio“ – der Plural drückt die Gewohnheit aus.<\/div>"},{"h":"Gemischte Paare und reine Pluralwörter","html":"<p>Der <b>maskuline Plural<\/b> bezeichnet auch gemischte Gruppen:<\/p><table><tr><th>Plural<\/th><th>Bedeutung<\/th><\/tr><tr><td><em>los padres<\/em><\/td><td>die Eltern (oder die Väter)<\/td><\/tr><tr><td><em>los hermanos<\/em><\/td><td>die Geschwister (oder die Brüder)<\/td><\/tr><tr><td><em>los hijos<\/em><\/td><td>die Kinder (Sohn und Tochter)<\/td><\/tr><tr><td><em>los reyes<\/em><\/td><td>das Königspaar (oder die Könige)<\/td><\/tr><tr><td><em>los tíos<\/em><\/td><td>Onkel und Tante<\/td><\/tr><tr><td><em>los abuelos<\/em><\/td><td>die Großeltern<\/td><\/tr><\/table><p>Beispiel: <em>¿Tienes hermanos? – Sí, un hermano y dos hermanas.<\/em> – Hast du Geschwister? – Ja, einen Bruder und zwei Schwestern.<\/p><p><b>Nur oder meist im Plural<\/b> stehen u. a.: <em>las gafas<\/em> (Brille), <em>las tijeras<\/em> (Schere), <em>los pantalones<\/em> (Hose; auch <em>el pantalón<\/em>), <em>las vacaciones<\/em> (Ferien, Urlaub), <em>las afueras<\/em> (Stadtrand), <em>los alrededores<\/em> (Umgebung), <em>las ganas<\/em> (Lust), <em>los víveres<\/em> (Lebensmittel).<\/p><div class=\"warn\">Achtung: <em>Mis gafas son nuevas.<\/em> – Meine Brille ist neu. Verb und Adjektiv stehen im Plural! Ebenso: <em>Las vacaciones fueron cortas.<\/em><\/div><p>Umgekehrt stehen manche deutschen Pluralwörter im Spanischen im Singular: <em>la gente<\/em> (die Leute) – <em>La gente está contenta.<\/em><\/p>"}],"exercises":[{"type":"choice","title":"el oder la?","task":"Wähle den richtigen Artikel.","items":[{"q":"___ ventana","options":["el","la"],"a":1,"why":"Endung -a → feminin."},{"q":"___ problema","options":["el","la"],"a":0,"why":"Griechisches Wort auf -ma → maskulin."},{"q":"___ mano","options":["el","la"],"a":1,"why":"la mano ist eine feste Ausnahme: feminin trotz -o."},{"q":"___ día","options":["el","la"],"a":0,"why":"el día ist maskulin trotz -a."},{"q":"___ foto","options":["el","la"],"a":1,"why":"Kurzform von la fotografía → feminin."},{"q":"___ canción","options":["el","la"],"a":1,"why":"Wörter auf -ción sind feminin."},{"q":"___ viaje","options":["el","la"],"a":0,"why":"Wörter auf -aje sind maskulin."},{"q":"___ mapa","options":["el","la"],"a":0,"why":"el mapa ist maskulin trotz -a."},{"q":"___ verdad","options":["el","la"],"a":1,"why":"Wörter auf -dad sind feminin."},{"q":"___ moto","options":["el","la"],"a":1,"why":"Kurzform von la motocicleta → feminin."}]},{"type":"choice","title":"Genus: schwierigere Fälle","task":"Maskulin oder feminin?","items":[{"q":"___ color","options":["el","la"],"a":0,"why":"Wörter auf -or sind meist maskulin."},{"q":"___ flor","options":["el","la"],"a":1,"why":"la flor ist eine Ausnahme unter den Wörtern auf -or."},{"q":"___ juventud","options":["el","la"],"a":1,"why":"Wörter auf -tud sind feminin."},{"q":"___ idioma","options":["el","la"],"a":0,"why":"Griechisches Lehnwort auf -ma → maskulin."},{"q":"___ crisis","options":["el","la"],"a":1,"why":"Wörter auf -is sind meist feminin."},{"q":"___ costumbre","options":["el","la"],"a":1,"why":"Wörter auf -umbre sind feminin."},{"q":"___ paisaje","options":["el","la"],"a":0,"why":"Endung -aje → maskulin."},{"q":"___ sofá","options":["el","la"],"a":0,"why":"el sofá ist maskulin trotz -a."},{"q":"___ cama","options":["el","la"],"a":1,"why":"Kein griechisches Lehnwort → normale Regel, feminin."}]},{"type":"gap","title":"Die weibliche Form","task":"Bilde die weibliche Entsprechung.","items":[{"q":"el profesor → la ___","a":["profesora"],"de":"der Lehrer → die Lehrerin"},{"q":"el actor → la ___","a":["actriz"],"de":"der Schauspieler → die Schauspielerin"},{"q":"el alcalde → la ___","a":["alcaldesa"],"de":"der Bürgermeister → die Bürgermeisterin"},{"q":"el estudiante → la ___","a":["estudiante"],"de":"der Student → die Studentin"},{"q":"el rey → la ___","a":["reina"],"de":"der König → die Königin"},{"q":"el yerno → la ___","a":["nuera"],"de":"der Schwiegersohn → die Schwiegertochter"},{"q":"el periodista → la ___","a":["periodista"],"de":"der Journalist → die Journalistin"},{"q":"el príncipe → la ___","a":["princesa"],"de":"der Prinz → die Prinzessin"},{"q":"el caballo → la ___","a":["yegua"],"de":"das Pferd (Hengst) → die Stute"}]},{"type":"choice","title":"Genus und Bedeutung","task":"Welcher Artikel passt zur Bedeutung im Satz?","items":[{"q":"Lima es ___ capital de Perú.","options":["el","la"],"a":1,"why":"la capital = die Hauptstadt."},{"q":"Invirtió todo ___ capital en la nueva empresa.","options":["el","la"],"a":0,"why":"el capital = das (Geld-)Kapital."},{"q":"El general dio ___ orden de atacar.","options":["el","la"],"a":1,"why":"la orden = der Befehl."},{"q":"Pon los libros en ___ orden alfabético.","options":["el","la"],"a":0,"why":"el orden = die Reihenfolge, Ordnung."},{"q":"Me duele ___ frente.","options":["el","la"],"a":1,"why":"la frente = die Stirn."},{"q":"Los niños hacen volar ___ cometa en la playa.","options":["el","la"],"a":1,"why":"la cometa = der Drachen (Spielzeug)."},{"q":"___ cura del pueblo celebra la misa.","options":["El","La"],"a":0,"why":"el cura = der Pfarrer."},{"q":"Ana ha perdido ___ pendiente de oro.","options":["un","una"],"a":0,"why":"el pendiente = der Ohrring."}]},{"type":"gap","title":"Plural bilden","task":"Setze das Substantiv in den Plural.","items":[{"q":"En esta calle hay muchos (árbol) ___.","a":["árboles"],"de":"In dieser Straße gibt es viele Bäume."},{"q":"Mañana hay dos (examen) ___.","a":["exámenes"],"de":"Morgen gibt es zwei Prüfungen."},{"q":"Me gustan las (canción) ___ de esta cantante.","a":["canciones"],"de":"Mir gefallen die Lieder dieser Sängerin."},{"q":"Apaga las (luz) ___, por favor.","a":["luces"],"de":"Mach bitte die Lichter aus."},{"q":"Los (joven) ___ de este barrio juegan al fútbol.","a":["jóvenes"],"de":"Die Jugendlichen dieses Viertels spielen Fußball."},{"q":"Trabajamos los (lunes) ___ y los martes.","a":["lunes"],"de":"Wir arbeiten montags und dienstags."},{"q":"Hemos visitado cinco (país) ___ este año.","a":["países"],"de":"Wir haben dieses Jahr fünf Länder besucht."},{"q":"Dos (café) ___ con leche, por favor.","a":["cafés"],"de":"Zwei Milchkaffee, bitte."},{"q":"En mi clase hay tres (inglés) ___.","a":["ingleses"],"de":"In meiner Klasse sind drei Engländer."},{"q":"Ya he estado allí tres (vez) ___.","a":["veces"],"de":"Ich war schon dreimal dort."}]},{"type":"choice","title":"Plural, Pluralwörter und Kongruenz","task":"Wähle die richtige Form.","items":[{"q":"Mis gafas ___ en el coche.","options":["está","están"],"a":1,"why":"las gafas ist ein Pluralwort → Verb im Plural."},{"q":"Este año ___ vacaciones empiezan en julio.","options":["la","las"],"a":1,"why":"las vacaciones steht im Plural."},{"q":"Hay varias ___ económicas en la historia de Europa.","options":["crisis","crisises","crises"],"a":0,"why":"Wörter auf unbetontes -is bleiben im Plural unverändert."},{"q":"Mañana celebramos dos ___.","options":["cumpleaños","cumpleañoses"],"a":0,"why":"Zusammensetzungen wie cumpleaños sind unveränderlich."},{"q":"Juan y María son ___ de Lucía.","options":["los padres","las padres","los padre"],"a":0,"why":"Vater und Mutter zusammen → maskuliner Plural los padres."},{"q":"¿Dónde están ___ tijeras?","options":["la","las"],"a":1,"why":"las tijeras wird im Plural verwendet."},{"q":"La gente ___ muy amable aquí.","options":["es","son"],"a":0,"why":"la gente ist grammatisch Singular."},{"q":"Este mes hemos tenido tres ___ con el ordenador.","options":["problemas","problemes"],"a":0,"why":"Endung auf unbetonten Vokal → nur -s."},{"q":"Los ___ de España visitaron Alemania.","options":["reys","reyes","reies"],"a":1,"why":"Endung -y → Plural -yes; los reyes = König und Königin."}]}],"cards":[{"f":"Genus: -o / -a","b":"-o meist maskulin, -a meist feminin"},{"f":"el día, el mapa, el sofá","b":"maskulin trotz -a"},{"f":"el problema, el tema, el sistema, el idioma","b":"maskulin (griechische Wörter auf -ma)"},{"f":"la mano, la foto, la moto, la radio","b":"feminin trotz -o"},{"f":"-ción, -sión, -dad, -tad, -tud, -umbre","b":"immer feminin: la canción, la ciudad, la juventud, la costumbre"},{"f":"-aje, -or","b":"maskulin: el viaje, el color (Ausnahmen: la flor, la labor)"},{"f":"der Tisch / das Auto / die Milch","b":"la mesa / el coche / la leche"},{"f":"el profesor →","b":"la profesora"},{"f":"el actor →","b":"la actriz"},{"f":"el alcalde, el príncipe →","b":"la alcaldesa, la princesa"},{"f":"el/la estudiante, el/la turista","b":"gleiche Form, nur der Artikel zeigt das Geschlecht"},{"f":"el yerno / el caballo / el toro →","b":"la nuera / la yegua / la vaca"},{"f":"el capital / la capital","b":"das Kapital (Geld) / die Hauptstadt"},{"f":"el orden / la orden","b":"die Ordnung, Reihenfolge / der Befehl"},{"f":"el frente / la frente","b":"die Front / die Stirn"},{"f":"el cura / la cura","b":"der Pfarrer / die Heilung"},{"f":"Plural nach Vokal / Konsonant","b":"+ -s (casas) / + -es (árboles, reyes)"},{"f":"Plural von luz, vez, lápiz","b":"luces, veces, lápices (-z → -ces)"},{"f":"canción, inglés → Plural","b":"canciones, ingleses (Akzent fällt weg)"},{"f":"joven, examen → Plural","b":"jóvenes, exámenes (Akzent kommt hinzu)"},{"f":"Plural: el lunes, la crisis, el paraguas","b":"los lunes, las crisis, los paraguas (unverändert)"},{"f":"el mes, el país → Plural","b":"los meses, los países (einsilbig/endbetont → -es)"},{"f":"los padres, los hermanos, los reyes","b":"die Eltern, die Geschwister, das Königspaar"},{"f":"die Brille, die Schere, die Ferien","b":"las gafas, las tijeras, las vacaciones (Plural!)"},{"f":"die Leute","b":"la gente (Singular: La gente es simpática.)"},{"f":"el carácter → Plural","b":"los caracteres (Betonung verschiebt sich)"}],"id":"k02"},{"nr":3,"title":"Der Artikel","teil":"Das Substantiv und seine Begleiter","intro":"Der spanische Artikel hat nur wenige Formen, wird aber oft anders verwendet als im Deutschen – mal steht er, wo wir keinen setzen, mal fehlt er. Dazu kommt das neutrale lo, das es im Deutschen so nicht gibt.","sections":[{"h":"Der bestimmte Artikel","html":"<table><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>maskulin<\/td><td><em>el coche<\/em><\/td><td><em>los coches<\/em><\/td><\/tr><tr><td>feminin<\/td><td><em>la casa<\/em><\/td><td><em>las casas<\/em><\/td><\/tr><\/table><p><b>el vor betontem a-/ha-<\/b>: Feminine Substantive, die mit betontem <em>a-<\/em> oder <em>ha-<\/em> beginnen, bekommen im Singular <em>el<\/em> (aus Gründen des Wohlklangs). Sie bleiben aber feminin:<\/p><ul><li><em>el agua fría<\/em> – das kalte Wasser (Adjektiv feminin!)<\/li><li><em>el águila, el aula, el hacha, el hambre, el arma, el alma<\/em><\/li><li>Plural normal: <em>las aguas, las águilas, las aulas<\/em><\/li><\/ul><div class=\"warn\">Achtung: Die Regel gilt nur direkt vor dem Substantiv und nur bei Betonung auf dem a: <em>la alta montaña, la amiga<\/em> (a- unbetont), <em>la Ana<\/em> (Name). Andere Begleiter bleiben feminin: <em>esta agua, mucha hambre, toda el agua<\/em>.<\/div><div class=\"tip\">Merke: Auch der unbestimmte Artikel wird meist angepasst: <em>un aula, un águila<\/em>.<\/div>"},{"h":"Verschmelzung: al und del","html":"<p>Nur <em>el<\/em> verschmilzt mit den Präpositionen <em>a<\/em> und <em>de<\/em>:<\/p><table><tr><th><\/th><th>Verschmelzung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>a + el<\/em><\/td><td><em>al<\/em><\/td><td><em>Voy al cine.<\/em><\/td><\/tr><tr><td><em>de + el<\/em><\/td><td><em>del<\/em><\/td><td><em>Vengo del trabajo.<\/em><\/td><\/tr><\/table><p>Keine Verschmelzung mit <em>la, los, las<\/em>: <em>a la playa, de los niños<\/em>.<\/p><div class=\"warn\">Achtung: Keine Verschmelzung mit dem Pronomen <em>él<\/em> (<em>Es el libro de él<\/em>) und bei Eigennamen, deren Artikel Teil des Namens ist: <em>Soy de El Salvador. Leo un artículo de El País.<\/em><\/div>"},{"h":"Bestimmter Artikel: anders als im Deutschen","html":"<p>Spanisch setzt den bestimmten Artikel in vielen Fällen, in denen das Deutsche keinen hat:<\/p><ul><li><b>Allgemeine Aussagen<\/b>: <em>Me encanta el chocolate.<\/em> – Ich liebe Schokolade. <em>Los perros son fieles.<\/em> – Hunde sind treu.<\/li><li><b>Titel<\/b> (<em>señor, señora, doctor, profesor<\/em>), wenn man <b>über<\/b> jemanden spricht: <em>El doctor Ruiz no está.<\/em> In der direkten Anrede ohne Artikel: <em>Buenos días, doctor Ruiz.<\/em><\/li><li><b>Uhrzeit<\/b>: <em>Es la una. Son las cinco. A las ocho.<\/em><\/li><li><b>Wochentage<\/b> im Sinne von „am“: <em>El lunes voy al médico.<\/em> (am Montag) – <em>Los lunes…<\/em> (montags). Aber: <em>Hoy es lunes.<\/em><\/li><li><b>Prozente<\/b>: <em>El 30 % de los alumnos habla inglés.<\/em><\/li><li><b>Körperteile und Kleidung<\/b> statt Possessiv: <em>Me duele la cabeza. Ponte el abrigo.<\/em><\/li><li><b>Sprachen<\/b> als Subjekt oder Objekt: <em>El español es fácil. Me gusta el francés.<\/em> Aber meist ohne Artikel nach <em>hablar, aprender, estudiar<\/em> und <em>en<\/em>: <em>Hablo alemán. Está escrito en español.<\/em><\/li><li><b>Alter und Jahrzehnte<\/b>: <em>a los veinte años, en los años noventa<\/em>.<\/li><li><b>Mengen und Preise<\/b> pro Einheit: <em>dos euros el kilo<\/em>.<\/li><\/ul><p><b>Ländernamen<\/b> stehen meist <b>ohne<\/b> Artikel: <em>España, Alemania, México, Francia<\/em>. Fester Bestandteil ist er bei <em>El Salvador, la India, el Reino Unido, los Países Bajos<\/em>; freigestellt bei <em>(el) Perú, (la) Argentina, (los) Estados Unidos<\/em>. Mit näherer Bestimmung steht immer ein Artikel: <em>la España de los años sesenta<\/em>.<\/p><div class=\"warn\">Achtung: Deutsche Lerner vergessen den Artikel bei allgemeinen Aussagen: nicht <em>Me gusta café<\/em>, sondern <em>Me gusta el café<\/em>.<\/div>"},{"h":"Der unbestimmte Artikel","html":"<table><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>maskulin<\/td><td><em>un libro<\/em><\/td><td><em>unos libros<\/em><\/td><\/tr><tr><td>feminin<\/td><td><em>una mesa<\/em><\/td><td><em>unas mesas<\/em><\/td><\/tr><\/table><p>Die Pluralformen bedeuten „einige, ein paar“ oder vor Zahlen „ungefähr“: <em>Tengo unos amigos en Bilbao.<\/em> – <em>Cuesta unos cincuenta euros.<\/em><\/p><p><b>Kein unbestimmter Artikel<\/b> steht – anders als im Deutschen – vor:<\/p><ul><li><em>otro/otra<\/em>: <em>¿Quieres otro café?<\/em> – Willst du noch einen Kaffee?<\/li><li><em>medio/media<\/em>: <em>medio kilo, media hora<\/em><\/li><li><em>cierto/cierta<\/em> (vorangestellt): <em>Cierto día recibí una carta.<\/em><\/li><li><em>tal<\/em>: <em>Nunca he dicho tal cosa.<\/em><\/li><li>Ausrufen mit <em>qué<\/em>: <em>¡Qué idea tan buena!<\/em> – Was für eine gute Idee!<\/li><li><b>Beruf, Nationalität, Religion<\/b> nach <em>ser<\/em>: <em>Mi hermana es abogada. Él es católico.<\/em><\/li><\/ul><p>Mit einem Adjektiv dazu steht der Artikel wieder: <em>Es una abogada excelente.<\/em><\/p><div class=\"warn\">Achtung: nicht <em>un otro libro<\/em>, sondern <em>otro libro<\/em>; nicht <em>un medio litro<\/em>, sondern <em>medio litro<\/em>.<\/div>"},{"h":"Ohne Artikel: unbestimmte Mengen","html":"<p>Bei unbestimmten Mengen und unzählbaren Dingen steht im Spanischen <b>kein<\/b> Artikel – wie im Deutschen:<\/p><ul><li><em>Quiero pan.<\/em> – Ich möchte Brot.<\/li><li><em>¿Hay leche en la nevera?<\/em> – Ist Milch im Kühlschrank?<\/li><li><em>Bebemos agua.<\/em> – Wir trinken Wasser.<\/li><\/ul><p>Anders als im Deutschen fehlt der Artikel aber oft auch bei zählbaren Dingen nach <em>tener, buscar, llevar, necesitar<\/em>, vor allem in Fragen und Verneinungen, wenn es nur um die Art, nicht um ein bestimmtes Exemplar geht:<\/p><ul><li><em>No tengo coche.<\/em> – Ich habe kein Auto.<\/li><li><em>¿Tienes bolígrafo?<\/em> – Hast du einen Kuli?<\/li><li><em>Buscamos piso en el centro.<\/em> – Wir suchen eine Wohnung im Zentrum.<\/li><li><em>Lleva gafas.<\/em> – Er/Sie trägt eine Brille.<\/li><\/ul><div class=\"tip\">Merke: Deutsches „kein“ ist im Spanischen einfach <em>no<\/em> + Substantiv ohne Artikel: <em>No hay tiempo.<\/em> – Es gibt keine Zeit.<\/div><p>Nach <em>hay<\/em> steht nie der bestimmte Artikel: <em>Hay un banco cerca.<\/em> – aber: <em>El banco está cerca.<\/em><\/p>"},{"h":"Das neutrale lo","html":"<p><em>lo<\/em> ist kein Artikel für Substantive (es gibt kein neutrales Substantiv), sondern macht aus Adjektiven, Adverbien und Sätzen abstrakte Begriffe:<\/p><table><tr><th>Struktur<\/th><th>Beispiel<\/th><th>Deutsch<\/th><\/tr><tr><td><em>lo<\/em> + Adjektiv<\/td><td><em>lo bueno, lo importante<\/em><\/td><td>das Gute, das Wichtige<\/td><\/tr><tr><td><em>lo que<\/em><\/td><td><em>Lo que dices es verdad.<\/em><\/td><td>Was du sagst, ist wahr.<\/td><\/tr><tr><td><em>lo de<\/em><\/td><td><em>¿Sabes lo de Marta?<\/em><\/td><td>Weißt du das mit Marta?<\/td><\/tr><tr><td><em>lo<\/em> + Adj./Adv. + <em>que<\/em><\/td><td><em>No sabes lo cansada que estoy.<\/em><\/td><td>Du weißt nicht, wie müde ich bin.<\/td><\/tr><\/table><p>Weitere Beispiele: <em>Lo mejor del viaje fue la comida.<\/em> – Das Beste an der Reise war das Essen. <em>Lo malo es que no tenemos tiempo.<\/em> – Das Dumme ist, dass wir keine Zeit haben.<\/p><div class=\"warn\">Achtung: Bei <em>lo<\/em> + Adjektiv + <em>que<\/em> richtet sich das Adjektiv nach dem Bezugswort: <em>No te imaginas lo caras que son las entradas.<\/em> Adverbien bleiben unverändert: <em>lo bien que canta<\/em>.<\/div><div class=\"tip\">Merke: „alles, was“ = <em>todo lo que<\/em>: <em>Haz todo lo que puedas.<\/em><\/div>"}],"exercises":[{"type":"gap","title":"Bestimmter Artikel","task":"Setze el, la, los oder las ein.","items":[{"q":"___ agua de este río está muy fría.","a":["El"],"de":"Das Wasser dieses Flusses ist sehr kalt."},{"q":"Los alumnos esperan en ___ aula 3.","a":["el"],"de":"Die Schüler warten im Raum 3."},{"q":"___ águilas viven en las montañas.","a":["Las"],"de":"Adler leben in den Bergen."},{"q":"Tengo ___ manos frías.","a":["las"],"de":"Ich habe kalte Hände."},{"q":"Desde aquí se ve ___ alta torre de la catedral.","a":["la"],"de":"Von hier sieht man den hohen Turm der Kathedrale."},{"q":"___ problema es que no tenemos dinero.","a":["El"],"de":"Das Problem ist, dass wir kein Geld haben."},{"q":"Mañana tenemos que hablar con ___ profesora Gómez.","a":["la"],"de":"Morgen müssen wir mit der Lehrerin, Frau Gómez, sprechen."},{"q":"Después de correr tengo mucha hambre: ___ hambre no me deja pensar.","a":["el"],"de":"Nach dem Laufen habe ich großen Hunger: Der Hunger lässt mich nicht denken."}]},{"type":"gap","title":"al, del oder nicht verschmolzen?","task":"Setze a/de mit dem passenden Artikel ein (al, del, a la, de la, a los …).","items":[{"q":"Esta tarde vamos ___ cine. (a + el)","a":["al"],"de":"Heute Nachmittag gehen wir ins Kino."},{"q":"Vuelvo ___ oficina a las seis. (de + la)","a":["de la"],"de":"Ich komme um sechs aus dem Büro zurück."},{"q":"Es la casa ___ profesor. (de + el)","a":["del"],"de":"Es ist das Haus des Lehrers."},{"q":"Mis abuelos son ___ Salvador. (de + El Salvador)","a":["de El"],"de":"Meine Großeltern sind aus El Salvador."},{"q":"Hemos invitado ___ vecinos a la fiesta. (a + los)","a":["a los"],"de":"Wir haben die Nachbarn zum Fest eingeladen."},{"q":"¿Has llamado ___ médico? (a + el)","a":["al"],"de":"Hast du den Arzt angerufen?"},{"q":"Este libro no es mío, es ___. (de + él = von ihm)","a":["de él"],"de":"Dieses Buch gehört nicht mir, es gehört ihm."},{"q":"El tren sale ___ estación central a las nueve. (de + la)","a":["de la"],"de":"Der Zug fährt um neun vom Hauptbahnhof ab."}]},{"type":"choice","title":"Artikel oder kein Artikel?","task":"Wähle die richtige Variante (– = kein Artikel).","items":[{"q":"Buenos días, ___ señora Martín. ¿Cómo está?","options":["la","–"],"a":1,"why":"Direkte Anrede → kein Artikel vor dem Titel."},{"q":"___ señora Martín vive en el segundo piso.","options":["La","–"],"a":0,"why":"Man spricht über die Person → Artikel vor dem Titel."},{"q":"La reunión es a ___ diez.","options":["las","–"],"a":0,"why":"Uhrzeiten stehen mit dem Artikel."},{"q":"___ sábado vamos a la playa.","options":["El","–"],"a":0,"why":"„Am Samstag“ → el sábado."},{"q":"Hoy es ___ miércoles.","options":["el","–"],"a":1,"why":"Nach „hoy es“ steht der Wochentag ohne Artikel."},{"q":"Me gusta mucho ___ música clásica.","options":["la","–"],"a":0,"why":"Allgemeine Aussage nach gustar → bestimmter Artikel."},{"q":"Mi padre habla ___ portugués.","options":["el","–"],"a":1,"why":"Nach hablar steht die Sprache meist ohne Artikel."},{"q":"___ 40 % de los encuestados no votó.","options":["El","–"],"a":0,"why":"Prozentangaben stehen mit dem Artikel."},{"q":"Me duele ___ espalda.","options":["mi","la"],"a":1,"why":"Bei Körperteilen steht der Artikel statt des Possessivs."},{"q":"Este verano viajamos a ___ Italia.","options":["la","–"],"a":1,"why":"Die meisten Ländernamen stehen ohne Artikel."}]},{"type":"choice","title":"Unbestimmter Artikel oder nicht?","task":"Wähle die richtige Variante.","items":[{"q":"¿Me das ___ vaso de agua?","options":["otro","un otro"],"a":0,"why":"Vor otro steht kein unbestimmter Artikel."},{"q":"Espérame, vuelvo en ___ hora.","options":["media","una media"],"a":0,"why":"Vor medio/media steht kein unbestimmter Artikel."},{"q":"Mi tío es ___.","options":["un arquitecto","arquitecto"],"a":1,"why":"Beruf nach ser ohne Adjektiv → kein Artikel."},{"q":"Mi tío es ___ muy conocido.","options":["un arquitecto","arquitecto"],"a":0,"why":"Mit näherer Bestimmung durch ein Adjektiv steht der Artikel."},{"q":"¡Qué ___ más bonito!","options":["un día","día"],"a":1,"why":"Nach qué im Ausruf steht kein Artikel."},{"q":"Esta chaqueta cuesta ___ ochenta euros.","options":["unos","unas"],"a":0,"why":"unos vor Zahlen = ungefähr; euros ist maskulin."},{"q":"Perdona, ¿tienes ___?","options":["un fuego","fuego"],"a":1,"why":"Tener + Substantiv in der Frage, Art statt Exemplar → kein Artikel."},{"q":"No tenemos ___.","options":["un jardín","jardín"],"a":1,"why":"Verneinung „kein“ → no + Substantiv ohne Artikel."},{"q":"Necesito ___ kilo de tomates.","options":["medio","un medio"],"a":0,"why":"medio ohne unbestimmten Artikel."}]},{"type":"gap","title":"Das neutrale lo","task":"Ergänze lo, lo que, el oder la.","items":[{"q":"___ más difícil del español es el subjuntivo.","a":["Lo"],"de":"Das Schwierigste am Spanischen ist der Subjunktiv."},{"q":"No entiendo ___ quieres decir.","a":["lo que"],"de":"Ich verstehe nicht, was du sagen willst."},{"q":"¿Te has enterado de ___ de Pedro?","a":["lo"],"de":"Hast du das mit Pedro mitbekommen?"},{"q":"No te imaginas ___ difíciles que son estos ejercicios.","a":["lo"],"de":"Du kannst dir nicht vorstellen, wie schwierig diese Übungen sind."},{"q":"___ película que vimos ayer fue muy aburrida.","a":["La"],"de":"Der Film, den wir gestern gesehen haben, war sehr langweilig."},{"q":"Haz todo ___ puedas.","a":["lo que"],"de":"Tu alles, was du kannst."},{"q":"Me sorprende ___ bien que hablas alemán.","a":["lo"],"de":"Es überrascht mich, wie gut du Deutsch sprichst."},{"q":"___ bueno de vivir aquí es el clima.","a":["Lo"],"de":"Das Gute am Leben hier ist das Klima."}]},{"type":"choice","title":"Gemischte Wiederholung","task":"Welche Variante ist korrekt?","items":[{"q":"Ich trinke keinen Kaffee.","options":["No bebo café.","No bebo un café.","No bebo el café."],"a":0,"why":"Verneinte unbestimmte Menge → kein Artikel."},{"q":"Ich liebe Katzen.","options":["Me encantan gatos.","Me encantan los gatos."],"a":1,"why":"Allgemeine Aussage → bestimmter Artikel."},{"q":"Das kalte Wasser tut gut.","options":["El agua frío sienta bien.","El agua fría sienta bien.","La agua fría sienta bien."],"a":1,"why":"agua ist feminin, bekommt aber el wegen des betonten a-."},{"q":"Er trägt eine Brille.","options":["Lleva gafas.","Lleva unas gafas.","Beides möglich"],"a":2,"why":"Ohne Artikel ist typisch; unas gafas betont ein bestimmtes Exemplar."},{"q":"Montags habe ich frei.","options":["El lunes tengo libre.","Los lunes tengo libre.","Lunes tengo libre."],"a":1,"why":"Regelmäßige Wiederholung → los lunes."},{"q":"Was mir gefällt, ist das Meer.","options":["Lo que me gusta es el mar.","El que me gusta es el mar.","Que me gusta es el mar."],"a":0,"why":"„was“ als abstrakter Bezug → lo que."},{"q":"Mit zwanzig Jahren zog sie nach Madrid.","options":["A veinte años se mudó a Madrid.","A los veinte años se mudó a Madrid."],"a":1,"why":"Altersangaben mit a stehen mit dem Artikel: a los veinte años."},{"q":"Ein anderes Mal.","options":["Una otra vez.","Otra vez."],"a":1,"why":"otro steht ohne unbestimmten Artikel."}]}],"cards":[{"f":"bestimmter Artikel – Formen","b":"el, la, los, las"},{"f":"unbestimmter Artikel – Formen","b":"un, una, unos, unas"},{"f":"el agua – maskulin oder feminin?","b":"feminin! el nur wegen betontem a-: el agua fría, las aguas"},{"f":"el águila, el aula, el hacha, el hambre","b":"feminine Wörter mit betontem a-/ha- → el im Singular"},{"f":"la alta montaña – warum la?","b":"el-Regel nur direkt vor dem Substantiv mit betontem a-"},{"f":"a + el / de + el","b":"al / del (nicht mit la, los, las, él, El Salvador)"},{"f":"Ich mag Kaffee.","b":"Me gusta el café. (allgemeine Aussage mit Artikel)"},{"f":"Titel: über jemanden / in der Anrede","b":"El señor López no está. / Buenos días, señor López."},{"f":"Es ist ein Uhr. / Um acht.","b":"Es la una. / A las ocho."},{"f":"am Montag / montags / heute ist Montag","b":"el lunes / los lunes / hoy es lunes"},{"f":"Mir tut der Kopf weh.","b":"Me duele la cabeza. (Artikel statt Possessiv)"},{"f":"Ich spreche Deutsch. / Deutsch ist schwer.","b":"Hablo alemán. / El alemán es difícil."},{"f":"Länder mit festem Artikel","b":"El Salvador, la India, el Reino Unido, los Países Bajos"},{"f":"20 % der Leute","b":"el 20 % de la gente"},{"f":"noch ein Bier / ein halbes Kilo","b":"otra cerveza / medio kilo (ohne un/una)"},{"f":"Sie ist Ärztin. / Sie ist eine gute Ärztin.","b":"Es médica. / Es una buena médica."},{"f":"Was für ein Glück!","b":"¡Qué suerte! (kein Artikel nach qué)"},{"f":"unos/unas vor Zahlen","b":"ungefähr: unos treinta euros"},{"f":"Ich habe kein Auto.","b":"No tengo coche."},{"f":"Hast du einen Kuli?","b":"¿Tienes bolígrafo? (Art, kein bestimmtes Exemplar)"},{"f":"das Wichtige / das Beste","b":"lo importante / lo mejor"},{"f":"was (= das, was)","b":"lo que: Lo que dices es verdad."},{"f":"das mit Marta","b":"lo de Marta"},{"f":"Du weißt nicht, wie müde ich bin. (Frau)","b":"No sabes lo cansada que estoy."},{"f":"alles, was","b":"todo lo que"}],"id":"k03"},{"nr":4,"title":"Das Adjektiv","teil":"Das Substantiv und seine Begleiter","intro":"Spanische Adjektive richten sich in Genus und Zahl nach dem Substantiv – auch prädikativ nach ser und estar, wo das Deutsche sie unverändert lässt. Außerdem kann die Stellung vor oder nach dem Substantiv die Bedeutung verändern.","sections":[{"h":"Formen und Angleichung","html":"<p>Das Adjektiv passt sich immer an – attributiv und prädikativ: <em>un coche rojo, una casa roja<\/em>; <em>Los coches son rojos.<\/em><\/p><table><tr><th>Endung<\/th><th>Singular m / f<\/th><th>Plural m / f<\/th><\/tr><tr><td><em>-o<\/em><\/td><td><em>alto / alta<\/em><\/td><td><em>altos / altas<\/em><\/td><\/tr><tr><td><em>-e<\/em><\/td><td><em>verde<\/em><\/td><td><em>verdes<\/em><\/td><\/tr><tr><td><em>-ista<\/em><\/td><td><em>optimista<\/em><\/td><td><em>optimistas<\/em><\/td><\/tr><tr><td>Konsonant<\/td><td><em>azul, fácil<\/em><\/td><td><em>azules, fáciles<\/em><\/td><\/tr><tr><td><em>-z<\/em><\/td><td><em>feliz<\/em><\/td><td><em>felices<\/em><\/td><\/tr><\/table><p><b>Ausnahmen mit weiblicher Form<\/b> auf -a: Adjektive auf <em>-or, -ón, -án, -ín<\/em>: <em>trabajador → trabajadora, dormilón → dormilona, holgazán → holgazana<\/em>. Aber unveränderlich: <em>mejor, peor, mayor, menor, interior, exterior, superior<\/em>.<\/p><p><b>Nationalitäten<\/b> auf Konsonant bilden immer eine weibliche Form (und verlieren dabei den Akzent):<\/p><ul><li><em>español → española, alemán → alemana, inglés → inglesa, francés → francesa<\/em><\/li><li>unveränderlich im Genus: <em>belga, marroquí, iraní, estadounidense, canadiense<\/em><\/li><\/ul><div class=\"warn\">Achtung: Deutsche Lerner vergessen die Angleichung nach ser/estar: <em>Mi hermana está cansada. Las calles son estrechas.<\/em><\/div>"},{"h":"Ein Adjektiv – mehrere Substantive","html":"<p>Bezieht sich ein nachgestelltes Adjektiv auf mehrere Substantive, steht es im Plural. Sind Maskulinum und Femininum gemischt, gewinnt das <b>Maskulinum<\/b>:<\/p><ul><li><em>un abrigo y una bufanda negros<\/em> – ein schwarzer Mantel und ein schwarzer Schal<\/li><li><em>Mi padre y mi madre son muy simpáticos.<\/em><\/li><li><em>la lengua y la cultura españolas<\/em> (beide feminin → feminin)<\/li><\/ul><p>Ein <b>vorangestelltes<\/b> Adjektiv richtet sich meist nur nach dem ersten Substantiv: <em>su enorme talento y paciencia<\/em>.<\/p><div class=\"tip\">Merke: Ein einziges maskulines Element genügt für den maskulinen Plural: <em>cinco chicas y un chico muy contentos<\/em>.<\/div>"},{"h":"Stellung: vor oder nach dem Substantiv","html":"<p>Normalerweise steht das Adjektiv <b>nach<\/b> dem Substantiv und unterscheidet es von anderen: <em>un vino tinto, la puerta cerrada, un libro interesante<\/em>. Farben, Formen, Nationalitäten und Fachbegriffe stehen in der Regel danach: <em>una camisa azul, la cocina italiana<\/em>.<\/p><p><b>Vor<\/b> dem Substantiv steht es, wenn es eine selbstverständliche Eigenschaft hervorhebt oder subjektiv-wertend ist: <em>la blanca nieve, un precioso jardín, mi querida amiga<\/em>. Ordnungszahlen und Mengenwörter stehen davor: <em>el primer día, muchos amigos<\/em>.<\/p><p>Bei einigen Adjektiven ändert die Stellung die Bedeutung:<\/p><table><tr><th>vorangestellt<\/th><th>nachgestellt<\/th><\/tr><tr><td><em>un gran hombre<\/em> ein großartiger Mann<\/td><td><em>un hombre grande<\/em> ein großer (großgewachsener) Mann<\/td><\/tr><tr><td><em>la pobre mujer<\/em> die arme (bedauernswerte) Frau<\/td><td><em>una mujer pobre<\/em> eine arme (mittellose) Frau<\/td><\/tr><tr><td><em>un viejo amigo<\/em> ein langjähriger Freund<\/td><td><em>un amigo viejo<\/em> ein alter (betagter) Freund<\/td><\/tr><tr><td><em>mi nuevo piso<\/em> meine neue (andere) Wohnung<\/td><td><em>un piso nuevo<\/em> eine neu gebaute Wohnung<\/td><\/tr><tr><td><em>el mismo día<\/em> derselbe Tag<\/td><td><em>el rey mismo<\/em> der König selbst<\/td><\/tr><tr><td><em>cierta noticia<\/em> eine gewisse Nachricht<\/td><td><em>una noticia cierta<\/em> eine wahre Nachricht<\/td><\/tr><tr><td><em>mi único hijo<\/em> mein einziger Sohn<\/td><td><em>un caso único<\/em> ein einzigartiger Fall<\/td><\/tr><\/table><div class=\"tip\">Merke: Vorangestellt ist die Bedeutung oft übertragen oder wertend, nachgestellt wörtlich und objektiv.<\/div>"},{"h":"Verkürzte Formen (Apokope)","html":"<p>Einige Adjektive verlieren vor dem Substantiv ihre Endung:<\/p><table><tr><th>Grundform<\/th><th>verkürzt<\/th><th>wann?<\/th><\/tr><tr><td><em>bueno, malo<\/em><\/td><td><em>buen, mal<\/em><\/td><td>vor m. Sg.<\/td><\/tr><tr><td><em>primero, tercero<\/em><\/td><td><em>primer, tercer<\/em><\/td><td>vor m. Sg.<\/td><\/tr><tr><td><em>alguno, ninguno<\/em><\/td><td><em>algún, ningún<\/em><\/td><td>vor m. Sg.<\/td><\/tr><tr><td><em>grande<\/em><\/td><td><em>gran<\/em><\/td><td>vor m. + f. Sg.<\/td><\/tr><tr><td><em>cualquiera<\/em><\/td><td><em>cualquier<\/em><\/td><td>vor m. + f. Sg.<\/td><\/tr><tr><td><em>santo<\/em><\/td><td><em>san<\/em><\/td><td>vor m. Heiligennamen<\/td><\/tr><\/table><ul><li><em>un buen día<\/em> – aber <em>una buena idea, unos buenos días<\/em><\/li><li><em>el primer piso, el tercer capítulo<\/em> – aber <em>la primera vez<\/em><\/li><li><em>No tengo ningún problema.<\/em> – aber <em>ninguna duda<\/em><\/li><li><em>una gran ciudad, un gran éxito<\/em> – aber <em>grandes ciudades<\/em><\/li><li><em>cualquier día, cualquier persona<\/em> – nachgestellt: <em>un día cualquiera<\/em><\/li><li><em>San Pedro, San Juan<\/em> – aber <em>Santo Tomás, Santo Domingo<\/em> und <em>Santa María<\/em><\/li><\/ul><div class=\"warn\">Achtung: Die Verkürzung gilt auch, wenn ein anderes Adjektiv dazwischensteht: <em>el primer gran premio<\/em>. Nachgestellt nie: <em>un día bueno, el capítulo tercero<\/em>.<\/div>"},{"h":"Der Vergleich","html":"<table><tr><th>Vergleich<\/th><th>Struktur<\/th><th>Beispiel<\/th><\/tr><tr><td>Überlegenheit<\/td><td><em>más<\/em> + Adj. + <em>que<\/em><\/td><td><em>Ana es más alta que Luis.<\/em><\/td><\/tr><tr><td>Unterlegenheit<\/td><td><em>menos<\/em> + Adj. + <em>que<\/em><\/td><td><em>El tren es menos caro que el avión.<\/em><\/td><\/tr><tr><td>Gleichheit (Adj./Adv.)<\/td><td><em>tan<\/em> + Adj. + <em>como<\/em><\/td><td><em>Eres tan alto como tu padre.<\/em><\/td><\/tr><tr><td>Gleichheit (Substantiv)<\/td><td><em>tanto/-a/-os/-as<\/em> + Subst. + <em>como<\/em><\/td><td><em>Tengo tantos libros como tú.<\/em><\/td><\/tr><tr><td>Gleichheit (Verb)<\/td><td>Verb + <em>tanto como<\/em><\/td><td><em>Trabajo tanto como tú.<\/em><\/td><\/tr><\/table><p><em>tanto<\/em> passt sich dem Substantiv an: <em>tanta paciencia, tantos problemas, tantas horas<\/em>. <em>tan<\/em> ist unveränderlich.<\/p><p>Vor <b>Zahlen und Mengen<\/b> steht <em>de<\/em> statt <em>que<\/em>: <em>Hay más de cien personas.<\/em> – <em>Gano menos de mil euros.<\/em> Aber: <em>No tengo más que diez euros.<\/em> = Ich habe nur zehn Euro.<\/p><div class=\"warn\">Achtung: „so … wie“ ist <em>tan … como<\/em>, nicht <em>tan … que<\/em>. Und nach <em>que/como<\/em> steht das Subjektpronomen: <em>más alto que yo, tan rápido como tú<\/em>.<\/div>"},{"h":"Der Superlativ","html":"<p><b>Relativer Superlativ<\/b> (der/die/das …ste): bestimmter Artikel + (Substantiv) + <em>más/menos<\/em> + Adjektiv + <em>de<\/em>:<\/p><ul><li><em>Es la ciudad más bonita de España.<\/em> – die schönste Stadt Spaniens<\/li><li><em>Pedro es el más joven de la clase.<\/em><\/li><li><em>Es el hotel menos caro del barrio.<\/em><\/li><\/ul><div class=\"warn\">Achtung: Der Artikel steht nur einmal: richtig ist <em>el libro más interesante<\/em>, nicht <em>el libro el más interesante<\/em>. Der Bereich wird mit <em>de<\/em> angeschlossen, nicht mit <em>en<\/em>.<\/div><p><b>Absoluter Superlativ<\/b> (sehr, äußerst): <em>muy<\/em> + Adjektiv oder Endung <em>-ísimo/-a/-os/-as<\/em>. Ein Endvokal fällt weg:<\/p><table><tr><th>Grundform<\/th><th>-ísimo<\/th><th>Hinweis<\/th><\/tr><tr><td><em>guapo<\/em><\/td><td><em>guapísimo<\/em><\/td><td>-o fällt weg<\/td><\/tr><tr><td><em>fácil<\/em><\/td><td><em>facilísimo<\/em><\/td><td>Akzent wandert<\/td><\/tr><tr><td><em>rico, poco<\/em><\/td><td><em>riquísimo, poquísimo<\/em><\/td><td>c → qu<\/td><\/tr><tr><td><em>largo<\/em><\/td><td><em>larguísimo<\/em><\/td><td>g → gu<\/td><\/tr><tr><td><em>feliz, capaz<\/em><\/td><td><em>felicísimo, capacísimo<\/em><\/td><td>z → c<\/td><\/tr><tr><td><em>amable<\/em><\/td><td><em>amabilísimo<\/em><\/td><td>-ble → -bilísimo<\/td><\/tr><tr><td><em>joven<\/em><\/td><td><em>jovencísimo<\/em><\/td><td>-n → -ncísimo<\/td><\/tr><\/table><div class=\"tip\">Merke: Die Schreibänderungen erhalten nur den Laut – dieselbe Logik wie bei <em>saqué, llegué<\/em>.<\/div>"},{"h":"Unregelmäßige Steigerung","html":"<table><tr><th>Grundform<\/th><th>Komparativ<\/th><th>Superlativ (absolut)<\/th><\/tr><tr><td><em>bueno<\/em><\/td><td><em>mejor<\/em><\/td><td><em>óptimo / buenísimo<\/em><\/td><\/tr><tr><td><em>malo<\/em><\/td><td><em>peor<\/em><\/td><td><em>pésimo / malísimo<\/em><\/td><\/tr><tr><td><em>grande<\/em><\/td><td><em>mayor / más grande<\/em><\/td><td><em>máximo / grandísimo<\/em><\/td><\/tr><tr><td><em>pequeño<\/em><\/td><td><em>menor / más pequeño<\/em><\/td><td><em>mínimo / pequeñísimo<\/em><\/td><\/tr><\/table><p><em>mejor, peor, mayor, menor<\/em> sind im Genus unveränderlich und bilden den Plural auf <em>-es<\/em>: <em>las mejores amigas<\/em>. Der relative Superlativ entsteht mit dem Artikel: <em>el mejor restaurante, la peor nota<\/em>.<\/p><p><b>mayor/menor<\/b> bezieht sich meist auf Alter oder Bedeutung, <b>más grande/más pequeño<\/b> auf die Größe:<\/p><ul><li><em>Mi hermano mayor tiene 30 años.<\/em> – mein älterer Bruder<\/li><li><em>Mi casa es más grande que la tuya.<\/em><\/li><li><em>Es un problema de mayor importancia.<\/em><\/li><\/ul><p><em>óptimo, pésimo, máximo, mínimo<\/em> gehören eher zur gehobenen oder fachlichen Sprache: <em>la temperatura máxima, en condiciones óptimas, un servicio pésimo<\/em>.<\/p><div class=\"warn\">Achtung: Für Qualität sagt man <em>mejor/peor<\/em>, nicht <em>más bueno/más malo<\/em> (diese nur umgangssprachlich oder für moralische Güte: <em>Es más bueno que el pan.<\/em>). Auch das Adverb: <em>bien → mejor, mal → peor<\/em>: <em>Hoy me siento mejor.<\/em><\/div>"}],"exercises":[{"type":"gap","title":"Adjektive angleichen","task":"Setze das Adjektiv in der richtigen Form ein.","items":[{"q":"Mis vecinas son muy (simpático) ___.","a":["simpáticas"],"de":"Meine Nachbarinnen sind sehr nett."},{"q":"Me he comprado unos zapatos (azul) ___.","a":["azules"],"de":"Ich habe mir blaue Schuhe gekauft."},{"q":"Mi madre es (alemán) ___ y mi padre es chileno.","a":["alemana"],"de":"Meine Mutter ist Deutsche und mein Vater Chilene."},{"q":"Los niños están muy (feliz) ___ hoy.","a":["felices"],"de":"Die Kinder sind heute sehr glücklich."},{"q":"Es una chica muy (trabajador) ___.","a":["trabajadora"],"de":"Sie ist ein sehr fleißiges Mädchen."},{"q":"Estas preguntas son muy (fácil) ___.","a":["fáciles"],"de":"Diese Fragen sind sehr leicht."},{"q":"Mis amigas son bastante (optimista) ___.","a":["optimistas"],"de":"Meine Freundinnen sind ziemlich optimistisch."},{"q":"Tengo una compañera (inglés) ___.","a":["inglesa"],"de":"Ich habe eine englische Kollegin."},{"q":"Mi hermano y mi hermana son muy (alto) ___.","a":["altos"],"de":"Mein Bruder und meine Schwester sind sehr groß."},{"q":"Su mujer es (belga) ___.","a":["belga"],"de":"Seine Frau ist Belgierin."}]},{"type":"choice","title":"Apokope","task":"Wähle die richtige Form.","items":[{"q":"Hoy hace ___ tiempo.","options":["bueno","buen"],"a":1,"why":"Vor maskulinem Singular-Substantiv → buen."},{"q":"Es la ___ vez que vengo a Madrid.","options":["primer","primera"],"a":1,"why":"Feminin → keine Verkürzung."},{"q":"Vivimos en el ___ piso.","options":["tercero","tercer"],"a":1,"why":"Vor maskulinem Singular → tercer."},{"q":"Barcelona es una ___ ciudad.","options":["grande","gran"],"a":1,"why":"gran steht vor Singular beider Genera."},{"q":"No tengo ___ problema.","options":["ninguno","ningún"],"a":1,"why":"Vor maskulinem Singular → ningún."},{"q":"Puedes venir ___ día de la semana.","options":["cualquiera","cualquier"],"a":1,"why":"Vor dem Substantiv → cualquier."},{"q":"Llámame un día ___.","options":["cualquiera","cualquier"],"a":0,"why":"Nachgestellt → volle Form cualquiera."},{"q":"La iglesia de ___ Tomás es muy
