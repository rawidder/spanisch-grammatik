ur Party?<\/div><p>In Argentinien, Uruguay und Teilen Mittelamerikas sagt man außerdem <em>vos<\/em> statt <em>tú<\/em> (<em>vos tenés<\/em> statt <em>tú tienes<\/em>) – für Lerner in Spanien nur zum Verstehen wichtig.<\/p>"},{"h":"Direkte Objektpronomen","html":"<p>Sie ersetzen das Akkusativobjekt (wen? was?):<\/p><table><tr><th>Person<\/th><th>Pronomen<\/th><th>Deutsch<\/th><\/tr><tr><td>1. Sg.<\/td><td><em>me<\/em><\/td><td>mich<\/td><\/tr><tr><td>2. Sg.<\/td><td><em>te<\/em><\/td><td>dich<\/td><\/tr><tr><td>3. Sg.<\/td><td><em>lo / la<\/em><\/td><td>ihn, es / sie; Sie<\/td><\/tr><tr><td>1. Pl.<\/td><td><em>nos<\/em><\/td><td>uns<\/td><\/tr><tr><td>2. Pl.<\/td><td><em>os<\/em><\/td><td>euch<\/td><\/tr><tr><td>3. Pl.<\/td><td><em>los / las<\/em><\/td><td>sie; Sie<\/td><\/tr><\/table><p><em>¿El pan? Lo compro yo.<\/em> – Das Brot? Das kaufe ich.<br><em>¿Ves a Carmen? – Sí, la veo.<\/em> – Siehst du Carmen? – Ja, ich sehe sie.<br><em>Os espero en la estación.<\/em> – Ich warte am Bahnhof auf euch.<\/p><p><em>lo<\/em> kann auch einen ganzen Sachverhalt ersetzen: <em>No lo sé.<\/em> – Ich weiß es nicht. <em>¿Es verdad? – Sí, lo es.<\/em><\/p><div class=\"warn\">Achtung: Das Geschlecht richtet sich nach dem spanischen Wort: <em>la mesa<\/em> → <em>la<\/em>, <em>el coche<\/em> → <em>lo<\/em>. „Ich warte auf dich“ = <em>Te espero<\/em> (direktes Objekt, keine Präposition!).<\/div>"},{"h":"Leísmo – kurz erklärt","html":"<p>In weiten Teilen Spaniens verwendet man <em>le<\/em> statt <em>lo<\/em>, wenn das direkte Objekt eine <b>männliche Person<\/b> ist. Die Real Academia lässt das im Singular ausdrücklich zu:<\/p><p><em>A Andrés lo conozco desde niño.<\/em> = <em>A Andrés le conozco desde niño.<\/em> – Andrés kenne ich seit meiner Kindheit.<br><em>Señor Ruiz, le acompaño.<\/em> – Herr Ruiz, ich begleite Sie.<\/p><p>Nicht korrekt ist <em>le<\/em> für Sachen (<em>*El libro le tengo<\/em>) oder für weibliche Personen (<em>*A María le vi<\/em> statt <em>la vi<\/em>). Den Plural <em>les<\/em> für männliche Personen sollte man ebenfalls meiden.<\/p><div class=\"tip\">Auf der sicheren Seite bist du immer mit <em>lo/la/los/las<\/em> für direkte und <em>le/les<\/em> für indirekte Objekte – so spricht man auch in ganz Lateinamerika.<\/div>"},{"h":"Indirekte Objektpronomen","html":"<p>Sie ersetzen das Dativobjekt (wem?):<\/p><table><tr><th>Sg.<\/th><th>Pl.<\/th><\/tr><tr><td><em>me<\/em> mir<\/td><td><em>nos<\/em> uns<\/td><\/tr><tr><td><em>te<\/em> dir<\/td><td><em>os<\/em> euch<\/td><\/tr><tr><td><em>le<\/em> ihm, ihr, Ihnen<\/td><td><em>les<\/em> ihnen, Ihnen<\/td><\/tr><\/table><p><em>Le he escrito un correo a mi jefa.<\/em> – Ich habe meiner Chefin eine Mail geschrieben.<br><em>¿Nos traes la cuenta?<\/em> – Bringst du uns die Rechnung?<br><em>Les regalamos un viaje a nuestros padres.<\/em> – Wir schenken unseren Eltern eine Reise.<\/p><p>Bei Verben wie <em>gustar, encantar, doler, parecer, interesar<\/em> steht die Person immer als indirektes Objekt: <em>Me duele la espalda.<\/em> – Mir tut der Rücken weh. <em>¿Te parece bien?<\/em> – Ist dir das recht?<\/p><div class=\"warn\">Achtung: Manche Verben haben im Deutschen und Spanischen unterschiedliche Fälle. <em>ayudar<\/em> (helfen) ist direkt: <em>La ayudo.<\/em> – Ich helfe ihr. <em>preguntar<\/em> (fragen) ist indirekt: <em>Le pregunto.<\/em> – Ich frage ihn/sie.<\/div>"},{"h":"Zwei Pronomen: Reihenfolge und se lo","html":"<p>Treffen zwei Objektpronomen zusammen, gilt: <b>indirekt vor direkt<\/b> (Person vor Sache).<\/p><p><em>Me lo explicas.<\/em> – Du erklärst es mir.<br><em>¿Nos las enseñas?<\/em> – Zeigst du sie uns?<\/p><p>Treffen <em>le<\/em> oder <em>les<\/em> auf <em>lo, la, los, las<\/em>, wird <em>le/les<\/em> zu <b><em>se<\/em><\/b>:<\/p><table><tr><th>falsch<\/th><th>richtig<\/th><\/tr><tr><td><em>*le lo doy<\/em><\/td><td><em>se lo doy<\/em><\/td><\/tr><tr><td><em>*les la mando<\/em><\/td><td><em>se la mando<\/em><\/td><\/tr><\/table><p><em>¿El regalo para Inés? Se lo doy mañana.<\/em> – Das Geschenk für Inés? Ich gebe es ihr morgen.<\/p><p>Weil <em>se<\/em> ihm/ihr/Ihnen/ihnen bedeuten kann, verdeutlicht man bei Bedarf mit <em>a + Person<\/em>: <em>Se lo doy a ella / a usted / a ellos.<\/em><\/p><p>Das Reflexivpronomen <em>se<\/em> (und das unpersönliche <em>se<\/em>) steht immer an erster Stelle: <em>Se me ha olvidado.<\/em> – Ich habe es vergessen. <em>Se le cayó el vaso.<\/em> – Ihm fiel das Glas herunter.<\/p><div class=\"tip\">Eselsbrücke: „<b>se<\/b> zuerst, Person vor Sache“ – <em>se<\/em> → <em>te/os<\/em> → <em>me/nos<\/em> → <em>le/les<\/em> → <em>lo/la/los/las<\/em>.<\/div>"},{"h":"Stellung: vor dem Verb","html":"<p>Vor einem <b>konjugierten Verb<\/b> (auch in zusammengesetzten Zeiten und beim verneinten Imperativ) stehen die Pronomen getrennt davor:<\/p><p><em>Te lo he dicho mil veces.<\/em> – Ich habe es dir tausendmal gesagt.<br><em>No me lo digas.<\/em> – Sag es mir nicht.<br><em>¿Lo habéis visto?<\/em> – Habt ihr ihn/es gesehen?<\/p><div class=\"warn\">Achtung: Bei <em>haber<\/em> + Partizip nie dazwischen: <em>*He lo visto<\/em> ist falsch → <em>Lo he visto<\/em>. Auch die Verneinung steht vor den Pronomen: <em>No lo sé<\/em>, nicht <em>*Lo no sé<\/em>.<\/div>"},{"h":"Stellung: angehängt (mit Akzent)","html":"<p>An <b>Infinitiv<\/b>, <b>Gerundio<\/b> und <b>bejahten Imperativ<\/b> werden die Pronomen angehängt und zusammengeschrieben:<\/p><table><tr><th>Form<\/th><th>Beispiel<\/th><\/tr><tr><td>Infinitiv<\/td><td><em>verlo, dártelo, decírselo<\/em><\/td><\/tr><tr><td>Gerundio<\/td><td><em>diciéndolo, explicándoselo<\/em><\/td><\/tr><tr><td>Imperativ<\/td><td><em>dámelo, cómpralo, díselo<\/em><\/td><\/tr><\/table><p>Die Betonung bleibt auf derselben Silbe. Rutscht sie dadurch auf die drittletzte (oder viertletzte) Silbe, braucht man einen <b>Akzent<\/b>: <em>da<\/em> → <em>dame<\/em> (kein Akzent) → <em>dámelo<\/em>; <em>comprar<\/em> → <em>comprarlo<\/em> → <em>comprárselo<\/em>.<\/p><p><em>Es difícil explicártelo.<\/em> – Es ist schwer, es dir zu erklären.<br><em>Estaba leyéndolo.<\/em> – Ich war dabei, es zu lesen.<br><em>¡Levántate ya!<\/em> – Steh endlich auf!<\/p><div class=\"tip\">Beim bejahten Imperativ mit <em>nosotros<\/em> + <em>nos<\/em> und <em>vosotros<\/em> + <em>os<\/em> fällt ein Buchstabe weg: <em>sentemos + nos<\/em> → <em>sentémonos<\/em>; <em>sentad + os<\/em> → <em>sentaos<\/em>.<\/div>"},{"h":"Stellung bei Verbalperiphrasen","html":"<p>Bei konjugiertem Verb + Infinitiv/Gerundio (<em>ir a, querer, poder, tener que, estar + Gerundio<\/em> usw.) sind <b>beide Stellungen<\/b> möglich – mit gleicher Bedeutung:<\/p><p><em>Lo voy a comprar.<\/em> = <em>Voy a comprarlo.<\/em> – Ich werde es kaufen.<br><em>Te lo quiero contar.<\/em> = <em>Quiero contártelo.<\/em> – Ich will es dir erzählen.<br><em>La estamos esperando.<\/em> = <em>Estamos esperándola.<\/em> – Wir warten auf sie.<\/p><div class=\"warn\">Achtung: Beide Pronomen bleiben zusammen, und man setzt sie nur einmal: <em>*Te quiero contarlo<\/em> und <em>*Lo voy a comprarlo<\/em> sind falsch.<\/div>"},{"h":"Verdopplung des Objekts","html":"<p>Spanisch wiederholt Objekte oft durch ein Pronomen – das ist korrekt und häufig sogar nötig.<\/p><p><b>1. Betonte Form + Pronomen:<\/b> Die betonte Form <em>a mí, a ti, a él …<\/em> steht nie allein, sondern zusätzlich zum unbetonten Pronomen:<br><em>A mí me encanta el mar, a él no.<\/em> – Ich liebe das Meer, er nicht.<br><em>Te lo digo a ti, no a ella.<\/em> – Ich sage es dir, nicht ihr.<\/p><p><b>2. Indirektes Objekt als Substantiv:<\/b> Meist steht <em>le/les<\/em> zusätzlich:<br><em>Le he dado las llaves al portero.<\/em> – Ich habe dem Hausmeister die Schlüssel gegeben.<\/p><p><b>3. Vorangestelltes direktes Objekt:<\/b> Steht es vor dem Verb, muss es wieder aufgenommen werden:<br><em>El libro lo tengo yo.<\/em> – Das Buch habe ich.<br><em>Las fotos las ha hecho mi hermano.<\/em> – Die Fotos hat mein Bruder gemacht.<\/p><div class=\"warn\">Achtung: <em>*A mí gusta<\/em> ist falsch → <em>A mí me gusta<\/em>. Und <em>*El libro tengo yo<\/em> ist falsch → <em>El libro lo tengo yo<\/em>.<\/div><div class=\"tip\">Auch <em>todo<\/em> als Objekt wird meist verdoppelt: <em>Lo he entendido todo.<\/em> – Ich habe alles verstanden.<\/div>"},{"h":"Pronomen nach Präpositionen","html":"<p>Nach Präpositionen stehen die Subjektformen – außer in der 1. und 2. Person Singular sowie beim Reflexiv:<\/p><table><tr><th>Person<\/th><th>Form<\/th><th>Beispiel<\/th><\/tr><tr><td>ich<\/td><td><em>mí<\/em><\/td><td><em>para mí<\/em><\/td><\/tr><tr><td>du<\/td><td><em>ti<\/em> (ohne Akzent)<\/td><td><em>sin ti<\/em><\/td><\/tr><tr><td>sich<\/td><td><em>sí<\/em><\/td><td><em>para sí<\/em><\/td><\/tr><tr><td>übrige<\/td><td>wie Subjekt<\/td><td><em>de él, con ustedes<\/em><\/td><\/tr><\/table><p>Mit <em>con<\/em> gibt es Sonderformen: <em>conmigo<\/em> (mit mir), <em>contigo<\/em> (mit dir), <em>consigo<\/em> (mit sich).<\/p><p><em>¿Vienes conmigo?<\/em> – Kommst du mit mir?<br><em>Siempre lleva el móvil consigo.<\/em> – Er hat das Handy immer bei sich.<br><em>Esta carta es para usted.<\/em> – Dieser Brief ist für Sie.<\/p><p>Nach <em>entre, según, excepto, menos, salvo, incluso, hasta<\/em> (= sogar) stehen <em>yo<\/em> und <em>tú<\/em>:<br><em>entre tú y yo<\/em> – unter uns; <em>según tú<\/em> – deiner Meinung nach; <em>todos menos yo<\/em> – alle außer mir.<\/p><div class=\"warn\">Achtung: <em>mí<\/em> (mir/mich) mit Akzent, <em>mi<\/em> (mein) ohne; <em>ti<\/em> nie mit Akzent. Nicht <em>*con mí<\/em>, sondern <em>conmigo<\/em>.<\/div>"}],"exercises":[{"type":"choice","title":"Subjektpronomen: nötig oder nicht?","task":"Wähle die natürlichste Variante.","items":[{"q":"Hallo, ich heiße Laura und ich komme aus Valencia.","options":["Hola, yo me llamo Laura y yo soy de Valencia.","Hola, me llamo Laura y soy de Valencia."],"a":1,"why":"Ohne Kontrast lässt man das Subjektpronomen weg."},{"q":"Ich koche, und du spülst ab.","options":["Cocino y friegas.","Yo cocino y tú friegas."],"a":1,"why":"Kontrast zwischen zwei Personen → Pronomen setzen."},{"q":"– Wer will Kaffee? – Ich!","options":["– ¡Yo!","– ¡Me!"],"a":0,"why":"Alleinstehend als Subjekt: yo."},{"q":"Es ist schon spät.","options":["Ello es ya tarde.","Ya es tarde."],"a":1,"why":"Für unpersönliches „es“ gibt es kein Subjektpronomen."},{"q":"Herr Gil, sind Sie der neue Nachbar?","options":["Señor Gil, ¿usted es el nuevo vecino?","Señor Gil, ¿eres el nuevo vecino?"],"a":0,"why":"Höflichkeitsform: usted mit 3. Person."},{"q":"(In Mexiko, zu zwei Freunden) Kommt ihr heute Abend?","options":["¿Venís esta noche?","¿Vienen esta noche?"],"a":1,"why":"In Lateinamerika ersetzt ustedes (3. Pl.) vosotros."},{"q":"Sie (ella) arbeitete, er (él) nicht.","options":["Trabajaba, no.","Ella trabajaba, él no."],"a":1,"why":"trabajaba ist mehrdeutig → Pronomen zur Klarheit."}]},{"type":"gap","title":"Direkte Objektpronomen","task":"Setze das passende direkte Objektpronomen ein (lo, la, los, las, me, te, nos, os).","items":[{"q":"(la tarta) ___ he hecho yo.","a":["La"],"de":"Die Torte habe ich gemacht."},{"q":"¿Conoces a mis primos? – Sí, ___ conozco.","a":["los"],"de":"Kennst du meine Cousins? – Ja, ich kenne sie."},{"q":"¿Dónde están las llaves? No ___ encuentro.","a":["las"],"de":"Wo sind die Schlüssel? Ich finde sie nicht."},{"q":"Chicos, ___ espero abajo. (euch)","a":["os"],"de":"Leute, ich warte unten auf euch."},{"q":"¿Me quieres? – Claro que ___ quiero. (dich)","a":["te"],"de":"Liebst du mich? – Natürlich liebe ich dich."},{"q":"Señora Vidal, ___ llamo esta tarde. (Sie)","a":["la"],"de":"Frau Vidal, ich rufe Sie heute Nachmittag an."},{"q":"¿Es caro este reloj? – No ___ sé. (es)","a":["lo"],"de":"Ist diese Uhr teuer? – Ich weiß es nicht."},{"q":"Nuestros vecinos ___ invitan a cenar. (uns)","a":["nos"],"de":"Unsere Nachbarn laden uns zum Abendessen ein."}]},{"type":"choice","title":"Direkt oder indirekt?","task":"Wähle das richtige Pronomen.","items":[{"q":"A mi abuela ___ ayudo con la compra.","options":["la","le"],"a":0,"why":"ayudar hat ein direktes Objekt → la (weiblich)."},{"q":"A mi abuela ___ he comprado flores.","options":["la","le"],"a":1,"why":"comprar algo a alguien: Person = indirekt → le."},{"q":"A los niños ___ duele la barriga.","options":["los","les"],"a":1,"why":"doler: Person als indirektes Objekt → les."},{"q":"Las ventanas ___ he limpiado esta mañana.","options":["las","les"],"a":0,"why":"Sache als direktes Objekt → las."},{"q":"A Teresa ___ voy a preguntar si viene.","options":["la","le"],"a":1,"why":"preguntar a alguien: indirektes Objekt → le."},{"q":"¿El coche? Ya ___ he vendido.","options":["lo","le"],"a":0,"why":"Sache: nur lo, Leísmo gilt nicht für Sachen."},{"q":"A mis padres ___ encanta viajar.","options":["los","les"],"a":1,"why":"encantar: Person indirekt → les."},{"q":"A Lucía ___ vi ayer en el metro.","options":["la","le"],"a":0,"why":"Direktes Objekt, weibliche Person → la (le wäre Leísmo, hier nicht zulässig)."}]},{"type":"gap","title":"Zwei Pronomen: se lo","task":"Ersetze beide Objekte durch Pronomen.","items":[{"q":"Doy el libro a Marta. → ___ doy.","a":["Se lo"],"de":"Ich gebe es ihr."},{"q":"Me explicas el problema. → ___ explicas.","a":["Me lo"],"de":"Du erklärst es mir."},{"q":"Enviamos las fotos a los abuelos. → ___ enviamos.","a":["Se las"],"de":"Wir schicken sie ihnen."},{"q":"Te presto mi bici. → ___ presto.","a":["Te la"],"de":"Ich leihe sie dir."},{"q":"¿Nos traes los platos? → ¿___ traes?","a":["Nos los"],"de":"Bringst du sie uns?"},{"q":"Han dicho la verdad al juez. → ___ han dicho.","a":["Se la"],"de":"Sie haben sie ihm gesagt."},{"q":"Os mando la dirección. → ___ mando.","a":["Os la"],"de":"Ich schicke sie euch."},{"q":"Usted pide la cuenta al camarero. → Usted ___ pide.","a":["se la"],"de":"Sie verlangen sie von ihm."}]},{"type":"gap","title":"Angehängte Pronomen mit Akzent","task":"Schreibe die Form mit angehängten Pronomen (achte auf den Akzent).","items":[{"q":"(da + me + lo) ¡___, por favor!","a":["Dámelo"],"de":"Gib es mir, bitte!"},{"q":"(di + se + lo) ¡___ a tu madre!","a":["Díselo"],"de":"Sag es deiner Mutter!"},{"q":"Está (explicando + nos + lo) ___ otra vez.","a":["explicándonoslo"],"de":"Er erklärt es uns noch einmal."},{"q":"Quiero (comprar + te + lo) ___ para tu cumpleaños.","a":["comprártelo"],"de":"Ich will es dir zum Geburtstag kaufen."},{"q":"Tienes que (ver + lo) ___ con tus propios ojos.","a":["verlo"],"de":"Du musst es mit eigenen Augen sehen."},{"q":"(levanta + te) ¡___, que son las ocho!","a":["Levántate"],"de":"Steh auf, es ist acht Uhr!"},{"q":"(sentad + os) Niños, ___ aquí.","a":["sentaos"],"de":"Kinder, setzt euch hierher."},{"q":"Salió de la reunión (diciendo + lo) ___ en voz alta.","a":["diciéndolo"],"de":"Er verließ die Sitzung und sagte es laut."},{"q":"(pon + te + lo) ¡___, que hace frío!","a":["Póntelo"],"de":"Zieh es an, es ist kalt!"}]},{"type":"choice","title":"Stellung der Pronomen","task":"Welcher Satz ist korrekt?","items":[{"q":"Ich habe es ihm schon gesagt.","options":["Ya he se lo dicho.","Ya se lo he dicho.","Ya se he lo dicho."],"a":1,"why":"Vor der konjugierten Form von haber, nie dazwischen."},{"q":"Gib es mir nicht!","options":["¡No dámelo!","¡No me lo des!","¡No lo me des!"],"a":1,"why":"Verneinter Imperativ: Pronomen davor, indirekt vor direkt."},{"q":"Ich werde es dir erklären.","options":["Te voy a explicarlo.","Voy a explicártelo.","Voy a te lo explicar."],"a":1,"why":"Beide Pronomen zusammen, hier angehängt."},{"q":"Wir sehen sie gerade (la película).","options":["La estamos viendo.","Estamos la viendo.","La estamos viéndola."],"a":0,"why":"Bei Periphrasen vor dem konjugierten Verb (oder angehängt), aber nur einmal."},{"q":"Ich weiß es nicht.","options":["Lo no sé.","No lo sé.","No sé lo."],"a":1,"why":"no steht vor dem Pronomen."},{"q":"Mir ist der Schlüssel heruntergefallen.","options":["Me se ha caído la llave.","Se me ha caído la llave.","Se ha me caído la llave."],"a":1,"why":"se steht immer an erster Stelle."},{"q":"Setzen wir uns!","options":["¡Sentémosnos!","¡Sentémonos!","¡Nos sentemos!"],"a":1,"why":"Bei nosotros + nos fällt das -s weg: sentémonos."},{"q":"Kannst du es ihnen bringen?","options":["¿Puedes llevárselo?","¿Puedes llevarles lo?","¿Les lo puedes llevar?"],"a":0,"why":"les + lo → se lo; angehängt an den Infinitiv mit Akzent."}]},{"type":"choice","title":"Verdopplung und Präpositionalformen","task":"Wähle die richtige Lösung.","items":[{"q":"___ me gustan las películas de miedo.","options":["A mí","A me","Mí"],"a":0,"why":"Betonte Form nach a: a mí, zusätzlich me."},{"q":"El coche ___ ha lavado Jorge.","options":["–","lo","le"],"a":1,"why":"Vorangestelltes direktes Objekt wird durch lo aufgenommen."},{"q":"¿Quieres venir al cine ___?","options":["con mí","conmigo","con yo"],"a":1,"why":"con + mí → conmigo."},{"q":"Este regalo es para ___.","options":["ti","tí","tú"],"a":0,"why":"Nach Präposition ti, ohne Akzent."},{"q":"Que quede entre tú y ___.","options":["mí","yo","me"],"a":1,"why":"Nach entre stehen tú und yo."},{"q":"Según ___, ¿quién tiene razón?","options":["ti","tú","te"],"a":1,"why":"Nach según steht tú."},{"q":"Marcos siempre habla de ___ mismo.","options":["sí","si","se"],"a":0,"why":"Reflexiv nach Präposition: de sí mismo (mit Akzent)."},{"q":"Todos lo sabían menos ___.","options":["mí","yo","me"],"a":1,"why":"Nach menos/excepto: yo."},{"q":"___ dije a tu hermano que llegaríamos tarde.","options":["Lo","Le","Les"],"a":1,"why":"Indirektes Objekt (a tu hermano) wird mit le verdoppelt."},{"q":"La abuela siempre lleva las gafas ___.","options":["con sí","consigo","con ella mismo"],"a":1,"why":"Reflexiv mit con: consigo."}]}],"cards":[{"f":"Subjektpronomen: wann setzen?","b":"nur bei Betonung, Kontrast oder Mehrdeutigkeit"},{"f":"usted / ustedes – Verbform?","b":"3. Person Sg. / Pl. (usted habla, ustedes hablan)"},{"f":"ihr (Lateinamerika)","b":"ustedes (kein vosotros)"},{"f":"direkte Objektpronomen","b":"me, te, lo/la, nos, os, los/las"},{"f":"indirekte Objektpronomen","b":"me, te, le, nos, os, les"},{"f":"Ich warte auf dich.","b":"Te espero."},{"f":"Ich helfe ihr. / Ich frage sie.","b":"La ayudo. / Le pregunto."},{"f":"Leísmo","b":"le statt lo für männliche Person (Sg.), in Spanien zulässig: Le vi ayer."},{"f":"le/les + lo/la/los/las","b":"→ se lo / se la / se los / se las"},{"f":"Ich gebe es ihr.","b":"Se lo doy (a ella)."},{"f":"Reihenfolge zweier Pronomen","b":"se zuerst, dann indirekt vor direkt (Person vor Sache)"},{"f":"Ich habe es vergessen (se).","b":"Se me ha olvidado."},{"f":"Stellung beim konjugierten Verb","b":"davor: Te lo he dicho. No me lo digas."},{"f":"angehängt an …","b":"Infinitiv, Gerundio, bejahten Imperativ"},{"f":"Gib es mir!","b":"¡Dámelo!"},{"f":"Sag es ihm!","b":"¡Díselo!"},{"f":"es ihm/ihr sagen (Infinitiv)","b":"decírselo"},{"f":"Setzt euch! / Setzen wir uns!","b":"¡Sentaos! / ¡Sentémonos!"},{"f":"Ich werde es kaufen (2 Varianten)","b":"Lo voy a comprar. = Voy a comprarlo."},{"f":"Verdopplung: a mí …","b":"A mí me gusta (nie *A mí gusta)."},{"f":"Das Buch habe ich.","b":"El libro lo tengo yo."},{"f":"Ich habe alles verstanden.","b":"Lo he entendido todo."},{"f":"für mich / ohne dich / für sich","b":"para mí / sin ti / para sí"},{"f":"mit mir / mit dir / mit sich","b":"conmigo / contigo / consigo"},{"f":"unter uns (gesagt)","b":"entre tú y yo"},{"f":"deiner Meinung nach","b":"según tú"},{"f":"alle außer mir","b":"todos menos yo / excepto yo"},{"f":"mí ↔ mi, ti","b":"mí = mir/mich (Akzent), mi = mein; ti nie mit Akzent"}],"id":"k07"},{"nr":9.5,"title":"Das Verb im Überblick","teil":"Das Verb und seine Ergänzungen","intro":"Bevor es an die einzelnen Zeiten geht, verschaffst du dir hier einen Überblick: Konjugationsgruppen, Personen und Anredeformen sowie das gesamte System der spanischen Zeiten und Modi.","sections":[{"h":"Drei Konjugationen: -ar, -er, -ir","html":"<p>Jedes spanische Verb endet im Infinitiv auf <em>-ar<\/em>, <em>-er<\/em> oder <em>-ir<\/em>. Nimmt man diese Endung weg, bleibt der <b>Stamm<\/b>. An den Stamm treten die Personal- und Zeitendungen.<\/p><table><tr><th>Gruppe<\/th><th>Infinitiv<\/th><th>Stamm<\/th><\/tr><tr><td>1. Konjugation<\/td><td><em>bailar<\/em> tanzen<\/td><td><em>bail-<\/em><\/td><\/tr><tr><td>2. Konjugation<\/td><td><em>beber<\/em> trinken<\/td><td><em>beb-<\/em><\/td><\/tr><tr><td>3. Konjugation<\/td><td><em>escribir<\/em> schreiben<\/td><td><em>escrib-<\/em><\/td><\/tr><\/table><p>Die <em>-ar<\/em>-Gruppe ist mit Abstand die größte; fast alle neuen Verben kommen dazu (<em>chatear<\/em>, <em>wasapear<\/em>, <em>googlear<\/em>). <em>-er<\/em>- und <em>-ir<\/em>-Verben unterscheiden sich in vielen Zeiten kaum.<\/p><div class=\"tip\">Merke: Wer die Endungen von <em>-ar<\/em> und <em>-er<\/em> kennt, kann <em>-ir<\/em> fast immer ableiten – im Präsens weichen nur <em>nosotros<\/em> und <em>vosotros<\/em> ab (<em>bebemos<\/em> – <em>escribimos<\/em>).<\/div>"},{"h":"Personen und Anrede","html":"<p>Im Spanischen verrät die Verbendung, wer handelt. Deshalb lässt man das Subjektpronomen normalerweise weg – anders als im Deutschen.<\/p><table><tr><th>Person<\/th><th>bailar<\/th><th>Deutsch<\/th><\/tr><tr><td>yo<\/td><td><em>bailo<\/em><\/td><td>ich tanze<\/td><\/tr><tr><td>tú<\/td><td><em>bailas<\/em><\/td><td>du tanzt<\/td><\/tr><tr><td>él / ella / usted<\/td><td><em>baila<\/em><\/td><td>er/sie tanzt, Sie tanzen<\/td><\/tr><tr><td>nosotros/-as<\/td><td><em>bailamos<\/em><\/td><td>wir tanzen<\/td><\/tr><tr><td>vosotros/-as<\/td><td><em>bailáis<\/em><\/td><td>ihr tanzt<\/td><\/tr><tr><td>ellos / ellas / ustedes<\/td><td><em>bailan<\/em><\/td><td>sie/Sie tanzen<\/td><\/tr><\/table><p>Das Pronomen setzt man nur zur <b>Betonung<\/b> oder zur <b>Unterscheidung<\/b>: <em>Yo trabajo y tú descansas.<\/em> <small>Ich arbeite, und du ruhst dich aus.<\/small><\/p><div class=\"warn\">Achtung: <em>Yo<\/em> vor jedem Verb klingt im Spanischen unnatürlich und überbetont. Sag einfach <em>Vivo en Colonia.<\/em> <small>Ich wohne in Köln.<\/small><\/div><div class=\"tip\">Wie im Italienischen: <em>bailo<\/em> = <em>ballo<\/em> (ital.) – das Pronomen fällt weg.<\/div><p>Spanisch hat vier Formen der Anrede:<\/p><table><tr><th>Form<\/th><th>Wen?<\/th><th>Verbform<\/th><\/tr><tr><td><em>tú<\/em><\/td><td>eine Person, vertraut<\/td><td>2. Sg.: <em>¿Bailas?<\/em><\/td><\/tr><tr><td><em>usted<\/em><\/td><td>eine Person, höflich<\/td><td>3. Sg.: <em>¿Baila usted?<\/em><\/td><\/tr><tr><td><em>vosotros<\/em><\/td><td>mehrere, vertraut<\/td><td>2. Pl.: <em>¿Bailáis?<\/em><\/td><\/tr><tr><td><em>ustedes<\/em><\/td><td>mehrere, höflich<\/td><td>3. Pl.: <em>¿Bailan ustedes?<\/em><\/td><\/tr><\/table><p><em>Usted<\/em> (Abkürzung <em>Ud.<\/em>) und <em>ustedes<\/em> (<em>Uds.<\/em>) stehen grammatisch in der <b>3. Person<\/b> – wie das deutsche „Sie“, das ja auch wie „sie“ (Plural) konjugiert wird. Weil <em>baila<\/em> auch „er/sie tanzt“ heißen kann, wird <em>usted<\/em> öfter ausgesprochen als die anderen Pronomen.<\/p><p>In Spanien duzt man sehr schnell, auch Fremde im Alltag. <em>Usted<\/em> verwendet man vor allem gegenüber älteren Menschen und in formellen Situationen.<\/p><div class=\"warn\">Lateinamerika: <em>vosotros<\/em> wird nicht verwendet. <em>Ustedes<\/em> ist dort die einzige Pluralanrede – vertraut und höflich: <em>Chicos, ¿ustedes vienen?<\/em> In Argentinien, Uruguay und Teilen Mittelamerikas ersetzt außerdem <em>vos<\/em> das <em>tú<\/em> (<em>vos bailás<\/em>).<\/div>"},{"h":"Alle Zeiten und Modi im Überblick","html":"<p>Spanisch hat drei <b>Modi<\/b>: Indikativ (Wirklichkeit), <em>subjuntivo<\/em> (Wunsch, Zweifel, Gefühl, Abhängigkeit) und Imperativ (Aufforderung). Hier alle Formen am Beispiel <em>bailar<\/em> (1. Person Sg.; Imperativ: tú-Form):<\/p><table><tr><th>Indikativ<\/th><th>Form<\/th><th>Deutsch<\/th><\/tr><tr><td>presente<\/td><td><em>bailo<\/em><\/td><td>ich tanze<\/td><\/tr><tr><td>pretérito perfecto<\/td><td><em>he bailado<\/em><\/td><td>ich habe getanzt<\/td><\/tr><tr><td>pretérito indefinido<\/td><td><em>bailé<\/em><\/td><td>ich tanzte<\/td><\/tr><tr><td>pretérito imperfecto<\/td><td><em>bailaba<\/em><\/td><td>ich tanzte (gewöhnlich)<\/td><\/tr><tr><td>pluscuamperfecto<\/td><td><em>había bailado<\/em><\/td><td>ich hatte getanzt<\/td><\/tr><tr><td>pretérito anterior<\/td><td><em>hube bailado<\/em><\/td><td>ich hatte getanzt (lit.)<\/td><\/tr><tr><td>futuro simple<\/td><td><em>bailaré<\/em><\/td><td>ich werde tanzen<\/td><\/tr><tr><td>futuro compuesto<\/td><td><em>habré bailado<\/em><\/td><td>ich werde getanzt haben<\/td><\/tr><tr><td>condicional simple<\/td><td><em>bailaría<\/em><\/td><td>ich würde tanzen<\/td><\/tr><tr><td>condicional compuesto<\/td><td><em>habría bailado<\/em><\/td><td>ich hätte getanzt<\/td><\/tr><\/table><table><tr><th>Subjuntivo u. a.<\/th><th>Form<\/th><th>Beispiel<\/th><\/tr><tr><td>presente de subj.<\/td><td><em>baile<\/em><\/td><td><em>Quiere que baile.<\/em><\/td><\/tr><tr><td>perfecto de subj.<\/td><td><em>haya bailado<\/em><\/td><td><em>Me alegra que hayas bailado.<\/em><\/td><\/tr><tr><td>imperfecto de subj.<\/td><td><em>bailara / bailase<\/em><\/td><td><em>Si bailara mejor…<\/em><\/td><\/tr><tr><td>pluscuamp. de subj.<\/td><td><em>hubiera bailado<\/em><\/td><td><em>Si hubiera bailado…<\/em><\/td><\/tr><tr><td>imperativo<\/td><td><em>¡baila!<\/em><\/td><td>tanz!<\/td><\/tr><tr><td>infinitivo<\/td><td><em>bailar<\/em><\/td><td>tanzen<\/td><\/tr><tr><td>gerundio<\/td><td><em>bailando<\/em><\/td><td>tanzend<\/td><\/tr><tr><td>participio<\/td><td><em>bailado<\/em><\/td><td>getanzt<\/td><\/tr><\/table><div class=\"tip\">Die Bezeichnungen folgen der traditionellen Grammatik. Die RAE nennt das <em>indefinido<\/em> heute <em>pretérito perfecto simple<\/em> und das <em>perfecto<\/em> <em>pretérito perfecto compuesto<\/em> – gemeint ist dasselbe.<\/div>"},{"h":"Einfache und zusammengesetzte Zeiten","html":"<p><b>Einfache Zeiten<\/b> bestehen aus einem Wort (<em>bailo, bailé, bailaré<\/em>). <b>Zusammengesetzte Zeiten<\/b> werden aus einer Form von <em>haber<\/em> + Partizip gebildet (<em>he bailado, había bailado<\/em>). Das Partizip endet regelmäßig auf <em>-ado<\/em> (-ar) bzw. <em>-ido<\/em> (-er/-ir): <em>bailado, bebido, escrito<\/em> (unregelmäßig).<\/p><ul><li>Hilfsverb ist <b>immer<\/b> <em>haber<\/em> – auch bei Bewegungsverben: <em>Hemos ido al cine.<\/em> <small>Wir sind ins Kino gegangen.<\/small><\/li><li>Das Partizip ist nach <em>haber<\/em> <b>unveränderlich<\/b>: <em>Ella ha llegado. Las chicas han llegado.<\/em><\/li><li><em>haber<\/em> und Partizip bilden eine Einheit; nichts tritt dazwischen: <em>Ya he terminado.<\/em> / <em>No lo he visto.<\/em><\/li><\/ul><div class=\"warn\">Achtung: Kein „sein“ als Hilfsverb! <em>*Soy venido<\/em> ist falsch, richtig ist <em>He venido.<\/em> <small>Ich bin gekommen.<\/small> Auch nicht wie im Italienischen angleichen: <em>siamo arrivate<\/em> → <em>hemos llegado<\/em>.<\/div><div class=\"tip\">Verändert wird das Partizip nur, wenn es als Adjektiv oder im Passiv steht: <em>La carta está escrita.<\/em> <small>Der Brief ist geschrieben.<\/small> – aber <em>Ana ha escrito la carta.<\/em><\/div>"},{"h":"Die Vergangenheitszeiten auf einen Blick","html":"<p>Wo das Deutsche im Alltag fast nur „Perfekt“ verwendet, unterscheidet das Spanische genau:<\/p><table><tr><th>Zeit<\/th><th>Funktion<\/th><th>Beispiel<\/th><\/tr><tr><td>perfecto<\/td><td>Vergangenes mit Bezug zur Gegenwart (heute, schon, je)<\/td><td><em>Hoy he comido paella.<\/em><\/td><\/tr><tr><td>indefinido<\/td><td>abgeschlossenes Ereignis in abgeschlossener Zeit<\/td><td><em>Ayer comí paella.<\/em><\/td><\/tr><tr><td>imperfecto<\/td><td>Beschreibung, Gewohnheit, Hintergrund<\/td><td><em>De niño comía paella los domingos.<\/em><\/td><\/tr><tr><td>pluscuamperfecto<\/td><td>Vorvergangenheit<\/td><td><em>Ya había comido cuando llamaste.<\/em><\/td><\/tr><tr><td>pretérito anterior<\/td><td>Vorvergangenheit, nur literarisch<\/td><td><em>Apenas hubo comido, salió.<\/em><\/td><\/tr><\/table><div class=\"tip\">Faustregel: <em>indefinido<\/em> = Was geschah? <em>imperfecto<\/em> = Wie war es? <em>perfecto<\/em> = Was ist bis jetzt passiert? Details in den Kapiteln 14 und 15.<\/div>"}],"exercises":[{"type":"choice","title":"Wer handelt?","task":"Die Endung verrät die Person. Wähle das passende Pronomen.","items":[{"q":"___ cantamos en un coro.","options":["Nosotros","Vosotros","Ellos"],"a":0,"why":"-amos ist die Endung der 1. Person Plural."},{"q":"¿___ escribís muchos correos?","options":["Ustedes","Vosotros","Nosotros"],"a":1,"why":"-ís (escribís) ist die vosotros-Form."},{"q":"___ trabajas demasiado.","options":["Tú","Usted","Yo"],"a":0,"why":"-as ist die 2. Person Singular; usted hätte trabaja."},{"q":"¿Habla ___ alemán, señora Gómez?","options":["tú","usted","vosotros"],"a":1,"why":"habla (3. Person) + höfliche Anrede einer Person = usted."},{"q":"___ miro las noticias cada mañana.","options":["Él","Yo","Tú"],"a":1,"why":"-o ist die Endung der 1. Person Singular."},{"q":"Señores, ¿___ desean algo más?","options":["vosotros","ustedes","ellos"],"a":1,"why":"Höfliche Anrede an mehrere Personen mit Verb in der 3. Person Plural = ustedes."},{"q":"___ abre la tienda a las nueve.","options":["Tú","Ella","Nosotras"],"a":1,"why":"abre (-e) ist die 3. Person Singular."},{"q":"¿___ coméis aquí todos los días?","options":["Vosotros","Ustedes","Ellos"],"a":0,"why":"-éis ist die vosotros-Form; ustedes und ellos hätten comen."}]},{"type":"choice","title":"tú, usted, vosotros oder ustedes?","task":"Wähle die passende Anrede (Spanien).","items":[{"q":"Du fragst deinen besten Freund: ¿Vienes a la playa?","options":["tú","usted"],"a":0,"why":"Vertraute Person, eine Person → tú."},{"q":"Du sprichst deine zwei Mitbewohnerinnen an: ¿Queréis pizza?","options":["ustedes","vosotras"],"a":1,"why":"Mehrere vertraute Personen in Spanien → vosotras (queréis)."},{"q":"Ein Hotelangestellter begrüßt ein älteres Ehepaar: ¿Necesitan ___ ayuda?","options":["vosotros","ustedes"],"a":1,"why":"Höflich, mehrere Personen, Verb in der 3. Person Plural → ustedes."},{"q":"Du schreibst an den Direktor einer Firma: ¿Podría ___ enviarme el contrato?","options":["usted","tú"],"a":0,"why":"Formell, eine Person, Verb podría in der 3. Person → usted."},{"q":"In Mexiko fragst du deine Freunde: ¿___ tienen hambre?","options":["Vosotros","Ustedes"],"a":1,"why":"In Lateinamerika ist ustedes auch die vertraute Pluralanrede."},{"q":"Welche Form passt zu usted? Usted ___ (comer) muy sano.","options":["comes","come","coméis"],"a":1,"why":"usted wird in der 3. Person Singular konjugiert."},{"q":"Welche Form passt zu ustedes? Ustedes ___ (vivir) cerca.","options":["vivís","viven","vivimos"],"a":1,"why":"ustedes verlangt die 3. Person Plural."}]},{"type":"gap","title":"Zusammengesetzte Zeiten bilden","task":"Setze haber + Partizip im pretérito perfecto ein (he, has, ha, hemos, habéis, han).","items":[{"q":"Yo (trabajar) ___ mucho esta semana.","a":["he trabajado"],"de":"Ich habe diese Woche viel gearbeitet."},{"q":"Mi hermana (llegar) ___ tarde.","a":["ha llegado"],"de":"Meine Schwester ist spät angekommen."},{"q":"Las niñas (salir) ___ al jardín.","a":["han salido"],"de":"Die Mädchen sind in den Garten hinausgegangen."},{"q":"Nosotros (ir) ___ al museo esta mañana.","a":["hemos ido"],"de":"Wir sind heute Morgen ins Museum gegangen."},{"q":"¿Tú (comer) ___ ya?","a":["has comido"],"de":"Hast du schon gegessen?"},{"q":"Vosotras (aprender) ___ muy rápido.","a":["habéis aprendido"],"de":"Ihr habt sehr schnell gelernt."},{"q":"Mis padres no (vender) ___ la casa.","a":["han vendido"],"de":"Meine Eltern haben das Haus nicht verkauft."},{"q":"Usted (elegir) ___ un buen vino.","a":["ha elegido"],"de":"Sie haben einen guten Wein gewählt."}]}],"cards":[{"f":"Drei Konjugationen","b":"-ar (bailar), -er (beber), -ir (escribir); Stamm = Infinitiv ohne Endung"},{"f":"Subjektpronomen – wann verwenden?","b":"Nur zur Betonung oder Unterscheidung; sonst weglassen: Vivo en Colonia."},{"f":"usted / ustedes – welche Verbform?","b":"3. Person Sg. / Pl.: ¿Baila usted? ¿Bailan ustedes?"},{"f":"Abkürzungen von usted / ustedes","b":"Ud. / Uds. (auch Vd. / Vds.)"},{"f":"vosotros in Lateinamerika?","b":"Wird nicht verwendet – dort immer ustedes (vertraut und höflich)."},{"f":"vos","b":"Ersetzt tú u. a. in Argentinien und Uruguay: vos bailás"},{"f":"Die drei Modi","b":"Indikativ, subjuntivo, Imperativ"},{"f":"Infinite Formen von bailar","b":"infinitivo bailar – gerundio bailando – participio bailado"},{"f":"Bildung der zusammengesetzten Zeiten","b":"haber + Partizip (he bailado, había bailado, habré bailado …)"},{"f":"Hilfsverb bei ir, venir, llegar?","b":"Immer haber: He venido. Hemos ido. (nie *soy venido)"},{"f":"Partizip nach haber – angleichen?","b":"Nein, unveränderlich: Las chicas han llegado."},{"f":"Regelmäßiges Partizip","b":"-ar → -ado (bailado), -er/-ir → -ido (bebido, vivido)"},{"f":"indefinido – Grundfunktion","b":"Abgeschlossenes Ereignis: Ayer comí paella."},{"f":"imperfecto – Grundfunktion","b":"Beschreibung, Gewohnheit, Hintergrund: De niño comía paella."},{"f":"perfecto – Grundfunktion","b":"Vergangenes mit Gegenwartsbezug: Hoy he comido paella."}],"id":"k11"},{"nr":10,"title":"Das Präsens","teil":"Das Verb und seine Ergänzungen","intro":"Das Präsens ist die Basis für fast alle anderen Zeiten: Wer seine Stammwechsel und unregelmäßigen Formen sicher beherrscht, hat später beim subjuntivo und Imperativ ein leichtes Spiel. Außerdem erfährst du, wofür das Präsens im Spanischen alles verwendet wird.","sections":[{"h":"Regelmäßige Verben","html":"<p>Das Präsens bildet man aus Stamm + Endung. Die Endungen der drei Gruppen:<\/p><table><tr><th><\/th><th>trabajar<\/th><th>aprender<\/th><th>abrir<\/th><\/tr><tr><td>yo<\/td><td><em>trabajo<\/em><\/td><td><em>aprendo<\/em><\/td><td><em>abro<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>trabajas<\/em><\/td><td><em>aprendes<\/em><\/td><td><em>abres<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>trabaja<\/em><\/td><td><em>aprende<\/em><\/td><td><em>abre<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>trabajamos<\/em><\/td><td><em>aprendemos<\/em><\/td><td><em>abrimos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>trabajáis<\/em><\/td><td><em>aprendéis<\/em><\/td><td><em>abrís<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>trabajan<\/em><\/td><td><em>aprenden<\/em><\/td><td><em>abren<\/em><\/td><\/tr><\/table><p>Betont wird in allen Formen außer <em>nosotros<\/em> und <em>vosotros<\/em> der Stamm (<em>tra<b>ba<\/b>jo<\/em>), in diesen beiden die Endung (<em>traba<b>ja<\/b>mos<\/em>). Die <em>vosotros<\/em>-Formen tragen deshalb einen Akzent: <em>trabajáis, aprendéis, abrís<\/em>.<\/p><div class=\"tip\">Merke: <em>-er<\/em> und <em>-ir<\/em> unterscheiden sich im Präsens nur bei <em>nosotros<\/em> (<em>-emos / -imos<\/em>) und <em>vosotros<\/em> (<em>-éis / -ís<\/em>).<\/div><div class=\"warn\">Achtung: <em>abrís<\/em> hat einen Akzent, <em>abris<\/em> gibt es nicht. Und die 1. Person Sg. endet bei allen Gruppen auf <em>-o<\/em>.<\/div>"},{"h":"Stammwechsel e → ie","html":"<p>Bei vielen Verben wird das betonte <em>e<\/em> des Stamms zu <em>ie<\/em>. Da <em>nosotros<\/em> und <em>vosotros<\/em> auf der Endung betont sind, bleiben sie regelmäßig. Das gilt für alle drei Gruppen.<\/p><table><tr><th><\/th><th>pensar<\/th><th>querer<\/th><th>preferir<\/th><\/tr><tr><td>yo<\/td><td><em>pienso<\/em><\/td><td><em>quiero<\/em><\/td><td><em>prefiero<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>piensas<\/em><\/td><td><em>quieres<\/em><\/td><td><em>prefieres<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>piensa<\/em><\/td><td><em>quiere<\/em><\/td><td><em>prefiere<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>pensamos<\/em><\/td><td><em>queremos<\/em><\/td><td><em>preferimos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>pensáis<\/em><\/td><td><em>queréis<\/em><\/td><td><em>preferís<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>piensan<\/em><\/td><td><em>quieren<\/em><\/td><td><em>prefieren<\/em><\/td><\/tr><\/table><p>Weitere häufige Verben: <em>empezar<\/em> (<em>empiezo<\/em>), <em>comenzar<\/em>, <em>cerrar<\/em>, <em>despertar(se)<\/em>, <em>sentarse<\/em>, <em>entender<\/em>, <em>perder<\/em>, <em>encender<\/em>, <em>sentir<\/em>, <em>mentir<\/em>, <em>divertirse<\/em>, <em>nevar<\/em> (<em>nieva<\/em>).<\/p><p><em>Empiezo a las ocho, pero mis compañeros empiezan a las nueve.<\/em> <small>Ich fange um acht an, aber meine Kollegen fangen um neun an.<\/small><\/p><div class=\"tip\">Eselsbrücke „Stiefelverben“: Schreibt man die sechs Formen in zwei Spalten (Singular links, Plural rechts), bilden die veränderten Formen die Umrisse eines Stiefels – nur <em>nosotros<\/em> und <em>vosotros<\/em> liegen außerhalb.<\/div><div class=\"warn\">Achtung: Ob ein Verb den Stamm wechselt, sieht man dem Infinitiv nicht an (<em>pensar → pienso<\/em>, aber <em>pesar → peso<\/em>). Lerne die Verben mit ihrer yo-Form.<\/div>"},{"h":"Stammwechsel o → ue","html":"<p>Nach demselben Muster wird betontes <em>o<\/em> zu <em>ue<\/em>:<\/p><table><tr><th><\/th><th>poder<\/th><th>volver<\/th><th>dormir<\/th><\/tr><tr><td>yo<\/td><td><em>puedo<\/em><\/td><td><em>vuelvo<\/em><\/td><td><em>duermo<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>puedes<\/em><\/td><td><em>vuelves<\/em><\/td><td><em>duermes<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>puede<\/em><\/td><td><em>vuelve<\/em><\/td><td><em>duerme<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>podemos<\/em><\/td><td><em>volvemos<\/em><\/td><td><em>dormimos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>podéis<\/em><\/td><td><em>volvéis<\/em><\/td><td><em>dormís<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>pueden<\/em><\/td><td><em>vuelven<\/em><\/td><td><em>duermen<\/em><\/td><\/tr><\/table><p>Weitere: <em>contar<\/em> (<em>cuento<\/em>), <em>encontrar<\/em>, <em>recordar<\/em>, <em>costar<\/em> (<em>cuesta<\/em>), <em>probar<\/em>, <em>soñar<\/em>, <em>acostarse<\/em>, <em>mover<\/em>, <em>doler<\/em> (<em>me duele<\/em>), <em>soler<\/em>, <em>llover<\/em> (<em>llueve<\/em>), <em>morir<\/em>.<\/p><p><em>¿Cuánto cuestan estas zapatillas?<\/em> <small>Wie viel kosten diese Turnschuhe?<\/small><br><em>Normalmente vuelvo a casa en bici.<\/em> <small>Normalerweise fahre ich mit dem Rad nach Hause.<\/small><\/p><div class=\"tip\"><em>soler<\/em> + Infinitiv = „normalerweise tun“: <em>Suelo desayunar en el bar.<\/em> <small>Ich frühstücke normalerweise in der Bar.<\/small><\/div>"},{"h":"jugar (u → ue) und e → i","html":"<p><b>jugar<\/b> ist das einzige Verb mit <em>u → ue<\/em>: <em>juego, juegas, juega, jugamos, jugáis, juegan<\/em>.<\/p><p><em>Los sábados juego al pádel con mi cuñado.<\/em> <small>Samstags spiele ich Padel mit meinem Schwager.<\/small><\/p><p>Bei einigen <b>-ir-Verben<\/b> wird betontes <em>e<\/em> zu <em>i<\/em>:<\/p><table><tr><th><\/th><th>pedir<\/th><th>servir<\/th><th>repetir<\/th><\/tr><tr><td>yo<\/td><td><em>pido<\/em><\/td><td><em>sirvo<\/em><\/td><td><em>repito<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>pides<\/em><\/td><td><em>sirves<\/em><\/td><td><em>repites<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>pide<\/em><\/td><td><em>sirve<\/em><\/td><td><em>repite<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>pedimos<\/em><\/td><td><em>servimos<\/em><\/td><td><em>repetimos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>pedís<\/em><\/td><td><em>servís<\/em><\/td><td><em>repetís<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>piden<\/em><\/td><td><em>sirven<\/em><\/td><td><em>repiten<\/em><\/td><\/tr><\/table><p>Ebenso: <em>vestirse<\/em> (<em>me visto<\/em>), <em>medir<\/em> (<em>mido<\/em>), <em>impedir<\/em>, <em>despedirse<\/em>, <em>seguir<\/em> (<em>sigo<\/em>), <em>elegir<\/em> (<em>elijo<\/em>), <em>corregir<\/em> (<em>corrijo<\/em>), <em>reír<\/em> (<em>río, ríes<\/em>).<\/p><div class=\"tip\">Der Wechsel <em>e → i<\/em> kommt nur bei <em>-ir<\/em>-Verben vor. Ein <em>-ar<\/em>- oder <em>-er<\/em>-Verb mit Stammwechsel hat immer <em>ie<\/em> oder <em>ue<\/em>.<\/div><div class=\"warn\">Achtung: <em>jugar a<\/em> + Spiel/Sport: <em>juego al fútbol, juegan a las cartas<\/em>. Ein Instrument „spielt“ man dagegen mit <em>tocar<\/em>: <em>toco la guitarra<\/em>.<\/div>"},{"h":"Unregelmäßige 1. Person: die -go-Verben","html":"<p>Eine wichtige Gruppe ist nur in der <b>yo-Form<\/b> unregelmäßig – sie endet auf <em>-go<\/em>:<\/p><table><tr><th>Infinitiv<\/th><th>yo<\/th><th>tú (regelmäßig)<\/th><\/tr><tr><td><em>hacer<\/em> machen<\/td><td><em>hago<\/em><\/td><td><em>haces<\/em><\/td><\/tr><tr><td><em>poner<\/em> stellen<\/td><td><em>pongo<\/em><\/td><td><em>pones<\/em><\/td><\/tr><tr><td><em>salir<\/em> ausgehen<\/td><td><em>salgo<\/em><\/td><td><em>sales<\/em><\/td><\/tr><tr><td><em>traer<\/em> bringen<\/td><td><em>traigo<\/em><\/td><td><em>traes<\/em><\/td><\/tr><tr><td><em>caer<\/em> fallen<\/td><td><em>caigo<\/em><\/td><td><em>caes<\/em><\/td><\/tr><tr><td><em>valer<\/em> kosten, wert sein<\/td><td><em>valgo<\/em><\/td><td><em>vales<\/em><\/td><\/tr><\/table><p>Bei <em>tener<\/em>, <em>venir<\/em>, <em>decir<\/em> und <em>oír<\/em> kommt zur <em>-go<\/em>-Form noch ein Stammwechsel hinzu (siehe unten): <em>tengo / tienes, vengo / vienes, digo / dices, oigo / oyes<\/em>.<\/p><p><em>Si no salgo pronto, no llego al tren.<\/em> <small>Wenn ich nicht bald losgehe, erreiche ich den Zug nicht.<\/small><br><em>¿Pongo la mesa?<\/em> <small>Soll ich den Tisch decken?<\/small><\/p><div class=\"tip\">Abgeleitete Verben verhalten sich genauso: <em>deshacer → deshago<\/em>, <em>suponer → supongo<\/em>, <em>proponer → propongo<\/em>, <em>distraer → distraigo<\/em>, <em>mantener → mantengo<\/em>.<\/div>"},{"h":"Weitere unregelmäßige 1. Personen und -uir","html":"<p><b>-zco<\/b>: Verben auf Vokal + <em>-cer<\/em> / <em>-cir<\/em> schieben in der yo-Form ein <em>z<\/em> ein (Ausnahmen: <em>hacer → hago<\/em>, <em>decir → digo<\/em>, <em>cocer → cuezo<\/em>):<\/p><ul><li><em>conocer → conozco<\/em> (<em>conoces<\/em>) – kennen<\/li><li><em>conducir → conduzco<\/em> (<em>conduces<\/em>) – fahren<\/li><li>ebenso <em>parecer → parezco<\/em>, <em>ofrecer → ofrezco<\/em>, <em>agradecer → agradezco<\/em>, <em>traducir → traduzco<\/em>, <em>producir → produzco<\/em><\/li><\/ul><p><b>Einzelfälle<\/b> (nur yo unregelmäßig):<\/p><table><tr><th>Infinitiv<\/th><th>yo<\/th><th>tú<\/th><\/tr><tr><td><em>saber<\/em><\/td><td><em>sé<\/em><\/td><td><em>sabes<\/em><\/td><\/tr><tr><td><em>dar<\/em><\/td><td><em>doy<\/em><\/td><td><em>das<\/em><\/td><\/tr><tr><td><em>ver<\/em><\/td><td><em>veo<\/em><\/td><td><em>ves<\/em><\/td><\/tr><tr><td><em>caber<\/em><\/td><td><em>quepo<\/em><\/td><td><em>cabes<\/em><\/td><\/tr><\/table><p>Die einsilbigen Formen von <em>dar<\/em> und <em>ver<\/em> tragen keinen Akzent: <em>da, dan, dais, ve, ven, veis<\/em>.<\/p><p><b>-uir<\/b>: Verben auf <em>-uir<\/em> schieben ein <em>y<\/em> ein, außer bei <em>nosotros<\/em> und <em>vosotros<\/em>: <em>construir → construyo, construyes, construye, construimos, construís, construyen<\/em>. Ebenso <em>destruir, incluir, concluir, huir, contribuir, distribuir<\/em>.<\/p><div class=\"warn\">Achtung: <em>sé<\/em> (ich weiß) braucht den Akzent – <em>se<\/em> ohne Akzent ist das Reflexivpronomen. <em>No sé si se ha ido.<\/em> <small>Ich weiß nicht, ob er gegangen ist.<\/small><\/div>"},{"h":"Ganz unregelmäßig: ser, estar, ir, haber","html":"<table><tr><th><\/th><th>ser<\/th><th>estar<\/th><th>ir<\/th><\/tr><tr><td>yo<\/td><td><em>soy<\/em><\/td><td><em>estoy<\/em><\/td><td><em>voy<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>eres<\/em><\/td><td><em>estás<\/em><\/td><td><em>vas<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>es<\/em><\/td><td><em>está<\/em><\/td><td><em>va<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>somos<\/em><\/td><td><em>estamos<\/em><\/td><td><em>vamos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>sois<\/em><\/td><td><em>estáis<\/em><\/td><td><em>vais<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>son<\/em><\/td><td><em>están<\/em><\/td><td><em>van<\/em><\/td><\/tr><\/table><p><b>haber<\/b> (Hilfsverb): <em>he, has, ha, hemos, habéis, han<\/em>. Als unpersönliches „es gibt“ heißt die Form <em>hay<\/em>: <em>Hay un problema.<\/em><\/p><p><em>Somos de Hamburgo, pero ahora estamos en Málaga.<\/em> <small>Wir sind aus Hamburg, aber jetzt sind wir in Málaga.<\/small><br><em>¿Vais a la fiesta?<\/em> <small>Geht ihr zur Party?<\/small><\/p><div class=\"warn\">Achtung: <em>estás, está, estáis, están<\/em> haben einen Akzent; <em>esta<\/em> ohne Akzent ist das Demonstrativpronomen („diese“). <em>Esta casa está vacía.<\/em><\/div><div class=\"tip\"><em>vais<\/em>, <em>sois<\/em>, <em>dais<\/em>, <em>veis<\/em> sind einsilbig und tragen keinen Akzent.<\/div>"},{"h":"Ganz unregelmäßig: tener, venir, decir, oír","html":"<p>Diese Verben kombinieren eine unregelmäßige yo-Form mit einem Stammwechsel:<\/p><table><tr><th><\/th><th>tener<\/th><th>venir<\/th><th>decir<\/th><\/tr><tr><td>yo<\/td><td><em>tengo<\/em><\/td><td><em>vengo<\/em><\/td><td><em>digo<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>tienes<\/em><\/td><td><em>vienes<\/em><\/td><td><em>dices<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>tiene<\/em><\/td><td><em>viene<\/em><\/td><td><em>dice<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>tenemos<\/em><\/td><td><em>venimos<\/em><\/td><td><em>decimos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>tenéis<\/em><\/td><td><em>venís<\/em><\/td><td><em>decís<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>tienen<\/em><\/td><td><em>vienen<\/em><\/td><td><em>dicen<\/em><\/td><\/tr><\/table><p><b>oír<\/b>: <em>oigo, oyes, oye, oímos, oís, oyen<\/em> (zwischen zwei Vokalen wird <em>i<\/em> zu <em>y<\/em>).<\/p><p><em>Tengo que irme, pero vengo mañana otra vez.<\/em> <small>Ich muss gehen, aber ich komme morgen wieder.<\/small><br><em>¿Me oyes bien? – No, no te oigo nada.<\/em> <small>Hörst du mich gut? – Nein, ich höre dich gar nicht.<\/small><\/p><div class=\"tip\">Ebenso konjugiert: <em>mantener, obtener, contener<\/em> (wie <em>tener<\/em>), <em>prevenir, convenir<\/em> (wie <em>venir<\/em>), <em>contradecir<\/em> (wie <em>decir<\/em>).<\/div>"},{"h":"Schreibänderungen","html":"<p>Manche Verben ändern in der yo-Form nur die <b>Schreibung<\/b>, damit die Aussprache des Stammes gleich bleibt:<\/p><table><tr><th>Endung<\/th><th>Änderung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>-ger / -gir<\/em><\/td><td><em>g → j<\/em> vor <em>o<\/em><\/td><td><em>coger → cojo<\/em>, <em>proteger → protejo<\/em>, <em>dirigir → dirijo<\/em><\/td><\/tr><tr><td><em>-guir<\/em><\/td><td><em>gu → g<\/em> vor <em>o<\/em><\/td><td><em>seguir → sigo<\/em>, <em>conseguir → consigo<\/em>, <em>distinguir → distingo<\/em><\/td><\/tr><tr><td>Konsonant + <em>-cer<\/em><\/td><td><em>c → z<\/em> vor <em>o<\/em><\/td><td><em>vencer → venzo<\/em>, <em>convencer → convenzo<\/em>, <em>ejercer → ejerzo<\/em><\/td><\/tr><\/table><p>Alle anderen Formen bleiben unverändert: <em>coges, sigues, vences<\/em>.<\/p><p><b>Akzent auf i / u<\/b>: Einige Verben auf <em>-iar<\/em> / <em>-uar<\/em> betonen das <em>í<\/em> bzw. <em>ú<\/em>: <em>enviar → envío, envías, envía, enviamos, enviáis, envían<\/em>; <em>continuar → continúo<\/em>; ebenso <em>confiar, esquiar, actuar, graduarse<\/em>. Andere nicht: <em>estudiar → estudio, cambiar → cambio<\/em>.<\/p><div class=\"warn\">Achtung: <em>coger<\/em> („nehmen“) ist in Spanien Alltagswort, in weiten Teilen Lateinamerikas aber vulgär. Dort sagt man <em>tomar<\/em> oder <em>agarrar<\/em>: <em>tomo el autobús<\/em>.<\/div>"},{"h":"Gebrauch des Präsens","html":"<ul><li><b>Gegenwart<\/b>: <em>¿Qué haces? – Leo el periódico.<\/em> <small>Was machst du? – Ich lese die Zeitung.<\/small> Für „gerade jetzt“ ist auch <em>estar + gerundio<\/em> üblich: <em>Estoy leyendo.<\/em><\/li><li><b>Gewohnheit<\/b>: <em>Los domingos comemos en casa de mi suegra.<\/em> <small>Sonntags essen wir bei meiner Schwiegermutter.<\/small><\/li><li><b>Allgemeine Wahrheiten<\/b>: <em>El agua hierve a cien grados.<\/em><\/li><li><b>Nahe, feste Zukunft<\/b> (meist mit Zeitangabe): <em>Mañana empiezo el curso.<\/em> <small>Morgen fange ich mit dem Kurs an.<\/small> <em>El vuelo sale a las seis.<\/em><\/li><li><b>Angebote und Fragen nach der Meinung<\/b>: <em>¿Te ayudo?<\/em> <small>Soll ich dir helfen?<\/small> <em>¿Cierro la puerta?<\/em> <small>Soll ich die Tür schließen?<\/small><\/li><li><b>Historisches Präsens<\/b> (Geschichtsdarstellungen, lebhaftes Erzählen): <em>En 1936 empieza la Guerra Civil.<\/em> <small>1936 beginnt der Bürgerkrieg.<\/small> <em>Y entonces entra el jefe y nos dice…<\/em><\/li><li><b>Aufforderung<\/b> (umgangssprachlich): <em>Tú te quedas aquí y esperas.<\/em> <small>Du bleibst hier und wartest.<\/small><\/li><\/ul><div class=\"tip\">Für „Soll ich …?“ nimmt man im Spanischen einfach das Präsens – kein Modalverb nötig: <em>¿Abro la ventana?<\/em><\/div>"},{"h":"Seit wann? desde, desde hace, hace … que","html":"<p>Dauert eine Handlung bis heute an, steht im Spanischen – wie im Deutschen – das <b>Präsens<\/b>:<\/p><table><tr><th>Struktur<\/th><th>Beispiel<\/th><\/tr><tr><td><em>desde<\/em> + Zeitpunkt<\/td><td><em>Vivo aquí desde 2019.<\/em><br><small>Ich wohne seit 2019 hier.<\/small><\/td><\/tr><tr><td><em>desde hace<\/em> + Zeitraum<\/td><td><em>Vivo aquí desde hace cinco años.<\/em><br><small>Ich wohne seit fünf Jahren hier.<\/small><\/td><\/tr><tr><td><em>hace<\/em> + Zeitraum + <em>que<\/em><\/td><td><em>Hace cinco años que vivo aquí.<\/em><br><small>Ich wohne schon fünf Jahre hier.<\/small><\/td><\/tr><tr><td><em>llevar<\/em> + Zeitraum + Gerundium<\/td><td><em>Llevo cinco años viviendo aquí.<\/em><br><small>Ich wohne schon fünf Jahre hier.<\/small><\/td><\/tr><\/table><p>Fragen: <em>¿Desde cuándo estudias español?<\/em> <small>Seit wann …?<\/small> – <em>¿Cuánto tiempo hace que estudias español?<\/em> / <em>¿Cuánto tiempo llevas estudiando español?<\/em> <small>Wie lange schon …?<\/small><\/p><div class=\"warn\">Achtung: <em>desde<\/em> + Zeitpunkt (<em>desde mayo, desde el lunes<\/em>), aber <em>desde hace<\/em> + Zeitraum (<em>desde hace dos meses<\/em>). Falsch: <em>*desde dos meses<\/em>.<\/div><div class=\"warn\">Achtung: <em>hace<\/em> allein (ohne <em>que<\/em> und mit Vergangenheit) bedeutet „vor“: <em>Llegué hace cinco años.<\/em> <small>Ich bin vor fünf Jahren angekommen.<\/small><\/div>"}],"exercises":[{"type":"gap","title":"Regelmäßige Verben","task":"Setze das Verb im Präsens ein.","items":[{"q":"Mi hermano (trabajar) ___ en un hospital.","a":["trabaja"],"de":"Mein Bruder arbeitet in einem Krankenhaus."},{"q":"¿Vosotros (comprar) ___ el pan en esta panadería?","a":["compráis"],"de":"Kauft ihr das Brot in dieser Bäckerei?"},{"q":"Yo (beber) ___ poco café.","a":["bebo"],"de":"Ich trinke wenig Kaffee."},{"q":"Nosotros (vivir) ___ en el centro.","a":["vivimos"],"de":"Wir wohnen im Zentrum."},{"q":"¿Tú (leer) ___ novelas en español?","a":["lees"],"de":"Liest du Romane auf Spanisch?"},{"q":"Mis vecinos (escuchar) ___ música muy alta.","a":["escuchan"],"de":"Meine Nachbarn hören sehr laute Musik."},{"q":"Vosotras (escribir) ___ muy bien.","a":["escribís"],"de":"Ihr schreibt sehr gut."},{"q":"Nosotros (aprender) ___ algo nuevo cada día.","a":["aprendemos"],"de":"Wir lernen jeden Tag etwas Neues."}]},{"type":"gap","title":"Stammwechsel e→ie, o→ue, u→ue","task":"Setze die Präsensform ein. Achte auf nosotros und vosotros!","items":[{"q":"La película (empezar) ___ a las nueve.","a":["empieza"],"de":"Der Film fängt um neun an."},{"q":"Yo no (entender) ___ esta palabra.","a":["entiendo"],"de":"Ich verstehe dieses Wort nicht."},{"q":"Nosotros (querer) ___ ir a la playa.","a":["queremos"],"de":"Wir wollen an den Strand gehen."},{"q":"¿Tú (poder) ___ ayudarme?","a":["puedes"],"de":"Kannst du mir helfen?"},{"q":"Los niños (dormir) ___ en la habitación de arriba.","a":["duermen"],"de":"Die Kinder schlafen im Zimmer oben."},{"q":"¿Cuánto (costar) ___ este libro?","a":["cuesta"],"de":"Wie viel kostet dieses Buch?"},{"q":"Vosotros (volver) ___ muy tarde.","a":["volvéis"],"de":"Ihr kommt sehr spät zurück."},{"q":"Mi hija (jugar) ___ al baloncesto.","a":["juega"],"de":"Meine Tochter spielt Basketball."},{"q":"Nosotros (jugar) ___ a las cartas los viernes.","a":["jugamos"],"de":"Wir spielen freitags Karten."},{"q":"Yo (preferir) ___ el té.","a":["prefiero"],"de":"Ich ziehe Tee vor."}]},{"type":"gap","title":"e → i und gemischte Stammwechsel","task":"Setze die Präsensform ein.","items":[{"q":"En este bar (ellos, servir) ___ unas tapas buenísimas.","a":["sirven"],"de":"In dieser Bar servieren sie sehr gute Tapas."},{"q":"Siempre (yo, pedir) ___ lo mismo.","a":["pido"],"de":"Ich bestelle immer dasselbe."},{"q":"¿Me (repetir, usted) ___ la pregunta, por favor?","a":["repite"],"de":"Wiederholen Sie mir bitte die Frage?"},{"q":"Nosotros (pedir) ___ la cuenta.","a":["pedimos"],"de":"Wir bitten um die Rechnung."},{"q":"Mi padre (vestirse) ___ muy elegante.","a":["se viste"],"de":"Mein Vater kleidet sich sehr elegant."},{"q":"En invierno casi nunca (nevar) ___ aquí.","a":["nieva"],"de":"Im Winter schneit es hier fast nie."},{"q":"Yo (soler) ___ leer antes de dormir.","a":["suelo"],"de":"Ich lese normalerweise vor dem Schlafen."},{"q":"Me (doler) ___ los pies.","a":["duelen"],"de":"Mir tun die Füße weh."}]},{"type":"gap","title":"Unregelmäßige yo-Form","task":"Setze die 1. Person Singular (yo) ein.","items":[{"q":"Por las mañanas (hacer) ___ yoga.","a":["hago"],"de":"Morgens mache ich Yoga."},{"q":"(salir) ___ de casa a las siete y media.","a":["Salgo","salgo"],"de":"Ich gehe um halb acht aus dem Haus."},{"q":"¿Dónde (poner) ___ las llaves?","a":["pongo"],"de":"Wohin lege ich die Schlüssel?"},{"q":"Hoy (traer) ___ el postre.","a":["traigo"],"de":"Heute bringe ich den Nachtisch mit."},{"q":"No (conocer) ___ a nadie en esta ciudad.","a":["conozco"],"de":"Ich kenne niemanden in dieser Stadt."},{"q":"(conducir) ___ con mucho cuidado.","a":["Conduzco","conduzco"],"de":"Ich fahre sehr vorsichtig."},{"q":"No (saber) ___ dónde está la estación.","a":["sé"],"de":"Ich weiß nicht, wo der Bahnhof ist."},{"q":"Te (dar) ___ mi número.","a":["doy"],"de":"Ich gebe dir meine Nummer."},{"q":"Desde aquí (ver) ___ el mar.","a":["veo"],"de":"Von hier aus sehe ich das Meer."},{"q":"Siempre (agradecer) ___ un buen consejo.","a":["agradezco"],"de":"Ich bin immer dankbar für einen guten Rat."}]},{"type":"gap","title":"Ganz unregelmäßige Verben","task":"Setze die richtige Präsensform ein.","items":[{"q":"Nosotros (ser) ___ compañeros de trabajo.","a":["somos"],"de":"Wir sind Arbeitskollegen."},{"q":"¿Dónde (estar) ___ mis gafas?","a":["están"],"de":"Wo ist meine Brille?"},{"q":"¿Vosotros (ir) ___ al concierto?","a":["vais"],"de":"Geht ihr zum Konzert?"},{"q":"Mi abuela (tener) ___ noventa años.","a":["tiene"],"de":"Meine Großmutter ist neunzig Jahre alt."},{"q":"¿De dónde (venir) ___ tú ahora?","a":["vienes"],"de":"Woher kommst du jetzt?"},{"q":"Los expertos (decir) ___ que va a llover.","a":["dicen"],"de":"Die Experten sagen, dass es regnen wird."},{"q":"¿Vosotros (oír) ___ ese ruido?","a":["oís"],"de":"Hört ihr dieses Geräusch?"},{"q":"Tú (ser) ___ muy paciente.","a":["eres"],"de":"Du bist sehr geduldig."},{"q":"Yo (decir) ___ siempre la verdad.","a":["digo"],"de":"Ich sage immer die Wahrheit."},{"q":"(haber) ___ mucha gente en la plaza.","a":["Hay","hay"],"de":"Es sind viele Leute auf dem Platz."}]},{"type":"gap","title":"Schreibänderungen und -uir","task":"Setze die Präsensform ein.","items":[{"q":"Normalmente (yo, coger) ___ el metro.","a":["cojo"],"de":"Normalerweise nehme ich die U-Bahn."},{"q":"(yo, seguir) ___ las instrucciones al pie de la letra.","a":["Sigo","sigo"],"de":"Ich befolge die Anweisungen buchstabengetreu."},{"q":"Si no lo (yo, conseguir) ___ hoy, lo intento mañana.","a":["consigo"],"de":"Wenn ich es heute nicht schaffe, versuche ich es morgen."},{"q":"Siempre (yo, vencer) ___ a mi hermano al ajedrez.","a":["venzo"],"de":"Ich besiege meinen Bruder immer beim Schach."},{"q":"Yo (elegir) ___ el menú del día.","a":["elijo"],"de":"Ich wähle das Tagesmenü."},{"q":"Ellos (construir) ___ una casa en el pueblo.","a":["construyen"],"de":"Sie bauen ein Haus im Dorf."},{"q":"El precio (incluir) ___ el desayuno.","a":["incluye"],"de":"Der Preis schließt das Frühstück ein."},{"q":"Te (enviar) ___ las fotos esta noche.","a":["envío"],"de":"Ich schicke dir heute Abend die Fotos."}]},{"type":"choice","title":"Gebrauch und Zeitangaben","task":"Wähle die richtige Lösung.","items":[{"q":"Estudio alemán ___ tres años.","options":["desde","desde hace","hace que"],"a":1,"why":"Zeitraum (tres años) nach dem Verb → desde hace."},{"q":"Trabajo en esta empresa ___ marzo.","options":["desde","desde hace","hace"],"a":0,"why":"Zeitpunkt (marzo) → desde."},{"q":"___ dos meses que no veo a Laura.","options":["Desde","Hace","Desde hace"],"a":1,"why":"Satzanfang mit Zeitraum + que → hace … que."},{"q":"Ich wohne seit 10 Jahren in Bonn.","options":["He vivido en Bonn desde hace diez años.","Vivo en Bonn desde hace diez años.","Viví en Bonn hace diez años."],"a":1,"why":"Andauernde Handlung bis heute → Präsens."},{"q":"Soll ich das Fenster aufmachen?","options":["¿Debo abrir la ventana?","¿Abro la ventana?","¿Abrí la ventana?"],"a":1,"why":"Angebote formuliert man natürlich mit dem Präsens."},{"q":"Mañana ___ a Lisboa. Ya tengo el billete.","options":["voy","fui","iba"],"a":0,"why":"Feste Pläne in naher Zukunft → Präsens."},{"q":"En 1492 Colón ___ a América. (Geschichtsdarstellung)","options":["llega","llegue","llegaba"],"a":0,"why":"Historisches Präsens für Ereignisse in Chroniken und Geschichtsdarstellungen."},{"q":"¿Cuánto tiempo ___ esperando?","options":["llevas","hace","desde"],"a":0,"why":"llevar + Zeitraum + Gerundium: ¿Cuánto tiempo llevas esperando?"}]}],"cards":[{"f":"Präsensendungen -ar","b":"-o, -as, -a, -amos, -áis, -an"},{"f":"Präsensendungen -er","b":"-o, -es, -e, -emos, -éis, -en"},{"f":"Präsensendungen -ir","b":"-o, -es, -e, -imos, -ís, -en"},{"f":"Stammwechsel – welche Formen bleiben regelmäßig?","b":"nosotros und vosotros (Betonung auf der Endung)"},{"f":"pensar – Präsens","b":"pienso, piensas, piensa, pensamos, pensáis, piensan"},{"f":"empezar – yo","b":"empiezo"},{"f":"poder – Präsens","b":"puedo, puedes, puede, podemos, podéis, pueden"},{"f":"dormir – Präsens","b":"duermo, duermes, duerme, dormimos, dormís, duermen"},{"f":"jugar – Präsens","b":"juego, juegas, juega, jugamos, jugáis, juegan"},{"f":"pedir – Präsens","b":"pido, pides, pide, pedimos, pedís, piden"},{"f":"e → i – bei welchen Verben?","b":"Nur bei -ir-Verben: pedir, servir, repetir, vestirse, seguir, elegir"},{"f":"hacer / poner / salir – yo","b":"hago / pongo / salgo"},{"f":"traer / caer – yo","b":"traigo / caigo"},{"f":"conocer / conducir – yo","b":"conozco / conduzco"},{"f":"saber / dar / ver – yo","b":"sé / doy / veo"},{"f":"caber – yo","b":"quepo"},{"f":"construir – Präsens","b":"construyo, construyes, construye, construimos, construís, construyen"},{"f":"ser – Präsens","b":"soy, eres, es, somos, sois, son"},{"f":"estar – Präsens","b":"estoy, estás, está, estamos, estáis, están"},{"f":"ir – Präsens","b":"voy, vas, va, vamos, vais, van"},{"f":"haber – Präsens","b":"he, has, ha (unpersönlich: hay), hemos, habéis, han"},{"f":"tener – Präsens","b":"tengo, tienes, tiene, tenemos, tenéis, tienen"},{"f":"venir – Präsens","b":"vengo, vienes, viene, venimos, venís, vienen"},{"f":"decir – Präsens","b":"digo, dices, dice, decimos, decís, dicen"},{"f":"oír – Präsens","b":"oigo, oyes, oye, oímos, oís, oyen"},{"f":"coger / seguir / vencer – yo","b":"cojo / sigo / venzo"},{"f":"enviar / continuar – yo","b":"envío / continúo"},{"f":"seit + Zeitpunkt","b":"desde: Vivo aquí desde 2019."},{"f":"seit + Zeitraum (2 Varianten)","b":"Vivo aquí desde hace cinco años. / Hace cinco años que vivo aquí."},{"f":"llevar + Zeitraum + gerundio","b":"Llevo dos años estudiando español. = Ich lerne seit zwei Jahren Spanisch."},{"f":"„Soll ich …?“ auf Spanisch","b":"Präsens: ¿Te ayudo? ¿Cierro la puerta?"},{"f":"Präsens für die Zukunft","b":"Feste Pläne mit Zeitangabe: Mañana empiezo el curso."},{"f":"soler + Infinitiv","b":"normalerweise tun: Suelo cenar tarde."},{"f":"spielen: jugar vs. tocar","b":"jugar al tenis / a las cartas – tocar el piano"},{"f":"coger in Lateinamerika","b":"Oft vulgär – besser tomar / agarrar"}],"id":"k12"},{"nr":11,"title":"ser, estar und hay","teil":"Das Verb und seine Ergänzungen","intro":"Für das deutsche „sein“ hat das Spanische zwei Verben und für „es gibt“ eine eigene Form. Hier lernst du, wann ser, wann estar und wann hay steht – eine der wichtigsten Unterscheidungen für deutsche Lerner.","sections":[{"h":"ser: Was oder wer etwas ist","html":"<p><em>ser<\/em> beschreibt, <b>was<\/b> etwas ist – sein Wesen, seine Identität, seine Zugehörigkeit:<\/p><table><tr><th>Gebrauch<\/th><th>Beispiel<\/th><\/tr><tr><td>Identität, Definition<\/td><td><em>Esta es mi cuñada Inés.<\/em> <small>Das ist meine Schwägerin Inés.<\/small><br><em>La ballena es un mamífero.<\/em><\/td><\/tr><tr><td>Herkunft, Nationalität<\/td><td><em>Somos de Viena.<\/em> <small>Wir sind aus Wien.<\/small><br><em>Lucía es chilena.<\/em><\/td><\/tr><tr><td>Beruf, Religion, Partei<\/td><td><em>Mi hermano es fontanero.<\/em> <small>Mein Bruder ist Klempner.<\/small><\/td><\/tr><tr><td>Material<\/td><td><em>La bufanda es de lana.<\/em> <small>Der Schal ist aus Wolle.<\/small><\/td><\/tr><tr><td>Charakter, Wesensmerkmale<\/td><td><em>Mis vecinos son muy amables.<\/em><br><em>El piso es pequeño pero luminoso.<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: Bei Berufen steht nach <em>ser<\/em> <b>kein<\/b> unbestimmter Artikel: <em>Es arquitecta.<\/em> (nicht <em>*es una arquitecta<\/em>). Mit Adjektiv dagegen schon: <em>Es una arquitecta muy conocida.<\/em><\/div><div class=\"tip\">Beruf als vorübergehender Job: <em>estar de<\/em> + Beruf: <em>Estudia Derecho, pero este verano está de camarero.<\/em> <small>Er studiert Jura, aber diesen Sommer jobbt er als Kellner.<\/small><\/div>"},{"h":"ser: Zeit, Besitz, Ereignisse, Passiv","html":"<ul><li><b>Uhrzeit<\/b>: <em>Es la una. Son las cinco y cuarto.<\/em> <small>Es ist ein Uhr. Es ist Viertel nach fünf.<\/small><\/li><li><b>Datum, Wochentag, Tageszeit<\/b>: <em>Hoy es viernes. Mañana es 12 de octubre. Ya es de noche.<\/em> (Auch: <em>Estamos a 12 de octubre.<\/em>)<\/li><li><b>Besitz<\/b>: <em>¿De quién es este móvil? – Es de Álvaro. / Es mío.<\/em> <small>Wem gehört dieses Handy? – Álvaro. / Mir.<\/small><\/li><li><b>Preis als Gesamtsumme<\/b>: <em>¿Cuánto es? – Son quince euros.<\/em><\/li><li><b>Ort und Zeit von Ereignissen<\/b>: <em>La fiesta es en mi casa.<\/em> <small>Die Party findet bei mir statt.<\/small> <em>El examen es el lunes.<\/em><\/li><li><b>Passiv<\/b> (<em>ser<\/em> + Partizip, angeglichen): <em>El puente fue inaugurado en 1998.<\/em> <small>Die Brücke wurde 1998 eingeweiht.<\/small> <em>Las entradas fueron vendidas en una hora.<\/em><\/li><li><b>Unpersönliche Wertungen<\/b>: <em>Es importante dormir bien. Es mejor esperar.<\/em><\/li><\/ul><div class=\"warn\">Achtung: Ort von <b>Gegenständen und Personen<\/b> → <em>estar<\/em>; Ort von <b>Veranstaltungen<\/b> → <em>ser<\/em>. <em>El concierto es en el estadio, y el estadio está junto al río.<\/em> <small>Das Konzert findet im Stadion statt, und das Stadion liegt am Fluss.<\/small><\/div>"},{"h":"estar: Wo und wie etwas ist","html":"<p><em>estar<\/em> beschreibt, <b>wo<\/b> etwas ist und <b>in welchem Zustand<\/b> es sich (gerade) befindet:<\/p><table><tr><th>Gebrauch<\/th><th>Beispiel<\/th><\/tr><tr><td>Ort, Lage<\/td><td><em>Granada está en Andalucía.<\/em><br><em>Tus llaves están en el cajón.<\/em><\/td><\/tr><tr><td>Befinden, Zustand<\/td><td><em>¿Cómo estás? – Estoy un poco resfriado.<\/em><br><em>El café está frío.<\/em><\/td><\/tr><tr><td>Ergebnis einer Handlung (+ Partizip)<\/td><td><em>La farmacia está cerrada.<\/em> <small>Die Apotheke ist geschlossen.<\/small><br><em>Los deberes ya están hechos.<\/em><\/td><\/tr><tr><td>Verlaufsform (+ Gerundium)<\/td><td><em>Estamos cenando.<\/em> <small>Wir sind gerade beim Abendessen.<\/small><\/td><\/tr><tr><td>Feste Wendungen<\/td><td><em>estar de vacaciones / de pie / de acuerdo / de buen humor<\/em><\/td><\/tr><\/table><p>Mit <em>estar<\/em> + Adjektiv drückt man auch einen <b>subjektiven Eindruck<\/b> oder eine Veränderung aus: <em>¡Qué alto está tu hijo!<\/em> <small>Wie groß dein Sohn geworden ist!<\/small> <em>Hoy estás muy elegante.<\/em><\/p><div class=\"tip\">Passiv mit <em>ser<\/em> = Vorgang (<em>La tienda fue cerrada por la policía.<\/em> – wurde geschlossen), <em>estar<\/em> + Partizip = Ergebnis (<em>La tienda está cerrada.<\/em> – ist geschlossen). Wie im Deutschen „werden“ vs. „sein“.<\/div><div class=\"warn\">Achtung: <em>bien<\/em> und <em>mal<\/em> stehen immer mit <em>estar<\/em>: <em>Está bien.<\/em> (nicht <em>*es bien<\/em>). Ebenso <em>estar muerto<\/em>, obwohl der Tod endgültig ist: <em>El pez está muerto.<\/em><\/div>"},{"h":"Adjektive mit Bedeutungswechsel","html":"<p>Einige Adjektive ändern ihre Bedeutung, je nachdem ob sie mit <em>ser<\/em> (Eigenschaft) oder <em>estar<\/em> (Zustand) stehen:<\/p><table><tr><th>Adjektiv<\/th><th>ser<\/th><th>estar<\/th><\/tr><tr><td><em>listo<\/em><\/td><td>klug, schlau<\/td><td>fertig, bereit<\/td><\/tr><tr><td><em>aburrido<\/em><\/td><td>langweilig<\/td><td>gelangweilt<\/td><\/tr><tr><td><em>malo<\/em><\/td><td>schlecht, böse<\/td><td>krank; verdorben<\/td><\/tr><tr><td><em>rico<\/em><\/td><td>reich<\/td><td>lecker<\/td><\/tr><tr><td><em>verde<\/em><\/td><td>grün<\/td><td>unreif; unerfahren<\/td><\/tr><tr><td><em>bueno<\/em><\/td><td>gut, gutherzig<\/td><td>lecker; (ugs.) attraktiv<\/td><\/tr><tr><td><em>despierto<\/em><\/td><td>aufgeweckt<\/td><td>wach<\/td><\/tr><tr><td><em>cansado<\/em><\/td><td>anstrengend<\/td><td>müde<\/td><\/tr><tr><td><em>abierto<\/em><\/td><td>offen (Mensch)<\/td><td>geöffnet<\/td><\/tr><tr><td><em>orgulloso<\/em><\/td><td>hochmütig<\/td><td>stolz (auf)<\/td><\/tr><\/table><p><em>Mi sobrina es muy lista, pero nunca está lista a tiempo.<\/em> <small>Meine Nichte ist sehr klug, aber nie rechtzeitig fertig.<\/small><br><em>Esta conferencia es aburrida y todos estamos aburridos.<\/em> <small>Dieser Vortrag ist langweilig, und wir alle langweilen uns.<\/small><br><em>Los plátanos todavía están verdes.<\/em> <small>Die Bananen sind noch unreif.<\/small><br><em>Hoy no voy a clase, estoy malo.<\/em> <small>Heute gehe ich nicht zum Unterricht, ich bin krank.<\/small><\/p><div class=\"warn\">Achtung: <em>¡Qué rico está!<\/em> heißt „Wie lecker!“ – <em>es rico<\/em> bedeutet „er ist reich“. Und mit <em>estar bueno<\/em> über Personen sollte man vorsichtig sein: Es bedeutet umgangssprachlich „gut aussehen, sexy sein“.<\/div>"},{"h":"Grenzfälle","html":"<ul><li><b>Familienstand<\/b>: <em>Está casada<\/em> und <em>Es casada<\/em> sind beide möglich; in Spanien ist <em>estar casado / soltero / divorciado<\/em> im Alltag üblicher.<\/li><li><b>Alter<\/b>: <em>Es joven / mayor<\/em> (Eigenschaft) – <em>Está muy joven para su edad<\/em> (Eindruck).<\/li><li><b>feliz / contento<\/b>: <em>contento<\/em> steht immer mit <em>estar<\/em>: <em>Estoy contenta.<\/em> <em>feliz<\/em> geht mit beiden; <em>Es feliz<\/em> eher als Grundhaltung, <em>Está feliz<\/em> als momentane Stimmung.<\/li><li><b>Zeitpunkt<\/b>: <em>Es tarde / temprano.<\/em> <small>Es ist spät / früh.<\/small> – aber <em>Llegas tarde.<\/em> / <em>*Estás tarde<\/em> ist falsch.<\/li><li><b>Wetter<\/b> meist mit <em>hacer<\/em> und <em>estar<\/em>: <em>Hace calor. Está nublado.<\/em><\/li><\/ul><div class=\"tip\">Leitfrage: Beschreibe ich, <b>was<\/b> etwas ist (Klasse, Identität, Wesen) → <em>ser<\/em>. Beschreibe ich, <b>wie es sich gerade befindet<\/b> oder <b>wo<\/b> → <em>estar<\/em>. „Dauerhaft vs. vorübergehend“ ist nur eine grobe Faustregel (siehe <em>estar muerto<\/em>, <em>ser joven<\/em>).<\/div>"},{"h":"hay oder está / están?","html":"<p><em>hay<\/em> („es gibt“, von <em>haber<\/em>) fragt, <b>ob<\/b> etwas existiert; <em>estar<\/em> sagt, <b>wo<\/b> sich etwas Bestimmtes befindet.<\/p><table><tr><th>hay + unbestimmt<\/th><th>estar + bestimmt<\/th><\/tr><tr><td><em>Hay un banco en la esquina.<\/em><br><small>An der Ecke ist eine Bank.<\/small><\/td><td><em>El banco está en la esquina.<\/em><br><small>Die Bank ist an der Ecke.<\/small><\/td><\/tr><tr><td><em>Hay dos farmacias cerca.<\/em><\/td><td><em>Las farmacias están cerca.<\/em><\/td><\/tr><tr><td><em>¿Hay leche?<\/em><\/td><td><em>¿Dónde está la leche?<\/em><\/td><\/tr><tr><td><em>Hay mucha gente.<\/em><\/td><td><em>Mis amigos están en la terraza.<\/em><\/td><\/tr><\/table><p>Nach <em>hay<\/em> stehen: <em>un/una, unos/unas<\/em>, Zahlen, <em>mucho, poco, algún, ningún, varios<\/em> oder ein Nomen ohne Artikel. Nach <em>estar<\/em>: <em>el/la/los/las<\/em>, Possessivbegleiter (<em>mi coche<\/em>), Demonstrativa, Eigennamen.<\/p><div class=\"warn\">Achtung: <em>*Hay el museo cerca<\/em> und <em>*Está un museo cerca<\/em> sind falsch. Richtig: <em>Hay un museo cerca.<\/em> / <em>El museo está cerca.<\/em><\/div><div class=\"warn\">Achtung: <em>hay<\/em> ist unveränderlich, auch in anderen Zeiten immer Singular: <em>Había muchos turistas.<\/em> <em>Ha habido dos accidentes.<\/em> <em>Habrá fuegos artificiales.<\/em> (nicht <em>*habían<\/em>, <em>*han habido<\/em>)<\/div>"},{"h":"hay que + Infinitiv","html":"<p><em>hay que<\/em> + Infinitiv drückt eine <b>allgemeine, unpersönliche Notwendigkeit<\/b> aus („man muss“):<\/p><p><em>Para entrar en el museo hay que reservar.<\/em> <small>Um ins Museum zu kommen, muss man reservieren.<\/small><br><em>Hay que regar las plantas dos veces por semana.<\/em> <small>Man muss die Pflanzen zweimal pro Woche gießen.<\/small><\/p><p>Geht es um eine <b>bestimmte Person<\/b>, nimmt man <em>tener que<\/em>: <em>Tengo que reservar mesa.<\/em> <small>Ich muss einen Tisch reservieren.<\/small><\/p><p>Verneint: <em>No hay que pagar entrada.<\/em> <small>Man muss keinen Eintritt zahlen.<\/small> <em>No hay que exagerar.<\/em> <small>Man sollte nicht übertreiben.<\/small><\/p><p>Andere Zeiten: <em>Había que esperar. Hubo que llamar al técnico. Habrá que ver.<\/em> <small>Man musste warten. Man musste den Techniker rufen. Das wird sich zeigen.<\/small><\/p><div class=\"tip\"><em>hay que<\/em> = „man muss“ (alle, niemand Bestimmtes) – <em>tener que<\/em> = „ich/du/er muss“. <em>hay que<\/em> hat nie ein Subjekt.<\/div>"}],"exercises":[{"type":"choice","title":"ser oder estar? Grundregeln","task":"Wähle die richtige Form.","items":[{"q":"Mi novio ___ de Valencia.","options":["es","está"],"a":0,"why":"Herkunft → ser."},{"q":"Valencia ___ en la costa este.","options":["es","está"],"a":1,"why":"Lage eines Ortes → estar."},{"q":"Hoy ___ muy cansada, he dormido mal.","options":["soy","estoy"],"a":1,"why":"Momentaner Zustand → estar."},{"q":"Mi madre ___ profesora de música.","options":["es","está"],"a":0,"why":"Beruf → ser (ohne Artikel)."},{"q":"Ya ___ las once. ¡Vamos!","options":["son","están"],"a":0,"why":"Uhrzeit → ser."},{"q":"Esta silla ___ de plástico.","options":["es","está"],"a":0,"why":"Material → ser."},{"q":"La reunión ___ en la sala de conferencias.","options":["es","está"],"a":0,"why":"Ort einer Veranstaltung → ser."},{"q":"Las ventanas ___ abiertas.","options":["son","están"],"a":1,"why":"Ergebnis/Zustand (estar + Partizip)."},{"q":"¿De quién ___ esta chaqueta?","options":["es","está"],"a":0,"why":"Besitz → ser."},{"q":"Los niños ___ jugando en el patio.","options":["son","están"],"a":1,"why":"Verlaufsform → estar + Gerundium."}]},{"type":"gap","title":"ser und estar konjugieren","task":"Setze ser oder estar im Präsens in der richtigen Form ein.","items":[{"q":"Nosotros ___ muy contentos con el piso nuevo.","a":["estamos"],"de":"Wir sind sehr zufrieden mit der neuen Wohnung."},{"q":"Vosotros ___ mis mejores amigos.","a":["sois"],"de":"Ihr seid meine besten Freunde."},{"q":"¿Tú ___ bien? Tienes mala cara.","a":["estás"],"de":"Geht es dir gut? Du siehst schlecht aus."},{"q":"El examen ___ el próximo jueves.","a":["es"],"de":"Die Prüfung ist nächsten Donnerstag."},{"q":"Yo ___ de acuerdo contigo.","a":["estoy"],"de":"Ich bin mit dir einverstanden."},{"q":"Hoy ___ martes, 3 de marzo.","a":["es"],"de":"Heute ist Dienstag, der 3. März."},{"q":"Mis padres ___ de vacaciones en Mallorca.","a":["están"],"de":"Meine Eltern sind auf Mallorca im Urlaub."},{"q":"Esta cartera ___ de piel.","a":["es"],"de":"Diese Brieftasche ist aus Leder."}]},{"type":"choice","title":"Bedeutungswechsel","task":"Wähle die passende Form.","items":[{"q":"Die Suppe ist lecker: La sopa ___ muy rica.","options":["es","está"],"a":1,"why":"estar rico = lecker."},{"q":"Sein Onkel ist reich: Su tío ___ muy rico.","options":["es","está"],"a":0,"why":"ser rico = reich."},{"q":"¿___ listos? ¡Nos vamos!","options":["Sois","Estáis"],"a":1,"why":"estar listo = fertig, bereit."},{"q":"Esta niña ___ muy lista: ya sabe leer.","options":["es","está"],"a":0,"why":"ser listo = klug."},{"q":"No como esas fresas, todavía ___ verdes.","options":["son","están"],"a":1,"why":"estar verde = unreif."},{"q":"Hoy Marcos no viene, ___ malo.","options":["es","está"],"a":1,"why":"estar malo = krank."},{"q":"Esta serie ___ aburridísima.","options":["es","está"],"a":0,"why":"ser aburrido = langweilig (Eigenschaft der Serie)."},{"q":"Los niños ___ aburridos porque llueve.","options":["son","están"],"a":1,"why":"estar aburrido = sich langweilen."}]},{"type":"choice","title":"hay, está oder están?","task":"Wähle die richtige Form.","items":[{"q":"¿___ un cajero automático por aquí?","options":["Hay","Está"],"a":0,"why":"Unbestimmter Artikel (un) → hay."},{"q":"¿Dónde ___ el cajero automático?","options":["hay","está"],"a":1,"why":"Bestimmter Artikel (el) → estar."},{"q":"En mi calle ___ tres restaurantes.","options":["hay","están"],"a":0,"why":"Zahl ohne Artikel → hay."},{"q":"Tus zapatos ___ debajo de la cama.","options":["hay","están"],"a":1,"why":"Possessivbegleiter + Ortsangabe → estar."},{"q":"No ___ pan. Tenemos que comprar.","options":["hay","está"],"a":0,"why":"Nomen ohne Artikel → hay."},{"q":"La Alhambra ___ en Granada.","options":["hay","está"],"a":1,"why":"Eigenname → estar."},{"q":"Ayer en la fiesta ___ mucha gente.","options":["había","habían","estaba"],"a":0,"why":"hay bleibt in allen Zeiten Singular: había."},{"q":"___ que llevar el pasaporte.","options":["Hay","Es","Está"],"a":0,"why":"Unpersönliche Notwendigkeit → hay que + Infinitiv."}]},{"type":"gap","title":"Gemischt: ser, estar, hay, hay que","task":"Setze es, está, están, hay oder hay que ein.","items":[{"q":"En el centro ___ una plaza muy bonita.","a":["hay"],"de":"Im Zentrum gibt es einen sehr schönen Platz."},{"q":"La plaza ___ al lado de la catedral.","a":["está"],"de":"Der Platz liegt neben der Kathedrale."},{"q":"El mercado ___ los sábados por la mañana.","a":["es"],"de":"Der Markt findet samstagmorgens statt."},{"q":"Para ver la torre ___ subir doscientos escalones.","a":["hay que"],"de":"Um den Turm zu sehen, muss man zweihundert Stufen hinaufsteigen."},{"q":"Los baños ___ al fondo, a la derecha.","a":["están"],"de":"Die Toiletten sind hinten rechts."},{"q":"¡Qué rico ___ este pastel! ¿Quién lo ha hecho?","a":["está"],"de":"Wie lecker dieser Kuchen ist! Wer hat ihn gemacht?"},{"q":"___ la una y media.","a":["Es","es"],"de":"Es ist halb zwei."},{"q":"¡Cuidado! El suelo ___ mojado.","a":["está"],"de":"Vorsicht! Der Boden ist nass."}]}],"cards":[{"f":"ser – Grundbedeutung","b":"Was/wer etwas ist: Identität, Herkunft, Beruf, Material, Charakter"},{"f":"estar – Grundbedeutung","b":"Wo und wie etwas ist: Ort, Zustand, Ergebnis"},{"f":"Beruf mit ser – Artikel?","b":"Nein: Es enfermera. Aber mit Adjektiv: Es una enfermera estupenda."},{"f":"vorübergehender Job","b":"estar de + Beruf: Este verano está de socorrista."},{"f":"Uhrzeit","b":"ser: Es la una. Son las tres."},{"f":"Datum (2 Möglichkeiten)","b":"Hoy es 5 de junio. / Estamos a 5 de junio."},{"f":"Besitz","b":"ser de: Este libro es de Clara. ¿De quién es?"},{"f":"Ort einer Veranstaltung","b":"ser: La fiesta es en mi casa."},{"f":"Ort einer Sache/Person","b":"estar: Mi casa está cerca del parque."},{"f":"Passiv (Vorgang) vs. Zustand","b":"La tienda fue cerrada (wurde geschlossen) – La tienda está cerrada (ist geschlossen)"},{"f":"Verlaufsform","b":"estar + gerundio: Estamos cenando."},{"f":"bien / mal – ser oder estar?","b":"Immer estar: Está bien. Estoy mal."},{"f":"tot sein","b":"estar muerto (trotz Endgültigkeit)"},{"f":"ser listo / estar listo","b":"klug sein / fertig, bereit sein"},{"f":"ser aburrido / estar aburrido","b":"langweilig sein / sich langweilen"},{"f":"ser malo / estar malo","b":"schlecht, böse sein / krank sein (Essen: verdorben)"},{"f":"ser rico / estar rico","b":"reich sein / lecker sein"},{"f":"ser verde / estar verde","b":"grün sein / unreif, unerfahren sein"},{"f":"ser despierto / estar despierto","b":"aufgeweckt sein / wach sein"},{"f":"ser cansado / estar cansado","b":"anstrengend sein / müde sein"},{"f":"contento – ser oder estar?","b":"Immer estar: Estoy muy contento."},{"f":"hay vs. estar","b":"hay + unbestimmt (Hay un banco) – estar + bestimmt (El banco está…)"},{"f":"„Es waren viele Leute da.“","b":"Había mucha gente. (hay immer Singular, nie *habían)"},{"f":"hay que + Infinitiv","b":"man muss: Hay que reservar."},{"f":"hay que vs. tener que","b":"unpersönlich (man muss) – persönlich (ich muss: Tengo que reservar)"},{"f":"no hay que + Infinitiv","b":"man muss nicht / man sollte nicht: No hay que pagar."}],"id":"k13"},{"nr":12,"title":"Die Vergangenheit I: pretérito perfecto und indefinido","teil":"Das Verb und seine Ergänzungen","intro":"Das Spanische unterscheidet genau zwischen Vergangenem, das noch zur Gegenwart gehört (perfecto), und abgeschlossenen Ereignissen (indefinido). Hier lernst du beide Zeiten mit allen wichtigen unregelmäßigen Formen und wann du welche verwendest.","sections":[{"h":"Pretérito perfecto: Bildung","html":"<p>Das <em>pretérito perfecto<\/em> wird aus dem Präsens von <em>haber<\/em> + Partizip gebildet. Das Partizip endet auf <em>-ado<\/em> (-ar) bzw. <em>-ido<\/em> (-er/-ir) und bleibt unverändert.<\/p><table><tr><th><\/th><th>haber<\/th><th>+ Partizip<\/th><\/tr><tr><td>yo<\/td><td><em>he<\/em><\/td><td><em>viajado<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>has<\/em><\/td><td><em>comido<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>ha<\/em><\/td><td><em>salido<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>hemos<\/em><\/td><td><em>terminado<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>habéis<\/em><\/td><td><em>bebido<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>han<\/em><\/td><td><em>subido<\/em><\/td><\/tr><\/table><p>Endet der Stamm auf <em>a<\/em>, <em>e<\/em> oder <em>o<\/em>, trägt das <em>-ído<\/em> einen Akzent: <em>leer → leído, creer → creído, traer → traído, caer → caído, oír → oído<\/em>.<\/p><p>Pronomen und Verneinung stehen <b>vor<\/b> <em>haber<\/em>: <em>No se lo he contado a nadie.<\/em> <small>Ich habe es niemandem erzählt.<\/small><\/p><div class=\"warn\">Achtung: Immer <em>haber<\/em>, nie <em>ser<\/em>: <em>Hemos llegado<\/em> (wir sind angekommen). Und das Partizip bleibt unverändert: <em>Mis hermanas han venido<\/em> (nicht <em>*venidas<\/em>).<\/div>"},{"h":"Unregelmäßige Partizipien","html":"<table><tr><th>Infinitiv<\/th><th>Partizip<\/th><th>Deutsch<\/th><\/tr><tr><td><em>hacer<\/em><\/td><td><em>hecho<\/em><\/td><td>gemacht<\/td><\/tr><tr><td><em>decir<\/em><\/td><td><em>dicho<\/em><\/td><td>gesagt<\/td><\/tr><tr><td><em>ver<\/em><\/td><td><em>visto<\/em><\/td><td>gesehen<\/td><\/tr><tr><td><em>poner<\/em><\/td><td><em>puesto<\/em><\/td><td>gestellt, gelegt<\/td><\/tr><tr><td><em>escribir<\/em><\/td><td><em>escrito<\/em><\/td><td>geschrieben<\/td><\/tr><tr><td><em>abri
