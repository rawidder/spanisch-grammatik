rmalerweise esse ich um zwei.<\/p><div class=\"warn\">Achtung: Zwischen <em>haber<\/em> und Partizip darf nichts stehen: <em>*He siempre vivido aquí<\/em> ist falsch → <em>Siempre he vivido aquí<\/em> oder <em>He vivido aquí siempre<\/em>. <\/div><div class=\"tip\">Ein kurzes direktes Objekt folgt meist direkt auf das Verb, das Adverb danach: <em>Leo el periódico a menudo.<\/em> (<em>Leo a menudo el periódico<\/em> ist möglich, betont aber das Adverb.)<\/div>"},{"h":"Steigerung des Adverbs","html":"<p>Adverbien steigert man mit <em>más / menos … que<\/em>:<br><em>Ana corre más rápido que yo.<\/em> – Ana läuft schneller als ich.<br><em>Hoy hemos trabajado menos que ayer.<\/em><\/p><p>Unregelmäßig:<\/p><table><tr><th>Grundform<\/th><th>Komparativ<\/th><\/tr><tr><td><em>bien<\/em> gut<\/td><td><em>mejor<\/em> besser<\/td><\/tr><tr><td><em>mal<\/em> schlecht<\/td><td><em>peor<\/em> schlechter<\/td><\/tr><tr><td><em>mucho<\/em> viel<\/td><td><em>más<\/em> mehr<\/td><\/tr><tr><td><em>poco<\/em> wenig<\/td><td><em>menos<\/em> weniger<\/td><\/tr><\/table><p><em>Ahora duermo mejor.<\/em> – Jetzt schlafe ich besser.<\/p><p><b>„So … wie möglich“:<\/b> <em>lo + Komparativ + posible<\/em><br><em>Llámame lo antes posible.<\/em> – Ruf mich so bald wie möglich an.<br><em>Ven lo más rápido posible.<\/em> – Komm so schnell wie möglich.<\/p><p><b>Elativ (sehr):<\/b> mit <em>-ísimo<\/em> bzw. <em>muchísimo<\/em>:<br><em>Te quiero muchísimo.<\/em> – Ich liebe dich sehr, sehr.<br><em>Llegamos tardísimo.<\/em> – Wir kamen sehr spät an.<br><em>Se fue rapidísimo.<\/em> – Er ging blitzschnell.<\/p><div class=\"warn\">Achtung: Nicht <em>*más bien<\/em> für „besser“ – das bedeutet „eher“: <em>Es más bien tímido.<\/em> – Er ist eher schüchtern. „Besser“ = <em>mejor<\/em>.<\/div>"},{"h":"muy oder mucho?","html":"<table><tr><th>Wort<\/th><th>steht bei …<\/th><th>Beispiel<\/th><\/tr><tr><td><em>muy<\/em><\/td><td>Adjektiv, Adverb<\/td><td><em>muy guapo, muy bien<\/em><\/td><\/tr><tr><td><em>mucho<\/em> (unveränd.)<\/td><td>Verb<\/td><td><em>Llueve mucho.<\/em><\/td><\/tr><tr><td><em>mucho/a/os/as<\/em><\/td><td>Substantiv<\/td><td><em>muchas flores<\/em><\/td><\/tr><\/table><p><b>Sonderfälle:<\/b> Vor <em>más, menos, mejor, peor, mayor, menor, antes, después<\/em> steht <em>mucho<\/em>:<br><em>Es mucho mejor así.<\/em> – So ist es viel besser.<br><em>Llegó mucho antes.<\/em> – Er kam viel früher.<\/p><p>Allein (ohne folgendes Wort) steht immer <em>mucho<\/em>: <em>– ¿Estás cansado? – Sí, mucho.<\/em> – Ja, sehr.<\/p><p>Bei Ausdrücken mit <em>tener<\/em> + Substantiv steht <em>mucho/a<\/em>, weil es sich auf das Substantiv bezieht: <em>Tengo mucha hambre / mucho frío / mucho sueño.<\/em> – Ich habe großen Hunger / mir ist sehr kalt / ich bin sehr müde.<\/p><div class=\"warn\">Achtung: <em>*Tengo muy hambre<\/em> und <em>*Me gusta muy<\/em> sind falsch → <em>Tengo mucha hambre<\/em>, <em>Me gusta mucho<\/em>.<\/div>"},{"h":"bueno / bien – malo / mal","html":"<p><em>bueno<\/em> und <em>malo<\/em> sind <b>Adjektive<\/b> (beschreiben ein Substantiv, veränderlich), <em>bien<\/em> und <em>mal<\/em> sind <b>Adverbien<\/b> (beschreiben ein Verb, unveränderlich).<\/p><p><em>Es una buena cocinera.<\/em> – Sie ist eine gute Köchin.<br><em>Cocina bien.<\/em> – Sie kocht gut.<br><em>Hace mal tiempo.<\/em> – Es ist schlechtes Wetter. (<em>malo<\/em> → <em>mal<\/em> vor mask. Sg.!)<br><em>Me siento mal.<\/em> – Ich fühle mich schlecht.<\/p><p>Mit <em>ser<\/em> und <em>estar<\/em>:<\/p><p><em>El libro es bueno.<\/em> – Das Buch ist gut (Qualität).<br><em>Está bien.<\/em> – Es ist in Ordnung / Es geht ihm gut.<br><em>La sopa está buena.<\/em> – Die Suppe schmeckt gut.<br><em>Estoy mal.<\/em> – Mir geht es schlecht.<\/p><div class=\"warn\">Achtung: Das deutsche „gut“ ist Adjektiv und Adverb zugleich – im Spanischen nicht! „Du sprichst gut Spanisch“ = <em>Hablas bien español<\/em>, nie <em>*Hablas bueno<\/em>.<\/div><div class=\"tip\"><em>buen<\/em> / <em>mal<\/em> (verkürzt) stehen vor maskulinem Singular: <em>un buen plan, un mal día<\/em>. Das Adverb <em>mal<\/em> sieht gleich aus – der Platz verrät die Funktion.<\/div>"}],"exercises":[{"type":"gap","title":"Adverbien auf -mente","task":"Bilde das Adverb aus dem Adjektiv in Klammern.","items":[{"q":"El abuelo camina (lento) ___.","a":["lentamente"],"de":"Der Großvater geht langsam."},{"q":"Resolvió el problema (fácil) ___.","a":["fácilmente"],"de":"Er hat das Problem leicht gelöst."},{"q":"(último) ___ duermo muy poco.","a":["Últimamente"],"de":"In letzter Zeit schlafe ich sehr wenig."},{"q":"Nos saludó (amable) ___.","a":["amablemente"],"de":"Er hat uns freundlich gegrüßt."},{"q":"Salieron (rápido) ___ del edificio.","a":["rápidamente"],"de":"Sie verließen schnell das Gebäude."},{"q":"(feliz) ___, el accidente no fue grave.","a":["Felizmente"],"de":"Glücklicherweise war der Unfall nicht schlimm."},{"q":"Explicó el ejercicio clara y (paciente) ___.","a":["pacientemente"],"de":"Sie erklärte die Übung deutlich und geduldig."},{"q":"Hay que leer el contrato (atento) ___ y despacio.","a":["atentamente"],"de":"Man muss den Vertrag aufmerksam und langsam lesen."},{"q":"Habla (lento) ___ y claramente. (Reihung: -mente nur einmal)","a":["lenta"],"de":"Sie spricht langsam und deutlich."}]},{"type":"choice","title":"Zeit- und Ortsadverbien","task":"Wähle das passende Adverb.","items":[{"q":"Mañana tengo que levantarme ___ para coger el tren de las seis.","options":["temprano","pronto","tarde"],"a":0,"why":"früh am Tag = temprano."},{"q":"¡Hasta ___! Nos vemos la semana que viene.","options":["temprano","pronto","ya"],"a":1,"why":"Bis bald = hasta pronto."},{"q":"___ no ha llegado el paquete.","options":["Aun","Aún","Ya"],"a":1,"why":"noch nicht = aún no (mit Akzent)."},{"q":"Trabaja mucho; ___ los domingos abre la tienda.","options":["aún","aun","ya"],"a":1,"why":"sogar = aun (ohne Akzent)."},{"q":"– ¿Dónde están mis gafas? – ___, a tu lado, en la mesa.","options":["Ahí","Allí","Allá"],"a":0,"why":"beim Angesprochenen: ahí."},{"q":"Vivimos muy cerca ___ colegio.","options":["del","al","–"],"a":0,"why":"cerca + de + Bezugswort."},{"q":"¿Ya has terminado? – No, ___ no.","options":["ya","todavía","nunca"],"a":1,"why":"noch nicht = todavía no."},{"q":"No he estado ___ en Japón.","options":["siempre","nunca","ya"],"a":1,"why":"Verneinung: no … nunca."}]},{"type":"gap","title":"Adverbiale Ausdrücke","task":"Setze den passenden Ausdruck ein (Hinweis in Klammern).","items":[{"q":"___ se puso a llover y nos mojamos. (plötzlich)","a":["De repente"],"de":"Plötzlich fing es an zu regnen, und wir wurden nass."},{"q":"Voy al teatro ___. (ab und zu)","a":["de vez en cuando"],"de":"Ich gehe ab und zu ins Theater."},{"q":"¡___ has llegado! Te esperábamos hace horas. (endlich)","a":["Por fin"],"de":"Endlich bist du da! Wir haben seit Stunden auf dich gewartet."},{"q":"Espera, vuelvo ___. (sofort)","a":["enseguida","en seguida"],"de":"Warte, ich bin gleich zurück."},{"q":"Perdona, te he pisado ___. (aus Versehen)","a":["sin querer"],"de":"Entschuldige, ich bin dir aus Versehen auf den Fuß getreten."},{"q":"Mis padres van ___ al cine, casi cada semana. (oft)","a":["a menudo"],"de":"Meine Eltern gehen oft ins Kino, fast jede Woche."},{"q":"___ me olvido de las llaves, pero no siempre. (manchmal)","a":["A veces"],"de":"Manchmal vergesse ich die Schlüssel, aber nicht immer."},{"q":"En la clase de yoga hay que respirar ___. (tief)","a":["hondo"],"de":"Im Yogakurs muss man tief atmen."},{"q":"Si quieres aprobar, tienes que trabajar ___. (hart)","a":["duro"],"de":"Wenn du bestehen willst, musst du hart arbeiten."}]},{"type":"choice","title":"muy oder mucho?","task":"Wähle muy oder die richtige Form von mucho.","items":[{"q":"Este restaurante es ___ caro.","options":["muy","mucho"],"a":0,"why":"Vor Adjektiv: muy."},{"q":"Mi hermano viaja ___.","options":["muy","mucho"],"a":1,"why":"Beim Verb: mucho."},{"q":"Hoy me encuentro ___ mejor.","options":["muy","mucho"],"a":1,"why":"Vor mejor: mucho."},{"q":"Tengo ___ sed.","options":["muy","mucho","mucha"],"a":2,"why":"sed ist ein feminines Substantiv: mucha."},{"q":"– ¿Te ha gustado la exposición? – Sí, ___.","options":["muy","mucho"],"a":1,"why":"Allein stehend: mucho."},{"q":"Lo has hecho ___ bien.","options":["muy","mucho"],"a":0,"why":"Vor Adverb: muy."},{"q":"Llegaron ___ antes que nosotros.","options":["muy","mucho"],"a":1,"why":"Vor antes: mucho."},{"q":"En agosto hace ___ calor en Sevilla.","options":["muy","mucho","mucha"],"a":1,"why":"calor ist maskulin: mucho calor."},{"q":"Mi abuela es ___ mayor que mi abuelo.","options":["muy","mucho"],"a":1,"why":"Vor dem Komparativ mayor: mucho."}]},{"type":"choice","title":"bueno/bien, malo/mal","task":"Wähle die richtige Form.","items":[{"q":"Carlos toca el piano muy ___.","options":["bueno","bien"],"a":1,"why":"Beschreibt das Verb: bien."},{"q":"Es un ___ médico.","options":["bueno","buen","bien"],"a":1,"why":"Adjektiv vor mask. Sg.: buen."},{"q":"Estas fresas están muy ___.","options":["buenas","bien","buenos"],"a":0,"why":"estar + bueno = gut schmecken, angeglichen an fresas."},{"q":"Anoche dormí ___ por el ruido.","options":["malo","mal","mala"],"a":1,"why":"Beschreibt das Verb: mal."},{"q":"Hoy hace ___ día para ir a la playa.","options":["mal","malo","mala"],"a":0,"why":"malo vor mask. Sg. → mal."},{"q":"– ¿Qué tal tu madre? – Está ___, gracias.","options":["buena","bien"],"a":1,"why":"Befinden: estar bien."},{"q":"Esta película es ___; no la recomiendo.","options":["mal","mala"],"a":1,"why":"ser + Adjektiv, angeglichen: mala."},{"q":"Hablas español mucho ___ que el año pasado.","options":["más bien","mejor","más bueno"],"a":1,"why":"Komparativ von bien: mejor."}]},{"type":"choice","title":"Stellung und Steigerung","task":"Welcher Satz ist korrekt?","items":[{"q":"Ich habe immer hier gewohnt.","options":["He siempre vivido aquí.","Siempre he vivido aquí.","He vivido siempre aquí siempre."],"a":1,"why":"Kein Adverb zwischen haber und Partizip."},{"q":"Antworte so bald wie möglich.","options":["Contesta lo antes posible.","Contesta tan antes como posible.","Contesta más antes posible."],"a":0,"why":"lo + Komparativ + posible."},{"q":"Sie singt besser als ich.","options":["Canta más bien que yo.","Canta mejor que yo.","Canta más buena que yo."],"a":1,"why":"bien → mejor."},{"q":"Er fährt sehr schnell.","options":["Conduce muy rápidamente.","Conduce mucho rápido.","Conduce muy rápidos."],"a":0,"why":"muy vor Adverb; auch muy rápido wäre möglich."},{"q":"Sprecht leise, das Baby schläft.","options":["Hablad bajos, el bebé duerme.","Hablad bajo, el bebé duerme.","Hablad bajamente, el bebé duerme."],"a":1,"why":"Adjektiv als Adverb bleibt unverändert: bajo."},{"q":"Er hat deutlich und höflich gesprochen.","options":["Ha hablado claromente y cortésmente.","Ha hablado clara y cortésmente.","Ha hablado claramente y cortés."],"a":1,"why":"Bei Reihung -mente nur am letzten Adverb, davor Femininform."},{"q":"Ich vermisse dich sehr, sehr.","options":["Te echo de menos muchísimo.","Te echo de menos muyísimo.","Te echo de menos muy mucho."],"a":0,"why":"Elativ von mucho: muchísimo."},{"q":"Er ist eher zurückhaltend.","options":["Es mejor reservado.","Es más bien reservado.","Es más bueno reservado."],"a":1,"why":"más bien = eher."}]}],"cards":[{"f":"Bildung -mente","b":"feminine Form + -mente: lenta → lentamente"},{"f":"rápido / fácil → Adverb","b":"rápidamente / fácilmente (Akzent bleibt)"},{"f":"deutlich und langsam (2 Adverbien)","b":"clara y lentamente"},{"f":"in letzter Zeit","b":"últimamente"},{"f":"aún ↔ aun","b":"aún = noch (todavía); aun = sogar (incluso)"},{"f":"früh (am Morgen) / bald","b":"temprano / pronto"},{"f":"nie / niemals","b":"nunca / jamás"},{"f":"aquí – ahí – allí","b":"hier – da (bei dir) – dort"},{"f":"acá / allá","b":"hierher / dorthin (weniger genau, Richtung)"},{"f":"nahe am / weit vom Zentrum","b":"cerca del / lejos del centro"},{"f":"oft / manchmal / ab und zu","b":"a menudo / a veces / de vez en cuando"},{"f":"plötzlich","b":"de repente"},{"f":"sofort, gleich","b":"enseguida / en seguida"},{"f":"endlich ↔ am Ende","b":"por fin ↔ al final"},{"f":"aus Versehen","b":"sin querer"},{"f":"laut / leise sprechen","b":"hablar alto / bajo (unveränderlich)"},{"f":"hart arbeiten","b":"trabajar duro"},{"f":"haber + Adverb + Partizip?","b":"Nie: Siempre he vivido aquí."},{"f":"bien / mal – Komparativ","b":"mejor / peor"},{"f":"so bald wie möglich","b":"lo antes posible"},{"f":"so schnell wie möglich","b":"lo más rápido posible"},{"f":"sehr viel / sehr spät","b":"muchísimo / tardísimo"},{"f":"muy oder mucho?","b":"muy + Adj./Adv.; mucho + Verb/Subst.; mucho + mejor/más/antes"},{"f":"Ich habe großen Hunger.","b":"Tengo mucha hambre. (nicht *muy hambre)"},{"f":"– ¿Te gusta? – Ja, sehr.","b":"Sí, mucho."},{"f":"bueno ↔ bien","b":"Adjektiv (Substantiv) ↔ Adverb (Verb)"},{"f":"Du sprichst gut Spanisch.","b":"Hablas bien español."},{"f":"La sopa está buena.","b":"Die Suppe schmeckt gut."},{"f":"más bien","b":"eher (nicht „besser“)"}],"id":"k10"},{"nr":24,"title":"Konjunktionen und Satzbau","teil":"Der Satz","intro":"Konjunktionen verbinden Sätze und entscheiden oft, ob Indikativ oder subjuntivo folgt. Dazu kommen die Regeln für Wortstellung, Verneinung und Hervorhebung, die sich deutlich vom Deutschen unterscheiden.","sections":[{"h":"Beiordnende Konjunktionen: y, o, ni, pero","html":"<p>Beiordnende Konjunktionen verbinden gleichrangige Wörter oder Sätze.<\/p><table><tr><th>Konj.<\/th><th>Deutsch<\/th><th>Beispiel<\/th><\/tr><tr><td><em>y<\/em><\/td><td>und<\/td><td><em>pan y queso<\/em><\/td><\/tr><tr><td><em>o<\/em><\/td><td>oder<\/td><td><em>¿Té o café?<\/em><\/td><\/tr><tr><td><em>ni … ni<\/em><\/td><td>weder … noch<\/td><td><em>No como ni carne ni pescado.<\/em><\/td><\/tr><tr><td><em>pero<\/em><\/td><td>aber<\/td><td><em>Es caro, pero vale la pena.<\/em><\/td><\/tr><\/table><p><b>Lautregeln<\/b> (zwei gleiche Vokale sollen nicht verschmelzen):<\/p><ul><li><b>y → e<\/b> vor gesprochenem i: <em>madre e hija, Pablo e Inés, geografía e historia<\/em>.<br>Aber vor Diphthong <em>hie-/hia-<\/em> bleibt y: <em>nieve y hielo<\/em>.<\/li><li><b>o → u<\/b> vor gesprochenem o: <em>siete u ocho, mujeres u hombres, ayer u hoy<\/em>.<\/li><\/ul><div class=\"tip\">Zwischen Ziffern schreibt man seit 2010 <em>o<\/em> ohne Akzent: <em>3 o 4 días<\/em>.<\/div>"},{"h":"pero, sino, sino que","html":"<p>Beide bedeuten „aber/sondern“, sind aber nicht austauschbar:<\/p><ul><li><b>pero<\/b> = aber (Einschränkung, beide Aussagen gelten): <em>No es barato, pero me lo compro.<\/em> – Es ist nicht billig, aber ich kaufe es mir.<\/li><li><b>sino<\/b> = sondern (nach Verneinung, <b>ersetzt<\/b> das Verneinte): <em>No es barato, sino carísimo.<\/em> – Es ist nicht billig, sondern sehr teuer.<\/li><li><b>sino que<\/b> vor einem <b>konjugierten Verb<\/b>: <em>No lo compré, sino que me lo regalaron.<\/em> – Ich habe es nicht gekauft, sondern es wurde mir geschenkt.<\/li><\/ul><p><em>no solo … sino (también)<\/em> = nicht nur … sondern auch: <em>Habla no solo inglés, sino también chino.<\/em><\/p><div class=\"tip\">Test: Kann man im Deutschen „sondern“ sagen? Dann <em>sino<\/em> (bzw. <em>sino que<\/em> vor Verb). Sonst <em>pero<\/em>.<\/div><div class=\"warn\">Achtung: Italienisch <em>ma<\/em> deckt beides ab, Spanisch trennt streng. „No es rojo, pero verde“ ist falsch – richtig: <em>No es rojo, sino verde.<\/em><\/div>"},{"h":"Erklären und folgern","html":"<table><tr><th>Spanisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>o sea<\/em><\/td><td>also, das heißt (umgangssprachlich)<\/td><\/tr><tr><td><em>es decir<\/em><\/td><td>das heißt<\/td><\/tr><tr><td><em>así que<\/em><\/td><td>also, sodass<\/td><\/tr><tr><td><em>por lo tanto / por tanto<\/em><\/td><td>folglich, daher (gehoben)<\/td><\/tr><tr><td><em>por eso<\/em><\/td><td>deshalb<\/td><\/tr><\/table><ul><li><em>Vuelvo el 2 de mayo, es decir, dentro de dos semanas.<\/em><\/li><li><em>Mañana no hay clase, o sea que podemos dormir más.<\/em><\/li><li><em>Ha perdido el autobús, así que llegará tarde.<\/em> – Er hat den Bus verpasst, also kommt er zu spät.<\/li><li><em>Los datos no son fiables; por lo tanto, hay que repetir el estudio.<\/em><\/li><\/ul><div class=\"warn\">Achtung: Deutsches „also“ ist nicht immer <em>así que<\/em>. Als Füllwort am Satzanfang („Also, …“) sagt man <em>bueno, …<\/em> oder <em>pues …<\/em>.<\/div>"},{"h":"Unterordnende Konjunktionen mit Indikativ","html":"<p>Diese Konjunktionen leiten Nebensätze mit Tatsachen ein – sie stehen mit dem <b>Indikativ<\/b>:<\/p><table><tr><th>Konj.<\/th><th>Deutsch<\/th><th>Beispiel<\/th><\/tr><tr><td><em>porque<\/em><\/td><td>weil<\/td><td><em>Me quedo porque estoy cansado.<\/em><\/td><\/tr><tr><td><em>como<\/em><\/td><td>da (am Satzanfang)<\/td><td><em>Como hacía frío, encendimos la chimenea.<\/em><\/td><\/tr><tr><td><em>ya que / puesto que<\/em><\/td><td>da ja<\/td><td><em>Ya que estás aquí, ayúdame.<\/em><\/td><\/tr><tr><td><em>si<\/em><\/td><td>wenn, falls<\/td><td><em>Si tienes tiempo, llámame.<\/em><\/td><\/tr><tr><td><em>mientras<\/em><\/td><td>während<\/td><td><em>Mientras cocino, escucho la radio.<\/em><\/td><\/tr><tr><td><em>cuando<\/em><\/td><td>wenn, als<\/td><td><em>Cuando llueve, me quedo en casa.<\/em><br><em>Cuando era pequeña, vivía en Soria.<\/em><\/td><\/tr><tr><td><em>desde que<\/em><\/td><td>seit(dem)<\/td><td><em>Desde que hago yoga, duermo mejor.<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: <em>porque<\/em> steht normalerweise nicht am Satzanfang (Ausnahme: Antwort auf <em>¿por qué?<\/em>). Begründung vorne → <em>como<\/em>: <em>Como no tenía llave, esperé fuera.<\/em><\/div><div class=\"warn\">Achtung: Nach <em>si<\/em> (wenn/falls) nie Futur und nie subjuntivo presente: <em>Si llueve mañana, nos quedamos.<\/em> – nicht „si lloverá“.<\/div><p><em>cuando<\/em> mit Indikativ für Gewohnheiten (Gegenwart) und Vergangenes; zur Zukunft siehe unten.<\/p>"},{"h":"Unterordnende Konjunktionen mit subjuntivo","html":"<p>Diese Konjunktionen drücken Zweck, Bedingung oder etwas noch nicht Eingetretenes aus und verlangen den <b>subjuntivo<\/b>:<\/p><table><tr><th>Konj.<\/th><th>Deutsch<\/th><\/tr><tr><td><em>para que / a fin de que<\/em><\/td><td>damit<\/td><\/tr><tr><td><em>antes de que<\/em><\/td><td>bevor<\/td><\/tr><tr><td><em>sin que<\/em><\/td><td>ohne dass<\/td><\/tr><tr><td><em>a menos que<\/em><\/td><td>es sei denn<\/td><\/tr><tr><td><em>con tal de que<\/em><\/td><td>vorausgesetzt, dass<\/td><\/tr><tr><td><em>siempre que<\/em><\/td><td>sofern <small>(mit Indikativ: „jedes Mal wenn“, s. u.)<\/small><\/td><\/tr><\/table><ul><li><em>Te dejo las llaves para que puedas entrar.<\/em> – … damit du hineinkannst.<\/li><li><em>Vámonos antes de que empiece a llover.<\/em><\/li><li><em>Salió sin que nadie lo viera.<\/em> – Er ging hinaus, ohne dass ihn jemand sah.<\/li><li><em>Iremos al lago, a menos que haga mal tiempo.<\/em><\/li><li><em>Puedes usar mi portátil con tal de que lo cuides.<\/em><\/li><\/ul><div class=\"tip\">Bei <b>gleichem Subjekt<\/b> nimmt man Präposition + Infinitiv: <em>Llamo antes de ir.<\/em> / <em>Llamo antes de que vayas.<\/em> – ebenso <em>para / para que, sin / sin que<\/em>.<\/div><div class=\"warn\">Achtung: <em>siempre que<\/em> + Indikativ heißt „jedes Mal wenn“: <em>Siempre que viene, trae vino.<\/em> Mit subjuntivo = „sofern“: <em>Te ayudo siempre que me avises antes.<\/em><\/div>"},{"h":"Indikativ oder subjuntivo – je nach Bedeutung","html":"<p>Bei diesen Konjunktionen entscheidet die Bedeutung: <b>Tatsache/Gewohnheit/Vergangenheit → Indikativ<\/b>, <b>Zukunft/Hypothese → subjuntivo<\/b>.<\/p><table><tr><th>Konj.<\/th><th>Indikativ<\/th><th>subjuntivo<\/th><\/tr><tr><td><em>cuando<\/em><\/td><td><em>Cuando llego, ceno.<\/em><br><small>(immer wenn)<\/small><\/td><td><em>Cuando llegue, cenaré.<\/em><br><small>(sobald, Zukunft)<\/small><\/td><\/tr><tr><td><em>en cuanto<\/em><\/td><td><em>En cuanto lo vi, lo supe.<\/em><\/td><td><em>En cuanto lo sepa, te aviso.<\/em><\/td><\/tr><tr><td><em>hasta que<\/em><\/td><td><em>Esperé hasta que salió.<\/em><\/td><td><em>Espera hasta que salga.<\/em><\/td><\/tr><tr><td><em>después de que<\/em><\/td><td><em>Después de que se fueron, limpiamos.<\/em><\/td><td><em>Después de que se vayan, limpiaremos.<\/em><\/td><\/tr><tr><td><em>aunque<\/em><\/td><td><em>Aunque llueve, salgo.<\/em><br><small>obwohl es regnet<\/small><\/td><td><em>Aunque llueva, saldré.<\/em><br><small>selbst wenn es regnet<\/small><\/td><\/tr><tr><td><em>de modo que<\/em><\/td><td><em>Habló alto, de modo que todos lo oyeron.<\/em><br><small>sodass (Folge)<\/small><\/td><td><em>Habla alto, de modo que todos te oigan.<\/em><br><small>damit (Absicht)<\/small><\/td><\/tr><tr><td><em>mientras<\/em><\/td><td><em>Mientras comemos, charlamos.<\/em><br><small>während<\/small><\/td><td><em>Mientras no pagues, no hay entrada.<\/em><br><small>solange<\/small><\/td><\/tr><\/table><div class=\"warn\">Achtung: Nach <em>cuando<\/em> (Zeit) nie Futur: <em>Cuando tenga dinero, viajaré.<\/em> – nicht „cuando tendré“. Nur das Fragewort <em>cuándo<\/em> (auch in indirekten Fragen) verträgt das Futur: <em>¿Cuándo vendrás?<\/em> / <em>No sé cuándo vendrá.<\/em><\/div><div class=\"tip\">Nach <em>después de que<\/em> findet man in der Pressesprache auch bei Vergangenem den subjuntivo auf -ra: <em>después de que el tribunal publicara la sentencia<\/em>.<\/div>"},{"h":"Wortstellung","html":"<p>Grundmuster ist <b>Subjekt – Verb – Objekt<\/b>: <em>Mi vecina riega las plantas.<\/em> Das Subjekt kann wegfallen, weil die Verbendung die Person zeigt: <em>Riego las plantas.<\/em><\/p><p><b>Freie Stellung<\/b>: Es gibt keine Verbzweitstellung wie im Deutschen. Zeitangaben können vorn oder hinten stehen, ohne dass sich etwas umstellt:<\/p><ul><li><em>Mañana mi hermano empieza a trabajar.<\/em> = <em>Mi hermano empieza a trabajar mañana.<\/em><\/li><\/ul><p><b>Subjekt nach dem Verb<\/b> ist normal, wenn das Subjekt die neue Information ist, besonders bei:<\/p><ul><li><em>gustar, encantar, interesar, doler, faltar<\/em>: <em>Me encantan las fresas.<\/em> (Subjekt: <em>las fresas<\/em>) – <em>Me duele la cabeza.<\/em><\/li><li>Verben des Erscheinens/Geschehens: <em>Ha llegado tu paquete.<\/em> – <em>Llegó el invierno.<\/em> – <em>Ocurrió un accidente.<\/em><\/li><\/ul><p><b>Fragen<\/b>: Nach einem Fragewort steht das Verb direkt dahinter, das Subjekt danach: <em>¿Dónde trabaja tu padre?<\/em> (nicht „¿Dónde tu padre trabaja?“). Ja/Nein-Fragen brauchen keine Umstellung – die Satzmelodie genügt: <em>¿Tu padre trabaja en Bonn?<\/em> = <em>¿Trabaja tu padre en Bonn?<\/em><\/p><div class=\"warn\">Achtung: Zwischen <em>haber<\/em> und Partizip darf nichts stehen: <em>Siempre he vivido aquí.<\/em> / <em>He vivido aquí siempre.<\/em> – nicht „he siempre vivido“.<\/div><div class=\"warn\">Achtung: Keine Verbendstellung im Nebensatz: <em>… porque mi hermano no tiene tiempo.<\/em><\/div>"},{"h":"Verneinung","html":"<p><b>no<\/b> steht vor dem konjugierten Verb – und vor Objektpronomen: <em>No lo sé.<\/em> – <em>No me gusta.<\/em><\/p><p><b>Doppelte Verneinung<\/b> ist Pflicht, wenn das Negativwort <b>nach<\/b> dem Verb steht. Steht es <b>davor<\/b>, fällt <em>no<\/em> weg:<\/p><table><tr><th>nach dem Verb<\/th><th>vor dem Verb<\/th><\/tr><tr><td><em>No viene nadie.<\/em><\/td><td><em>Nadie viene.<\/em><\/td><\/tr><tr><td><em>No voy nunca al gimnasio.<\/em><\/td><td><em>Nunca voy al gimnasio.<\/em><\/td><\/tr><tr><td><em>No me gusta tampoco.<\/em><\/td><td><em>Tampoco me gusta.<\/em><\/td><\/tr><tr><td><em>No he comprado nada.<\/em><\/td><td><em>Nada me parece bien.<\/em><\/td><\/tr><\/table><ul><li>„kein“: <em>No tengo coche.<\/em> / betont: <em>No tengo ningún problema.<\/em><\/li><li><em>ni … ni<\/em>: <em>No hablo ni ruso ni árabe.<\/em> – <em>ni siquiera<\/em> = nicht einmal.<\/li><li><em>ya no<\/em> = nicht mehr: <em>Ya no fumo.<\/em> – <em>todavía no / aún no<\/em> = noch nicht.<\/li><li><em>no … más que<\/em> = nur: <em>No tengo más que diez euros.<\/em><\/li><\/ul><div class=\"warn\">Achtung: „No, ich habe keine Zeit“ → <em>No, no tengo tiempo.<\/em> Das erste <em>no<\/em> ist die Antwort, das zweite verneint das Verb.<\/div>"},{"h":"Hervorhebung","html":"<p>Um einen Satzteil zu betonen, nutzt das Spanische vor allem Satzbau statt Betonung:<\/p><ul><li><b>Spaltsatz mit ser … quien / el que / donde / cuando<\/b>:<br><em>Es Marta quien ha organizado la fiesta.<\/em> – Marta ist es, die die Party organisiert hat.<br><em>Fue en Lisboa donde nos conocimos.<\/em> – In Lissabon haben wir uns kennengelernt.<br><em>Somos nosotros los que pagamos.<\/em><\/li><li><b>Lo que … es<\/b>: <em>Lo que más me gusta es pasear por la playa.<\/em> – Was mir am meisten gefällt, ist am Strand spazieren zu gehen.<br><em>Lo que necesito es un café.<\/em><\/li><li><b>Voranstellung des Objekts<\/b> mit Wiederaufnahme durch Pronomen: <em>El vino lo traigo yo.<\/em> – <em>A tu hermana la vi ayer.<\/em><\/li><li><b>Subjektpronomen<\/b> ans Ende: <em>Hoy pago yo.<\/em> – Heute zahle ich.<\/li><li><b>sí que<\/b> verstärkt: <em>Esto sí que es una sorpresa.<\/em><\/li><\/ul><div class=\"tip\">Im Spaltsatz richtet sich <em>ser<\/em> nach der Person: <em>Fuiste tú quien lo dijo.<\/em> / <em>Soy yo el que llama.<\/em><\/div><div class=\"warn\">Achtung: Steht das direkte Objekt vor dem Verb, muss das Pronomen folgen: <em>Las fotos las hice yo<\/em> – nicht „Las fotos hice yo“.<\/div>"}],"exercises":[{"type":"gap","title":"y/e und o/u","task":"Setze y, e, o oder u ein.","items":[{"q":"Mis abuelos tienen un perro ___ un gato.","a":["y"],"de":"Meine Großeltern haben einen Hund und eine Katze."},{"q":"Invitamos a Carlos ___ Irene.","a":["e"],"de":"Wir laden Carlos und Irene ein."},{"q":"Necesito agujas ___ hilo.","a":["e"],"de":"Ich brauche Nadeln und Faden."},{"q":"¿Vienes hoy ___ mañana? (oder)","a":["o"],"de":"Kommst du heute oder morgen?"},{"q":"Habrá siete ___ ocho personas.","a":["u"],"de":"Es werden sieben oder acht Leute da sein."},{"q":"¿Prefieres plata ___ oro?","a":["u"],"de":"Bevorzugst du Silber oder Gold?"},{"q":"Pon agua ___ hielo en la jarra. (und)","a":["y"],"de":"Gib Wasser und Eis in den Krug."},{"q":"Tenemos que decidir ahora ___ nunca. (oder)","a":["o"],"de":"Wir müssen jetzt oder nie entscheiden."},{"q":"Es un libro de arte ___ historia. (und)","a":["e"],"de":"Es ist ein Buch über Kunst und Geschichte."}]},{"type":"choice","title":"pero, sino oder sino que?","task":"Wähle die richtige Konjunktion.","items":[{"q":"El piso es pequeño, ___ muy luminoso.","options":["pero","sino","sino que"],"a":0,"why":"Einschränkung ohne vorherige Verneinung → pero."},{"q":"No vivo en Madrid, ___ en Alcalá.","options":["pero","sino","sino que"],"a":1,"why":"Verneintes wird ersetzt (sondern) → sino."},{"q":"No me llamó, ___ me escribió un mensaje.","options":["pero","sino","sino que"],"a":2,"why":"Ersetzung vor konjugiertem Verb → sino que."},{"q":"No tengo hambre, ___ me tomaría un café.","options":["pero","sino","sino que"],"a":0,"why":"Beide Aussagen gelten nebeneinander (aber) → pero."},{"q":"No es mi hermano, ___ mi primo.","options":["pero","sino","sino que"],"a":1,"why":"Korrektur nach Verneinung → sino."},{"q":"Este cuadro no solo es bonito, ___ también valioso.","options":["pero","sino","sino que"],"a":1,"why":"no solo … sino también."},{"q":"No lo arreglamos, ___ compramos uno nuevo.","options":["pero","sino","sino que"],"a":2,"why":"sondern + konjugiertes Verb → sino que."},{"q":"No es caro, ___ no lo necesito.","options":["pero","sino","sino que"],"a":0,"why":"Keine Ersetzung, sondern Einschränkung → pero."}]},{"type":"choice","title":"Welche Konjunktion passt?","task":"Wähle die passende Konjunktion.","items":[{"q":"___ no había pan, compré galletas.","options":["Porque","Como","Sino"],"a":1,"why":"Begründung am Satzanfang → como."},{"q":"No salgo hoy ___ tengo fiebre.","options":["porque","como","así que"],"a":0,"why":"Begründung im nachgestellten Nebensatz → porque."},{"q":"Está lloviendo, ___ cogeré el paraguas.","options":["porque","así que","aunque"],"a":1,"why":"Folge → así que."},{"q":"___ estás en la cocina, ¿me traes un vaso?","options":["Ya que","A menos que","Sin que"],"a":0,"why":"Bekannter Grund (da ja) → ya que."},{"q":"Vuelve el 20, ___, dentro de diez días.","options":["es decir","sin embargo","a menos que"],"a":0,"why":"Erklärung/Umformulierung → es decir."},{"q":"___ vivo sola, cocino menos.","options":["Desde que","Antes de que","Para que"],"a":0,"why":"Seitdem + Tatsache → desde que mit Indikativ."},{"q":"Iremos de excursión, ___ llueva.","options":["a menos que","ya que","porque"],"a":0,"why":"Subjuntivo nach „es sei denn“ → a menos que."},{"q":"___ friego los platos, mi pareja barre.","options":["Mientras","Sin que","A fin de que"],"a":0,"why":"Gleichzeitigkeit (während) → mientras + Indikativ."}]},{"type":"gap","title":"Indikativ oder subjuntivo?","task":"Setze das Verb in der richtigen Form ein (Indikativ oder subjuntivo).","items":[{"q":"Cuando (llegar, yo) ___ a casa esta noche, te llamaré.","a":["llegue"],"de":"Wenn ich heute Abend nach Hause komme, rufe ich dich an."},{"q":"Cuando (ser, yo) ___ niña, vivía en Cuenca.","a":["era"],"de":"Als ich ein Kind war, wohnte ich in Cuenca."},{"q":"Salgamos antes de que (empezar) ___ a llover.","a":["empiece"],"de":"Lass uns gehen, bevor es zu regnen anfängt."},{"q":"Como no (tener, nosotros) ___ coche, vamos en tren.","a":["tenemos"],"de":"Da wir kein Auto haben, fahren wir mit dem Zug."},{"q":"Te lo explico otra vez para que lo (entender, tú) ___.","a":["entiendas"],"de":"Ich erkläre es dir noch einmal, damit du es verstehst."},{"q":"Siempre que (venir, ella) ___ a vernos, nos trae dulces. (jedes Mal)","a":["viene"],"de":"Jedes Mal, wenn sie uns besucht, bringt sie Süßigkeiten mit."},{"q":"Puedes salir siempre que (terminar, tú) ___ antes los deberes. (sofern)","a":["termines"],"de":"Du darfst rausgehen, sofern du vorher die Hausaufgaben fertig machst."},{"q":"En cuanto (saber, yo) ___ algo, te aviso.","a":["sepa"],"de":"Sobald ich etwas weiß, sage ich dir Bescheid."},{"q":"Aunque mañana (hacer) ___ frío, iremos a la playa. (selbst wenn)","a":["haga"],"de":"Selbst wenn es morgen kalt ist, fahren wir an den Strand."},{"q":"Aunque (estar, yo) ___ cansado, ahora mismo salgo a correr. (obwohl, Tatsache)","a":["estoy"],"de":"Obwohl ich müde bin, gehe ich jetzt gleich laufen."}]},{"type":"choice","title":"Wortstellung und Verneinung","task":"Welcher Satz ist korrekt?","items":[{"q":"Wo wohnt deine Schwester?","options":["¿Dónde tu hermana vive?","¿Dónde vive tu hermana?"],"a":1,"why":"Nach dem Fragewort folgt direkt das Verb."},{"q":"Ich habe nie geraucht.","options":["He nunca fumado.","Nunca he fumado.","No nunca he fumado."],"a":1,"why":"Nichts zwischen haber und Partizip; Negativwort vor dem Verb ohne no."},{"q":"Niemand hat angerufen.","options":["Nadie ha llamado.","No nadie ha llamado.","Nadie no ha llamado."],"a":0,"why":"Negativwort vor dem Verb → kein zusätzliches no."},{"q":"Ich sehe niemanden.","options":["Veo a nadie.","No veo a nadie.","No veo nadie."],"a":1,"why":"Negativwort nach dem Verb → no davor; a personal vor nadie."},{"q":"Mir tun die Füße weh.","options":["Me duelen los pies.","Me duele los pies.","Los pies me duele."],"a":0,"why":"Subjekt ist los pies (Plural) → duelen."},{"q":"Dein Paket ist angekommen.","options":["Ha llegado tu paquete.","Tu paquete ha llegado.","beide richtig"],"a":2,"why":"Beide Stellungen sind möglich; nachgestelltes Subjekt betont die neue Information."},{"q":"Ich trinke weder Kaffee noch Tee.","options":["No bebo ni café ni té.","Bebo ni café ni té.","No bebo café o té ni."],"a":0,"why":"no + Verb + ni … ni."},{"q":"Ich rauche nicht mehr.","options":["Todavía no fumo.","Ya no fumo.","No fumo ya más nunca."],"a":1,"why":"ya no = nicht mehr; todavía no = noch nicht."}]},{"type":"gap","title":"Hervorhebung","task":"Ergänze das fehlende Wort.","items":[{"q":"___ que más me gusta de Madrid son los parques.","a":["Lo","lo"],"de":"Was mir an Madrid am meisten gefällt, sind die Parks."},{"q":"Fue en Granada ___ nos conocimos.","a":["donde"],"de":"In Granada haben wir uns kennengelernt."},{"q":"Fue en 2015 ___ empecé a estudiar español.","a":["cuando"],"de":"2015 habe ich angefangen, Spanisch zu lernen."},{"q":"Es mi hermana ___ ha preparado la tarta.","a":["quien","la que"],"de":"Meine Schwester ist es, die die Torte gemacht hat."},{"q":"La ensalada ___ preparo yo. (Objektpronomen)","a":["la"],"de":"Den Salat mache ich."},{"q":"(ser) ___ tú quien rompió el vaso, ¿verdad? (indefinido)","a":["Fuiste","fuiste"],"de":"Du warst es, der das Glas zerbrochen hat, oder?"},{"q":"A tus padres no ___ he visto desde Navidad. (Objektpronomen)","a":["los"],"de":"Deine Eltern habe ich seit Weihnachten nicht gesehen."},{"q":"¡Esto ___ que es una buena noticia!","a":["sí"],"de":"Das ist wirklich eine gute Nachricht!"}]}],"cards":[{"f":"und vor i-/hi-","b":"e – padre e hijo, Ana e Isabel (aber: nieve y hielo)"},{"f":"oder vor o-/ho-","b":"u – siete u ocho, mujeres u hombres"},{"f":"pero vs. sino","b":"pero = aber; sino = sondern (nach Verneinung, ersetzt)"},{"f":"sino que","b":"sondern + konjugiertes Verb: No lo compré, sino que lo alquilé."},{"f":"nicht nur … sondern auch","b":"no solo … sino también"},{"f":"weder … noch","b":"ni … ni – No como ni carne ni pescado."},{"f":"das heißt","b":"es decir / o sea (umgangssprachlich)"},{"f":"also, sodass / folglich","b":"así que / por lo tanto"},{"f":"weil / da (am Satzanfang)","b":"porque / como"},{"f":"da ja","b":"ya que / puesto que"},{"f":"seitdem (Konjunktion)","b":"desde que + Indikativ"},{"f":"damit","b":"para que / a fin de que + subjuntivo"},{"f":"bevor (anderes Subjekt)","b":"antes de que + subjuntivo"},{"f":"ohne dass","b":"sin que + subjuntivo"},{"f":"es sei denn","b":"a menos que + subjuntivo"},{"f":"vorausgesetzt, dass","b":"con tal de que / siempre que + subjuntivo"},{"f":"siempre que + Indikativ","b":"jedes Mal wenn"},{"f":"cuando + Zukunft","b":"subjuntivo: Cuando llegues, cenamos. (nie Futur)"},{"f":"aunque + Ind. / + subj.","b":"obwohl (Tatsache) / selbst wenn (hypothetisch)"},{"f":"de modo que + Ind. / + subj.","b":"sodass (Folge) / damit (Absicht)"},{"f":"mientras + subj.","b":"solange: Mientras no pagues, no entras."},{"f":"si + ?","b":"Indikativ (nie Futur, nie subj. presente): Si puedes, ven."},{"f":"Verb vor Subjekt bei …","b":"gustar, doler, faltar, llegar, ocurrir: Me duele la espalda."},{"f":"Fragewort + …","b":"Verb + Subjekt: ¿Qué quiere tu hermano?"},{"f":"Nunca he … / He nunca …?","b":"Nunca he estado allí. (nichts zwischen haber und Partizip)"},{"f":"doppelte Verneinung","b":"No viene nadie. / Nadie viene."},{"f":"nicht mehr / noch nicht","b":"ya no / todavía no (aún no)"},{"f":"Spaltsatz","b":"Es Juan quien… / Fue aquí donde… / Lo que más me gusta es…"}],"id":"k26"},{"nr":25,"title":"Die Präpositionen","teil":"Der Satz","intro":"Präpositionen verbinden Wörter und geben Ort, Zeit, Grund oder Zweck an. Gerade bei a, en und vor allem por/para weicht das Spanische stark vom Deutschen ab – hier entstehen die meisten Fehler.","sections":[{"h":"Überblick und die Präposition a","html":"<p>Spanische Präpositionen decken sich selten eins zu eins mit den deutschen. Lerne sie deshalb immer mit Beispiel. Nach Präpositionen stehen Substantive, Pronomen (<em>mí, ti<\/em> …) oder der <b>Infinitiv<\/b> – nie ein gerundio.<\/p><p><b>a<\/b> drückt vor allem Richtung und Zeitpunkt aus:<\/p><table><tr><th>Gebrauch<\/th><th>Beispiel<\/th><\/tr><tr><td>Richtung, Ziel<\/td><td><em>Mañana vamos a Cádiz.<\/em><br><small>Morgen fahren wir nach Cádiz.<\/small><\/td><\/tr><tr><td>Ankunft<\/td><td><em>Llegué a casa muy tarde.<\/em><br><small>Ich kam sehr spät nach Hause.<\/small><\/td><\/tr><tr><td>Uhrzeit<\/td><td><em>La clase empieza a las nueve.<\/em><br><small>Der Unterricht beginnt um neun.<\/small><\/td><\/tr><tr><td>Entfernung, Preis<\/td><td><em>El pueblo está a diez kilómetros.<\/em><br><em>Las fresas están a tres euros el kilo.<\/em><\/td><\/tr><tr><td>Art und Weise<\/td><td><em>a mano, a pie, a la plancha<\/em><br><small>von Hand, zu Fuß, gegrillt<\/small><\/td><\/tr><tr><td>indirektes Objekt<\/td><td><em>Le mandé un mensaje a Lucía.<\/em><\/td><\/tr><\/table><p><b>a + el = al<\/b>: <em>Vamos al cine.<\/em> (Aber: <em>a él<\/em> – mit Pronomen keine Verschmelzung.)<\/p><p><b>al + Infinitiv<\/b> = „als / beim …“ (gleichzeitig oder unmittelbar davor):<\/p><ul><li><em>Al abrir la puerta, vi que llovía.<\/em> – Als ich die Tür öffnete, sah ich, dass es regnete.<\/li><li><em>Ten cuidado al cruzar la calle.<\/em> – Pass beim Überqueren der Straße auf.<\/li><\/ul><div class=\"warn\">Achtung: <em>llegar a<\/em>, nicht <em>llegar en<\/em>: <em>Llegamos a Sevilla a las seis.<\/em> – Wir kamen um sechs in Sevilla an.<\/div>"},{"h":"Das „a personal“","html":"<p>Ist das <b>direkte Objekt eine bestimmte Person<\/b> (oder ein vertrautes Tier), steht davor <b>a<\/b>. Im Deutschen gibt es dafür keine Entsprechung.<\/p><table><tr><th>mit a<\/th><th>ohne a<\/th><\/tr><tr><td><em>Veo a tu hermano.<\/em><br><small>Ich sehe deinen Bruder.<\/small><\/td><td><em>Veo tu coche.<\/em><br><small>Ich sehe dein Auto.<\/small><\/td><\/tr><tr><td><em>Echo de menos a mis abuelos.<\/em><br><small>Ich vermisse meine Großeltern.<\/small><\/td><td><em>Echo de menos el mar.<\/em><br><small>Ich vermisse das Meer.<\/small><\/td><\/tr><tr><td><em>Buscamos a la profesora de inglés.<\/em><br><small>(eine bestimmte Person)<\/small><\/td><td><em>Buscamos una profesora de inglés.<\/em><br><small>(irgendeine, noch unbekannt)<\/small><\/td><\/tr><\/table><ul><li>Auch vor <em>alguien, nadie, quién<\/em>: <em>¿A quién has invitado?<\/em> – <em>No conozco a nadie aquí.<\/em><\/li><li>Haustiere: <em>Saco a pasear a mi perra.<\/em> – Ich führe meine Hündin aus.<\/li><\/ul><div class=\"warn\">Achtung: Nach <em>tener<\/em> und <em>hay<\/em> normalerweise kein a: <em>Tengo dos primos en Lima.<\/em> – <em>Hay un niño en el jardín.<\/em><\/div><div class=\"tip\">Merke: Frage dich „wen?“ – ist die Antwort ein konkreter Mensch, kommt ein a davor.<\/div>"},{"h":"Die Präposition de","html":"<table><tr><th>Gebrauch<\/th><th>Beispiel<\/th><\/tr><tr><td>Herkunft<\/td><td><em>Somos de Hamburgo.<\/em><br><small>Wir sind aus Hamburg.<\/small><\/td><\/tr><tr><td>Besitz<\/td><td><em>la bici de Marta<\/em><br><small>Martas Fahrrad<\/small><\/td><\/tr><tr><td>Material<\/td><td><em>una silla de madera, un anillo de plata<\/em><\/td><\/tr><tr><td>Inhalt<\/td><td><em>una taza de café, una botella de agua<\/em><br><small>eine Tasse Kaffee, eine Flasche Wasser<\/small><\/td><\/tr><tr><td>Thema, Art<\/td><td><em>una clase de química, una película de miedo<\/em><\/td><\/tr><tr><td>Merkmal<\/td><td><em>la chica del abrigo rojo<\/em><br><small>das Mädchen mit dem roten Mantel<\/small><\/td><\/tr><tr><td>Ursache (Gefühl)<\/td><td><em>Temblaba de frío.<\/em><br><small>Er zitterte vor Kälte.<\/small><\/td><\/tr><tr><td>Teil, Menge<\/td><td><em>un poco de sal, la mitad del pastel<\/em><\/td><\/tr><\/table><p><b>de + el = del<\/b>: <em>Vuelvo del trabajo.<\/em><\/p><p><b>de … a<\/b> = von … bis (Zeit, Strecke): <em>Abrimos de lunes a sábado, de diez a dos.<\/em> – Wir haben montags bis samstags von zehn bis zwei geöffnet. Gleichbedeutend, etwas betonter: <em>desde … hasta<\/em>.<\/p><div class=\"warn\">Achtung: Kein Genitiv-s! <em>el piso de Jorge<\/em>, nie „Jorge's piso“. <\/div><div class=\"tip\"><em>una taza de café<\/em> ist meist eine Tasse <b>mit<\/b> Kaffee, kann aber je nach Zusammenhang auch die Kaffeetasse selbst sein. Eindeutig für den Zweck: <em>una taza para el café<\/em>.<\/div>"},{"h":"Die Präposition en","html":"<p><b>en<\/b> steht für den Ort – sowohl „in“ als auch „auf“ und „an“:<\/p><ul><li><em>Las llaves están en la mesa.<\/em> – Die Schlüssel liegen auf dem Tisch.<\/li><li><em>Trabajo en un hospital.<\/em> – Ich arbeite in einem Krankenhaus.<\/li><li><em>Hoy me quedo en casa.<\/em> – Heute bleibe ich zu Hause.<\/li><\/ul><p><b>Verkehrsmittel<\/b>: <em>en tren, en coche, en autobús, en avión, en bici, en barco<\/em>.<br>Aber: <em>a pie<\/em> (zu Fuß), <em>a caballo<\/em> (zu Pferd).<\/p><p><b>Zeit<\/b>: Monate, Jahreszeiten, Jahre, Feste:<\/p><table><tr><th>mit en<\/th><th>ohne Präposition<\/th><\/tr><tr><td><em>en verano, en marzo<\/em><\/td><td><em>el lunes<\/em> (am Montag)<\/td><\/tr><tr><td><em>en 2020, en Navidad<\/em><\/td><td><em>los sábados<\/em> (samstags)<\/td><\/tr><tr><td><em>en dos horas<\/em> (innerhalb von)<\/td><td><em>el 4 de julio, esta semana<\/em><\/td><\/tr><\/table><p>Weitere Verwendungen: <em>en serio<\/em> (im Ernst), <em>en voz alta<\/em> (laut), <em>pensar en<\/em> (denken an).<\/p><div class=\"warn\">Achtung: „am Montag“ ist <em>el lunes<\/em>, nicht „en lunes“. Und Ziel einer Bewegung ist <em>a<\/em>: <em>Voy a Roma<\/em> (hin), <em>Estoy en Roma<\/em> (dort).<\/div><div class=\"tip\">Lateinamerika sagt oft <em>entrar a<\/em>, Spanien eher <em>entrar en<\/em>: <em>Entró en la tienda.<\/em><\/div>"},{"h":"por – Grund, Weg, Mittel, Preis","html":"<p><b>por<\/b> blickt auf die Ursache, den Weg oder das Mittel:<\/p><table><tr><th>Gebrauch<\/th><th>Beispiel<\/th><\/tr><tr><td>Grund, Ursache<\/td><td><em>Cerramos por obras.<\/em> – Wegen Bauarbeiten geschlossen.<br><em>Gracias por las flores.<\/em><\/td><\/tr><tr><td>zuliebe, anstelle von<\/td><td><em>Lo hice por mi madre.<\/em> – Ich tat es meiner Mutter zuliebe.<\/td><\/tr><tr><td>Durchgang, Weg<\/td><td><em>Paseamos por el casco antiguo.<\/em> – Wir spazieren durch die Altstadt.<br><em>El tren pasa por Zaragoza.<\/em><\/td><\/tr><tr><td>Mittel<\/td><td><em>por teléfono, por correo, por internet<\/em><\/td><\/tr><tr><td>ungefähre Zeit<\/td><td><em>por la mañana, por la noche, por Semana Santa<\/em><\/td><\/tr><tr><td>ungefährer Ort<\/td><td><em>¿Hay un cajero por aquí?<\/em> – Gibt es hier in der Gegend einen Geldautomaten?<\/td><\/tr><tr><td>Tausch, Preis<\/td><td><em>Vendí la moto por 800 euros.<\/em><br><em>Cambié mi abrigo por uno más grande.<\/em><\/td><\/tr><tr><td>Urheber im Passiv<\/td><td><em>El puente fue diseñado por una ingeniera.<\/em> – … von einer Ingenieurin entworfen.<\/td><\/tr><tr><td>pro, je<\/td><td><em>dos veces por semana, 90 km por hora<\/em><\/td><\/tr><\/table><p>Feste Fügungen mit por: <em>por fin<\/em> (endlich), <em>por supuesto<\/em> (selbstverständlich), <em>por eso<\/em> (deshalb), <em>por cierto<\/em> (übrigens), <em>por lo menos<\/em> (wenigstens), <em>por ejemplo<\/em>.<\/p>"},{"h":"para – Zweck, Empfänger, Ziel, Frist","html":"<p><b>para<\/b> blickt nach vorn – auf Ziel, Zweck, Empfänger:<\/p><table><tr><th>Gebrauch<\/th><th>Beispiel<\/th><\/tr><tr><td>Zweck (um … zu)<\/td><td><em>Ahorro para comprarme un piso.<\/em><br><small>Ich spare, um mir eine Wohnung zu kaufen.<\/small><\/td><\/tr><tr><td>Empfänger<\/td><td><em>Este paquete es para el vecino.<\/em><\/td><\/tr><tr><td>Ziel, Richtung<\/td><td><em>Mañana salgo para Bilbao.<\/em> – Morgen breche ich nach Bilbao auf.<\/td><\/tr><tr><td>Frist, Termin<\/td><td><em>Necesito el informe para el jueves.<\/em> – … bis (spätestens) Donnerstag.<\/td><\/tr><tr><td>Meinung<\/td><td><em>Para mí, esta es la mejor playa.<\/em> – Für mich / meiner Meinung nach …<\/td><\/tr><tr><td>Vergleich, Maßstab<\/td><td><em>Para tener seis años, lee muy bien.<\/em> – Dafür, dass er sechs ist, liest er sehr gut.<\/td><\/tr><tr><td>Bestimmung<\/td><td><em>un jarabe para la tos<\/em> – ein Hustensaft<\/td><\/tr><\/table><p><b>para + Infinitiv<\/b> bei gleichem Subjekt, <b>para que + subjuntivo<\/b> bei verschiedenem Subjekt: <em>Te lo explico para que lo entiendas.<\/em><\/p><div class=\"warn\">Achtung: „um zu“ ist immer <em>para<\/em> + Infinitiv – nie <em>por<\/em>: <em>Vengo para ayudarte.<\/em><\/div>"},{"h":"por oder para? Der direkte Vergleich","html":"<table><tr><th>por<\/th><th>para<\/th><\/tr><tr><td><em>Lo hago por ti.<\/em><br><small>dir zuliebe / wegen dir<\/small><\/td><td><em>Lo hago para ti.<\/em><br><small>für dich (du bekommst es)<\/small><\/td><\/tr><tr><td><em>Voy por la playa.<\/em><br><small>am Strand entlang<\/small><\/td><td><em>Voy para la playa.<\/em><br><small>Richtung Strand<\/small><\/td><\/tr><tr><td><em>Estudio por la tarde.<\/em><br><small>nachmittags<\/small><\/td><td><em>Es para esta tarde.<\/em><br><small>bis heute Nachmittag<\/small><\/td><\/tr><tr><td><em>¿Por qué?<\/em><br><small>warum? (Grund)<\/small><\/td><td><em>¿Para qué?<\/em><br><small>wozu? (Zweck)<\/small><\/td><\/tr><tr><td><em>Trabaja por su hermano.<\/em><br><small>an seiner Stelle<\/small><\/td><td><em>Trabaja para una empresa alemana.<\/em><br><small>für (Arbeitgeber)<\/small><\/td><\/tr><\/table><div class=\"tip\">Eselsbrücke: <b>por<\/b> schaut zurück (Woher kommt es? Warum? Auf welchem Weg?), <b>para<\/b> schaut nach vorn (Wohin? Wozu? Für wen? Bis wann?).<\/div><div class=\"tip\">Für Italienischkenner: <em>para<\/em> ≈ <em>per<\/em> (Zweck), <em>por<\/em> ≈ <em>per / a causa di / attraverso<\/em>. Das Italienische trennt hier nicht – Spanisch schon.<\/div>"},{"h":"con, sin, contra, según","html":"<ul><li><b>con<\/b> = mit: <em>Salgo con mis compañeros.<\/em> – <em>un té con limón<\/em>.<br>Sonderformen: <em>conmigo, contigo<\/em> (und reflexiv <em>consigo<\/em>): <em>¿Vienes conmigo?<\/em><\/li><li><b>sin<\/b> = ohne, meist ohne Artikel: <em>sin azúcar, sin dinero<\/em>. <b>sin + Infinitiv<\/b> = ohne zu: <em>Se fue sin despedirse.<\/em> – Er ging, ohne sich zu verabschieden.<\/li><li><b>contra<\/b> = gegen: <em>un jarabe contra la tos, jugar contra el Betis, apoyar la escalera contra la pared<\/em>.<\/li><li><b>según<\/b> = laut, gemäß, je nach: <em>Según el pronóstico, mañana nevará.<\/em> – <em>Según el día, voy en bici o en metro.<\/em><\/li><\/ul><div class=\"warn\">Achtung: Nach <em>según<\/em> und <em>entre<\/em> stehen die Subjektpronomen: <em>según tú<\/em>, <em>entre tú y yo<\/em> – nicht „según ti“, „entre ti y mí“.<\/div><div class=\"tip\">„gegen“ als Uhrzeit (ungefähr) ist nicht <em>contra<\/em>, sondern <em>hacia<\/em> oder <em>sobre<\/em>: <em>Llego hacia las ocho.<\/em><\/div>"},{"h":"desde, hasta, desde hace, durante","html":"<ul><li><b>desde<\/b> = seit, von … aus: <em>desde 2019, desde el lunes, Te llamo desde el tren.<\/em><\/li><li><b>hasta<\/b> = bis: <em>Esperé hasta las once.<\/em> – <em>¡Hasta mañana!<\/em><br>Als Gradpartikel = sogar: <em>Hasta mi abuelo tiene móvil.<\/em><\/li><li><b>desde … hasta<\/b> = von … bis: <em>Fuimos andando desde la estación hasta el hotel.<\/em><\/li><\/ul><p><b>Zeitpunkt oder Zeitraum?<\/b><\/p><table><tr><th>Spanisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>Vivo aquí desde 2021.<\/em><\/td><td>seit (Zeitpunkt)<\/td><\/tr><tr><td><em>Vivo aquí desde hace cinco años.<\/em><\/td><td>seit (Zeitraum)<\/td><\/tr><tr><td><em>Hace cinco años que vivo aquí.<\/em><\/td><td>(gleiche Bedeutung)<\/td><\/tr><tr><td><em>Llegué hace cinco años.<\/em><\/td><td>vor fünf Jahren<\/td><\/tr><\/table><div class=\"warn\">Achtung: Bei andauernden Handlungen steht nach <em>desde (hace)<\/em> das <b>Präsens<\/b>, nicht das Perfekt: <em>Estudio español desde hace un año.<\/em> – Ich lerne seit einem Jahr Spanisch.<\/div><p><b>durante<\/b> = während, … lang: <em>Durante la cena nadie habló.<\/em> – <em>Viví en Perú durante dos años.<\/em><\/p>"},{"h":"entre, hacia, sobre, tras, bajo","html":"<table><tr><th>Präp.<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>entre<\/em><\/td><td>zwischen, unter, gemeinsam<\/td><td><em>entre el banco y la farmacia<\/em><br><em>Lo pagamos entre todos.<\/em><\/td><\/tr><tr><td><em>hacia<\/em><\/td><td>in Richtung; gegen (ungefähr)<\/td><td><em>Caminamos hacia el río.<\/em><br><em>hacia las cinco<\/em><\/td><\/tr><tr><td><em>sobre<\/em><\/td><td>auf, über; Thema; ungefähr<\/td><td><em>sobre la mesa<\/em><br><em>un libro sobre Goya<\/em><br><em>sobre las diez<\/em><\/td><\/tr><tr><td><em>tras<\/em><\/td><td>nach, hinter (gehoben)<\/td><td><em>tras la reunión<\/em><br><em>día tras día<\/em><\/td><\/tr><tr><td><em>bajo<\/em><\/td><td>unter<\/td><td><em>bajo la lluvia, tres grados bajo cero<\/em><\/td><\/tr><\/table><div class=\"tip\">Im Alltag ersetzt man <em>tras<\/em> meist durch <em>después de<\/em> (zeitlich) oder <em>detrás de<\/em> (räumlich), <em>bajo<\/em> räumlich oft durch <em>debajo de<\/em>.<\/div>"},{"h":"Zusammengesetzte Präpositionen","html":"<p>Viele Ortsangaben bestehen aus Adverb + <b>de<\/b>. Ohne Ergänzung fällt das <em>de<\/em> weg: <em>Vivo cerca.<\/em> / <em>Vivo cerca del centro.<\/em><\/p><table><tr><th>Spanisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>delante de<\/em><\/td><td>vor (räumlich)<\/td><\/tr><tr><td><em>detrás de<\/em><\/td><td>hinter<\/td><\/tr><tr><td><em>encima de<\/em><\/td><td>auf, über<\/td><\/tr><tr><td><em>debajo de<\/em><\/td><td>unter<\/td><\/tr><tr><td><em>al lado de<\/em><\/td><td>neben<\/td><\/tr><tr><td><em>cerca de / lejos de<\/em><\/td><td>nahe bei / weit weg von<\/td><\/tr><tr><td><em>dentro de / fuera de<\/em><\/td><td>in, innerhalb / außerhalb<\/td><\/tr><tr><td><em>antes de / después de<\/em><\/td><td>vor / nach (zeitlich)<\/td><\/tr><tr><td><em>a pesar de<\/em><\/td><td>trotz<\/td><\/tr><tr><td><em>en vez de<\/em><\/td><td>statt<\/td><\/tr><tr><td><em>gracias a<\/em><\/td><td>dank<\/td><\/tr><tr><td><em>a causa de<\/em><\/td><td>wegen<\/td><\/tr><\/table><ul><li><em>El gato duerme debajo de la cama.<\/em> – Die Katze schläft unter dem Bett.<\/li><li><em>Antes de salir, apaga la luz.<\/em> – Bevor du gehst, mach das Licht aus.<\/li><li><em>Dentro de una semana empiezan las vacaciones.<\/em> – In einer Woche beginnen die Ferien.<\/li><li><em>Gracias a tu consejo, aprobé.<\/em> / <em>A causa de la niebla, cerraron el aeropuerto.<\/em><\/li><li><em>En vez de quejarte, ayúdame.<\/em> – Statt dich zu beschweren, hilf mir.<\/li><\/ul><div class=\"warn\">Achtung: „vor“ zeitlich = <em>antes de<\/em>, räumlich = <em>delante de<\/em>; „vor drei Tagen“ = <em>hace tres días<\/em>. Und mit Pronomen: <em>cerca de mí, detrás de ti<\/em>.<\/div><div class=\"tip\"><em>gracias a<\/em> für erfreuliche Ursachen, <em>a causa de<\/em> neutral, <em>por culpa de<\/em> für negative mit Schuldzuweisung.<\/div>"},{"h":"Feste Wendungen und Verben mit Präposition","html":"<p>Viele Verben verlangen eine bestimmte Präposition – oft eine andere als im Deutschen:<\/p><table><tr><th>Spanisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>pensar en<\/em><\/td><td>denken an<\/td><\/tr><tr><td><em>soñar con<\/em><\/td><td>träumen von<\/td><\/tr><tr><td><em>depender de<\/em><\/td><td>abhängen von<\/td><\/tr><tr><td><em>enamorarse de<\/em><\/td><td>sich verlieben in<\/td><\/tr><tr><td><em>casarse con<\/em><\/td><td>heiraten (jdn.)<\/td><\/tr><tr><td><em>acordarse de<\/em><\/td><td>sich erinnern an<\/td><\/tr><tr><td><em>consistir en<\/em><\/td><td>bestehen aus/in<\/td><\/tr><tr><td><em>tardar en<\/em> + Inf.<\/td><td>brauchen, um zu<\/td><\/tr><tr><td><em>empezar a / dejar de<\/em> + Inf.<\/td><td>anfangen / aufhören zu<\/td><\/tr><tr><td><em>preocuparse por<\/em><\/td><td>sich Sorgen machen um<\/td><\/tr><\/table><p>Ohne Präposition, obwohl das Deutsche eine hat: <em>esperar el autobús<\/em> (warten auf), <em>buscar las gafas<\/em> (suchen nach), <em>pedir ayuda<\/em> (bitten um), <em>escuchar la radio<\/em>.<\/p><p>Häufige Wendungen: <em>a veces, a menudo, a lo mejor, de repente, de nuevo, de memoria, de vacaciones, enseguida, en cambio, para siempre<\/em>.<\/p><div class=\"warn\">Achtung: „sich verlieben in“ = <em>enamorarse de<\/em> (nicht en), „heiraten“ = <em>casarse con<\/em>: <em>Se casó con un chico de Vigo.<\/em><\/div>"}],"exercises":[{"type":"gap","title":"a, de oder en?","task":"Setze a, de oder en ein (bei Bedarf als al oder del).","items":[{"q":"Esta tarde vamos ___ cine.","a":["al"],"de":"Heute Nachmittag gehen wir ins Kino."},{"q":"Mi compañera de piso es ___ Valencia.","a":["de"],"de":"Meine Mitbewohnerin ist aus Valencia."},{"q":"Siempre voy al trabajo ___ bici.","a":["en"],"de":"Ich fahre immer mit dem Rad zur Arbeit."},{"q":"La película empieza ___ las diez y media.","a":["a"],"de":"Der Film beginnt um halb elf."},{"q":"¿Me pones una taza ___ té, por favor?","a":["de"],"de":"Bringst du mir bitte eine Tasse Tee?"},{"q":"Nos conocimos ___ verano de 2018.","a":["en"],"de":"Wir haben uns im Sommer 2018 kennengelernt."},{"q":"Hoy vengo ___ trabajo andando.","a":["del"],"de":"Heute komme ich zu Fuß von der Arbeit."},{"q":"El supermercado está abierto ___ lunes a sábado.","a":["de"],"de":"Der Supermarkt ist von Montag bis Samstag geöffnet."}]},{"type":"choice","title":"a personal – ja oder nein?","task":"Braucht der Satz ein a?","items":[{"q":"Ayer vi ___ tu prima en el mercado.","options":["a","–"],"a":0,"why":"Bestimmte Person als direktes Objekt → a."},{"q":"Tengo ___ tres hermanas.","options":["a","–"],"a":1,"why":"Nach tener steht normalerweise kein a personal."},{"q":"¿Conoces ___ alguien que hable japonés?","options":["a","–"],"a":0,"why":"Vor alguien/nadie steht das a personal."},{"q":"Necesito ___ un fontanero urgentemente.","options":["a","–"],"a":1,"why":"Irgendein (noch unbekannter) Handwerker → kein a."},{"q":"Llevo ___ mi perro al veterinario.","options":["a","–"],"a":0,"why":"Vertrautes Haustier wird wie eine Person behandelt."},{"q":"Hay ___ dos chicos esperando fuera.","options":["a","–"],"a":1,"why":"Nach hay kein a personal."},{"q":"Estamos buscando ___ el nuevo museo.","options":["a","–"],"a":1,"why":"Ein Gebäude ist keine Person."},{"q":"Quiero mucho ___ mis abuelos.","options":["a","–"],"a":0,"why":"Bestimmte Personen als direktes Objekt → a."}]},{"type":"choice","title":"por oder para?","task":"Wähle die passende Präposition.","items":[{"q":"Estas flores son ___ ti.","options":["por","para"],"a":1,"why":"Empfänger → para."},{"q":"Gracias ___ venir tan rápido.","options":["por","para"],"a":0,"why":"Grund des Dankes → por."},{"q":"Me gusta pasear ___ la orilla del río.","options":["por","para"],"a":0,"why":"Bewegung entlang/durch einen Ort → por."},{"q":"Estudio alemán ___ trabajar en Berlín.","options":["por","para"],"a":1,"why":"Zweck (um zu) → para."},{"q":"Hablamos ___ teléfono casi cada día.","options":["por","para"],"a":0,"why":"Kommunikationsmittel → por."},{"q":"Tienes que entregar el trabajo ___ el lunes.","options":["por","para"],"a":1,"why":"Frist → para."},{"q":"Compré esta lámpara ___ quince euros.","options":["por","para"],"a":0,"why":"Preis/Tausch → por."},{"q":"___ mí, el mejor plato es la paella.","options":["Por","Para"],"a":1,"why":"Meinung → para mí."},{"q":"La novela fue traducida ___ un equipo de expertos.","options":["por","para"],"a":0,"why":"Urheber im Passiv → por."},{"q":"___ ser extranjero, habla un español perfecto.","options":["Por","Para"],"a":1,"why":"Vergleich mit dem Erwartbaren (dafür, dass) → para."}]},{"type":"gap","title":"por oder para einsetzen","task":"Setze por oder para ein.","items":[{"q":"El tren ___ Salamanca sale del andén 4.","a":["para"],"de":"Der Zug nach Salamanca fährt von Gleis 4 ab."},{"q":"Normalmente voy al gimnasio ___ la mañana.","a":["por"],"de":"Normalerweise gehe ich morgens ins Fitnessstudio."},{"q":"Cerrado ___ vacaciones.","a":["por"],"de":"Wegen Urlaub geschlossen."},{"q":"Este cuchillo es ___ cortar pan.","a":["para"],"de":"Dieses Messer ist zum Brotschneiden."},{"q":"Vamos a 120 kilómetros ___ hora.","a":["por"],"de":"Wir fahren 120 Kilometer pro Stunde."},{"q":"Trabajo ___ una empresa de software.","a":["para"],"de":"Ich arbeite für eine Softwarefirma."},{"q":"¿___ qué no me llamaste ayer?","a":["Por","por"],"de":"Warum hast du mich gestern nicht angerufen?"},{"q":"Mi compañero está enfermo, así que hoy trabajo ___ él.","a":["por"],"de":"Mein Kollege ist krank, also arbeite ich heute für ihn (an seiner Stelle)."}]},{"type":"gap","title":"Zusammengesetzte Präpositionen","task":"Ergänze das fehlende Wort (de, del oder a).","items":[{"q":"Las zapatillas están debajo ___ la cama.","a":["de"],"de":"Die Turnschuhe sind unter dem Bett."},{"q":"Gracias ___ tu ayuda, terminamos a tiempo.","a":["a"],"de":"Dank deiner Hilfe sind wir rechtzeitig fertig geworden."},{"q":"Lávate las manos antes ___ comer.","a":["de"],"de":"Wasch dir vor dem Essen die Hände."},{"q":"La farmacia está al lado ___ banco.","a":["del"],"de":"Die Apotheke ist neben der Bank."},{"q":"A pesar ___ la lluvia, salimos a correr.","a":["de"],"de":"Trotz des Regens sind wir laufen gegangen."},{"q":"En vez ___ ver la tele, lee un libro.","a":["de"],"de":"Statt fernzusehen, lies ein Buch."},{"q":"Mis padres viven lejos ___ aquí.","a":["de"],"de":"Meine Eltern wohnen weit weg von hier."},{"q":"Dentro ___ dos horas aterrizamos en Lima.","a":["de"],"de":"In zwei Stunden landen wir in Lima."}]},{"type":"choice","title":"Gemischt – für Fortgeschrittene","task":"Wähle die richtige Lösung.","items":[{"q":"Trabajo en esta oficina ___ seis meses.","options":["desde","desde hace","hace"],"a":1,"why":"Zeitraum bis jetzt → desde hace + Präsens."},{"q":"Te mandé el correo ___ dos días.","options":["desde hace","hace","durante"],"a":1,"why":"„vor“ + Zeitraum in der Vergangenheit → hace."},{"q":"Esto queda entre ___.","options":["ti y mí","tú y yo","te y me"],"a":1,"why":"Nach entre stehen die Subjektpronomen."},{"q":"¿Quieres venir ___ al concierto?","options":["con mí","conmigo","con me"],"a":1,"why":"con + mí verschmilzt zu conmigo."},{"q":"Últimamente sueño mucho ___ el mar.","options":["de","en","con"],"a":2,"why":"soñar con = träumen von."},{"q":"Mi hermana se casó ___ un chico de Oviedo.","options":["con","a","–"],"a":0,"why":"casarse con alguien."},{"q":"Llegamos ___ Granada a medianoche.","options":["en","a","por"],"a":1,"why":"llegar a + Ziel."},{"q":"___ la crisis, muchas tiendas cerraron.","options":["Gracias a","A causa de","En vez de"],"a":1,"why":"Neutral-negative Ursache → a causa de; gracias a nur bei positiven Folgen."},{"q":"Llegaré ___ las nueve, más o menos.","options":["contra","hacia","hasta"],"a":1,"why":"Ungefähre Uhrzeit → hacia (oder sobre)."}]}],"cards":[{"f":"a + el","b":"al – Vamos al teatro."},{"f":"de + el","b":"del – la puerta del garaje"},{"f":"al + Infinitiv","b":"als / beim … – Al llegar, llamé a mi madre."},{"f":"a personal","b":"vor bestimmten Personen als direktes Objekt: Veo a Pablo."},{"f":"a personal nach tener / hay?","b":"nein: Tengo dos hijos. Hay un hombre fuera."},{"f":"zu Fuß / mit dem Zug","b":"a pie / en tren"},{"f":"am Montag / montags","b":"el lunes / los lunes (ohne Präposition)"},{"f":"im Sommer / im Jahr 2020","b":"en verano / en 2020"},{"f":"eine Tasse Kaffee","b":"una taza de café"},{"f":"von Montag bis Freitag","b":"de lunes a viernes (desde el lunes hasta el viernes)"},{"f":"por – Hauptbedeutungen","b":"Grund, Weg/durch, Mittel, ungefähre Zeit/Ort, Preis/Tausch, Urheber im Passiv, pro"},{"f":"para – Hauptbedeutungen","b":"Zweck, Empfänger, Ziel, Frist, Meinung, Vergleich"},{"f":"warum? / wozu?","b":"¿por qué? / ¿para qué?"},{"f":"Lo hago por ti / para ti","b":"dir zuliebe, wegen dir / für dich (als Empfänger)"},{"f":"meiner Meinung nach","b":"para mí"},{"f":"zweimal pro Woche","b":"dos veces por semana"},{"f":"mit mir / mit dir","b":"conmigo / contigo"},{"f":"ohne etwas zu sagen","b":"sin decir nada"},{"f":"laut dir / zwischen dir und mir","b":"según tú / entre tú y yo"},{"f":"seit 2020 / seit drei Jahren","b":"desde 2020 / desde hace tres años"},{"f":"vor drei Jahren","b":"hace tres años"},{"f":"gegen fünf Uhr (ungefähr)","b":"hacia las cinco / sobre las cinco"},{"f":"vor (räumlich / zeitlich)","b":"delante de / antes de"},{"f":"in einer Stunde (Zukunft)","b":"dentro de una hora"},{"f":"trotz / statt","b":"a pesar de / en vez de"},{"f":"dank / wegen","b":"gracias a / a causa de (negativ: por culpa de)"},{"f":"denken an / träumen von","b":"pensar en / soñar con"},{"f":"sich verlieben in / heiraten","b":"enamorarse de / casarse con"},{"f":"warten auf / suchen nach","b":"esperar / buscar (ohne Präposition)"},{"f":"llegar …","b":"llegar a (nicht en): Llegué a Madrid."}],"id":"k25"},{"nr":26,"title":"Zahlen, Datum und Uhrzeit","teil":"Anhang","intro":"Zahlen, Uhrzeiten und Datumsangaben braucht man täglich – beim Einkaufen, bei Terminen, am Telefon. Dieses Kapitel fasst alle Formen und ihre Besonderheiten wie Angleichung und Verkürzung zusammen.","sections":[{"h":"Grundzahlen 0–99","html":"<table><tr><th>Zahl<\/th><th>Spanisch<\/th><th>Zahl<\/th><th>Spanisch<\/th><\/tr><tr><td>0<\/td><td><em>cero<\/em><\/td><td>16<\/td><td><em>dieciséis<\/em><\/td><\/tr><tr><td>1<\/td><td><em>uno<\/em><\/td><td>17<\/td><td><em>diecisiete<\/em><\/td><\/tr><tr><td>2<\/td><td><em>dos<\/em><\/td><td>18<\/td><td><em>dieciocho<\/em><\/td><\/tr><tr><td>3<\/td><td><em>tres<\/em><\/td><td>19<\/td><td><em>diecinueve<\/em><\/td><\/tr><tr><td>4<\/td><td><em>cuatro<\/em><\/td><td>20<\/td><td><em>veinte<\/em><\/td><\/tr><tr><td>5<\/td><td><em>cinco<\/em><\/td><td>21<\/td><td><em>veintiuno<\/em><\/td><\/tr><tr><td>6<\/td><td><em>seis<\/em><\/td><td>22<\/td><td><em>veintidós<\/em><\/td><\/tr><tr><td>7<\/td><td><em>siete<\/em><\/td><td>23<\/td><td><em>veintitrés<\/em><\/td><\/tr><tr><td>8<\/td><td><em>ocho<\/em><\/td><td>26<\/td><td><em>veintiséis<\/em><\/td><\/tr><tr><td>9<\/td><td><em>nueve<\/em><\/td><td>30<\/td><td><em>treinta<\/em><\/td><\/tr><tr><td>10<\/td><td><em>diez<\/em><\/td><td>40<\/td><td><em>cuarenta<\/em><\/td><\/tr><tr><td>11<\/td><td><em>once<\/em><\/td><td>50<\/td><td><em>cincuenta<\/em><\/td><\/tr><tr><td>12<\/td><td><em>doce<\/em><\/td><td>60<\/td><td><em>sesenta<\/em><\/td><\/tr><tr><td>13<\/td><td><em>trece<\/em><\/td><td>70<\/td><td><em>setenta<\/em><\/td><\/tr><tr><td>14<\/td><td><em>catorce<\/em><\/td><td>80<\/td><td><em>ochenta<\/em><\/td><\/tr><tr><td>15<\/td><td><em>quince<\/em><\/td><td>90<\/td><td><em>noventa<\/em><\/td><\/tr><\/table><p>16–29 schreibt man <b>in einem Wort<\/b> (mit Akzent bei <em>dieciséis, veintidós, veintitrés, veintiséis<\/em>). Ab 31 in drei Wörtern mit <em>y<\/em>: <em>treinta y uno, cuarenta y cinco, noventa y nueve<\/em>.<\/p><div class=\"warn\">Achtung: Reihenfolge wie geschrieben – Zehner zuerst: 45 = <em>cuarenta y cinco<\/em>, nicht „fünfundvierzig“-Logik.<\/div>"},{"h":"uno/un/una, cien/ciento und Angleichung","html":"<p><b>uno<\/b> verkürzt sich vor männlichen Substantiven zu <b>un<\/b>, vor weiblichen heißt es <b>una<\/b> – auch in zusammengesetzten Zahlen:<\/p><ul><li><em>un hijo, una hija<\/em><\/li><li><em>veintiún años, treinta y un días<\/em><\/li><li><em>veintiuna personas, cuarenta y una sillas<\/em> <small>(die RAE lässt auch <em>veintiún personas<\/em> zu)<\/small><\/li><li>allein stehend: <em>¿Cuántos libros? – Veintiuno.<\/em><\/li><\/ul><p><b>cien<\/b> steht allein, vor Substantiven und vor <em>mil / millones<\/em>; <b>ciento<\/b> vor weiteren Zahlen:<\/p><table><tr><th>cien<\/th><th>ciento<\/th><\/tr><tr><td><em>cien euros<\/em><\/td><td><em>ciento uno<\/em> (101)<\/td><\/tr><tr><td><em>cien mil<\/em> (100 000)<\/td><td><em>ciento veinte<\/em> (120)<\/td><\/tr><tr><td><em>Tengo cien.<\/em><\/td><td><em>ciento cincuenta y cinco<\/em> (155)<\/td><\/tr><\/table><p>Die Hunderter ab 200 <b>richten sich nach dem Geschlecht<\/b>:<\/p><table><tr><th>Zahl<\/th><th>männlich<\/th><th>weiblich<\/th><\/tr><tr><td>200<\/td><td><em>doscientos<\/em><\/td><td><em>doscientas<\/em><\/td><\/tr><tr><td>300<\/td><td><em>trescientos<\/em><\/td><td><em>trescientas<\/em><\/td><\/tr><tr><td>400<\/td><td><em>cuatrocientos<\/em><\/td><td><em>cuatrocientas<\/em><\/td><\/tr><tr><td>500<\/td><td><em>quinientos<\/em><\/td><td><em>quinientas<\/em><\/td><\/tr><tr><td>600<\/td><td><em>seiscientos<\/em><\/td><td><em>seiscientas<\/em><\/td><\/tr><tr><td>700<\/td><td><em>setecientos<\/em><\/td><td><em>setecientas<\/em><\/td><\/tr><tr><td>800<\/td><td><em>ochocientos<\/em><\/td><td><em>ochocientas<\/em><\/td><\/tr><tr><td>900<\/td><td><em>novecientos<\/em><\/td><td><em>novecientas<\/em><\/td><\/tr><\/table><p><em>trescientas páginas, quinientas personas, doscientas mil libras<\/em> (Angleichung auch vor <em>mil<\/em>).<\/p><div class=\"warn\">Achtung: Unregelmäßig sind <em>quinientos<\/em> (nicht „cincocientos“), <em>setecientos<\/em> und <em>novecientos<\/em>. Und nie „un cien“ – „hundert“ ist einfach <em>cien<\/em>.<\/div>"},{"h":"Tausend, Million, große Zahlen","html":"<ul><li><b>mil<\/b> ist unveränderlich und steht ohne <em>un<\/em>: <em>mil euros, dos mil, diez mil<\/em>.<br><em>miles de<\/em> = Tausende von: <em>miles de turistas<\/em>.<\/li><li><b>millón<\/b> ist ein Substantiv: <em>un millón, dos millones<\/em>. Vor einem Substantiv folgt <b>de<\/b>: <em>un millón de habitantes, tres millones de euros<\/em>. Folgen weitere Zahlen, entfällt <em>de<\/em>: <em>un millón doscientos mil euros<\/em>.<\/li><li><em>mil millones<\/em> = eine Milliarde; <em>un billón<\/em> = eine Billion (10¹²).<\/li><\/ul><p>Beispiele: 1975 = <em>mil novecientos setenta y cinco<\/em>; 2400 = <em>dos mil cuatrocientos<\/em>; 351 000 = <em>trescientos cincuenta y un mil<\/em>.<\/p><p><b>Schreibweise<\/b>: Dezimalzeichen ist in Spanien das Komma (<em>3,5<\/em> = <em>tres coma cinco<\/em>); Ab fünf Ziffern trennt man Tausender mit Leerzeichen (früher Punkt): <em>35 000<\/em>; vierstellige Zahlen und Jahreszahlen ohne Trennung: <em>2400, 2025<\/em>.<\/p><div class=\"warn\">Achtung: „Milliarde“ ist nicht <em>billón<\/em>! <em>Un billón<\/em> ist tausendmal mehr. Und „zweitausend“ heißt <em>dos mil<\/em>, nicht „dos miles“.<\/div>"},{"h":"Ordnungszahlen","html":"<table><tr><th><\/th><th>Spanisch<\/th><th><\/th><th>Spanisch<\/th><\/tr><tr><td>1.<\/td><td><em>primero<\/em><\/td><td>6.<\/td><td><em>sexto<\/em><\/td><\/tr><tr><td>2.<\/td><td><em>segundo<\/em><\/td><td>7.<\/td><td><em>séptimo<\/em><\/td><\/tr><tr><td>3.<\/td><td><em>tercero<\/em><\/td><td>8.<\/td><td><em>octavo<\/em><\/td><\/tr><tr><td>4.<\/td><td><em>cuarto<\/em><\/td><td>9.<\/td><td><em>noveno<\/em><\/td><\/tr><tr><td>5.<\/td><td><em>quinto<\/em><\/td><td>10.<\/td><td><em>décimo<\/em><\/td><\/tr><\/table><ul><li>Sie richten sich nach dem Substantiv: <em>la segunda puerta, las primeras semanas<\/em>.<\/li><li><em>primero<\/em> und <em>tercero<\/em> verkürzen sich vor männlichem Singular: <em>el primer día, el tercer piso<\/em> – aber <em>el día primero<\/em>, <em>la tercera vez<\/em>.<\/li><li>Abkürzung: <em>1.º, 2.ª, 3.er<\/em>.<\/li><li>Ab 11 nimmt man im Alltag meist die Grundzahl, nachgestellt: <em>el piso catorce, la planta veinte<\/em>.<\/li><\/ul><p><b>Herrscher und Päpste<\/b>: bis X Ordnungszahl, danach Grundzahl:<br><em>Felipe VI<\/em> = <em>Felipe sexto<\/em>, <em>Isabel II<\/em> = <em>Isabel segunda<\/em>, <em>Alfonso XIII<\/em> = <em>Alfonso trece<\/em>.<\/p><p><b>Jahrhunderte<\/b> mit römischen Ziffern, gelesen meist als Grundzahl: <em>el siglo XXI<\/em> = <em>el siglo veintiuno<\/em>, <em>el siglo XIX<\/em> = <em>diecinueve<\/em>; bei niedrigen Zahlen auch ordinal: <em>el siglo V<\/em> = <em>quinto<\/em>.<\/p><div class=\"warn\">Achtung: Kein Artikel vor dem Namenszusatz: <em>Carlos III<\/em> = „Carlos tercero“, nicht „Carlos el tercero“.<\/div>"},{"h":"Brüche, Prozente, Rechnen","html":"<table><tr><th>Bruch<\/th><th>Spanisch<\/th><\/tr><tr><td>1/2<\/td><td><em>un medio / la mitad<\/em><\/td><\/tr><tr><td>1/3, 2/3<\/td><td><em>un tercio, dos tercios<\/em><\/td><\/tr><tr><td>1/4, 3/4<\/td><td><em>un cuarto, tres cuartos<\/em><\/td><\/tr><tr><td>1/5 … 1/10<\/td><td><em>un quinto … un décimo<\/em><\/td><\/tr><tr><td>1/12<\/td><td><em>un doceavo<\/em><\/td><\/tr><\/table><ul><li><em>medio<\/em> als Adjektiv ohne <em>un<\/em>: <em>medio litro, media hora<\/em>; nachgestellt: <em>dos horas y media<\/em>.<\/li><li><em>la mitad de<\/em> + Substantiv: <em>La mitad de la clase está enferma.<\/em><\/li><\/ul><p><b>Prozente<\/b> stehen mit Artikel: <em>el 20 %<\/em> (<em>el veinte por ciento<\/em>), oft auch <em>un 20 %<\/em>. <em>El 60 % de los socios votó a favor.<\/em> 100 % = <em>cien por cien<\/em> (Spanien) oder <em>ciento por ciento<\/em>.<\/p><p><b>Rechnen<\/b>:<\/p><ul><li><em>Cuatro más tres son siete.<\/em> (+)<\/li><li><em>Diez menos seis son cuatro.<\/em> (−)<\/li><li><em>Cinco por tres son quince.<\/em> (×)<\/li><li><em>Veinte entre cuatro son cinco.<\/em> / <em>Veinte dividido por cuatro …<\/em> (:)<\/li><\/ul>"},{"h":"Ungefähre Zahlen","html":"<table><tr><th>Spanisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>unos veinte, unas treinta<\/em><\/td><td>etwa 20, etwa 30<\/td><\/tr><tr><td><em>una decena<\/em><\/td><td>etwa zehn<\/td><\/tr><tr><td><em>una docena<\/em><\/td><td>ein Dutzend<\/td><\/tr><tr><td><em>una quincena<\/em><\/td><td>etwa 15; zwei Wochen<\/td><\/tr><tr><td><em>una veintena<\/em><\/td><td>etwa 20<\/td><\/tr><tr><td><em>un centenar<\/em><\/td><td>etwa 100<\/td><\/tr><tr><td><em>cientos de / miles de<\/em><\/td><td>Hunderte / Tausende von<\/td><\/tr><tr><td><em>alrededor de, más o menos<\/em><\/td><td>ungefähr<\/td><\/tr><\/table><ul><li><em>Vinieron unas cuarenta personas.<\/em> – Es kamen etwa vierzig Leute.<\/li><li><em>Había una veintena de coches aparcados.<\/em><\/li><li><em>Recibimos cientos de correos.<\/em><\/li><\/ul><div class=\"warn\">Achtung: „mehr als 50“ = <em>más de cincuenta<\/em> (nicht „más que“). <em>más que<\/em> vergleicht: <em>Gana más que yo.<\/em><\/div>"},{"h":"Die Uhrzeit","html":"<p><em>¿Qué hora es?<\/em> – Wie spät ist es? Antwort mit <em>ser<\/em> und Artikel: <em>Es la una<\/em> (Singular!), sonst <em>Son las …<\/em><\/p><table><tr><th>Zeit<\/th><th>Spanisch<\/th><\/tr><tr><td>1:00<\/td><td><em>Es la una (en punto).<\/em><\/td><\/tr><tr><td>3:15<\/td><td><em>Son las tres y cuarto.<\/em><\/td><\/tr><tr><td>4:30<\/td><td><em>Son las cuatro y media.<\/em><\/td><\/tr><tr><td>6:10<\/td><td><em>Son las seis y diez.<\/em><\/td><\/tr><tr><td>7:40<\/td><td><em>Son las ocho menos veinte.<\/em><\/td><\/tr><tr><td>12:45<\/td><td><em>Es la una menos cuarto.<\/em><\/td><\/tr><\/table><ul><li>Tageszeit: <em>de la mañana, de la tarde, de la noche, de la madrugada<\/em> (frühe Morgenstunden): <em>Son las cinco de la tarde.<\/em><\/li><li><em>a mediodía<\/em> (mittags), <em>a medianoche<\/em> (um Mitternacht)<\/li><li><b>um<\/b> = <em>a<\/em>: <em>¿A qué hora sale el tren? – A las nueve y media.<\/em><\/li><li>Offiziell (Fahrplan, Radio) im 24-Stunden-Format: <em>a las 17:45<\/em> = <em>a las diecisiete cuarenta y cinco<\/em>.<\/li><li>In der Vergangenheit: <em>Eran las once cuando llegó.<\/em> (imperfecto)<\/li><\/ul><div class=\"warn\">Achtung: „halb vier“ ist <em>las tres y media<\/em> (drei und halb), nicht „las cuatro y media“!<\/div><div class=\"tip\">Merke: Bis :30 zählt man mit <em>y<\/em> vorwärts, danach mit <em>menos<\/em> von der nächsten Stunde rückwärts.<\/div>"},{"h":"Datum, Wochentage, Monate, Jahreszeiten","html":"<p>Datum: Artikel + Tag + <em>de<\/em> + Monat + <em>de<\/em> + Jahr: <em>el 5 de mayo de 2025<\/em>. Der Erste: <em>el uno<\/em> oder <em>el primero de enero<\/em> (in Lateinamerika fast nur <em>primero<\/em>).<\/p><ul><li><em>¿Qué día es hoy? – Hoy es jueves.<\/em> / <em>Hoy es 12 de octubre.<\/em><\/li><li><em>¿A qué estamos hoy? – Estamos a 3 de marzo.<\/em><\/li><li>Jahreszahlen wie normale Zahlen: 1998 = <em>mil novecientos noventa y ocho<\/em>, 2025 = <em>dos mil veinticinco<\/em>.<\/li><li>Jahrzehnte: <em>los años ochenta<\/em> (die Achtziger).<\/li><\/ul><table><tr><th>Wochentage<\/th><th>Monate<\/th><th>Monate<\/th><\/tr><tr><td><em>lunes<\/em><\/td><td><em>enero<\/em><\/td><td><em>julio<\/em><\/td><\/tr><tr><td><em>martes<\/em><\/td><td><em>febrero<\/em><\/td><td><em>agosto<\/em><\/td><\/tr><tr><td><em>miércoles<\/em><\/td><td><em>marzo<\/em><\/td><td><em>septiembre<\/em><\/td><\/tr><tr><td><em>jueves<\/em><\/td><td><em>abril<\/em><\/td><td><em>octubre<\/em><\/td><\/tr><tr><td><em>viernes<\/em><\/td><td><em>mayo<\/em><\/td><td><em>noviembre<\/em><\/td><\/tr><tr><td><em>sábado<\/em><\/td><td><em>junio<\/em><\/td><td><em>diciembre<\/em><\/td><\/tr><tr><td><em>domingo<\/em><\/td><td><\/td><td><\/td><\/tr><\/table><p><b>Jahreszeiten<\/b>: <em>la primavera, el verano, el otoño, el invierno<\/em> – <em>en otoño<\/em>.<\/p><ul><li>Wochentage, Monate und Jahreszeiten schreibt man <b>klein<\/b>.<\/li><li>„am Freitag“ = <em>el viernes<\/em>, „freitags“ = <em>los viernes<\/em> (ohne Präposition). Plural nur bei <em>sábados, domingos<\/em> sichtbar.<\/li><li>Kurzschreibweise Tag/Monat/Jahr: <em>5/5/2025<\/em>.<\/li><\/ul><div class=\"warn\">Achtung: Kein Punkt wie im Deutschen („5. Mai“) und keine Ordnungszahl: <em>el 5 de mayo<\/em> = „el cinco“.<\/div>"},{"h":"Alter und Mengenangaben","html":"<p><b>Alter<\/b> mit <em>tener … años<\/em>:<\/p><ul><li><em>¿Cuántos años tienes? – Tengo treinta y dos años.<\/em><\/li><li><em>cumplir<\/em> = (ein Alter) erreichen: <em>El sábado mi hijo cumple diez años.<\/em><\/li><li><em>a los<\/em> + Alter = mit …: <em>Aprendí a nadar a los seis años.<\/em><\/li><\/ul><div class=\"warn\">Achtung: Nicht „soy 32 años“ – das Alter „hat“ man: <em>tengo 32 años<\/em>.<\/div><p><b>Mengenangaben<\/b> + <em>de<\/em> + Substantiv (ohne Artikel):<\/p><table><tr><th>Spanisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>un kilo de tomates<\/em><\/td><td>ein Kilo Tomaten<\/td><\/tr><tr><td><em>medio kilo de uvas<\/em><\/td><td>ein halbes Kilo Trauben<\/td><\/tr><tr><td><em>un cuarto de kilo de queso<\/em><\/td><td>250 g Käse<\/td><\/tr><tr><td><em>cien gramos de jamón<\/em><\/td><td>100 g Schinken<\/td><\/tr><tr><td><em>un litro de leche<\/em><\/td><td>ein Liter Milch<\/td><\/tr><tr><td><em>una docena de huevos<\/em><\/td><td>ein Dutzend Eier<\/td><\/tr><tr><td><em>un paquete de arroz<\/em><\/td><td>eine Packung Reis<\/td><\/tr><tr><td><em>una lata de atún<\/em><\/td><td>eine Dose Thunfisch<\/td><\/tr><tr><td><em>una barra de pan<\/em><\/td><td>ein Baguette/Stangenbrot<\/td><\/tr><tr><td><em>una botella de aceite<\/em><\/td><td>eine Flasche Öl<\/td><\/tr><tr><td><em>un trozo de tarta<\/em><\/td><td>ein Stück Kuchen<\/td><\/tr><\/table><p><em>kilo y medio<\/em> = anderthalb Kilo; <em>Póngame medio kilo de fresas, por favor.<\/em><\/p><div class=\"warn\">Achtung: „ein halbes Kilo“ ohne <em>un<\/em>: <em>medio kilo<\/em>, nicht „un medio kilo“.<\/div>"}],"exercises":[{"type":"gap","title":"Grundzahlen mit Angleichung","task":"Schreibe die Zahl in Worten (achte auf un/una, cien/ciento und Geschlecht).","items":[{"q":"Mi abuela tiene noventa y (1) ___ años.","a":["un"],"de":"Meine Großmutter ist 91 Jahre alt."},{"q":"En la sala caben (200) ___ personas.","a":["doscientas"],"de":"Im Saal haben 200 Leute Platz."},{"q":"El billete cuesta (100) ___ euros.","a":["cien"],"de":"Das Ticket kostet 100 Euro."},{"q":"La novela tiene (500) ___ páginas.","a":["quinientas"],"de":"Der Roman hat 500 Seiten."},{"q":"Marzo tiene (31) ___ días.","a":["treinta y un"],"de":"Der März hat 31 Tage."},{"q":"Mi sobrina tiene (16) ___ años.","a":["dieciséis"],"de":"Meine Nichte ist 16."},{"q":"La ciudad tiene un (1 000 000) ___ de habitantes.","a":["millón"],"de":"Die Stadt hat eine Million Einwohner."},{"q":"El edificio mide (115) ___ metros.","a":["ciento quince"],"de":"Das Gebäude ist 115 Meter hoch."},{"q":"Este año se han vendido (700) ___ casas.","a":["setecientas"],"de":"Dieses Jahr wurden 700 Häuser verkauft."},{"q":"La moto de segunda mano cuesta (2000) ___ euros.","a":["dos mil"],"de":"Das gebrauchte Motorrad kostet 2000 Euro."}]},{"type":"choice","title":"Ordnungszahlen","task":"Wähle die richtige Form.","items":[{"q":"Vivimos en el ___ piso.","options":["tercero","tercer","tres"],"a":1,"why":"tercero → tercer vor männlichem Singular."},{"q":"Es la ___ vez que vengo a Asturias.","options":["primer","primera","primero"],"a":1,"why":"Weiblich (la vez) → primera; Verkürzung nur bei männlich."},{"q":"Felipe VI se lee:","options":["Felipe seis","Felipe sexto","Felipe el sexto"],"a":1,"why":"Bis X Ordnungszahl, ohne Artikel."},{"q":"Alfonso XIII se lee:","options":["Alfonso treceavo","Alfonso trece","Alfonso el trece"],"a":1,"why":"Ab XI Grundzahl, ohne Artikel; treceavo ist ein Bruch (1/13)."},{"q":"Vivimos en el siglo XXI, es decir, en el siglo ___.","options":["veintiuno","veintiuna","veintiún"],"a":0,"why":"Jahrhunderte über X liest man als Grundzahl; siglo ist männlich, allein stehend → veintiuno."},{"q":"Mi despacho está en la planta ___.","options":["catorce","catorceava","decimocuarto"],"a":0,"why":"Ab 11 nachgestellte Grundzahl im Alltag."},{"q":"Llegó en ___ lugar.","options":["segundo","segunda","dos"],"a":0,"why":"el lugar ist männlich → segundo (keine Verkürzung)."},{"q":"Isabel II se lee:","options":["Isabel segundo","Isabel dos","Isabel segunda"],"a":2,"why":"Ordnungszahl richtet sich nach dem Geschlecht der Person."}]},{"type":"gap","title":"Wie spät ist es?","task":"Ergänze die Uhrzeit.","items":[{"q":"(5:15) Son las cinco y ___.","a":["cuarto"],"de":"Es ist Viertel nach fünf."},{"q":"(1:30) ___ la una y media.","a":["Es"],"de":"Es ist halb zwei."},{"q":"(7:50) Son las ocho ___ diez.","a":["menos"],"de":"Es ist zehn vor acht."},{"q":"(21:00) Son las nueve de la ___.","a":["noche"],"de":"Es ist neun Uhr abends."},{"q":"(10:30) Son las diez y ___.","a":["media"],"de":"Es ist halb elf."},{"q":"(16:00) Son las cuatro de la ___.","a":["tarde"],"de":"Es ist vier Uhr nachmittags."},{"q":"¿___ qué hora empieza la reunión? – A las once.","a":["A"],"de":"Um wie viel Uhr beginnt die Besprechung? – Um elf."},{"q":"(12:45) Es la ___ menos cuarto.","a":["una"],"de":"Es ist Viertel vor eins."},{"q":"(Vergangenheit) ___ las dos de la madrugada cuando sonó el teléfono.","a":["Eran"],"de":"Es war zwei Uhr nachts, als das Telefon klingelte."}]},{"type":"choice","title":"Datum, Prozente, ungefähre Zahlen","task":"Wähle die richtige Lösung.","items":[{"q":"Mi cumpleaños es ___ 14 de febrero.","options":["en","el","–"],"a":1,"why":"Datum mit bestimmtem Artikel: el 14 de febrero."},{"q":"Nos vemos ___ sábado.","options":["en","el","al"],"a":1,"why":"Wochentag ohne Präposition, mit Artikel."},{"q":"___ de los alumnos aprobó el examen.","options":["El 80 %","80 %","Un 80 por cientos"],"a":0,"why":"Prozentangaben stehen mit Artikel (el oder un)."},{"q":"En la boda había ___ cien invitados.","options":["unos","unas","uno"],"a":0,"why":"unos + Zahl = etwa; invitados ist männlich."},{"q":"Compramos una ___ de huevos.","options":["decena","docena","quincena"],"a":1,"why":"Eier kauft man im Dutzend: una docena."},{"q":"En el concierto había ___ personas.","options":["miles de","miles","mil de"],"a":0,"why":"Tausende von = miles de."},{"q":"Ese coche cuesta más ___ 30 000 euros.","options":["que","de","como"],"a":1,"why":"Vor Zahlen: más de."},{"q":"Diez ___ dos son veinte.","options":["más","por","entre"],"a":1,"why":"Multiplikation: por."},{"q":"„Die Neunziger“ heißt:","options":["los noventas","los años noventa","las noventa"],"a":1,"why":"Jahrzehnt: los años + Zehnerzahl (unverändert)."}]},{"type":"gap","title":"Einkaufen und Alter","task":"Ergänze das fehlende Wort.","items":[{"q":"Una ___ de pan, por favor.","a":["barra"],"de":"Ein Stangenbrot, bitte."},{"q":"Póngame ___ kilo de cerezas. (ein halbes)","a":["medio"],"de":"Geben Sie mir ein halbes Kilo Kirschen."},{"q":"Necesito una ___ de atún para la ensalada. (Dose)","a":["lata"],"de":"Ich brauche eine Dose Thunfisch für den Salat."},{"q":"Compra un ___ de arroz, que no queda. (Packung)","a":["paquete"],"de":"Kauf eine Packung Reis, es ist keiner mehr da."},{"q":"Mi hermano ___ cuarenta años. (tener)","a":["tiene"],"de":"Mein Bruder ist vierzig Jahre alt."},{"q":"Mañana mi madre ___ setenta años. (vollendet)","a":["cumple"],"de":"Morgen wird meine Mutter siebzig."},{"q":"Empecé a trabajar ___ los diecinueve años.","a":["a"],"de":"Ich habe mit neunzehn angefangen zu arbeiten."},{"q":"Hemos comprado un ___ de leche. (Liter)","a":["litro"],"de":"Wir haben einen Liter Milch gekauft."}]}],"cards":[{"f":"16
