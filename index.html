r<\/em><\/td><td><em>abierto<\/em><\/td><td>geöffnet<\/td><\/tr><tr><td><em>volver<\/em><\/td><td><em>vuelto<\/em><\/td><td>zurückgekehrt<\/td><\/tr><tr><td><em>romper<\/em><\/td><td><em>roto<\/em><\/td><td>zerbrochen<\/td><\/tr><tr><td><em>morir<\/em><\/td><td><em>muerto<\/em><\/td><td>gestorben<\/td><\/tr><tr><td><em>cubrir<\/em><\/td><td><em>cubierto<\/em><\/td><td>bedeckt<\/td><\/tr><tr><td><em>resolver<\/em><\/td><td><em>resuelto<\/em><\/td><td>gelöst<\/td><\/tr><\/table><p>Zusammengesetzte Verben übernehmen die Unregelmäßigkeit: <em>deshacer → deshecho, describir → descrito, descubrir → descubierto, devolver → devuelto, componer → compuesto, prever → previsto<\/em>.<\/p><p>Doppelformen: <em>freír → frito<\/em> (auch <em>freído<\/em>), <em>imprimir → impreso<\/em> (auch <em>imprimido<\/em>).<\/p><p><em>¿Quién ha roto el jarrón? – No sé, yo no he visto nada.<\/em> <small>Wer hat die Vase zerbrochen? – Ich weiß nicht, ich habe nichts gesehen.<\/small><\/p><div class=\"tip\">Eselsbrücke: Die meisten enden auf <em>-to<\/em> (<em>visto, puesto, escrito, abierto, vuelto, roto, muerto, cubierto, resuelto<\/em>), nur zwei auf <em>-cho<\/em> (<em>hecho, dicho<\/em>).<\/div>"},{"h":"Pretérito perfecto: Gebrauch","html":"<p>Das <em>perfecto<\/em> verwendet man (in Spanien) für Vergangenes, das zu einem <b>noch nicht abgeschlossenen Zeitraum<\/b> gehört oder <b>Bezug zur Gegenwart<\/b> hat:<\/p><ul><li><b>Heute, diese Woche, dieses Jahr<\/b>: <em>Esta mañana he ido al dentista.<\/em> <small>Heute Morgen war ich beim Zahnarzt.<\/small> <em>Este año hemos viajado poco.<\/em><\/li><li><b>ya / todavía no<\/b>: <em>¿Ya has hecho la maleta? – No, todavía no la he hecho.<\/em> <small>Hast du schon den Koffer gepackt? – Nein, noch nicht.<\/small><\/li><li><b>Erfahrungen<\/b> (bis heute, ohne Zeitpunkt): <em>¿Has estado alguna vez en Cuba?<\/em> <small>Warst du schon mal in Kuba?<\/small> <em>Nunca he probado el pulpo.<\/em><\/li><li><b>Gerade Geschehenes<\/b>: <em>¿Qué ha pasado? – Se ha caído un vaso.<\/em> <small>Was ist passiert? – Ein Glas ist heruntergefallen.<\/small><\/li><li><b>Mit Wirkung bis jetzt<\/b>: <em>He perdido las gafas.<\/em> <small>Ich habe meine Brille verloren (und finde sie nicht).<\/small><\/li><\/ul><p>Typische Signalwörter: <em>hoy, esta mañana, esta semana, este mes, este año, ya, todavía no, alguna vez, nunca, siempre, últimamente, hace un rato<\/em>.<\/p>"},{"h":"Pretérito indefinido: regelmäßige Formen","html":"<table><tr><th><\/th><th>cantar<\/th><th>correr<\/th><th>subir<\/th><\/tr><tr><td>yo<\/td><td><em>canté<\/em><\/td><td><em>corrí<\/em><\/td><td><em>subí<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>cantaste<\/em><\/td><td><em>corriste<\/em><\/td><td><em>subiste<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>cantó<\/em><\/td><td><em>corrió<\/em><\/td><td><em>subió<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>cantamos<\/em><\/td><td><em>corrimos<\/em><\/td><td><em>subimos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>cantasteis<\/em><\/td><td><em>corristeis<\/em><\/td><td><em>subisteis<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>cantaron<\/em><\/td><td><em>corrieron<\/em><\/td><td><em>subieron<\/em><\/td><\/tr><\/table><p><em>-er<\/em>- und <em>-ir<\/em>-Verben haben im <em>indefinido<\/em> genau dieselben Endungen.<\/p><div class=\"warn\">Achtung Akzent: <em>canto<\/em> (ich singe) – <em>cantó<\/em> (er sang); <em>canté<\/em> (ich sang) – <em>cante<\/em> (subjuntivo). Der Akzent auf der 1. und 3. Person Sg. verändert die Bedeutung!<\/div><div class=\"tip\">Bei <em>-ar<\/em> und <em>-ir<\/em> ist die <em>nosotros<\/em>-Form gleich wie im Präsens: <em>cantamos, subimos<\/em>. Die Zeitangabe macht klar, was gemeint ist: <em>Ayer cantamos en la boda.<\/em><\/div>"},{"h":"Schreibänderungen im indefinido","html":"<p>In der <b>yo-Form<\/b> ändert sich die Schreibung, um die Aussprache zu erhalten:<\/p><table><tr><th>Endung<\/th><th>Änderung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>-car<\/em><\/td><td><em>c → qu<\/em><\/td><td><em>buscar → busqué<\/em>, <em>tocar → toqué<\/em>, <em>sacar → saqué<\/em><\/td><\/tr><tr><td><em>-gar<\/em><\/td><td><em>g → gu<\/em><\/td><td><em>llegar → llegué<\/em>, <em>pagar → pagué<\/em>, <em>jugar → jugué<\/em><\/td><\/tr><tr><td><em>-zar<\/em><\/td><td><em>z → c<\/em><\/td><td><em>empezar → empecé<\/em>, <em>cruzar → crucé<\/em>, <em>almorzar → almorcé<\/em><\/td><\/tr><tr><td><em>-guar<\/em><\/td><td><em>gu → gü<\/em><\/td><td><em>averiguar → averigüé<\/em><\/td><\/tr><\/table><p>Die anderen Personen sind regelmäßig: <em>buscaste, llegó, empezamos<\/em>.<\/p><p><b>i → y<\/b>: Steht vor der Endung ein Vokal, wird das <em>i<\/em> in der 3. Person zu <em>y<\/em>: <em>leer → leyó, leyeron<\/em>; <em>oír → oyó, oyeron<\/em>; <em>creer → creyó<\/em>; <em>caer → cayó<\/em>; <em>construir → construyó, construyeron<\/em>. Die übrigen Formen von <em>leer, oír, creer, caer<\/em> tragen einen Akzent: <em>leí, leíste, leímos, leísteis<\/em>.<\/p><div class=\"warn\">Achtung: <em>construir<\/em> hat keinen Akzent in <em>construiste, construimos<\/em> (<em>ui<\/em> gilt als Diphthong).<\/div>"},{"h":"Stammwechsel bei -ir-Verben","html":"<p>Nur <b>-ir-Verben<\/b> mit Stammwechsel ändern auch im <em>indefinido<\/em> den Stamm – und zwar nur in der <b>3. Person<\/b> Singular und Plural: <em>e → i<\/em>, <em>o → u<\/em>.<\/p><table><tr><th><\/th><th>pedir<\/th><th>dormir<\/th><\/tr><tr><td>yo<\/td><td><em>pedí<\/em><\/td><td><em>dormí<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>pediste<\/em><\/td><td><em>dormiste<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>pidió<\/em><\/td><td><em>durmió<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>pedimos<\/em><\/td><td><em>dormimos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>pedisteis<\/em><\/td><td><em>dormisteis<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>pidieron<\/em><\/td><td><em>durmieron<\/em><\/td><\/tr><\/table><p>Ebenso: <em>servir → sirvió<\/em>, <em>repetir → repitió<\/em>, <em>preferir → prefirió<\/em>, <em>sentir → sintió<\/em>, <em>divertirse → se divirtió<\/em>, <em>seguir → siguió<\/em>, <em>vestirse → se vistió<\/em>, <em>morir → murió<\/em>.<\/p><p><em>El bebé durmió diez horas seguidas.<\/em> <small>Das Baby schlief zehn Stunden am Stück.<\/small><br><em>Mis amigos pidieron una paella para cuatro.<\/em><\/p><div class=\"tip\"><em>-ar<\/em>- und <em>-er<\/em>-Verben mit Stammwechsel sind im <em>indefinido<\/em> regelmäßig: <em>pensé, pensó, volví, volvió, jugué, jugó<\/em>.<\/div>"},{"h":"Unregelmäßige Stämme","html":"<p>Eine Gruppe häufiger Verben hat einen eigenen Stamm und eigene Endungen ohne Akzent (<em>yo<\/em> und <em>él<\/em> sind auf dem Stamm betont: <em>tuve, pudo<\/em>): <em>-e, -iste, -o, -imos, -isteis, -ieron<\/em>.<\/p><table><tr><th>Infinitiv<\/th><th>Stamm<\/th><th>yo / él<\/th><\/tr><tr><td><em>tener<\/em><\/td><td><em>tuv-<\/em><\/td><td><em>tuve / tuvo<\/em><\/td><\/tr><tr><td><em>estar<\/em><\/td><td><em>estuv-<\/em><\/td><td><em>estuve / estuvo<\/em><\/td><\/tr><tr><td><em>andar<\/em><\/td><td><em>anduv-<\/em><\/td><td><em>anduve / anduvo<\/em><\/td><\/tr><tr><td><em>poder<\/em><\/td><td><em>pud-<\/em><\/td><td><em>pude / pudo<\/em><\/td><\/tr><tr><td><em>poner<\/em><\/td><td><em>pus-<\/em><\/td><td><em>puse / puso<\/em><\/td><\/tr><tr><td><em>saber<\/em><\/td><td><em>sup-<\/em><\/td><td><em>supe / supo<\/em><\/td><\/tr><tr><td><em>haber<\/em><\/td><td><em>hub-<\/em><\/td><td><em>hube / hubo<\/em><\/td><\/tr><tr><td><em>querer<\/em><\/td><td><em>quis-<\/em><\/td><td><em>quise / quiso<\/em><\/td><\/tr><tr><td><em>venir<\/em><\/td><td><em>vin-<\/em><\/td><td><em>vine / vino<\/em><\/td><\/tr><tr><td><em>hacer<\/em><\/td><td><em>hic-<\/em><\/td><td><em>hice / hizo<\/em><\/td><\/tr><\/table><p>Vollständig: <em>tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron<\/em>.<\/p><p><b>j-Stämme<\/b> haben in der 3. Person Plural <em>-eron<\/em> statt <em>-ieron<\/em>:<\/p><table><tr><th><\/th><th>decir<\/th><th>traer<\/th><th>conducir<\/th><\/tr><tr><td>yo<\/td><td><em>dije<\/em><\/td><td><em>traje<\/em><\/td><td><em>conduje<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>dijiste<\/em><\/td><td><em>trajiste<\/em><\/td><td><em>condujiste<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>dijo<\/em><\/td><td><em>trajo<\/em><\/td><td><em>condujo<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>dijimos<\/em><\/td><td><em>trajimos<\/em><\/td><td><em>condujimos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>dijisteis<\/em><\/td><td><em>trajisteis<\/em><\/td><td><em>condujisteis<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>dijeron<\/em><\/td><td><em>trajeron<\/em><\/td><td><em>condujeron<\/em><\/td><\/tr><\/table><p>Ebenso <em>producir → produje<\/em>, <em>traducir → traduje<\/em>.<\/p><div class=\"warn\">Achtung: <em>hizo<\/em> mit <em>z<\/em> (nicht <em>*hico<\/em>), <em>dijeron<\/em> ohne <em>i<\/em> (nicht <em>*dijieron<\/em>), und keine Akzente: <em>tuve, pudo<\/em> (nicht <em>*tuvé, *pudó<\/em>).<\/div>"},{"h":"ser, ir, dar, ver","html":"<table><tr><th><\/th><th>ser / ir<\/th><th>dar<\/th><th>ver<\/th><\/tr><tr><td>yo<\/td><td><em>fui<\/em><\/td><td><em>di<\/em><\/td><td><em>vi<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>fuiste<\/em><\/td><td><em>diste<\/em><\/td><td><em>viste<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>fue<\/em><\/td><td><em>dio<\/em><\/td><td><em>vio<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>fuimos<\/em><\/td><td><em>dimos<\/em><\/td><td><em>vimos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>fuisteis<\/em><\/td><td><em>disteis<\/em><\/td><td><em>visteis<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>fueron<\/em><\/td><td><em>dieron<\/em><\/td><td><em>vieron<\/em><\/td><\/tr><\/table><p><em>ser<\/em> und <em>ir<\/em> haben im <em>indefinido<\/em> dieselben Formen – der Zusammenhang klärt die Bedeutung:<\/p><p><em>Fui a Sevilla en tren.<\/em> <small>Ich fuhr mit dem Zug nach Sevilla.<\/small> (<em>ir<\/em>)<br><em>El viaje fue muy agradable.<\/em> <small>Die Reise war sehr angenehm.<\/small> (<em>ser<\/em>)<\/p><div class=\"tip\">Einsilbige Formen tragen keinen Akzent: <em>fui, fue, di, dio, vi, vio<\/em>. <em>dar<\/em> hat die Endungen der <em>-er/-ir<\/em>-Verben: <em>dieron<\/em>.<\/div>"},{"h":"Pretérito indefinido: Gebrauch","html":"<p>Das <em>indefinido<\/em> erzählt <b>abgeschlossene Ereignisse<\/b> in einem <b>abgeschlossenen Zeitraum<\/b>, der keinen Bezug mehr zur Gegenwart hat:<\/p><ul><li>Mit Zeitangaben der Vergangenheit: <em>Ayer cenamos en un restaurante vasco.<\/em> <em>El año pasado me mudé a Bilbao.<\/em> <em>En 2010 España ganó el Mundial.<\/em><\/li><li>Aufeinanderfolgende Ereignisse: <em>Se levantó, se duchó y salió corriendo.<\/em> <small>Sie stand auf, duschte und rannte los.<\/small><\/li><li>Abgeschlossene Dauer: <em>Vivimos seis años en Chile.<\/em> <small>Wir haben sechs Jahre in Chile gelebt (jetzt nicht mehr).<\/small><\/li><li>Plötzlich eintretende Ereignisse: <em>De repente se fue la luz.<\/em> <small>Plötzlich fiel der Strom aus.<\/small><\/li><\/ul><p>Typische Signalwörter: <em>ayer, anteayer, anoche, el lunes pasado, la semana pasada, el mes pasado, el año pasado, en 2015, hace dos años, aquel día, de repente, entonces<\/em>.<\/p><div class=\"warn\">Achtung: Im Deutschen sagt man fast immer „Ich habe … gemacht“, auch für gestern. Im Spanischen heißt das trotzdem <em>indefinido<\/em>: <em>Ayer vi a Pedro<\/em> (nicht <em>*Ayer he visto a Pedro<\/em>).<\/div>"},{"h":"perfecto oder indefinido?","html":"<table><tr><th>perfecto<\/th><th>indefinido<\/th><\/tr><tr><td>Zeitraum noch offen: <em>Esta semana he trabajado mucho.<\/em><\/td><td>Zeitraum abgeschlossen: <em>La semana pasada trabajé mucho.<\/em><\/td><\/tr><tr><td>Erfahrung ohne Zeitpunkt: <em>He estado en Perú dos veces.<\/em><\/td><td>mit Zeitpunkt: <em>Estuve en Perú en 2018.<\/em><\/td><\/tr><tr><td>Bezug zur Gegenwart: <em>Ha muerto el actor.<\/em> (Nachricht)<\/td><td>reine Vergangenheit: <em>Cervantes murió en 1616.<\/em><\/td><\/tr><\/table><p>Entscheidend ist, wie der Sprecher den Zeitraum sieht: <em>Este verano he ido a Italia<\/em> (der Sommer läuft noch oder wird noch als „dieser“ empfunden) – <em>Este verano fui a Italia<\/em> (im Winter gesagt, der Sommer ist vorbei). Beides ist möglich.<\/p><div class=\"warn\">Lateinamerika (und die Kanaren sowie Teile Nordwestspaniens): Hier verwendet man das <em>indefinido<\/em> auch für heute und mit <em>ya<\/em>: <em>Hoy me levanté temprano. ¿Ya comiste?<\/em> Das <em>perfecto<\/em> ist dort seltener und betont meist etwas, das bis jetzt andauert: <em>Siempre he vivido aquí.<\/em><\/div><div class=\"tip\">Faustregel für Spanien: Kann man „heute / diese Woche / schon / je“ dazudenken → <em>perfecto<\/em>. Steht „gestern / letzte Woche / 2015“ da → <em>indefinido<\/em>.<\/div>"}],"exercises":[{"type":"gap","title":"Pretérito perfecto","task":"Setze das Verb im pretérito perfecto ein.","items":[{"q":"Esta mañana (yo, desayunar) ___ en la terraza.","a":["he desayunado"],"de":"Heute Morgen habe ich auf der Terrasse gefrühstückt."},{"q":"¿(tú, leer) ___ ya el correo del jefe?","a":["Has leído","has leído"],"de":"Hast du die Mail vom Chef schon gelesen?"},{"q":"Los niños (romper) ___ la ventana con el balón.","a":["han roto"],"de":"Die Kinder haben das Fenster mit dem Ball zerbrochen."},{"q":"Todavía no (nosotros, ver) ___ la nueva película.","a":["hemos visto"],"de":"Wir haben den neuen Film noch nicht gesehen."},{"q":"¿Qué (vosotros, hacer) ___ este fin de semana?","a":["habéis hecho"],"de":"Was habt ihr dieses Wochenende gemacht?"},{"q":"Mi hermana (escribir) ___ un libro de cocina.","a":["ha escrito"],"de":"Meine Schwester hat ein Kochbuch geschrieben."},{"q":"¿Quién (abrir) ___ la puerta?","a":["ha abierto"],"de":"Wer hat die Tür geöffnet?"},{"q":"Mis padres todavía no (volver) ___ de viaje.","a":["han vuelto"],"de":"Meine Eltern sind noch nicht von der Reise zurück."},{"q":"Nunca te (yo, decir) ___ una mentira.","a":["he dicho"],"de":"Ich habe dich nie angelogen."},{"q":"Por fin (ellos, resolver) ___ el problema.","a":["han resuelto"],"de":"Endlich haben sie das Problem gelöst."}]},{"type":"gap","title":"Indefinido: regelmäßige Verben","task":"Setze das Verb im pretérito indefinido ein.","items":[{"q":"Ayer (yo, trabajar) ___ hasta las diez.","a":["trabajé"],"de":"Gestern habe ich bis zehn gearbeitet."},{"q":"Mi abuelo (nacer) ___ en un pueblo de Teruel.","a":["nació"],"de":"Mein Großvater wurde in einem Dorf in Teruel geboren."},{"q":"¿A qué hora (tú, salir) ___ anoche?","a":["saliste"],"de":"Um wie viel Uhr bist du gestern Abend ausgegangen?"},{"q":"El verano pasado (nosotros, alquilar) ___ una casa en la costa.","a":["alquilamos"],"de":"Letzten Sommer haben wir ein Haus an der Küste gemietet."},{"q":"Ellos (vender) ___ el coche hace un mes.","a":["vendieron"],"de":"Sie haben das Auto vor einem Monat verkauft."},{"q":"¿Vosotros (comprender) ___ la explicación?","a":["comprendisteis"],"de":"Habt ihr die Erklärung verstanden?"},{"q":"La reunión (terminar) ___ muy tarde.","a":["terminó"],"de":"Die Besprechung endete sehr spät."},{"q":"En 2012 (ellos, abrir) ___ su primera tienda.","a":["abrieron"],"de":"2012 eröffneten sie ihr erstes Geschäft."}]},{"type":"gap","title":"Schreibung und Stammwechsel","task":"Setze das Verb im pretérito indefinido ein.","items":[{"q":"Anoche (yo, llegar) ___ a casa a las dos.","a":["llegué"],"de":"Gestern Nacht bin ich um zwei nach Hause gekommen."},{"q":"(yo, buscar) ___ las llaves por todas partes.","a":["Busqué","busqué"],"de":"Ich habe die Schlüssel überall gesucht."},{"q":"El lunes (yo, empezar) ___ un curso de cerámica.","a":["empecé"],"de":"Am Montag habe ich einen Töpferkurs angefangen."},{"q":"Mi padre (leer) ___ la noticia en el periódico.","a":["leyó"],"de":"Mein Vater hat die Nachricht in der Zeitung gelesen."},{"q":"Los vecinos (oír) ___ un ruido extraño.","a":["oyeron"],"de":"Die Nachbarn hörten ein seltsames Geräusch."},{"q":"El camarero nos (servir) ___ muy rápido.","a":["sirvió"],"de":"Der Kellner hat uns sehr schnell bedient."},{"q":"Los niños (dormir) ___ en el coche.","a":["durmieron"],"de":"Die Kinder haben im Auto geschlafen."},{"q":"Mi compañera (preferir) ___ quedarse en casa.","a":["prefirió"],"de":"Meine Kollegin blieb lieber zu Hause."}]},{"type":"gap","title":"Unregelmäßige Stämme","task":"Setze das Verb im pretérito indefinido ein.","items":[{"q":"El sábado (nosotros, tener) ___ visita.","a":["tuvimos"],"de":"Am Samstag hatten wir Besuch."},{"q":"¿Dónde (tú, estar) ___ ayer por la tarde?","a":["estuviste"],"de":"Wo warst du gestern Nachmittag?"},{"q":"No (yo, poder) ___ dormir por el calor.","a":["pude"],"de":"Ich konnte wegen der Hitze nicht schlafen."},{"q":"¿Quién (hacer) ___ esta tarta?","a":["hizo"],"de":"Wer hat diese Torte gebacken?"},{"q":"Mis primos (venir) ___ a la boda desde Argentina.","a":["vinieron"],"de":"Meine Cousins kamen aus Argentinien zur Hochzeit."},{"q":"Los alumnos no (decir) ___ nada.","a":["dijeron"],"de":"Die Schüler sagten nichts."},{"q":"¿(vosotros, traer) ___ el vino?","a":["Trajisteis","trajisteis"],"de":"Habt ihr den Wein mitgebracht?"},{"q":"Ana (poner) ___ las flores en la mesa.","a":["puso"],"de":"Ana stellte die Blumen auf den Tisch."},{"q":"Cuando (yo, saber) ___ la noticia, llamé a mi madre.","a":["supe"],"de":"Als ich die Nachricht erfuhr, rief ich meine Mutter an."},{"q":"Ayer (yo, conducir) ___ seis horas sin parar.","a":["conduje"],"de":"Gestern bin ich sechs Stunden ohne Pause gefahren."}]},{"type":"gap","title":"ser, ir, dar, ver","task":"Setze das Verb im pretérito indefinido ein.","items":[{"q":"El año pasado (nosotros, ir) ___ a Marruecos.","a":["fuimos"],"de":"Letztes Jahr sind wir nach Marokko gefahren."},{"q":"La fiesta (ser) ___ un éxito.","a":["fue"],"de":"Die Party war ein Erfolg."},{"q":"¿(tú, ver) ___ el partido anoche?","a":["Viste","viste"],"de":"Hast du gestern Abend das Spiel gesehen?"},{"q":"Mis amigos me (dar) ___ una sorpresa.","a":["dieron"],"de":"Meine Freunde haben mir eine Überraschung bereitet."},{"q":"¿Adónde (vosotros, ir) ___ de vacaciones?","a":["fuisteis"],"de":"Wohin seid ihr in den Urlaub gefahren?"},{"q":"Le (yo, dar) ___ las gracias por todo.","a":["di"],"de":"Ich bedankte mich bei ihm für alles."},{"q":"Mis abuelos (ser) ___ muy felices en aquella casa.","a":["fueron"],"de":"Meine Großeltern waren in jenem Haus sehr glücklich."},{"q":"Nadie (ver) ___ al ladrón.","a":["vio"],"de":"Niemand sah den Dieb."}]},{"type":"choice","title":"perfecto oder indefinido? (Spanien)","task":"Wähle die passende Zeit.","items":[{"q":"Hoy ___ temprano.","options":["me he levantado","me levanté"],"a":0,"why":"hoy = noch nicht abgeschlossener Zeitraum → perfecto."},{"q":"Ayer ___ temprano.","options":["me he levantado","me levanté"],"a":1,"why":"ayer = abgeschlossener Zeitraum → indefinido."},{"q":"¿___ alguna vez paella de marisco?","options":["Has comido","Comiste"],"a":0,"why":"Erfahrung ohne Zeitpunkt (alguna vez) → perfecto."},{"q":"En 2005 ___ a Londres por primera vez.","options":["he viajado","viajé"],"a":1,"why":"Jahreszahl in der Vergangenheit → indefinido."},{"q":"Todavía no ___ los deberes.","options":["he terminado","terminé"],"a":0,"why":"todavía no → perfecto."},{"q":"La semana pasada ___ muy enferma.","options":["he estado","estuve"],"a":1,"why":"la semana pasada → indefinido."},{"q":"Esta semana ___ tres veces al gimnasio.","options":["he ido","fui"],"a":0,"why":"esta semana → perfecto."},{"q":"Picasso ___ en Málaga en 1881.","options":["ha nacido","nació"],"a":1,"why":"Historisches Ereignis mit Datum → indefinido."},{"q":"Hace dos años ___ a mi pareja.","options":["he conocido","conocí"],"a":1,"why":"hace + Zeitraum (= vor) → indefinido."},{"q":"México: «Hoy ___ temprano», dice Carlos.","options":["me he levantado","me levanté"],"a":1,"why":"In Lateinamerika wird auch für heute meist das indefinido verwendet."}]},{"type":"choice","title":"Die richtige Form","task":"Welche Form ist korrekt?","items":[{"q":"Ellos ___ la verdad. (decir)","options":["dijieron","dijeron","decieron"],"a":1,"why":"j-Stämme haben -eron: dijeron."},{"q":"Ella ___ la cena. (hacer)","options":["hició","hizo","hico"],"a":1,"why":"hacer → hizo (mit z, ohne Akzent)."},{"q":"Yo ___ que salir antes. (tener)","options":["tuvé","tení","tuve"],"a":2,"why":"Unregelmäßige Stämme haben unbetonte Endungen: tuve."},{"q":"Él ___ al jefe. (ver)","options":["vió","vio","veyó"],"a":1,"why":"Einsilbig → ohne Akzent: vio."},{"q":"Yo ___ la factura. (pagar)","options":["pagé","pagué","pagüé"],"a":1,"why":"-gar → -gué in der yo-Form."},{"q":"Ellos ___ un puente. (construir)","options":["construieron","construyeron","construyieron"],"a":1,"why":"i → y zwischen Vokalen: construyeron."},{"q":"La señora ___ un café. (pedir)","options":["pedió","pidió","pidó"],"a":1,"why":"-ir-Stammwechsel e → i in der 3. Person: pidió."},{"q":"El paquete ha sido ___. (abrir)","options":["abrido","abierto","abrío"],"a":1,"why":"abrir hat das unregelmäßige Partizip abierto."}]}],"cards":[{"f":"pretérito perfecto – Bildung","b":"he/has/ha/hemos/habéis/han + Partizip (unveränderlich)"},{"f":"Partizip von leer / traer / oír","b":"leído / traído / oído (mit Akzent)"},{"f":"hacer / decir – Partizip","b":"hecho / dicho"},{"f":"ver / poner – Partizip","b":"visto / puesto"},{"f":"escribir / abrir – Partizip","b":"escrito / abierto"},{"f":"volver / romper – Partizip","b":"vuelto / roto"},{"f":"morir / cubrir / resolver – Partizip","b":"muerto / cubierto / resuelto"},{"f":"descubrir / devolver – Partizip","b":"descubierto / devuelto"},{"f":"Signalwörter perfecto","b":"hoy, esta semana, este año, ya, todavía no, alguna vez, nunca"},{"f":"Signalwörter indefinido","b":"ayer, anoche, el año pasado, en 2010, hace dos años, de repente"},{"f":"Indefinido-Endungen -ar","b":"-é, -aste, -ó, -amos, -asteis, -aron"},{"f":"Indefinido-Endungen -er/-ir","b":"-í, -iste, -ió, -imos, -isteis, -ieron"},{"f":"canto / cantó","b":"ich singe / er sang – der Akzent entscheidet"},{"f":"buscar / llegar / empezar – yo (indefinido)","b":"busqué / llegué / empecé"},{"f":"leer / oír – 3. Person (indefinido)","b":"leyó, leyeron / oyó, oyeron"},{"f":"pedir – indefinido","b":"pedí, pediste, pidió, pedimos, pedisteis, pidieron"},{"f":"dormir – indefinido","b":"dormí, dormiste, durmió, dormimos, dormisteis, durmieron"},{"f":"pensar / volver – indefinido 3. Sg.","b":"pensó / volvió (kein Stammwechsel bei -ar/-er)"},{"f":"Endungen der unregelmäßigen Stämme","b":"-e, -iste, -o, -imos, -isteis, -ieron (ohne Akzent)"},{"f":"tener / estar / poder – yo (indefinido)","b":"tuve / estuve / pude"},{"f":"poner / saber / querer – yo (indefinido)","b":"puse / supe / quise"},{"f":"venir / hacer – yo und él (indefinido)","b":"vine, vino / hice, hizo"},{"f":"decir – indefinido","b":"dije, dijiste, dijo, dijimos, dijisteis, dijeron"},{"f":"traer / conducir – yo (indefinido)","b":"traje / conduje (3. Pl.: trajeron, condujeron)"},{"f":"ser / ir – indefinido","b":"fui, fuiste, fue, fuimos, fuisteis, fueron (beide gleich)"},{"f":"dar – indefinido","b":"di, diste, dio, dimos, disteis, dieron"},{"f":"ver – indefinido","b":"vi, viste, vio, vimos, visteis, vieron"},{"f":"haber – indefinido 3. Sg.","b":"hubo: Hubo un accidente."},{"f":"„Gestern habe ich Pedro gesehen.“","b":"Ayer vi a Pedro. (indefinido, nicht perfecto)"},{"f":"perfecto vs. indefinido in Lateinamerika","b":"Dort meist indefinido, auch für heute: ¿Ya comiste?"},{"f":"Erfahrung mit / ohne Zeitpunkt","b":"He estado en Perú. / Estuve en Perú en 2018."}],"id":"k14"},{"nr":13,"title":"Die Vergangenheit II: imperfecto und Kontrast","teil":"Das Verb und seine Ergänzungen","intro":"Mit dem imperfecto beschreibst du, wie etwas war und was man früher gewöhnlich tat. Das Zusammenspiel von imperfecto, indefinido und pluscuamperfecto ist der Schlüssel zum flüssigen Erzählen auf Spanisch.","sections":[{"h":"Imperfecto: Formen","html":"<table><tr><th><\/th><th>mirar<\/th><th>tener<\/th><th>salir<\/th><\/tr><tr><td>yo<\/td><td><em>miraba<\/em><\/td><td><em>tenía<\/em><\/td><td><em>salía<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>mirabas<\/em><\/td><td><em>tenías<\/em><\/td><td><em>salías<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>miraba<\/em><\/td><td><em>tenía<\/em><\/td><td><em>salía<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>mirábamos<\/em><\/td><td><em>teníamos<\/em><\/td><td><em>salíamos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>mirabais<\/em><\/td><td><em>teníais<\/em><\/td><td><em>salíais<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>miraban<\/em><\/td><td><em>tenían<\/em><\/td><td><em>salían<\/em><\/td><\/tr><\/table><p><em>-ar<\/em>-Verben: <em>-aba<\/em>; <em>-er<\/em>- und <em>-ir<\/em>-Verben: <em>-ía<\/em>. Stammwechsel gibt es im <em>imperfecto<\/em> nicht: <em>pensaba, podía, dormía, pedía, hacía, decía<\/em>.<\/p><div class=\"tip\">1. und 3. Person Singular sind gleich (<em>miraba<\/em> = ich / er / sie / Sie schaute). Bei Unklarheit setzt man das Pronomen: <em>Yo miraba la tele y él leía.<\/em><\/div><div class=\"warn\">Achtung Akzente: <em>mirábamos<\/em> (nur <em>nosotros<\/em> bei <em>-ar<\/em>), aber bei <em>-er/-ir<\/em> <b>alle<\/b> Formen: <em>tenía, tenías, teníamos …<\/em><\/div>"},{"h":"Nur drei unregelmäßige Verben: ser, ir, ver","html":"<table><tr><th><\/th><th>ser<\/th><th>ir<\/th><th>ver<\/th><\/tr><tr><td>yo<\/td><td><em>era<\/em><\/td><td><em>iba<\/em><\/td><td><em>veía<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>eras<\/em><\/td><td><em>ibas<\/em><\/td><td><em>veías<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>era<\/em><\/td><td><em>iba<\/em><\/td><td><em>veía<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>éramos<\/em><\/td><td><em>íbamos<\/em><\/td><td><em>veíamos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>erais<\/em><\/td><td><em>ibais<\/em><\/td><td><em>veíais<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>eran<\/em><\/td><td><em>iban<\/em><\/td><td><em>veían<\/em><\/td><\/tr><\/table><p><em>hay<\/em> lautet im <em>imperfecto<\/em> <em>había<\/em> (immer Singular): <em>Había muchos árboles en la calle.<\/em><\/p><p><em>Cuando éramos jóvenes, íbamos a todos los conciertos.<\/em> <small>Als wir jung waren, gingen wir auf alle Konzerte.<\/small><\/p><div class=\"tip\">Das <em>imperfecto<\/em> ist die regelmäßigste Zeit des Spanischen: Mit drei Ausnahmen kann man jedes Verb sofort bilden.<\/div>"},{"h":"Imperfecto: Gebrauch","html":"<ul><li><b>Beschreibung<\/b> von Personen, Dingen, Orten, Situationen: <em>La casa era antigua y tenía un patio lleno de plantas.<\/em> <small>Das Haus war alt und hatte einen Innenhof voller Pflanzen.<\/small><\/li><li><b>Gewohnheiten<\/b> in der Vergangenheit („früher, immer, oft“): <em>De pequeña pasaba los veranos en el pueblo.<\/em> <small>Als Kind verbrachte ich die Sommer im Dorf.<\/small> Auch mit <em>soler<\/em>: <em>Solíamos cenar a las diez.<\/em><\/li><li><b>Hintergrund / laufende Handlung<\/b>: <em>Llovía y la gente esperaba el autobús.<\/em> <small>Es regnete, und die Leute warteten auf den Bus.<\/small><\/li><li><b>Uhrzeit und Alter<\/b> in der Vergangenheit: <em>Eran las once de la noche.<\/em> <em>Cuando aprendí a nadar, tenía cinco años.<\/em><\/li><li><b>Gefühle, Gedanken, Zustände<\/b>: <em>Estaba nervioso porque no sabía qué hacer.<\/em><\/li><li><b>Höfliche Bitte<\/b> (abgeschwächt): <em>Quería un kilo de tomates, por favor.<\/em> <small>Ich hätte gern ein Kilo Tomaten.<\/small> <em>Venía a preguntar por el piso.<\/em><\/li><\/ul><p>Signalwörter: <em>antes, de niño / de pequeño, siempre, a menudo, todos los días, normalmente, cada verano, mientras<\/em>.<\/p>"},{"h":"Imperfecto oder indefinido?","html":"<p>Stell dir eine Erzählung als Theaterstück vor: Das <em>imperfecto<\/em> malt das <b>Bühnenbild<\/b> (wie war es?), das <em>indefinido<\/em> erzählt die <b>Handlung<\/b> (was geschah dann?).<\/p><table><tr><th>imperfecto<\/th><th>indefinido<\/th><\/tr><tr><td>Hintergrund, Situation<\/td><td>Ereignis, das eintritt<\/td><\/tr><tr><td>Gewohnheit, Wiederholung ohne Zahl<\/td><td>einmalige oder gezählte Handlung<\/td><\/tr><tr><td>Handlung im Verlauf (ohne Anfang/Ende)<\/td><td>abgeschlossene Handlung<\/td><\/tr><tr><td><em>Todos los días iba en bici.<\/em><\/td><td><em>Ayer fui en bici.<\/em><\/td><\/tr><tr><td><em>Vivía en Roma.<\/em> (damals)<\/td><td><em>Viví tres años en Roma.<\/em> (begrenzt)<\/td><\/tr><\/table><p><em>Hacía sol y los niños jugaban en el parque. De repente empezó a llover.<\/em> <small>Die Sonne schien, und die Kinder spielten im Park. Plötzlich fing es an zu regnen.<\/small><\/p><div class=\"warn\">Achtung: Eine genannte <b>Dauer<\/b> oder <b>Anzahl<\/b> macht die Handlung abgeschlossen → <em>indefinido<\/em>: <em>Estuve dos horas esperando. Fui cinco veces a Roma.<\/em> Normalerweise nicht: <em>Estaba dos horas esperando.<\/em><\/div>"},{"h":"mientras und cuando","html":"<ul><li><b>Unterbrochene Handlung<\/b>: laufende Handlung (<em>imperfecto<\/em>) + eintretendes Ereignis (<em>indefinido<\/em>):<br><em>Mientras cocinaba, sonó el teléfono.<\/em> <small>Während ich kochte, klingelte das Telefon.<\/small><br><em>Cuando llegué a casa, mi hija dormía.<\/em> <small>Als ich nach Hause kam, schlief meine Tochter.<\/small><\/li><li><b>Zwei gleichzeitige Hintergrundhandlungen<\/b>: beide <em>imperfecto<\/em>:<br><em>Mientras yo lavaba los platos, él barría la cocina.<\/em> <small>Während ich spülte, fegte er die Küche.<\/small><\/li><li><b>Ereigniskette<\/b>: beide <em>indefinido<\/em>:<br><em>Cuando me vio, me saludó.<\/em> <small>Als er mich sah, grüßte er mich.<\/small><\/li><\/ul><p>Auch <em>estaba + gerundio<\/em> beschreibt die laufende Handlung: <em>Estaba duchándome cuando llamaste.<\/em><\/p><div class=\"tip\"><em>mientras<\/em> steht fast immer mit <em>imperfecto<\/em>. Bei <em>cuando<\/em> entscheidet der Inhalt: <em>Cuando era niño…<\/em> (Zeitraum) – <em>Cuando cumplí 18…<\/em> (Zeitpunkt).<\/div>"},{"h":"Verben mit Bedeutungsunterschied","html":"<p>Bei einigen Verben verändert die Wahl der Zeit die Bedeutung – im Deutschen braucht man oft ein anderes Verb:<\/p><table><tr><th>Verb<\/th><th>imperfecto<\/th><th>indefinido<\/th><\/tr><tr><td><em>conocer<\/em><\/td><td><em>conocía<\/em> – kannte<\/td><td><em>conocí<\/em> – lernte kennen<\/td><\/tr><tr><td><em>saber<\/em><\/td><td><em>sabía<\/em> – wusste<\/td><td><em>supe<\/em> – erfuhr<\/td><\/tr><tr><td><em>querer<\/em><\/td><td><em>quería<\/em> – wollte<\/td><td><em>quise<\/em> – versuchte; <em>no quise<\/em> – weigerte mich<\/td><\/tr><tr><td><em>poder<\/em><\/td><td><em>podía<\/em> – konnte (hatte die Möglichkeit)<\/td><td><em>pude<\/em> – schaffte es; <em>no pude<\/em> – es gelang nicht<\/td><\/tr><tr><td><em>tener<\/em><\/td><td><em>tenía<\/em> – hatte, besaß<\/td><td><em>tuve<\/em> – bekam, erlebte<\/td><\/tr><\/table><p><em>Conocía a Pablo desde hacía años, pero a su mujer la conocí ayer.<\/em> <small>Pablo kannte ich seit Jahren, aber seine Frau habe ich gestern kennengelernt.<\/small><br><em>No sabía que estabas aquí. Lo supe por tu hermano.<\/em> <small>Ich wusste nicht, dass du hier bist. Ich habe es von deinem Bruder erfahren.<\/small><br><em>Quería llamarte, pero no podía.<\/em> <small>Ich wollte dich anrufen, konnte aber nicht.<\/small> – <em>Quise llamarte, pero no pude.<\/em> <small>Ich habe versucht, dich anzurufen, aber es ging nicht.<\/small><br><em>Tenía un perro.<\/em> <small>Ich hatte (damals) einen Hund.<\/small> – <em>Tuvo un accidente.<\/em> <small>Er hatte einen Unfall.<\/small><\/p>"},{"h":"Pluscuamperfecto: die Vorvergangenheit","html":"<p>Bildung: <em>imperfecto<\/em> von <em>haber<\/em> + Partizip (unveränderlich).<\/p><table><tr><th><\/th><th>haber<\/th><th>+ Partizip<\/th><\/tr><tr><td>yo<\/td><td><em>había<\/em><\/td><td><em>terminado<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>habías<\/em><\/td><td><em>visto<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>había<\/em><\/td><td><em>salido<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>habíamos<\/em><\/td><td><em>hecho<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>habíais<\/em><\/td><td><em>dicho<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>habían<\/em><\/td><td><em>vuelto<\/em><\/td><\/tr><\/table><p>Das <em>pluscuamperfecto<\/em> beschreibt, was <b>vor<\/b> einem anderen Zeitpunkt der Vergangenheit schon geschehen war – wie das deutsche Plusquamperfekt:<\/p><p><em>Cuando llegamos a la estación, el tren ya había salido.<\/em> <small>Als wir am Bahnhof ankamen, war der Zug schon abgefahren.<\/small><br><em>Me dijo que nunca había estado en Galicia.<\/em> <small>Er sagte mir, dass er noch nie in Galicien gewesen war.<\/small><br><em>Nunca había visto un paisaje tan bonito.<\/em> <small>Ich hatte noch nie eine so schöne Landschaft gesehen.<\/small><\/p><div class=\"warn\">Achtung: Als Hilfsverb wird <em>habían<\/em> im Plural verwendet (<em>Ellos habían salido<\/em>). Nur das unpersönliche „es gab“ bleibt Singular: <em>Había muchos coches.<\/em><\/div>"},{"h":"Pretérito anterior (nur literarisch)","html":"<p>Bildung: <em>indefinido<\/em> von <em>haber<\/em> (<em>hube, hubiste, hubo, hubimos, hubisteis, hubieron<\/em>) + Partizip.<\/p><p>Es bezeichnet eine Handlung, die <b>unmittelbar vor<\/b> einer anderen vergangenen Handlung abgeschlossen war, und steht nach <em>apenas, en cuanto, tan pronto como, cuando, después de que<\/em>:<\/p><p><em>Apenas hubo terminado la carta, la rompió.<\/em> <small>Kaum hatte sie den Brief beendet, zerriss sie ihn.<\/small><\/p><p>Heute findet man es nur noch in gehobener Schriftsprache. Im normalen Sprachgebrauch ersetzt man es durch das <em>indefinido<\/em> oder eine Infinitivkonstruktion: <em>Apenas terminó la carta, la rompió.<\/em> / <em>Después de terminar la carta, la rompió.<\/em><\/p><div class=\"tip\">Aktiv brauchst du das <em>pretérito anterior<\/em> praktisch nie – erkennen solltest du es beim Lesen von Romanen.<\/div>"},{"h":"Erzählen mit allen Vergangenheitszeiten","html":"<p>In einer Erzählung wirken alle Zeiten zusammen:<\/p><p><em>Era un sábado de agosto y hacía un calor terrible. Mis amigos y yo estábamos en la playa desde las diez. De repente, Marta se levantó y gritó: «¡Mi mochila!». Alguien se la había llevado mientras nadábamos. Fuimos a la comisaría, donde nos dijeron que aquel verano ya habían recibido muchas denuncias parecidas. Desde entonces nunca he vuelto a dejar nada solo en la arena.<\/em><\/p><table><tr><th>Zeit<\/th><th>Formen im Text<\/th><th>Funktion<\/th><\/tr><tr><td>imperfecto<\/td><td><em>era, hacía, estábamos, nadábamos<\/em><\/td><td>Hintergrund, Situation<\/td><\/tr><tr><td>indefinido<\/td><td><em>se levantó, gritó, fuimos, dijeron<\/em><\/td><td>Ereignisse, Handlungskette<\/td><\/tr><tr><td>pluscuamperfecto<\/td><td><em>se la había llevado, habían recibido<\/em><\/td><td>was vorher geschehen war<\/td><\/tr><tr><td>perfecto<\/td><td><em>he vuelto<\/em><\/td><td>Bezug zur Gegenwart des Erzählers<\/td><\/tr><\/table><div class=\"tip\">Strategie beim Erzählen: Zuerst die Ereigniskette im <em>indefinido<\/em> festlegen (Was passierte?), dann mit dem <em>imperfecto<\/em> Kulisse und Begleitumstände ausmalen, und mit dem <em>pluscuamperfecto<\/em> zurückblicken.<\/div>"}],"exercises":[{"type":"gap","title":"Imperfecto: Formen","task":"Setze das Verb im imperfecto ein.","items":[{"q":"De niño (yo, jugar) ___ en la calle con mis vecinos.","a":["jugaba"],"de":"Als Kind spielte ich mit meinen Nachbarn auf der Straße."},{"q":"Antes mis padres (vivir) ___ en Zaragoza.","a":["vivían"],"de":"Früher wohnten meine Eltern in Saragossa."},{"q":"Nosotros (cenar) ___ siempre a las nueve.","a":["cenábamos"],"de":"Wir aßen immer um neun zu Abend."},{"q":"Mi abuela (ser) ___ una mujer muy divertida.","a":["era"],"de":"Meine Großmutter war eine sehr lustige Frau."},{"q":"¿Vosotros (ir) ___ al colegio andando?","a":["ibais"],"de":"Seid ihr zu Fuß zur Schule gegangen?"},{"q":"Desde mi ventana (yo, ver) ___ las montañas.","a":["veía"],"de":"Von meinem Fenster aus sah ich die Berge."},{"q":"Los domingos (nosotros, ir) ___ al campo.","a":["íbamos"],"de":"Sonntags fuhren wir aufs Land."},{"q":"¿Qué (tú, querer) ___ ser de mayor?","a":["querías"],"de":"Was wolltest du später einmal werden?"}]},{"type":"choice","title":"Imperfecto oder indefinido?","task":"Wähle die passende Form.","items":[{"q":"Cuando ___ pequeña, tenía miedo de los perros.","options":["era","fui"],"a":0,"why":"Lebensphase / Beschreibung → imperfecto."},{"q":"Ayer ___ a mi profesor de inglés en el metro.","options":["veía","vi"],"a":1,"why":"Einmaliges Ereignis mit ayer → indefinido."},{"q":"___ las ocho cuando sonó el despertador.","options":["Eran","Fueron"],"a":0,"why":"Uhrzeit in der Vergangenheit → imperfecto."},{"q":"Mientras ___ la cena, se fue la luz.","options":["preparaba","preparé"],"a":0,"why":"Laufende, unterbrochene Handlung → imperfecto."},{"q":"Mientras preparaba la cena, ___ la luz.","options":["se iba","se fue"],"a":1,"why":"Eintretendes Ereignis → indefinido."},{"q":"Antes ___ mucho, pero ahora ya no fumo.","options":["fumaba","fumé"],"a":0,"why":"Gewohnheit in der Vergangenheit → imperfecto."},{"q":"El año pasado ___ cuatro veces a Londres.","options":["iba","fui"],"a":1,"why":"Gezählte Wiederholung → indefinido."},{"q":"La casa ___ grande y tenía un jardín precioso.","options":["era","fue"],"a":0,"why":"Beschreibung → imperfecto."},{"q":"Ayer ___ dos horas en la consulta del médico.","options":["esperaba","esperé"],"a":1,"why":"Begrenzte Dauer (dos horas) → indefinido."},{"q":"(Im Laden) Buenos días, ___ unas sandalias.","options":["quería","quise"],"a":0,"why":"Höfliche Bitte → imperfecto."}]},{"type":"gap","title":"Formen mischen","task":"Setze das Verb in der angegebenen Zeit ein.","items":[{"q":"Cuando (nosotros, llegar – indefinido) ___ al hotel, ya era de noche.","a":["llegamos"],"de":"Als wir im Hotel ankamen, war es schon Nacht."},{"q":"Hacía frío y (nevar – imperfecto) ___ sin parar.","a":["nevaba"],"de":"Es war kalt, und es schneite ununterbrochen."},{"q":"De repente (yo, oír – indefinido) ___ un grito.","a":["oí"],"de":"Plötzlich hörte ich einen Schrei."},{"q":"Los niños (estar – imperfecto) ___ muy cansados.","a":["estaban"],"de":"Die Kinder waren sehr müde."},{"q":"El camarero nos (traer – indefinido) ___ la cuenta.","a":["trajo"],"de":"Der Kellner brachte uns die Rechnung."},{"q":"Mi abuelo (tener – imperfecto) ___ una pequeña librería.","a":["tenía"],"de":"Mein Großvater hatte eine kleine Buchhandlung."},{"q":"Aquella noche (ella, dormir – indefinido) ___ muy mal.","a":["durmió"],"de":"In jener Nacht schlief sie sehr schlecht."},{"q":"En aquella época (haber – imperfecto) ___ pocos coches.","a":["había"],"de":"Damals gab es wenige Autos."}]},{"type":"choice","title":"Bedeutungsunterschied","task":"Wähle die Form, die zur deutschen Bedeutung passt.","items":[{"q":"Ich habe meinen Mann in Sevilla kennengelernt: ___ a mi marido en Sevilla.","options":["Conocía","Conocí"],"a":1,"why":"conocer im indefinido = kennenlernen."},{"q":"Damals kannte ich niemanden: Entonces no ___ a nadie.","options":["conocía","conocí"],"a":0,"why":"conocer im imperfecto = kennen (Zustand)."},{"q":"Ich habe es gestern erfahren: Lo ___ ayer.","options":["sabía","supe"],"a":1,"why":"saber im indefinido = erfahren."},{"q":"Wir wussten nicht, dass es geschlossen war: No ___ que estaba cerrado.","options":["sabíamos","supimos"],"a":0,"why":"saber im imperfecto = wissen."},{"q":"Er weigerte sich zu unterschreiben: No ___ firmar.","options":["quería","quiso"],"a":1,"why":"no quise/quiso = sich weigern (tatsächliche Ablehnung)."},{"q":"Endlich schaffte sie es, die Tür zu öffnen: Por fin ___ abrir la puerta.","options":["podía","pudo"],"a":1,"why":"poder im indefinido = es schaffen."},{"q":"Als Kind konnte ich stundenlang lesen: De niño ___ leer durante horas.","options":["podía","pude"],"a":0,"why":"poder im imperfecto = Fähigkeit/Möglichkeit."},{"q":"Sie bekam Zwillinge: ___ gemelos.","options":["Tenía","Tuvo"],"a":1,"why":"tener im indefinido = bekommen (Ereignis)."}]},{"type":"gap","title":"Pluscuamperfecto","task":"Setze das Verb im pluscuamperfecto ein.","items":[{"q":"Cuando llegué al cine, la película ya (empezar) ___.","a":["había empezado"],"de":"Als ich ins Kino kam, hatte der Film schon angefangen."},{"q":"No pude entrar porque (yo, olvidar) ___ las llaves.","a":["había olvidado"],"de":"Ich konnte nicht hinein, weil ich die Schlüssel vergessen hatte."},{"q":"Nunca (nosotros, ver) ___ tanta nieve.","a":["habíamos visto"],"de":"Wir hatten noch nie so viel Schnee gesehen."},{"q":"Me contó que sus padres (volver) ___ a Ecuador.","a":["habían vuelto"],"de":"Er erzählte mir, dass seine Eltern nach Ecuador zurückgekehrt waren."},{"q":"¿(tú, estar) ___ antes en Lisboa?","a":["Habías estado","habías estado"],"de":"Warst du vorher schon in Lissabon gewesen?"},{"q":"Los invitados ya (irse) ___ cuando llegamos.","a":["se habían ido"],"de":"Die Gäste waren schon gegangen, als wir ankamen."},{"q":"Nadie sabía quién (romper) ___ la lámpara.","a":["había roto"],"de":"Niemand wusste, wer die Lampe zerbrochen hatte."},{"q":"Vosotros ya (hacer) ___ la reserva, ¿verdad?","a":["habíais hecho"],"de":"Ihr hattet die Reservierung schon gemacht, oder?"}]},{"type":"choice","title":"Alle Vergangenheitszeiten","task":"Wähle die passende Form.","items":[{"q":"Cuando llegaron los bomberos, el fuego ya se ___.","options":["apagó","había apagado","apagaba"],"a":1,"why":"Vorzeitig zu einem anderen vergangenen Ereignis → pluscuamperfecto."},{"q":"Esta mañana ___ un correo muy raro. (Spanien)","options":["he recibido","recibía","había recibido"],"a":0,"why":"esta mañana → perfecto."},{"q":"Cuando vivíamos en Lima, ___ a la playa cada fin de semana.","options":["fuimos","íbamos","hemos ido"],"a":1,"why":"Gewohnheit → imperfecto."},{"q":"Apenas ___ el sol, salieron del refugio. (literarisch)","options":["hubo salido","ha salido","salía"],"a":0,"why":"Unmittelbare Vorzeitigkeit nach apenas, literarisch → pretérito anterior."},{"q":"Mi padre ___ en 1950 en un pueblo de Cuenca.","options":["nacía","nació","ha nacido"],"a":1,"why":"Abgeschlossenes Ereignis mit Jahreszahl → indefinido."},{"q":"Estaba muy nerviosa porque nunca antes ___ en avión.","options":["volé","volaba","había volado"],"a":2,"why":"Erfahrung bis zu einem Zeitpunkt in der Vergangenheit → pluscuamperfecto."},{"q":"¿___ alguna vez en un festival de música? (Spanien)","options":["Has estado","Estabas","Habías estado"],"a":0,"why":"Lebenserfahrung bis heute → perfecto."},{"q":"Mientras los niños ___, nosotros preparamos la sorpresa.","options":["durmieron","dormían","habían dormido"],"a":1,"why":"Hintergrundhandlung mit mientras → imperfecto."}]}],"cards":[{"f":"Imperfecto-Endungen -ar","b":"-aba, -abas, -aba, -ábamos, -abais, -aban"},{"f":"Imperfecto-Endungen -er/-ir","b":"-ía, -ías, -ía, -íamos, -íais, -ían"},{"f":"Unregelmäßige Verben im imperfecto","b":"Nur drei: ser, ir, ver"},{"f":"ser – imperfecto","b":"era, eras, era, éramos, erais, eran"},{"f":"ir – imperfecto","b":"iba, ibas, iba, íbamos, ibais, iban"},{"f":"ver – imperfecto","b":"veía, veías, veía, veíamos, veíais, veían"},{"f":"hay – imperfecto","b":"había (immer Singular)"},{"f":"Stammwechsel im imperfecto?","b":"Nein: podía, dormía, pedía, pensaba"},{"f":"imperfecto – Hauptfunktionen","b":"Beschreibung, Gewohnheit, Hintergrund, Uhrzeit/Alter, höfliche Bitte"},{"f":"Uhrzeit in der Vergangenheit","b":"Eran las diez. / Era la una."},{"f":"Alter in der Vergangenheit","b":"Tenía siete años cuando…"},{"f":"höfliche Bitte mit imperfecto","b":"Quería un café, por favor."},{"f":"solía + Infinitiv","b":"pflegte zu tun: Solíamos cenar tarde."},{"f":"Bühnenbild vs. Handlung","b":"imperfecto = wie war es? – indefinido = was geschah?"},{"f":"Dauer oder Anzahl genannt","b":"indefinido: Estuve dos horas. Fui tres veces."},{"f":"mientras – welche Zeit?","b":"Meist imperfecto: Mientras cocinaba, sonó el teléfono."},{"f":"Unterbrochene Handlung","b":"imperfecto + indefinido: Cuando llegué, dormía."},{"f":"conocía / conocí","b":"kannte / lernte kennen"},{"f":"sabía / supe","b":"wusste / erfuhr"},{"f":"quería / quise / no quise","b":"wollte / versuchte / weigerte mich"},{"f":"podía / pude / no pude","b":"konnte (Möglichkeit) / schaffte es / es gelang nicht"},{"f":"tenía / tuve","b":"hatte, besaß / bekam, erlebte"},{"f":"pluscuamperfecto – Bildung","b":"había/habías/había/habíamos/habíais/habían + Partizip"},{"f":"pluscuamperfecto – Gebrauch","b":"Vorvergangenheit: El tren ya había salido."},{"f":"habían (Hilfsverb) vs. había (es gab)","b":"Ellos habían salido. – Había muchos coches."},{"f":"pretérito anterior – Bildung","b":"hube/hubiste/hubo/hubimos/hubisteis/hubieron + Partizip"},{"f":"pretérito anterior – Gebrauch","b":"Nur literarisch nach apenas, en cuanto: Apenas hubo terminado, salió."},{"f":"pretérito anterior im Alltag ersetzen","b":"Apenas terminó, salió. / Después de terminar, salió."},{"f":"Erzählstrategie","b":"indefinido für die Ereigniskette, imperfecto für die Kulisse, pluscuamperfecto für Rückblicke"}],"id":"k15"},{"nr":14,"title":"Futur und Konditional","teil":"Das Verb und seine Ergänzungen","intro":"Mit ir a + Infinitiv, dem futuro und dem condicional sprichst du über Pläne, Prognosen und Möglichkeiten – und du kannst Vermutungen und höfliche Bitten ausdrücken. Beide Zeiten bauen auf denselben Stämmen auf, daher lernst du sie am besten zusammen.","sections":[{"h":"ir a + Infinitiv: die nahe Zukunft","html":"<p>Die häufigste Art, im Alltag über Zukünftiges zu sprechen, ist <em>ir a<\/em> + Infinitiv. Sie drückt Pläne, Absichten und Dinge aus, die sich schon abzeichnen.<\/p><table><tr><th>Form<\/th><th>Beispiel<\/th><\/tr><tr><td><em>voy a<\/em><\/td><td><em>Voy a pintar la cocina.<\/em><br><small>Ich werde die Küche streichen.<\/small><\/td><\/tr><tr><td><em>vas a<\/em><\/td><td><em>¿Vas a venir a la cena?<\/em><br><small>Kommst du zum Abendessen?<\/small><\/td><\/tr><tr><td><em>va a<\/em><\/td><td><em>Mira esas nubes: va a llover.<\/em><br><small>Schau dir die Wolken an: Es wird regnen.<\/small><\/td><\/tr><tr><td><em>vamos / vais / van a<\/em><\/td><td><em>Van a abrir una panadería.<\/em><br><small>Sie wollen eine Bäckerei eröffnen.<\/small><\/td><\/tr><\/table><p>Auch das einfache Präsens kann Zukunft ausdrücken, wenn der Termin feststeht: <em>Mañana salimos a las seis.<\/em> <small>Morgen fahren wir um sechs los.<\/small><\/p><div class=\"warn\">Achtung: Das <em>a<\/em> nicht vergessen! <em>Voy a comer<\/em>, nicht <em>*voy comer<\/em>.<\/div>"},{"h":"futuro simple: regelmäßige Formen","html":"<p>Das futuro simple wird gebildet, indem man an den <b>ganzen Infinitiv<\/b> Endungen anhängt. Diese Endungen sind für alle drei Konjugationen gleich.<\/p><table><tr><th><\/th><th>trabajar<\/th><th>leer<\/th><th>abrir<\/th><\/tr><tr><td>yo<\/td><td><em>trabajaré<\/em><\/td><td><em>leeré<\/em><\/td><td><em>abriré<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>trabajarás<\/em><\/td><td><em>leerás<\/em><\/td><td><em>abrirás<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>trabajará<\/em><\/td><td><em>leerá<\/em><\/td><td><em>abrirá<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>trabajaremos<\/em><\/td><td><em>leeremos<\/em><\/td><td><em>abriremos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>trabajaréis<\/em><\/td><td><em>leeréis<\/em><\/td><td><em>abriréis<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>trabajarán<\/em><\/td><td><em>leerán<\/em><\/td><td><em>abrirán<\/em><\/td><\/tr><\/table><div class=\"tip\">Merke: Alle Formen außer <em>nosotros<\/em> tragen einen Akzent: <em>-é, -ás, -á, -emos, -éis, -án<\/em>. Die Endungen erinnern an das Präsens von <em>haber<\/em> (he, has, ha …).<\/div><p>Reflexive Verben: <em>Me levantaré temprano.<\/em> <small>Ich werde früh aufstehen.<\/small><\/p>"},{"h":"futuro simple: unregelmäßige Stämme","html":"<p>Zwölf häufige Verben (und ihre Ableitungen) verändern den Stamm. Die Endungen bleiben regelmäßig.<\/p><table><tr><th>Muster<\/th><th>Infinitiv<\/th><th>Futur (yo)<\/th><\/tr><tr><td>e/i fällt weg, <b>d<\/b> wird eingeschoben<\/td><td><em>tener, poner, salir, venir, valer<\/em><\/td><td><em>tendré, pondré, saldré, vendré, valdré<\/em><\/td><\/tr><tr><td>Vokal fällt weg<\/td><td><em>poder, saber, haber, caber, querer<\/em><\/td><td><em>podré, sabré, habré, cabré, querré<\/em><\/td><\/tr><tr><td>Kurzstamm<\/td><td><em>hacer, decir<\/em><\/td><td><em>haré, diré<\/em><\/td><\/tr><\/table><p>Ableitungen folgen dem Grundverb: <em>mantener → mantendré, componer → compondré, deshacer → desharé, convenir → convendré<\/em>.<\/p><p>Das Futur von <em>hay<\/em> lautet <em>habrá<\/em>: <em>Mañana habrá huelga de metro.<\/em> <small>Morgen wird es einen U-Bahn-Streik geben.<\/small><\/p><div class=\"warn\">Achtung: <em>querer → querré<\/em> mit doppeltem r. Und <em>bendecir/maldecir<\/em> sind regelmäßig (<em>bendeciré<\/em>), anders als <em>decir → diré<\/em>.<\/div>"},{"h":"Gebrauch des futuro simple","html":"<ul><li><b>Vorhersagen, Zukunft allgemein<\/b> (eher schriftlich oder neutral): <em>En 2050 la ciudad tendrá más de dos millones de habitantes.<\/em> <small>2050 wird die Stadt über zwei Millionen Einwohner haben.<\/small><\/li><li><b>Versprechen, Vorsätze<\/b>: <em>Te lo devolveré el lunes, te lo prometo.<\/em> <small>Ich gebe es dir am Montag zurück, versprochen.<\/small><\/li><li><b>Vermutung über die Gegenwart<\/b>: <em>¿Dónde está Lucía? – Estará en el gimnasio.<\/em> <small>Wo ist Lucía? – Sie wird (wohl) im Fitnessstudio sein.<\/small> <em>Serán las ocho.<\/em> <small>Es wird etwa acht Uhr sein.<\/small><\/li><li><b>Nachdrückliche Anweisung<\/b>: <em>¡Harás los deberes antes de salir!<\/em> <small>Du machst deine Hausaufgaben, bevor du rausgehst!<\/small><\/li><\/ul><div class=\"tip\">Faustregel: Plan/Absicht → <em>ir a<\/em>; Prognose, Versprechen, Vermutung → futuro.<\/div><div class=\"warn\">Achtung: Das Vermutungsfutur bezieht sich auf <b>jetzt<\/b>. <em>Tendrá unos cuarenta años<\/em> heißt „Er ist wohl um die vierzig“, nicht „Er wird vierzig werden“.<\/div>"},{"h":"futuro compuesto","html":"<p>Bildung: Futur von <em>haber<\/em> + Partizip.<\/p><table><tr><th>Person<\/th><th>Form<\/th><\/tr><tr><td>yo<\/td><td><em>habré terminado<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>habrás terminado<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>habrá terminado<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>habremos terminado<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>habréis terminado<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>habrán terminado<\/em><\/td><\/tr><\/table><ul><li><b>Vorzeitigkeit in der Zukunft<\/b> (deutsches Futur II): <em>A las nueve ya habré terminado el informe.<\/em> <small>Um neun werde ich den Bericht schon fertig haben.<\/small><\/li><li><b>Vermutung über Vergangenes<\/b> (meist mit Bezug zum Jetzt): <em>Ana no ha llegado. Habrá perdido el tren.<\/em> <small>Ana ist nicht gekommen. Sie wird wohl den Zug verpasst haben.<\/small><\/li><\/ul><div class=\"tip\">Vermutungen verschieben sich um eine Zeitstufe: <em>está<\/em> → <em>estará<\/em>; <em>ha estado<\/em> → <em>habrá estado<\/em>; <em>estuvo/estaba<\/em> → <em>estaría<\/em>.<\/div>"},{"h":"condicional simple: Formen","html":"<p>Das condicional verwendet <b>dieselben Stämme wie das Futur<\/b> und hängt die Endungen des imperfecto der -er/-ir-Verben an: <em>-ía, -ías, -ía, -íamos, -íais, -ían<\/em>.<\/p><table><tr><th><\/th><th>viajar<\/th><th>tener<\/th><th>hacer<\/th><\/tr><tr><td>yo<\/td><td><em>viajaría<\/em><\/td><td><em>tendría<\/em><\/td><td><em>haría<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>viajarías<\/em><\/td><td><em>tendrías<\/em><\/td><td><em>harías<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>viajaría<\/em><\/td><td><em>tendría<\/em><\/td><td><em>haría<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>viajaríamos<\/em><\/td><td><em>tendríamos<\/em><\/td><td><em>haríamos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>viajaríais<\/em><\/td><td><em>tendríais<\/em><\/td><td><em>haríais<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>viajarían<\/em><\/td><td><em>tendrían<\/em><\/td><td><em>harían<\/em><\/td><\/tr><\/table><p>Ebenso: <em>pondría, saldría, vendría, valdría, podría, sabría, habría, cabría, querría, diría<\/em>.<\/p><div class=\"warn\">Achtung: Alle Formen haben den Akzent auf dem <em>í<\/em>. <em>podría<\/em> (condicional) ≠ <em>podía<\/em> (imperfecto).<\/div>"},{"h":"Gebrauch des condicional simple","html":"<ul><li><b>Höflichkeit<\/b>: <em>¿Podría cerrar la ventana, por favor?<\/em> <small>Könnten Sie bitte das Fenster schließen?<\/small> <em>Querría hablar con la directora.<\/em> <small>Ich würde gern mit der Direktorin sprechen.<\/small><\/li><li><b>Rat, Empfehlung<\/b>: <em>Deberías dormir más.<\/em> <small>Du solltest mehr schlafen.<\/small> <em>Yo que tú, no le diría nada.<\/em> <small>An deiner Stelle würde ich ihm nichts sagen.<\/small><\/li><li><b>Wunsch<\/b>: <em>Me encantaría vivir junto al mar.<\/em> <small>Ich würde liebend gern am Meer wohnen.<\/small><\/li><li><b>Hypothese<\/b> (oft mit Bedingung): <em>Con más tiempo, aprendería japonés.<\/em> <small>Mit mehr Zeit würde ich Japanisch lernen.<\/small><\/li><li><b>Vermutung über die Vergangenheit<\/b>: <em>Cuando llegó, serían las diez.<\/em> <small>Als er ankam, war es wohl gegen zehn.<\/small><\/li><li><b>Zukunft in der Vergangenheit<\/b> (indirekte Rede): <em>Marta dijo que vendría.<\/em> <small>Marta sagte, sie würde kommen.<\/small><\/li><\/ul><div class=\"tip\">Zeitverschiebung in der indirekten Rede: <em>„Vendré.“<\/em> → <em>Dijo que vendría.<\/em> (Futur → Konditional)<\/div>"},{"h":"condicional compuesto","html":"<p>Bildung: <em>habría, habrías, habría, habríamos, habríais, habrían<\/em> + Partizip.<\/p><ul><li><b>Irreale Vergangenheit<\/b> – etwas wäre geschehen, ist es aber nicht: <em>Yo no habría aceptado esa oferta.<\/em> <small>Ich hätte das Angebot nicht angenommen.<\/small> <em>Con un mapa, habríamos llegado antes.<\/em> <small>Mit einer Karte wären wir früher angekommen.<\/small><\/li><li><b>Vermutung über Vorvergangenes<\/b>: <em>Pensé que ya se habrían ido.<\/em> <small>Ich dachte, sie wären wohl schon gegangen.<\/small><\/li><li><b>Futur II in der Vergangenheit<\/b>: <em>Dijo que a las cinco ya habría terminado.<\/em> <small>Sie sagte, um fünf werde sie schon fertig sein.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Deutsch unterscheidet „hätte“ und „wäre“, Spanisch nicht: immer <em>habría<\/em> + Partizip (<em>habría ido<\/em> = wäre gegangen).<\/div><p>Wie diese Formen in Bedingungssätzen funktionieren, zeigt Kapitel 18.<\/p>"}],"exercises":[{"type":"gap","title":"ir a + Infinitiv","task":"Setze die passende Form von ir a + Infinitiv ein.","items":[{"q":"Esta tarde (yo – llamar) ___ a mi abuela.","a":["voy a llamar"],"de":"Heute Nachmittag werde ich meine Oma anrufen."},{"q":"Cuidado, el vaso (caerse) ___.","a":["se va a caer","va a caerse"],"de":"Vorsicht, das Glas fällt gleich runter."},{"q":"¿Qué (vosotros – hacer) ___ en verano?","a":["vais a hacer"],"de":"Was macht ihr im Sommer?"},{"q":"Mis vecinos (vender) ___ su casa.","a":["van a vender"],"de":"Meine Nachbarn wollen ihr Haus verkaufen."},{"q":"Nosotros no (decir) ___ nada a nadie.","a":["vamos a decir"],"de":"Wir werden niemandem etwas sagen."},{"q":"¿(tú – estudiar) ___ medicina o derecho?","a":["Vas a estudiar","vas a estudiar"],"de":"Wirst du Medizin oder Jura studieren?"}]},{"type":"gap","title":"futuro simple: Formen","task":"Setze das futuro simple ein.","items":[{"q":"El año que viene (nosotros – vivir) ___ en Valencia.","a":["viviremos"],"de":"Nächstes Jahr werden wir in Valencia wohnen."},{"q":"Mañana (yo – tener) ___ más tiempo.","a":["tendré"],"de":"Morgen werde ich mehr Zeit haben."},{"q":"¿(tú – poder) ___ venir el sábado?","a":["Podrás","podrás"],"de":"Wirst du am Samstag kommen können?"},{"q":"Os lo (yo – decir) ___ cuando lo sepa.","a":["diré"],"de":"Ich werde es euch sagen, sobald ich es weiß."},{"q":"En el maletero no (caber) ___ todas las maletas.","a":["cabrán"],"de":"In den Kofferraum werden nicht alle Koffer passen."},{"q":"¿Qué (vosotros – hacer) ___ con tanto dinero?","a":["haréis"],"de":"Was werdet ihr mit so viel Geld machen?"},{"q":"El tren (salir) ___ con retraso.","a":["saldrá"],"de":"Der Zug wird mit Verspätung abfahren."},{"q":"Mañana (haber) ___ tormentas en el norte.","a":["habrá"],"de":"Morgen wird es im Norden Gewitter geben."},{"q":"Mis padres (querer) ___ conocerte.","a":["querrán"],"de":"Meine Eltern werden dich kennenlernen wollen."},{"q":"Si lo pides con amabilidad, ella te lo (poner) ___ en una bolsa.","a":["pondrá"],"de":"Wenn du freundlich fragst, wird sie es dir in eine Tüte tun."}]},{"type":"choice","title":"Zukunft oder Vermutung?","task":"Was drückt das Futur hier aus?","items":[{"q":"Llaman a la puerta. Será el cartero.","options":["Zukunft","Vermutung über die Gegenwart"],"a":1,"why":"Man vermutet, wer gerade jetzt klingelt."},{"q":"El próximo eclipse será en agosto.","options":["Zukunft","Vermutung über die Gegenwart"],"a":0,"why":"Es geht um ein zukünftiges Ereignis."},{"q":"No contesta. Estará dormido.","options":["Zukunft","Vermutung über die Gegenwart"],"a":1,"why":"Vermutung über den momentanen Zustand."},{"q":"Te prometo que no llegaré tarde.","options":["Versprechen","Vermutung über die Gegenwart"],"a":0,"why":"prometer leitet ein Versprechen ein."},{"q":"Sus hijos tendrán unos diez años.","options":["Zukunft","Vermutung über die Gegenwart"],"a":1,"why":"Man schätzt das jetzige Alter."},{"q":"Ana no ha venido. Habrá tenido un problema.","options":["Vermutung über Vergangenes","Futur II (Vorzeitigkeit)"],"a":0,"why":"Man vermutet, was gerade passiert ist."},{"q":"Para junio ya habremos acabado la obra.","options":["Vermutung über Vergangenes","Futur II (Vorzeitigkeit)"],"a":1,"why":"Etwas wird vor einem Zukunftszeitpunkt abgeschlossen sein."}]},{"type":"gap","title":"condicional simple","task":"Setze das condicional simple ein.","items":[{"q":"¿(usted – poder) ___ repetirlo, por favor?","a":["Podría","podría"],"de":"Könnten Sie das bitte wiederholen?"},{"q":"(tú – deber) ___ ir al médico.","a":["Deberías","deberías"],"de":"Du solltest zum Arzt gehen."},{"q":"Me (gustar) ___ aprender a bucear.","a":["gustaría"],"de":"Ich würde gern tauchen lernen."},{"q":"Yo que tú, no (salir) ___ con este tiempo.","a":["saldría"],"de":"An deiner Stelle würde ich bei diesem Wetter nicht rausgehen."},{"q":"Juan dijo que (venir) ___ a las nueve.","a":["vendría"],"de":"Juan sagte, er würde um neun kommen."},{"q":"Cuando nos conocimos, ella (tener) ___ unos veinte años.","a":["tendría"],"de":"Als wir uns kennenlernten, war sie wohl um die zwanzig."},{"q":"Sin vosotros no (nosotros – saber) ___ qué hacer.","a":["sabríamos"],"de":"Ohne euch wüssten wir nicht, was wir tun sollten."},{"q":"¿Qué (vosotros – hacer) ___ en mi lugar?","a":["haríais"],"de":"Was würdet ihr an meiner Stelle tun?"}]},{"type":"choice","title":"Welche Form passt?","task":"Wähle die richtige Form.","items":[{"q":"Me prometió que me ___ al día siguiente.","options":["llamará","llamaría","llamaba"],"a":1,"why":"Zukunft aus Sicht der Vergangenheit → condicional."},{"q":"¿Qué hora es? – No sé, ___ las tres.","options":["serán","serían","habrán sido"],"a":0,"why":"Vermutung über die Gegenwart → futuro simple."},{"q":"Anoche Pedro no vino a la fiesta. ___ cansado.","options":["Estará","Estaría","Está"],"a":1,"why":"Vermutung über einen vergangenen Zustand → condicional."},{"q":"Yo en tu lugar no ___ ese coche; era carísimo.","options":["habré comprado","habría comprado","compraré"],"a":1,"why":"Irreale Vergangenheit → condicional compuesto."},{"q":"Las llaves no están aquí. Las ___ en la oficina.","options":["habré dejado","habría dejado","dejaría"],"a":0,"why":"Vermutung über gerade Vergangenes (Bezug zum Jetzt) → futuro compuesto."},{"q":"Mira qué cielo tan negro: ___ a granizar.","options":["va","irá","iría"],"a":0,"why":"Sichtbare Anzeichen → ir a + Infinitiv im Präsens."},{"q":"¿Te ___ cambiar el turno conmigo?","options":["importará","importaría","importaba"],"a":1,"why":"Höfliche Bitte → condicional."},{"q":"Dijo que para las ocho ya ___ la cena.","options":["habrá preparado","habría preparado","preparará"],"a":1,"why":"Futur II aus Sicht der Vergangenheit → condicional compuesto."}]},{"type":"gap","title":"Zusammengesetzte Formen","task":"Setze futuro compuesto oder condicional compuesto ein.","items":[{"q":"Para el viernes (yo – leer) ___ el libro entero. (futuro compuesto)","a":["habré leído"],"de":"Bis Freitag werde ich das ganze Buch gelesen haben."},{"q":"Hay mucha agua en la calle. (llover) ___ mucho esta noche. (futuro compuesto)","a":["Habrá llovido","habrá llovido"],"de":"Auf der Straße steht viel Wasser. Es wird heute Nacht wohl viel geregnet haben."},{"q":"Con más paciencia, (nosotros – encontrar) ___ una solución. (condicional compuesto)","a":["habríamos encontrado"],"de":"Mit mehr Geduld hätten wir eine Lösung gefunden."},{"q":"Yo no (decir) ___ eso delante de los niños. (condicional compuesto)","a":["habría dicho"],"de":"Ich hätte das nicht vor den Kindern gesagt."},{"q":"Rosa no contesta; ya (irse) ___ a casa. (futuro compuesto)","a":["se habrá ido"],"de":"Rosa antwortet nicht; sie wird wohl schon nach Hause gegangen sein."},{"q":"Sin tu ayuda, ellos no (aprobar) ___. (condicional compuesto)","a":["habrían aprobado"],"de":"Ohne deine Hilfe hätten sie nicht bestanden."},{"q":"Cuando volváis, nosotros ya (poner) ___ la mesa. (futuro compuesto)","a":["habremos puesto"],"de":"Wenn ihr zurückkommt, werden wir schon den Tisch gedeckt haben."},{"q":"¿Tú qué (hacer) ___ en su situación? (condicional compuesto)","a":["habrías hecho"],"de":"Was hättest du in seiner Lage gemacht?"}]}],"cards":[{"f":"Bildung futuro simple","b":"ganzer Infinitiv + -é, -ás, -á, -emos, -éis, -án (hablaré)"},{"f":"Bildung condicional simple","b":"ganzer Infinitiv + -ía, -ías, -ía, -íamos, -íais, -ían (hablaría)"},{"f":"tener – Futur / Konditional (yo)","b":"tendré / tendría"},{"f":"poner – Futur / Konditional (yo)","b":"pondré / pondría"},{"f":"salir – Futur / Konditional (yo)","b":"saldré / saldría"},{"f":"venir – Futur / Konditional (yo)","b":"vendré / vendría"},{"f":"valer – Futur (yo)","b":"valdré"},{"f":"poder – Futur / Konditional (yo)","b":"podré / podría"},{"f":"saber – Futur / Konditional (yo)","b":"sabré / sabría"},{"f":"haber / hay – Futur","b":"habré … / habrá (es wird … geben)"},{"f":"caber – Futur (yo)","b":"cabré"},{"f":"querer – Futur / Konditional (yo)","b":"querré / querría (doppeltes r!)"},{"f":"hacer – Futur / Konditional (yo)","b":"haré / haría"},{"f":"decir – Futur / Konditional (yo)","b":"diré / diría"},{"f":"Plan / sichtbare Anzeichen","b":"ir a + Infinitiv: Voy a cocinar. Va a llover."},{"f":"Es wird wohl acht Uhr sein.","b":"Serán las ocho. (Vermutung → Futur)"},{"f":"Es war wohl gegen zehn.","b":"Serían las diez. (Vermutung Vergangenheit → condicional)"},{"f":"Er wird wohl den Zug verpasst haben.","b":"Habrá perdido el tren. (futuro compuesto)"},{"f":"Du solltest … (Rat)","b":"Deberías …"},{"f":"An deiner Stelle würde ich …","b":"Yo que tú, … / Yo en tu lugar, … + condicional"},{"f":"Könnten Sie …? (höflich)","b":"¿Podría …?"},{"f":"Sie sagte, sie würde kommen.","b":"Dijo que vendría. (Zukunft in der Vergangenheit)"},{"f":"Ich hätte / wäre … (irreal Vergangenheit)","b":"habría + Partizip: habría aceptado, habría ido"},{"f":"Bis Montag werde ich es beendet haben.","b":"Para el lunes lo habré terminado."},{"f":"podría vs. podía","b":"podría = könnte (condicional); podía = konnte (imperfecto)"},{"f":"Ableitungen: mantener, componer, deshacer – Futur (yo)","b":"mantendré, compondré, desharé"}],"id":"k16"},{"nr":15,"title":"Der subjuntivo im Präsens","teil":"Das Verb und seine Ergänzungen","intro":"Der subjuntivo ist der Modus des Wünschens, Fühlens, Zweifelns und des Noch-nicht-Wirklichen. Im Deutschen gibt es dafür keine direkte Entsprechung – deshalb lohnt es sich, Formen und Auslöser systematisch zu lernen.","sections":[{"h":"Was ist der subjuntivo?","html":"<p>Der Indikativ stellt Sachverhalte als Tatsachen dar. Der subjuntivo steht vor allem in <b>Nebensätzen mit <em>que<\/em><\/b>, wenn der Hauptsatz einen Wunsch, ein Gefühl, einen Zweifel oder eine Bewertung ausdrückt – oder wenn etwas noch nicht eingetreten bzw. unbekannt ist.<\/p><table><tr><th>Indikativ<\/th><th>subjuntivo<\/th><\/tr><tr><td><em>Sé que Pablo viene.<\/em><br><small>Ich weiß, dass Pablo kommt.<\/small><\/td><td><em>Quiero que Pablo venga.<\/em><br><small>Ich will, dass Pablo kommt.<\/small><\/td><\/tr><tr><td><em>Cuando llega, cenamos.<\/em><br><small>Wenn (immer) er kommt, essen wir.<\/small><\/td><td><em>Cuando llegue, cenaremos.<\/em><br><small>Wenn er kommt (künftig), essen wir.<\/small><\/td><\/tr><\/table><div class=\"tip\">Leitfrage: Wird etwas als <b>Tatsache behauptet<\/b> (Indikativ) – oder gewünscht, bewertet, bezweifelt, erwartet (subjuntivo)?<\/div>"},{"h":"Regelmäßige Formen: Vokalwechsel","html":"<p>Grundprinzip: Die Verben tauschen ihren Themavokal. <b>-ar → e<\/b>, <b>-er/-ir → a<\/b>.<\/p><table><tr><th><\/th><th>cantar<\/th><th>beber<\/th><th>escribir<\/th><\/tr><tr><td>yo<\/td><td><em>cante<\/em><\/td><td><em>beba<\/em><\/td><td><em>escriba<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>cantes<\/em><\/td><td><em>bebas<\/em><\/td><td><em>escribas<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>cante<\/em><\/td><td><em>beba<\/em><\/td><td><em>escriba<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>cantemos<\/em><\/td><td><em>bebamos<\/em><\/td><td><em>escribamos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>cantéis<\/em><\/td><td><em>bebáis<\/em><\/td><td><em>escribáis<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>canten<\/em><\/td><td><em>beban<\/em><\/td><td><em>escriban<\/em><\/td><\/tr><\/table><div class=\"tip\">Merke: 1. und 3. Person Singular sind gleich (<em>que yo cante / que ella cante<\/em>).<\/div>"},{"h":"Ableitung von der 1. Person Präsens","html":"<p>Fast alle Verben bilden den subjuntivo vom <b>Stamm der 1. Person Singular Präsens Indikativ<\/b>: <em>-o<\/em> weg, neue Endung dran. So werden viele „Unregelmäßige“ ganz regelmäßig.<\/p><table><tr><th>Infinitiv<\/th><th>yo (Ind.)<\/th><th>subjuntivo<\/th><\/tr><tr><td><em>hacer<\/em><\/td><td><em>hago<\/em><\/td><td><em>haga, hagas …<\/em><\/td><\/tr><tr><td><em>tener<\/em><\/td><td><em>tengo<\/em><\/td><td><em>tenga<\/em><\/td><\/tr><tr><td><em>salir<\/em><\/td><td><em>salgo<\/em><\/td><td><em>salga<\/em><\/td><\/tr><tr><td><em>poner / venir<\/em><\/td><td><em>pongo / vengo<\/em><\/td><td><em>ponga / venga<\/em><\/td><\/tr><tr><td><em>decir / oír<\/em><\/td><td><em>digo / oigo<\/em><\/td><td><em>diga / oiga<\/em><\/td><\/tr><tr><td><em>traer / caer<\/em><\/td><td><em>traigo / caigo<\/em><\/td><td><em>traiga / caiga<\/em><\/td><\/tr><tr><td><em>conocer / conducir<\/em><\/td><td><em>conozco / conduzco<\/em><\/td><td><em>conozca / conduzca<\/em><\/td><\/tr><tr><td><em>construir<\/em><\/td><td><em>construyo<\/em><\/td><td><em>construya<\/em><\/td><\/tr><tr><td><em>ver<\/em><\/td><td><em>veo<\/em><\/td><td><em>vea<\/em><\/td><\/tr><\/table><p>Der Stamm bleibt in <b>allen<\/b> Personen: <em>hagamos, tengáis, conozcan<\/em>.<\/p>"},{"h":"Verben mit Stammwechsel","html":"<p>Stammwechselverben wechseln wie im Präsens: e→ie, o→ue (und e→i) in allen Personen <b>außer nosotros/vosotros<\/b>. Bei <em>-ir<\/em>-Verben ändert sich der Stamm aber auch dort (siehe unten).<\/p><table><tr><th><\/th><th>pensar<\/th><th>poder<\/th><th>pedir<\/th><th>dormir<\/th><\/tr><tr><td>yo<\/td><td><em>piense<\/em><\/td><td><em>pueda<\/em><\/td><td><em>pida<\/em><\/td><td><em>duerma<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>pienses<\/em><\/td><td><em>puedas<\/em><\/td><td><em>pidas<\/em><\/td><td><em>duermas<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>pensemos<\/em><\/td><td><em>podamos<\/em><\/td><td><em>pidamos<\/em><\/td><td><em>durmamos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>penséis<\/em><\/td><td><em>podáis<\/em><\/td><td><em>pidáis<\/em><\/td><td><em>durmáis<\/em><\/td><\/tr><tr><td>ellos<\/td><td><em>piensen<\/em><\/td><td><em>puedan<\/em><\/td><td><em>pidan<\/em><\/td><td><em>duerman<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung bei -ir-Verben: In <em>nosotros/vosotros<\/em> wird <b>e→i<\/b> bzw. <b>o→u<\/b>: <em>sintamos, prefiramos, pidamos, durmamos, muramos<\/em>. Bei -ar/-er-Verben bleibt der Stamm dort unverändert (<em>pensemos, volvamos<\/em>).<\/div>"},{"h":"Unregelmäßige Verben","html":"<p>Sechs Verben passen in kein Muster und müssen auswendig gelernt werden (die 1. Person Präsens endet nicht auf <em>-o<\/em>):<\/p><table><tr><th>Infinitiv<\/th><th>subjuntivo<\/th><\/tr><tr><td><em>ser<\/em><\/td><td><em>sea, seas, sea, seamos, seáis, sean<\/em><\/td><\/tr><tr><td><em>estar<\/em><\/td><td><em>esté, estés, esté, estemos, estéis, estén<\/em><\/td><\/tr><tr><td><em>ir<\/em><\/td><td><em>vaya, vayas, vaya, vayamos, vayáis, vayan<\/em><\/td><\/tr><tr><td><em>haber<\/em><\/td><td><em>haya, hayas, haya, hayamos, hayáis, hayan<\/em><\/td><\/tr><tr><td><em>saber<\/em><\/td><td><em>sepa, sepas, sepa, sepamos, sepáis, sepan<\/em><\/td><\/tr><tr><td><em>dar<\/em><\/td><td><em>dé, des, dé, demos, deis, den<\/em><\/td><\/tr><\/table><p>Dazu kommt <em>ver → vea<\/em> (von <em>veo<\/em>, aber gern vergessen).<\/p><div class=\"tip\">Eselsbrücke: <b>DISHES<\/b> – <em>dar, ir, saber, haber, estar, ser<\/em>.<\/div><div class=\"warn\">Achtung: <em>dé<\/em> trägt einen Akzent zur Unterscheidung von der Präposition <em>de<\/em>; <em>deis<\/em> und <em>den<\/em> nicht.<\/div>"},{"h":"Schreibänderungen","html":"<p>Damit die <b>Aussprache<\/b> des Stammes gleich bleibt, ändert sich vor <em>e<\/em> bzw. <em>a<\/em> die Schreibung:<\/p><table><tr><th>Endung<\/th><th>Änderung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>-car<\/em><\/td><td>c → qu<\/td><td><em>buscar → busque<\/em><\/td><\/tr><tr><td><em>-gar<\/em><\/td><td>g → gu<\/td><td><em>llegar → llegue<\/em><\/td><\/tr><tr><td><em>-zar<\/em><\/td><td>z → c<\/td><td><em>empezar → empiece<\/em><\/td><\/tr><tr><td><em>-guar<\/em><\/td><td>gu → gü<\/td><td><em>averiguar → averigüe<\/em><\/td><\/tr><tr><td><em>-ger/-gir<\/em><\/td><td>g → j<\/td><td><em>coger → coja, elegir → elija<\/em><\/td><\/tr><tr><td><em>-guir<\/em><\/td><td>gu → g<\/td><td><em>seguir → siga<\/em><\/td><\/tr><\/table><div class=\"tip\">Das ist dasselbe Prinzip wie im indefinido (<em>busqué, llegué, empecé<\/em>).<\/div>"},{"h":"Wunsch, Wille, Aufforderung","html":"<p>Nach Verben des Wollens, Bittens, Erlaubens und Verbietens steht im <em>que<\/em>-Satz der subjuntivo – sofern das Subjekt wechselt.<\/p><ul><li><em>Quiero que me ayudes.<\/em> <small>Ich will, dass du mir hilfst.<\/small><\/li><li><em>Te pido que no se lo cuentes.<\/em> <small>Ich bitte dich, es ihm nicht zu erzählen.<\/small><\/li><li><em>Mis padres prefieren que volvamos antes de las doce.<\/em> <small>Meinen Eltern ist es lieber, dass wir vor zwölf zurück sind.<\/small><\/li><li><em>El médico me aconseja que camine más.<\/em> <small>Der Arzt rät mir, mehr zu gehen.<\/small><\/li><li><em>No permiten que se fume aquí.<\/em> <small>Hier darf nicht geraucht werden.<\/small><\/li><\/ul><p>Weitere Auslöser: <em>desear, esperar, necesitar, exigir, recomendar, sugerir, prohibir, dejar<\/em>.<\/p><div class=\"warn\">Achtung: Nach <em>querer, desear, esperar, preferir<\/em> bei fremdem Subjekt immer <em>que<\/em> + subjuntivo, nie Infinitiv (wie engl. „I want you to come“): <em>*Quiero tú venir<\/em>. Nur bei <em>dejar, permitir, prohibir, mandar<\/em> geht auch der Infinitiv: <em>No me dejan salir.<\/em><\/div>"},{"h":"Gefühle und Bewertungen","html":"<p>Wenn der Hauptsatz eine emotionale Reaktion ausdrückt, steht der subjuntivo – auch wenn der Inhalt eine Tatsache ist.<\/p><ul><li><em>Me alegra que estés mejor.<\/em> <small>Es freut mich, dass es dir besser geht.<\/small><\/li><li><em>Me molesta que hablen tan alto.<\/em> <small>Es stört mich, dass sie so laut reden.<\/small><\/li><li><em>Siento que no puedas venir.<\/em> <small>Es tut mir leid, dass du nicht kommen kannst.<\/small><\/li><li><em>Tengo miedo de que se pierda.<\/em> <small>Ich habe Angst, dass er sich verläuft.<\/small><\/li><li><em>Nos sorprende que no sepa nadar.<\/em> <small>Es überrascht uns, dass er nicht schwimmen kann.<\/small><\/li><\/ul><div class=\"tip\">Merke: Nicht der Wahrheitsgehalt, sondern die <b>Haltung<\/b> des Sprechers entscheidet. Gefühl → subjuntivo.<\/div>"},{"h":"Meinung, Zweifel und Verneinung","html":"<p>Bejahte Verben des Meinens, Glaubens und Wissens stehen mit Indikativ. Werden sie <b>verneint<\/b>, oder drückt das Verb Zweifel aus, folgt der subjuntivo.<\/p><table><tr><th>Indikativ<\/th><th>subjuntivo<\/th><\/tr><tr><td><em>Creo que tiene razón.<\/em><br><small>Ich glaube, er hat recht.<\/small><\/td><td><em>No creo que tenga razón.<\/em><br><small>Ich glaube nicht, dass er recht hat.<\/small><\/td><\/tr><tr><td><em>Pienso que es caro.<\/em><\/td><td><em>No pienso que sea caro.<\/em><\/td><\/tr><tr><td><em>Estoy seguro de que viene.<\/em><\/td><td><em>No estoy seguro de que venga.<\/em><\/td><\/tr><tr><td>–<\/td><td><em>Dudo que lo consigan.<\/em><br><small>Ich bezweifle, dass sie es schaffen.<\/small><\/td><\/tr><\/table><p>Umgekehrt: <em>No dudo que lo conseguirán.<\/em> (kein Zweifel → meist Indikativ).<\/p><p>In verneinten Fragen und bei <em>¿No crees que …?<\/em> als rhetorischer Frage steht oft der Indikativ: <em>¿No crees que es demasiado tarde?<\/em><\/p><div class=\"warn\">Achtung: <em>*Creo que sea<\/em> ist falsch! Bejahtes <em>creer/pensar/parecer<\/em> → Indikativ.<\/div>"},{"h":"Unpersönliche Ausdrücke","html":"<p>Ausdrücke wie <em>es + Adjektiv + que<\/em> verlangen den subjuntivo, wenn sie bewerten, Notwendigkeit oder Möglichkeit ausdrücken.<\/p><ul><li><em>Es importante que bebas agua.<\/em> <small>Es ist wichtig, dass du Wasser trinkst.<\/small><\/li><li><em>Es posible que llueva.<\/em> <small>Es kann sein, dass es regnet.<\/small><\/li><li><em>Es necesario / mejor / normal / una pena que …<\/em><\/li><li><em>Hace falta que alguien lo revise.<\/em> <small>Jemand muss es überprüfen.<\/small><\/li><\/ul><p>Drückt der Ausdruck dagegen <b>Gewissheit<\/b> aus, folgt der Indikativ:<\/p><ul><li><em>Es verdad que hace frío.<\/em> <small>Es stimmt, dass es kalt ist.<\/small><\/li><li><em>Está claro que no quiere venir.<\/em> <small>Es ist klar, dass er nicht kommen will.<\/small><\/li><li><em>Es evidente / cierto / seguro que …<\/em><\/li><\/ul><div class=\"tip\">Verneint kippt es wieder: <em>No es verdad que haga frío.<\/em> → subjuntivo.<\/div><p>Ohne neues Subjekt steht der Infinitiv: <em>Es importante dormir bien.<\/em><\/p>"},{"h":"Konjunktionen mit subjuntivo","html":"<p>Einige Konjunktionen verlangen <b>immer<\/b> den subjuntivo, weil sie etwas Beabsichtigtes, Bedingtes oder (noch) nicht Eingetretenes einleiten:<\/p><table><tr><th>Konjunktion<\/th><th>Beispiel<\/th><\/tr><tr><td><em>para que<\/em> (damit)<\/td><td><em>Te lo explico para que lo entiendas.<\/em><\/td><\/tr><tr><td><em>antes de que<\/em> (bevor)<\/td><td><em>Sal antes de que empiece a nevar.<\/em><\/td><\/tr><tr><td><em>sin que<\/em> (ohne dass)<\/td><td><em>Salimos sin que nos vean.<\/em><\/td><\/tr><tr><td><em>a no ser que<\/em> (es sei denn)<\/td><td><em>Iremos a pie, a no ser que llueva.<\/em><\/td><\/tr><tr><td><em>con tal de que<\/em> (vorausgesetzt)<\/td><td><em>Te lo presto con tal de que me lo cuides.<\/em><\/td><\/tr><\/table><p>Ebenso: <em>en caso de que, a menos que, siempre que<\/em> (im Sinne von „sofern“).<\/p><p>Bei gleichem Subjekt steht die Präposition + Infinitiv: <em>Ahorro para viajar.<\/em> / <em>Lávate las manos antes de comer.<\/em><\/p>"},{"h":"cuando, en cuanto, hasta que …","html":"<p>Zeitliche Konjunktionen stehen mit dem subjuntivo, wenn sich der Nebensatz auf die <b>Zukunft<\/b> bezieht. Bei Gewohnheiten oder Vergangenem steht der Indikativ.<\/p><table><tr><th>Indikativ (Tatsache)<\/th><th>subjuntivo (Zukunft)<\/th><\/tr><tr><td><em>Cuando llego a casa, me ducho.<\/em><br><small>Wenn ich heimkomme, dusche ich (immer).<\/small><\/td><td><em>Cuando llegues, llámame.<\/em><br><small>Wenn du ankommst, ruf mich an.<\/small><\/td><\/tr><tr><td><em>En cuanto lo vi, lo reconocí.<\/em><\/td><td><em>En cuanto sepa algo, te aviso.<\/em><\/td><\/tr><tr><td><em>Esperé hasta que cerraron.<\/em><\/td><td><em>Esperaré hasta que cierren.<\/em><\/td><\/tr><\/table><p>Ebenso: <em>mientras, después de que, tan pronto como, una vez que<\/em>.<\/p><div class=\"warn\">Achtung: Nach zukunftsbezogenem <em>cuando<\/em> nie Futur! <em>*Cuando llegarás<\/em> ist falsch – richtig: <em>Cuando llegues<\/em>. (Die Fragewort-Form <em>¿Cuándo llegarás?<\/em> ist dagegen korrekt.)<\/div>"},{"h":"aunque: Indikativ oder subjuntivo","html":"<p><em>Aunque<\/em> kann beides – mit Bedeutungsunterschied:<\/p><ul><li><b>Indikativ<\/b> = bekannte Tatsache („obwohl“): <em>Aunque está cansada, sigue trabajando.<\/em> <small>Obwohl sie müde ist, arbeitet sie weiter.<\/small><\/li><li><b>subjuntivo<\/b> = unbekannt, hypothetisch oder unwichtig („auch wenn“): <em>Aunque llueva, saldremos.<\/em> <small>Auch wenn es regnet, gehen wir raus.<\/small> <em>Aunque sea tu jefe, no tiene derecho a gritarte.<\/em> <small>Auch wenn er dein Chef ist, darf er dich nicht anschreien.<\/small><\/li><\/ul><div class=\"tip\">Test: Lässt sich „selbst wenn“ einsetzen? → subjuntivo.<\/div>"},{"h":"Relativsätze, ojalá, quizás, Infinitiv","html":"<p><b>Relativsätze<\/b>: subjuntivo, wenn das Bezugswort unbekannt, gesucht oder nicht existent ist.<\/p><ul><li><em>Busco a alguien que sepa alemán.<\/em> <small>Ich suche jemanden, der Deutsch kann (egal wen).<\/small> vs. <em>Conozco a alguien que sabe alemán.<\/em><\/li><li><em>No hay nadie que entienda esto.<\/em> <small>Es gibt niemanden, der das versteht.<\/small><\/li><li><em>Haz lo que quieras.<\/em> <small>Mach, was du willst.<\/small><\/li><\/ul><p><b>ojalá<\/b> (+ subjuntivo, mit oder ohne <em>que<\/em>): <em>¡Ojalá haga sol mañana!<\/em> <small>Hoffentlich scheint morgen die Sonne!<\/small><\/p><p><b>quizás / quizá / tal vez<\/b>: subjuntivo bei größerem Zweifel, Indikativ bei größerer Sicherheit: <em>Quizás venga Luis.<\/em> / <em>Tal vez tienes razón.<\/em> Steht das Wort <b>nach<\/b> dem Verb, immer Indikativ: <em>Viene, quizás, más tarde.<\/em> Mit <em>a lo mejor<\/em> steht immer Indikativ: <em>A lo mejor viene.<\/em><\/p><p><b>Gleiches Subjekt → Infinitiv<\/b>: <em>Quiero ir.<\/em> (ich will, ich gehe) vs. <em>Quiero que vayas.<\/em> (ich will, du gehst). Ebenso: <em>Me alegra verte.<\/em> vs. <em>Me alegra que vengas.<\/em><\/p><div class=\"warn\">Achtung: <em>*Quiero que yo vaya<\/em> ist falsch – bei gleichem Subjekt immer Infinitiv.<\/div>"}],"exercises":[{"type":"gap","title":"Regelmäßige Formen","task":"Setze den subjuntivo presente ein.","items":[{"q":"Quiero que tú (trabajar) ___ menos.","a":["trabajes"],"de":"Ich will, dass du weniger arbeitest."},{"q":"Es importante que nosotros (comer) ___ fruta.","a":["comamos"],"de":"Es ist wichtig, dass wir Obst essen."},{"q":"Espero que ellos me (escribir) ___ pronto.","a":["escriban"],"de":"Ich hoffe, dass sie mir bald schreiben."},{"q":"Mi madre quiere que yo (aprender) ___ a cocinar.","a":["aprenda"],"de":"Meine Mutter will, dass ich kochen lerne."},{"q":"Os pido que (vosotros – hablar) ___ más bajo.","a":["habléis"],"de":"Ich bitte euch, leiser zu sprechen."},{"q":"Ojalá ella (abrir) ___ la tienda mañana.","a":["abra"],"de":"Hoffentlich öffnet sie den Laden morgen."},{"q":"Es mejor que usted (esperar) ___ fuera.","a":["espere"],"de":"Es ist besser, wenn Sie draußen warten."},{"q":"No creo que ellos (vivir) ___ aquí.","a":["vivan"],"de":"Ich glaube nicht, dass sie hier wohnen."}]},{"type":"gap","title":"Ableitung von der yo-Form","task":"Bilde den subjuntivo vom Stamm der 1. Person Präsens.","items":[{"q":"Necesito que (t
