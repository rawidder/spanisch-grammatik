ú – hacer) ___ la compra.","a":["hagas"],"de":"Du musst bitte einkaufen gehen."},{"q":"Es posible que (yo – salir) ___ tarde del trabajo.","a":["salga"],"de":"Es kann sein, dass ich spät aus der Arbeit komme."},{"q":"Me alegra que (vosotros – venir) ___ a la boda.","a":["vengáis"],"de":"Es freut mich, dass ihr zur Hochzeit kommt."},{"q":"Quiero que (ellos – conocer) ___ a mi familia.","a":["conozcan"],"de":"Ich will, dass sie meine Familie kennenlernen."},{"q":"No es normal que el perro no (oír) ___ nada.","a":["oiga"],"de":"Es ist nicht normal, dass der Hund nichts hört."},{"q":"Dile que (traer) ___ el vino.","a":["traiga"],"de":"Sag ihm, er soll den Wein mitbringen."},{"q":"Prefiero que (nosotros – poner) ___ la mesa fuera.","a":["pongamos"],"de":"Mir ist lieber, dass wir draußen decken."},{"q":"Es mejor que tú no (conducir) ___ de noche.","a":["conduzcas"],"de":"Es ist besser, wenn du nachts nicht fährst."},{"q":"Espero que el profesor no (decir) ___ nada.","a":["diga"],"de":"Ich hoffe, der Lehrer sagt nichts."}]},{"type":"gap","title":"Stammwechsel und unregelmäßige Verben","task":"Setze den subjuntivo ein. Achte auf nosotros/vosotros.","items":[{"q":"Ojalá (nosotros – poder) ___ ir a la playa.","a":["podamos"],"de":"Hoffentlich können wir an den Strand fahren."},{"q":"Es necesario que tú (dormir) ___ ocho horas.","a":["duermas"],"de":"Es ist nötig, dass du acht Stunden schläfst."},{"q":"Es necesario que nosotros (dormir) ___ más.","a":["durmamos"],"de":"Es ist nötig, dass wir mehr schlafen."},{"q":"No quiero que (vosotros – pedir) ___ pizza otra vez.","a":["pidáis"],"de":"Ich will nicht, dass ihr schon wieder Pizza bestellt."},{"q":"Espero que (ser) ___ un buen día para ti.","a":["sea"],"de":"Ich hoffe, es wird ein guter Tag für dich."},{"q":"Me molesta que no (haber) ___ aparcamiento.","a":["haya"],"de":"Es stört mich, dass es keinen Parkplatz gibt."},{"q":"No creo que ellos (saber) ___ la respuesta.","a":["sepan"],"de":"Ich glaube nicht, dass sie die Antwort wissen."},{"q":"Quiero que me (tú – dar) ___ tu número.","a":["des"],"de":"Ich will, dass du mir deine Nummer gibst."},{"q":"Es raro que Elena no (estar) ___ en casa.","a":["esté"],"de":"Es ist seltsam, dass Elena nicht zu Hause ist."},{"q":"Prefiero que (nosotros – ir) ___ en tren.","a":["vayamos"],"de":"Mir ist lieber, dass wir mit dem Zug fahren."}]},{"type":"gap","title":"Schreibänderungen","task":"Setze den subjuntivo ein und achte auf die Schreibung.","items":[{"q":"Espero que el paquete (llegar) ___ hoy.","a":["llegue"],"de":"Ich hoffe, das Paket kommt heute an."},{"q":"Quiero que tú (buscar) ___ las llaves.","a":["busques"],"de":"Ich will, dass du die Schlüssel suchst."},{"q":"Es mejor que (nosotros – empezar) ___ ya.","a":["empecemos"],"de":"Es ist besser, wenn wir gleich anfangen."},{"q":"Dile que (coger) ___ un paraguas.","a":["coja"],"de":"Sag ihr, sie soll einen Regenschirm mitnehmen."},{"q":"No es fácil que (tú – elegir) ___ bien a la primera.","a":["elijas"],"de":"Es ist nicht leicht, beim ersten Mal richtig zu wählen."},{"q":"Os recomiendo que (seguir) ___ por esta calle.","a":["sigáis"],"de":"Ich empfehle euch, diese Straße weiterzugehen."},{"q":"Hace falta que alguien (averiguar) ___ qué pasó.","a":["averigüe"],"de":"Jemand muss herausfinden, was passiert ist."},{"q":"No dejes que el niño (tocar) ___ el horno.","a":["toque"],"de":"Lass nicht zu, dass das Kind den Ofen anfasst."}]},{"type":"choice","title":"Indikativ oder subjuntivo? (Meinung und Gewissheit)","task":"Wähle die richtige Form.","items":[{"q":"Creo que el museo ___ los lunes.","options":["cierra","cierre"],"a":0,"why":"Bejahtes creer → Indikativ."},{"q":"No creo que el museo ___ los lunes.","options":["cierra","cierre"],"a":1,"why":"Verneinte Meinung → subjuntivo."},{"q":"Es verdad que este restaurante ___ caro.","options":["es","sea"],"a":0,"why":"Gewissheit (es verdad) → Indikativ."},{"q":"No es verdad que este restaurante ___ caro.","options":["es","sea"],"a":1,"why":"Verneinte Gewissheit → subjuntivo."},{"q":"Dudo que ellos ___ a tiempo.","options":["llegan","lleguen"],"a":1,"why":"Zweifel → subjuntivo."},{"q":"Está claro que nadie ___ trabajar el domingo.","options":["quiere","quiera"],"a":0,"why":"Está claro drückt Gewissheit aus → Indikativ."},{"q":"Es posible que mañana ___ niebla.","options":["hay","haya"],"a":1,"why":"Möglichkeit → subjuntivo."},{"q":"Me parece que tu idea ___ buena.","options":["es","sea"],"a":0,"why":"Bejahtes parecer que → Indikativ."}]},{"type":"choice","title":"Wunsch, Gefühl oder Infinitiv?","task":"Wähle die passende Form.","items":[{"q":"Quiero ___ un café.","options":["tomar","que tome","que tomo"],"a":0,"why":"Gleiches Subjekt → Infinitiv."},{"q":"Quiero que tú ___ un café.","options":["tomar","tomes","tomas"],"a":1,"why":"Subjektwechsel + Wunsch → subjuntivo."},{"q":"Me alegro de ___ aquí contigo.","options":["estar","que esté","que estoy"],"a":0,"why":"Gleiches Subjekt → Infinitiv."},{"q":"Nos encanta que nuestros hijos ___ música.","options":["estudian","estudien","estudiar"],"a":1,"why":"Gefühl + anderes Subjekt → subjuntivo."},{"q":"Sé que Marta ___ en Lisboa.","options":["vive","viva"],"a":0,"why":"saber drückt Wissen aus → Indikativ."},{"q":"Le molesta que la gente no ___ los platos.","options":["friega","friegue","fregar"],"a":1,"why":"Gefühl → subjuntivo; fregar: e→ie, g→gu."},{"q":"Es importante ___ los documentos antes.","options":["leer","que lea","que leo"],"a":0,"why":"Unpersönlich ohne bestimmtes Subjekt → Infinitiv."},{"q":"Siento que no te ___ bien.","options":["encuentras","encuentres"],"a":1,"why":"Gefühl (sentir = bedauern) → subjuntivo."}]},{"type":"choice","title":"Konjunktionen und Zeitangaben","task":"Wähle die richtige Form.","items":[{"q":"Cuando ___ a Madrid, visitaré el Prado.","options":["voy","vaya","iré"],"a":1,"why":"cuando mit Zukunftsbezug → subjuntivo."},{"q":"Cuando ___ a Madrid, siempre visito el Prado.","options":["voy","vaya","iré"],"a":0,"why":"Gewohnheit → Indikativ."},{"q":"Te dejo mi coche para que ___ al aeropuerto.","options":["vas","vayas","ir"],"a":1,"why":"para que → immer subjuntivo."},{"q":"Vamos a terminar antes de que ___ los invitados.","options":["lleguen","llegan","llegarán"],"a":0,"why":"antes de que → immer subjuntivo."},{"q":"Me quedo aquí hasta que me ___ .","options":["llamas","llames","llamarás"],"a":1,"why":"hasta que mit Zukunftsbezug → subjuntivo."},{"q":"En cuanto ___ la noticia, se puso a llorar.","options":["oyó","oiga","oye"],"a":0,"why":"Vergangenes Ereignis → Indikativ."},{"q":"Saldremos de excursión, a no ser que ___ mal tiempo.","options":["hace","haga","hará"],"a":1,"why":"a no ser que → immer subjuntivo."},{"q":"Siempre se va sin que nadie se ___ cuenta.","options":["da","dé"],"a":1,"why":"sin que → immer subjuntivo."},{"q":"Puedes usar mi ordenador con tal de que no lo ___ .","options":["rompes","rompas","romper"],"a":1,"why":"con tal de que → immer subjuntivo."}]},{"type":"choice","title":"aunque, Relativsätze, ojalá, quizás","task":"Wähle die passende Form.","items":[{"q":"Aunque ___ mucho dinero, vive de forma modesta. (Er ist bekanntlich reich.)","options":["tiene","tenga"],"a":0,"why":"Bekannte Tatsache → Indikativ."},{"q":"Aunque me lo ___ mil veces, no lo voy a creer.","options":["juras","jures"],"a":1,"why":"Hypothetisch („selbst wenn“) → subjuntivo."},{"q":"Buscamos un piso que ___ terraza.","options":["tiene","tenga"],"a":1,"why":"Gesuchter, noch unbekannter Bezug → subjuntivo."},{"q":"Vivimos en un piso que ___ terraza.","options":["tiene","tenga"],"a":0,"why":"Konkreter, bekannter Bezug → Indikativ."},{"q":"Aquí no hay nadie que ___ chino.","options":["habla","hable"],"a":1,"why":"Nicht existierender Bezug → subjuntivo."},{"q":"¡Ojalá ___ suerte en el examen!","options":["tienes","tengas","tendrás"],"a":1,"why":"ojalá → subjuntivo."},{"q":"A lo mejor ___ a verte esta tarde.","options":["paso","pase"],"a":0,"why":"a lo mejor → immer Indikativ."},{"q":"Puedes pedir lo que ___ ; invito yo.","options":["quieres","quieras"],"a":1,"why":"Unbestimmter Inhalt („was auch immer“) → subjuntivo."}]},{"type":"gap","title":"Gemischt: Indikativ, subjuntivo oder Infinitiv","task":"Setze die richtige Form ein (Präsens Indikativ, subjuntivo oder Infinitiv).","items":[{"q":"Cuando (tú – terminar) ___ , avísame.","a":["termines"],"de":"Wenn du fertig bist, sag mir Bescheid."},{"q":"Estoy segura de que Pedro (decir) ___ la verdad.","a":["dice"],"de":"Ich bin sicher, dass Pedro die Wahrheit sagt."},{"q":"No estoy segura de que Pedro (decir) ___ la verdad.","a":["diga"],"de":"Ich bin nicht sicher, dass Pedro die Wahrheit sagt."},{"q":"Necesitamos un camarero que (hablar) ___ inglés.","a":["hable"],"de":"Wir brauchen einen Kellner, der Englisch spricht."},{"q":"Prefiero (yo – quedarse) ___ en casa esta noche.","a":["quedarme"],"de":"Ich bleibe heute Abend lieber zu Hause."},{"q":"Os llamo en cuanto (yo – saber) ___ el resultado.","a":["sepa"],"de":"Ich rufe euch an, sobald ich das Ergebnis weiß."},{"q":"Aunque (hacer) ___ frío, iremos al partido. (Vielleicht wird es kalt.)","a":["haga"],"de":"Auch wenn es kalt ist, gehen wir zum Spiel."},{"q":"Es evidente que el sistema no (funcionar) ___ .","a":["funciona"],"de":"Es ist offensichtlich, dass das System nicht funktioniert."},{"q":"Quizás (nosotros – volver) ___ el año que viene. (eher unsicher)","a":["volvamos"],"de":"Vielleicht kommen wir nächstes Jahr wieder."},{"q":"Llévate el abrigo, en caso de que (refrescar) ___ por la noche.","a":["refresque"],"de":"Nimm den Mantel mit, falls es nachts kühler wird."}]}],"cards":[{"f":"subjuntivo: Endungen -ar","b":"-e, -es, -e, -emos, -éis, -en (hable)"},{"f":"subjuntivo: Endungen -er/-ir","b":"-a, -as, -a, -amos, -áis, -an (coma, viva)"},{"f":"Ableitungsregel subjuntivo","b":"1. Person Präsens Ind. ohne -o + neue Endung: tengo → tenga"},{"f":"hacer – subjuntivo (yo)","b":"haga"},{"f":"tener – subjuntivo (yo)","b":"tenga"},{"f":"salir – subjuntivo (yo)","b":"salga"},{"f":"conocer – subjuntivo (yo)","b":"conozca"},{"f":"decir – subjuntivo (yo)","b":"diga"},{"f":"pensar – subjuntivo (yo / nosotros)","b":"piense / pensemos"},{"f":"poder – subjuntivo (yo / nosotros)","b":"pueda / podamos"},{"f":"pedir – subjuntivo (yo / nosotros)","b":"pida / pidamos"},{"f":"dormir – subjuntivo (yo / nosotros)","b":"duerma / durmamos"},{"f":"sentir – subjuntivo (yo / nosotros)","b":"sienta / sintamos"},{"f":"ser – subjuntivo (yo)","b":"sea"},{"f":"estar – subjuntivo (yo)","b":"esté"},{"f":"ir – subjuntivo (yo / nosotros)","b":"vaya / vayamos"},{"f":"haber – subjuntivo (3. Sg.)","b":"haya"},{"f":"saber – subjuntivo (yo)","b":"sepa"},{"f":"dar – subjuntivo (yo / ellos)","b":"dé / den"},{"f":"ver – subjuntivo (yo)","b":"vea"},{"f":"buscar / llegar / empezar – subjuntivo (yo)","b":"busque / llegue / empiece"},{"f":"coger / elegir / seguir – subjuntivo (yo)","b":"coja / elija / siga"},{"f":"Ich will, dass du mitkommst.","b":"Quiero que vengas conmigo."},{"f":"Ich will mitkommen.","b":"Quiero ir contigo. (gleiches Subjekt → Infinitiv)"},{"f":"Es freut mich, dass du da bist.","b":"Me alegra que estés aquí."},{"f":"creo que vs. no creo que","b":"Creo que es verdad (Ind.) – No creo que sea verdad (Subj.)"},{"f":"es posible / importante que …","b":"+ subjuntivo: Es posible que llueva."},{"f":"es verdad / está claro que …","b":"+ Indikativ: Está claro que tiene razón."},{"f":"Konjunktionen immer mit subjuntivo","b":"para que, antes de que, sin que, a no ser que, con tal de que, en caso de que"},{"f":"Wenn du ankommst, ruf mich an.","b":"Cuando llegues, llámame. (cuando + Zukunft → Subj.)"},{"f":"Sobald ich etwas weiß, sage ich dir Bescheid.","b":"En cuanto sepa algo, te aviso."},{"f":"aunque + Indikativ / + subjuntivo","b":"obwohl (Tatsache) / auch wenn (hypothetisch)"},{"f":"Ich suche jemanden, der Deutsch kann.","b":"Busco a alguien que sepa alemán."},{"f":"Es gibt niemanden, der das versteht.","b":"No hay nadie que lo entienda."},{"f":"Hoffentlich …!","b":"¡Ojalá + subjuntivo! – ¡Ojalá gane mi equipo!"},{"f":"quizás / tal vez vs. a lo mejor","b":"quizás/tal vez: Subj. oder Ind.; a lo mejor: immer Ind."},{"f":"Mach, was du willst.","b":"Haz lo que quieras."},{"f":"Achtung: *Cuando llegarás …","b":"Falsch! Nach cuando (Zukunft) kein Futur → Cuando llegues …"}],"id":"k17"},{"nr":16,"title":"subjuntivo der Vergangenheit, Zeitenfolge und Bedingungssätze","teil":"Das Verb und seine Ergänzungen","intro":"Hier lernst du die Vergangenheitsformen des subjuntivo, die Regeln, welche Zeit im Nebensatz auf welche Zeit im Hauptsatz folgt, und die drei Typen von Bedingungssätzen mit si. Damit kannst du über Unwirkliches, Verpasstes und Hypothetisches sprechen.","sections":[{"h":"pretérito perfecto de subjuntivo","html":"<p>Bildung: subjuntivo von <em>haber<\/em> + Partizip.<\/p><table><tr><th>Person<\/th><th>Form<\/th><\/tr><tr><td>yo<\/td><td><em>haya hecho<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>hayas hecho<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>haya hecho<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>hayamos hecho<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>hayáis hecho<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>hayan hecho<\/em><\/td><\/tr><\/table><p>Gebrauch: wie das pretérito perfecto, aber in Kontexten, die den subjuntivo verlangen – für Abgeschlossenes mit Bezug zur Gegenwart oder Vorzeitiges in der Zukunft.<\/p><ul><li><em>Me alegro de que hayas aprobado.<\/em> <small>Ich freue mich, dass du bestanden hast.<\/small><\/li><li><em>No creo que hayan llegado todavía.<\/em> <small>Ich glaube nicht, dass sie schon angekommen sind.<\/small><\/li><li><em>Cuando hayáis terminado, recoged la mesa.<\/em> <small>Wenn ihr fertig seid, räumt den Tisch ab.<\/small><\/li><\/ul>"},{"h":"imperfecto de subjuntivo: Bildung","html":"<p>Ausgangspunkt ist die <b>3. Person Plural des indefinido<\/b>. Man streicht <em>-ron<\/em> und hängt <em>-ra<\/em> oder <em>-se<\/em> an. Dadurch übernimmt der subjuntivo alle Unregelmäßigkeiten des indefinido.<\/p><table><tr><th>indefinido<\/th><th>-ra<\/th><th>-se<\/th><\/tr><tr><td><em>hablaron<\/em><\/td><td><em>hablara<\/em><\/td><td><em>hablase<\/em><\/td><\/tr><tr><td><em>comieron<\/em><\/td><td><em>comiera<\/em><\/td><td><em>comiese<\/em><\/td><\/tr><tr><td><em>tuvieron<\/em><\/td><td><em>tuviera<\/em><\/td><td><em>tuviese<\/em><\/td><\/tr><tr><td><em>fueron<\/em> (ser/ir)<\/td><td><em>fuera<\/em><\/td><td><em>fuese<\/em><\/td><\/tr><tr><td><em>hicieron<\/em><\/td><td><em>hiciera<\/em><\/td><td><em>hiciese<\/em><\/td><\/tr><tr><td><em>dijeron<\/em><\/td><td><em>dijera<\/em><\/td><td><em>dijese<\/em><\/td><\/tr><tr><td><em>pudieron<\/em><\/td><td><em>pudiera<\/em><\/td><td><em>pudiese<\/em><\/td><\/tr><tr><td><em>pidieron / durmieron<\/em><\/td><td><em>pidiera / durmiera<\/em><\/td><td><em>pidiese / durmiese<\/em><\/td><\/tr><tr><td><em>leyeron<\/em><\/td><td><em>leyera<\/em><\/td><td><em>leyese<\/em><\/td><\/tr><\/table><div class=\"tip\">Merke: Wer das indefinido kann, kann auch das imperfecto de subjuntivo.<\/div>"},{"h":"imperfecto de subjuntivo: Endungen","html":"<table><tr><th><\/th><th>-ra<\/th><th>-se<\/th><\/tr><tr><td>yo<\/td><td><em>estuviera<\/em><\/td><td><em>estuviese<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>estuvieras<\/em><\/td><td><em>estuvieses<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>estuviera<\/em><\/td><td><em>estuviese<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>estuviéramos<\/em><\/td><td><em>estuviésemos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>estuvierais<\/em><\/td><td><em>estuvieseis<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>estuvieran<\/em><\/td><td><em>estuviesen<\/em><\/td><\/tr><\/table><p>Beide Formen sind im subjuntivo <b>gleichwertig<\/b> und austauschbar. Die <em>-ra<\/em>-Form ist im gesprochenen Spanisch häufiger, besonders in Lateinamerika.<\/p><div class=\"warn\">Achtung: Die <em>nosotros<\/em>-Form hat einen Akzent: <em>habláramos, fuésemos, tuviéramos<\/em>. Und: Nur die <em>-ra<\/em>-Form kann in festen Höflichkeitsformeln ein condicional ersetzen (<em>Quisiera un café.<\/em> <small>Ich hätte gern einen Kaffee.<\/small>).<\/div>"},{"h":"pluscuamperfecto de subjuntivo","html":"<p>Bildung: imperfecto de subjuntivo von <em>haber<\/em> + Partizip.<\/p><table><tr><th>Person<\/th><th>-ra<\/th><th>-se<\/th><\/tr><tr><td>yo<\/td><td><em>hubiera hecho<\/em><\/td><td><em>hubiese hecho<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>hubieras hecho<\/em><\/td><td><em>hubieses hecho<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>hubiera hecho<\/em><\/td><td><em>hubiese hecho<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>hubiéramos hecho<\/em><\/td><td><em>hubiésemos hecho<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>hubierais hecho<\/em><\/td><td><em>hubieseis hecho<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>hubieran hecho<\/em><\/td><td><em>hubiesen hecho<\/em><\/td><\/tr><\/table><p>Gebrauch: Vorvergangenes in subjuntivo-Kontexten und irreale Vergangenheit.<\/p><ul><li><em>Me sorprendió que no hubieran avisado.<\/em> <small>Es überraschte mich, dass sie nicht Bescheid gegeben hatten.<\/small><\/li><li><em>¡Ojalá hubiera sabido la verdad!<\/em> <small>Hätte ich doch die Wahrheit gewusst!<\/small><\/li><\/ul>"},{"h":"Zeitenfolge (consecutio temporum)","html":"<p>Die Zeit im subjuntivo-Nebensatz richtet sich nach der Zeit im Hauptsatz.<\/p><table><tr><th>Hauptsatz<\/th><th>Nebensatz (subjuntivo)<\/th><\/tr><tr><td>Präsens, Futur, perfecto, Imperativ<\/td><td><b>presente<\/b> (gleichzeitig/nachzeitig) oder <b>perfecto<\/b> (vorzeitig)<\/td><\/tr><tr><td>indefinido, imperfecto, pluscuamperfecto, condicional<\/td><td><b>imperfecto<\/b> (gleichzeitig/nachzeitig) oder <b>pluscuamperfecto<\/b> (vorzeitig)<\/td><\/tr><\/table><ul><li><em>Quiero que vengas.<\/em> → <em>Quería que vinieras.<\/em> <small>Ich wollte, dass du kommst.<\/small><\/li><li><em>Le diré que me llame.<\/em> → <em>Le dije que me llamara.<\/em> <small>Ich sagte ihm, er solle mich anrufen.<\/small><\/li><li><em>Me alegra que lo hayas conseguido.<\/em> → <em>Me alegró que lo hubieras conseguido.<\/em><\/li><li><em>Me gustaría que me acompañaras.<\/em> <small>Ich fände es schön, wenn du mich begleiten würdest.<\/small><\/li><\/ul><div class=\"tip\">Merke: <em>me gustaría, preferiría, sería mejor<\/em> (condicional) ziehen das imperfecto de subjuntivo nach sich.<\/div><p>Ausnahme: Gilt der Inhalt noch jetzt, kann nach Vergangenheit auch der presente stehen: <em>Me pidió que lo llames mañana.<\/em> <small>Er bat darum, dass du ihn morgen anrufst.<\/small><\/p>"},{"h":"Gebrauch nach den bekannten Auslösern","html":"<p>Alle Auslöser aus Kapitel 17 (Wunsch, Gefühl, Zweifel, Konjunktionen, Relativsätze …) funktionieren auch in der Vergangenheit – nur mit den Vergangenheitsformen.<\/p><ul><li><em>No creía que fuera tan difícil.<\/em> <small>Ich hätte nicht gedacht, dass es so schwierig ist.<\/small><\/li><li><em>Lo hice para que estuvieras tranquila.<\/em> <small>Ich tat es, damit du beruhigt bist.<\/small><\/li><li><em>Buscaban a alguien que supiera programar.<\/em> <small>Sie suchten jemanden, der programmieren kann.<\/small><\/li><li><em>Se fue antes de que empezara la película.<\/em> <small>Er ging, bevor der Film anfing.<\/small><\/li><li><em>Le dije que me avisara cuando llegara.<\/em> <small>Ich sagte ihr, sie solle Bescheid geben, wenn sie ankommt.<\/small><\/li><\/ul>"},{"h":"como si","html":"<p><em>como si<\/em> (als ob) steht <b>immer<\/b> mit imperfecto oder pluscuamperfecto de subjuntivo – unabhängig von der Zeit im Hauptsatz.<\/p><ul><li><b>gleichzeitig<\/b>: <em>Habla como si fuera el dueño.<\/em> <small>Er redet, als wäre er der Besitzer.<\/small><\/li><li><b>vorzeitig<\/b>: <em>Me miró como si hubiera visto un fantasma.<\/em> <small>Sie sah mich an, als hätte sie ein Gespenst gesehen.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Nie <em>*como si sea<\/em> oder <em>*como si es<\/em>. Nach <em>como si<\/em> kein presente!<\/div>"},{"h":"ojalá mit Vergangenheitsformen","html":"<p>Je nach Form drückt <em>ojalá<\/em> unterschiedliche Grade von Wahrscheinlichkeit aus:<\/p><table><tr><th>Form<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td>presente<\/td><td>möglich<\/td><td><em>Ojalá gane.<\/em><br><small>Hoffentlich gewinnt er.<\/small><\/td><\/tr><tr><td>perfecto<\/td><td>möglich, schon geschehen?<\/td><td><em>Ojalá haya ganado.<\/em><br><small>Hoffentlich hat er gewonnen.<\/small><\/td><\/tr><tr><td>imperfecto<\/td><td>unwahrscheinlich / unmöglich (jetzt)<\/td><td><em>Ojalá tuviera más tiempo.<\/em><br><small>Hätte ich doch mehr Zeit!<\/small><\/td><\/tr><tr><td>pluscuamperf.<\/td><td>verpasst (Vergangenheit)<\/td><td><em>Ojalá hubiera ido.<\/em><br><small>Wäre ich doch hingegangen!<\/small><\/td><\/tr><\/table>"},{"h":"Reale Bedingungssätze","html":"<p>Die Bedingung ist erfüllbar oder gilt allgemein. Nach <em>si<\/em> steht der <b>Indikativ<\/b> (meist Präsens).<\/p><table><tr><th>si-Satz<\/th><th>Hauptsatz<\/th><\/tr><tr><td><em>si<\/em> + Präsens<\/td><td>Präsens / Futur / <em>ir a<\/em> / Imperativ<\/td><\/tr><\/table><ul><li><em>Si calientas el agua a 100 grados, hierve.<\/em> <small>Wenn man Wasser auf 100 Grad erhitzt, kocht es.<\/small><\/li><li><em>Si me das tu correo, te mandaré las fotos.<\/em> <small>Wenn du mir deine Mail gibst, schicke ich dir die Fotos.<\/small><\/li><li><em>Si ves a Clara, salúdala de mi parte.<\/em> <small>Wenn du Clara siehst, grüß sie von mir.<\/small><\/li><\/ul><p>Auch Vergangenheit im Indikativ ist möglich: <em>Si lo dijo, sería por algo.<\/em> <small>Wenn er es gesagt hat, hatte er wohl einen Grund.<\/small><\/p>"},{"h":"Irreale Bedingungssätze: Gegenwart","html":"<p>Die Bedingung ist unwahrscheinlich oder gegenwärtig nicht erfüllt.<\/p><table><tr><th>si-Satz<\/th><th>Hauptsatz<\/th><\/tr><tr><td><em>si<\/em> + imperfecto de subjuntivo<\/td><td>condicional simple<\/td><\/tr><\/table><ul><li><em>Si tuviera un jardín, plantaría tomates.<\/em> <small>Wenn ich einen Garten hätte, würde ich Tomaten pflanzen.<\/small><\/li><li><em>Si fuera tú, aceptaría el trabajo.<\/em> <small>Wenn ich du wäre, würde ich die Stelle annehmen.<\/small><\/li><li><em>Si no lloviera tanto, iríamos a pie.<\/em> <small>Wenn es nicht so regnen würde, gingen wir zu Fuß.<\/small><\/li><\/ul><div class=\"tip\">Reihenfolge frei: <em>Plantaría tomates si tuviera un jardín.<\/em> Vorne stehender si-Satz wird meist mit Komma abgetrennt.<\/div>"},{"h":"Irreale Bedingungssätze: Vergangenheit","html":"<p>Die Bedingung war in der Vergangenheit nicht erfüllt – es geht um Verpasstes.<\/p><table><tr><th>si-Satz<\/th><th>Hauptsatz<\/th><\/tr><tr><td><em>si<\/em> + pluscuamperfecto de subjuntivo<\/td><td>condicional compuesto <b>oder<\/b> <em>hubiera<\/em> + Partizip<\/td><\/tr><\/table><ul><li><em>Si hubieras salido antes, no habrías perdido el autobús.<\/em> <small>Wenn du früher losgegangen wärst, hättest du den Bus nicht verpasst.<\/small><\/li><li><em>Si lo hubiera sabido, te habría / hubiera llamado.<\/em> <small>Wenn ich es gewusst hätte, hätte ich dich angerufen.<\/small><\/li><\/ul><p><b>Mischform<\/b> (Vergangenheit → Folge jetzt): <em>Si hubiera estudiado medicina, ahora sería médico.<\/em> <small>Hätte ich Medizin studiert, wäre ich jetzt Arzt.<\/small><\/p><p>Umgekehrt: <em>Si fuera más organizado, no habría olvidado la cita.<\/em> <small>Wenn ich organisierter wäre, hätte ich den Termin nicht vergessen.<\/small><\/p>"},{"h":"Vorsicht nach si und de + Infinitiv","html":"<div class=\"warn\">Achtung: Nach dem bedingenden <em>si<\/em> stehen <b>nie<\/b> Futur, condicional oder subjuntivo presente!<br><em>*Si lloverá …<\/em> → <em>Si llueve …<\/em><br><em>*Si tendría dinero …<\/em> → <em>Si tuviera dinero …<\/em><br><em>*Si tenga tiempo …<\/em> → <em>Si tengo tiempo …<\/em><\/div><p>Ausnahme: <em>si<\/em> im Sinne von „ob“ (indirekte Frage) erlaubt Futur und condicional: <em>No sé si vendrá.<\/em> <small>Ich weiß nicht, ob er kommt.<\/small><\/p><p><b>de + Infinitiv<\/b> ersetzt einen si-Satz, wenn das Subjekt klar ist:<\/p><ul><li><em>De saberlo, te lo diría.<\/em> = <em>Si lo supiera, te lo diría.<\/em><\/li><li><em>De haberlo sabido, no habría venido.<\/em> = <em>Si lo hubiera sabido …<\/em> <small>Hätte ich das gewusst, wäre ich nicht gekommen.<\/small><\/li><\/ul><p>Weitere Bedingungskonjunktionen (immer subjuntivo): <em>en caso de que, siempre que<\/em> (= sofern)<em>, con tal de que, a no ser que<\/em>.<\/p>"}],"exercises":[{"type":"gap","title":"imperfecto de subjuntivo bilden","task":"Setze das imperfecto de subjuntivo (Form auf -ra oder -se) ein.","items":[{"q":"Quería que tú (hablar) ___ con él.","a":["hablaras","hablases"],"de":"Ich wollte, dass du mit ihm sprichst."},{"q":"Me pidieron que (yo – traer) ___ postre.","a":["trajera","trajese"],"de":"Sie baten mich, Nachtisch mitzubringen."},{"q":"No creían que nosotros (ser) ___ hermanos.","a":["fuéramos","fuésemos"],"de":"Sie glaubten nicht, dass wir Geschwister sind."},{"q":"Era necesario que ellos (tener) ___ paciencia.","a":["tuvieran","tuviesen"],"de":"Es war nötig, dass sie Geduld hatten."},{"q":"Le prohibí que (decir) ___ nada.","a":["dijera","dijese"],"de":"Ich verbot ihm, etwas zu sagen."},{"q":"Os dejé las llaves para que (vosotros – poder) ___ entrar.","a":["pudierais","pudieseis"],"de":"Ich ließ euch die Schlüssel da, damit ihr hineinkonntet."},{"q":"Esperaba que ella (hacer) ___ la reserva.","a":["hiciera","hiciese"],"de":"Ich hoffte, dass sie die Reservierung macht."},{"q":"Me sorprendió que (haber) ___ tanta gente.","a":["hubiera","hubiese"],"de":"Es überraschte mich, dass so viele Leute da waren."},{"q":"Buscaba un libro que (explicar) ___ bien la historia.","a":["explicara","explicase"],"de":"Ich suchte ein Buch, das die Geschichte gut erklärt."},{"q":"El médico le aconsejó que (dormir) ___ más.","a":["durmiera","durmiese"],"de":"Der Arzt riet ihm, mehr zu schlafen."}]},{"type":"gap","title":"perfecto und pluscuamperfecto de subjuntivo","task":"Setze die zusammengesetzte Form ein (perfecto oder pluscuamperfecto de subjuntivo).","items":[{"q":"Me alegro de que (vosotros – venir) ___ .","a":["hayáis venido"],"de":"Ich freue mich, dass ihr gekommen seid."},{"q":"No creo que Luis (terminar) ___ ya.","a":["haya terminado"],"de":"Ich glaube nicht, dass Luis schon fertig ist."},{"q":"Me molestó que no me (ellos – invitar) ___ .","a":["hubieran invitado","hubiesen invitado"],"de":"Es ärgerte mich, dass sie mich nicht eingeladen hatten."},{"q":"Ojalá (tú – ver) ___ su cara. ¡Fue increíble!","a":["hubieras visto","hubieses visto"],"de":"Hättest du nur sein Gesicht gesehen! Es war unglaublich!"},{"q":"Cuando (tú – leer) ___ el contrato, fírmalo.","a":["hayas leído"],"de":"Wenn du den Vertrag gelesen hast, unterschreib ihn."},{"q":"Actuó como si no (pasar) ___ nada.","a":["hubiera pasado","hubiese pasado"],"de":"Er verhielt sich, als wäre nichts geschehen."},{"q":"Es posible que el paquete (llegar) ___ esta mañana.","a":["haya llegado"],"de":"Es kann sein, dass das Paket heute Morgen angekommen ist."},{"q":"Dudaba que ellos (decir) ___ la verdad.","a":["hubieran dicho","hubiesen dicho"],"de":"Ich bezweifelte, dass sie die Wahrheit gesagt hatten."}]},{"type":"choice","title":"Zeitenfolge","task":"Wähle die passende Form des subjuntivo.","items":[{"q":"Te pido que me ___ .","options":["ayudes","ayudaras"],"a":0,"why":"Hauptsatz Präsens → presente de subjuntivo."},{"q":"Te pedí que me ___ .","options":["ayudes","ayudaras"],"a":1,"why":"Hauptsatz indefinido → imperfecto de subjuntivo."},{"q":"Me gustaría que ___ a mi cumpleaños.","options":["vengáis","vinierais"],"a":1,"why":"Hauptsatz condicional → imperfecto de subjuntivo."},{"q":"Les diremos que ___ puntuales.","options":["sean","fueran"],"a":0,"why":"Hauptsatz Futur → presente de subjuntivo."},{"q":"Era una pena que no ___ ir con nosotros.","options":["puedas","pudieras"],"a":1,"why":"Hauptsatz imperfecto → imperfecto de subjuntivo."},{"q":"Siento que ayer no ___ tiempo para hablar.","options":["hayamos tenido","tengamos"],"a":0,"why":"Hauptsatz Präsens, Nebensatz vorzeitig → perfecto de subjuntivo."},{"q":"No me había dado cuenta de que te ___ .","options":["haya molestado","hubiera molestado"],"a":1,"why":"Hauptsatz pluscuamperfecto, vorzeitig → pluscuamperfecto de subjuntivo."},{"q":"Sería mejor que lo ___ tú.","options":["hagas","hicieras"],"a":1,"why":"Hauptsatz condicional → imperfecto de subjuntivo."}]},{"type":"choice","title":"como si und ojalá","task":"Wähle die richtige Form.","items":[{"q":"Gasta dinero como si ___ millonario.","options":["es","sea","fuera"],"a":2,"why":"como si + imperfecto de subjuntivo."},{"q":"Estaba pálido, como si ___ toda la noche sin dormir.","options":["estuviera","hubiera estado","ha estado"],"a":1,"why":"Vorzeitig zu „als ob“ → pluscuamperfecto de subjuntivo."},{"q":"Ojalá ___ verano ya; estoy harto del frío. (unmöglich, es ist Januar)","options":["sea","fuera"],"a":1,"why":"Unerfüllbarer Wunsch → imperfecto de subjuntivo."},{"q":"Ojalá ___ bien el examen mañana.","options":["te salga","te hubiera salido"],"a":0,"why":"Möglicher Wunsch für die Zukunft → presente de subjuntivo."},{"q":"Ojalá no le ___ nada; ahora está enfadada.","options":["digo","hubiera dicho"],"a":1,"why":"Bedauern über Vergangenes → pluscuamperfecto de subjuntivo."},{"q":"Me trata como si ___ un niño.","options":["fuera","fui","sería"],"a":0,"why":"como si + imperfecto de subjuntivo."}]},{"type":"gap","title":"Reale Bedingungssätze","task":"Setze die passende Indikativ- oder Imperativform ein.","items":[{"q":"Si (tú – tener) ___ hambre, hay pan en la cocina.","a":["tienes"],"de":"Wenn du Hunger hast, gibt es Brot in der Küche."},{"q":"Si llueve mañana, (nosotros – quedarse) ___ en casa. (Futur)","a":["nos quedaremos"],"de":"Wenn es morgen regnet, bleiben wir zu Hause."},{"q":"Si tienes frío, (cerrar – tú, Imperativ) ___ la ventana.","a":["cierra"],"de":"Wenn dir kalt ist, mach das Fenster zu."},{"q":"Si (ellos – salir) ___ ahora, llegarán a tiempo.","a":["salen"],"de":"Wenn sie jetzt losfahren, kommen sie rechtzeitig an."},{"q":"Si mezclas azul y amarillo, (salir) ___ verde.","a":["sale"],"de":"Wenn man Blau und Gelb mischt, kommt Grün heraus."},{"q":"Si no (vosotros – estudiar) ___ , no aprobaréis.","a":["estudiáis"],"de":"Wenn ihr nicht lernt, besteht ihr nicht."}]},{"type":"gap","title":"Irreale Bedingungssätze (Gegenwart)","task":"Setze imperfecto de subjuntivo bzw. condicional ein.","items":[{"q":"Si (yo – vivir) ___ en el campo, tendría gallinas.","a":["viviera","viviese"],"de":"Wenn ich auf dem Land wohnen würde, hätte ich Hühner."},{"q":"Si tuviéramos coche, (nosotros – ir) ___ a la sierra.","a":["iríamos"],"de":"Wenn wir ein Auto hätten, würden wir in die Berge fahren."},{"q":"Si (tú – ser) ___ más paciente, todo iría mejor.","a":["fueras","fueses"],"de":"Wenn du geduldiger wärst, liefe alles besser."},{"q":"¿Qué harías si te (tocar) ___ la lotería?","a":["tocara","tocase"],"de":"Was würdest du tun, wenn du im Lotto gewinnen würdest?"},{"q":"Si no hiciera tanto calor, (yo – salir) ___ a correr.","a":["saldría"],"de":"Wenn es nicht so heiß wäre, würde ich joggen gehen."},{"q":"Si (ellos – saber) ___ cocinar, no comerían siempre fuera.","a":["supieran","supiesen"],"de":"Wenn sie kochen könnten, würden sie nicht immer auswärts essen."},{"q":"Si pudiera elegir, (yo – querer) ___ vivir en Granada.","a":["querría","quisiera"],"de":"Wenn ich wählen könnte, würde ich in Granada leben wollen."},{"q":"Si (vosotros – decir) ___ la verdad, os creerían.","a":["dijerais","dijeseis"],"de":"Wenn ihr die Wahrheit sagen würdet, würde man euch glauben."}]},{"type":"gap","title":"Irreale Bedingungssätze (Vergangenheit)","task":"Setze pluscuamperfecto de subjuntivo oder condicional compuesto ein.","items":[{"q":"Si (yo – saber) ___ que estabas enfermo, te habría visitado.","a":["hubiera sabido","hubiese sabido"],"de":"Wenn ich gewusst hätte, dass du krank warst, hätte ich dich besucht."},{"q":"Si hubiéramos reservado, no (nosotros – tener) ___ que esperar. (condicional compuesto)","a":["habríamos tenido","hubiéramos tenido","hubiésemos tenido"],"de":"Wenn wir reserviert hätten, hätten wir nicht warten müssen."},{"q":"Si (tú – poner) ___ la alarma, no te habrías dormido.","a":["hubieras puesto","hubieses puesto"],"de":"Wenn du den Wecker gestellt hättest, hättest du nicht verschlafen."},{"q":"Si no hubiera llovido, el partido no se (suspender) ___ . (condicional compuesto)","a":["habría suspendido","hubiera suspendido"],"de":"Wenn es nicht geregnet hätte, wäre das Spiel nicht abgesagt worden."},{"q":"Si (ellos – escuchar) ___ al guía, no se habrían perdido.","a":["hubieran escuchado","hubiesen escuchado"],"de":"Wenn sie dem Führer zugehört hätten, hätten sie sich nicht verlaufen."},{"q":"Si hubiera aceptado aquel trabajo, ahora (yo – vivir) ___ en Chile. (condicional simple)","a":["viviría"],"de":"Wenn ich jene Stelle angenommen hätte, würde ich jetzt in Chile leben."},{"q":"Si me lo hubieras pedido, te lo (yo – prestar) ___ . (condicional compuesto)","a":["habría prestado","hubiera prestado"],"de":"Wenn du mich darum gebeten hättest, hätte ich es dir geliehen."},{"q":"De (saber – Infinitiv Perfekt) ___ lo caro que era, no lo habría comprado.","a":["haber sabido"],"de":"Hätte ich gewusst, wie teuer es war, hätte ich es nicht gekauft."}]},{"type":"choice","title":"Welcher Bedingungssatz?","task":"Wähle die korrekte Form.","items":[{"q":"Si mañana ___ sol, iremos a la playa.","options":["hará","hace","haga"],"a":1,"why":"Realer Bedingungssatz: si + Präsens, nie Futur oder subjuntivo presente."},{"q":"Si ___ más dinero, me compraría una moto.","options":["tendría","tengo","tuviera"],"a":2,"why":"Irreal Gegenwart: si + imperfecto de subjuntivo, nie condicional."},{"q":"Si lo ___ antes, te lo habría dicho.","options":["habría sabido","hubiera sabido","sabía"],"a":1,"why":"Irreal Vergangenheit: si + pluscuamperfecto de subjuntivo."},{"q":"No sé si ___ tiempo de pasar mañana.","options":["tendré","tuviera","tenga"],"a":0,"why":"si = „ob“ (indirekte Frage) → Futur erlaubt."},{"q":"Si fueras más puntual, el jefe no se ___ .","options":["enfadaría","enfadará","enfade"],"a":0,"why":"Irreal Gegenwart → condicional im Hauptsatz."},{"q":"Si hubieras venido, te ___ mucho.","options":["divertirías","habrías divertido","divertirás"],"a":1,"why":"Irreal Vergangenheit → condicional compuesto (ebenso möglich: te hubieras divertido)."},{"q":"___ estudiado más, ahora tendrías un buen puesto.","options":["Si habrías","De haber","Si has"],"a":1,"why":"de + haber + Partizip ersetzt si + pluscuamperfecto de subjuntivo."},{"q":"Si ___ al supermercado, compra leche.","options":["vas","irás","vayas"],"a":0,"why":"Realer Bedingungssatz mit Imperativ: si + Präsens."}]}],"cards":[{"f":"Bildung imperfecto de subjuntivo","b":"3. Pl. indefinido − ron + ra/se: tuvieron → tuviera/tuviese"},{"f":"Endungen imperfecto de subjuntivo (-ra)","b":"-ra, -ras, -ra, -ramos, -rais, -ran (Akzent: -áramos/-iéramos)"},{"f":"Endungen imperfecto de subjuntivo (-se)","b":"-se, -ses, -se, -semos, -seis, -sen (Akzent: -ásemos/-iésemos)"},{"f":"-ra oder -se?","b":"gleichwertig; -ra im Gespräch häufiger"},{"f":"ser / ir – imperfecto de subjuntivo (yo)","b":"fuera / fuese"},{"f":"tener – imperfecto de subjuntivo (yo)","b":"tuviera / tuviese"},{"f":"hacer – imperfecto de subjuntivo (yo)","b":"hiciera / hiciese"},{"f":"decir – imperfecto de subjuntivo (yo)","b":"dijera / dijese"},{"f":"poder – imperfecto de subjuntivo (yo)","b":"pudiera / pudiese"},{"f":"estar – imperfecto de subjuntivo (nosotros)","b":"estuviéramos / estuviésemos"},{"f":"pretérito perfecto de subjuntivo","b":"haya, hayas, haya … + Partizip (haya hecho)"},{"f":"pluscuamperfecto de subjuntivo","b":"hubiera/hubiese + Partizip (hubiera hecho)"},{"f":"Zeitenfolge: Hauptsatz Präsens/Futur","b":"→ presente oder perfecto de subjuntivo"},{"f":"Zeitenfolge: Hauptsatz Vergangenheit/condicional","b":"→ imperfecto oder pluscuamperfecto de subjuntivo"},{"f":"Ich wollte, dass du kommst.","b":"Quería que vinieras."},{"f":"Ich fände es schön, wenn du bliebest.","b":"Me gustaría que te quedaras."},{"f":"als ob","b":"como si + imperfecto/pluscuamperfecto de subjuntivo"},{"f":"Er tut, als wüsste er alles.","b":"Hace como si lo supiera todo."},{"f":"Hätte ich doch mehr Zeit!","b":"¡Ojalá tuviera más tiempo!"},{"f":"Wäre ich doch mitgekommen!","b":"¡Ojalá hubiera ido!"},{"f":"Realer Bedingungssatz","b":"si + Präsens → Präsens / Futur / Imperativ"},{"f":"Irrealer Bedingungssatz (Gegenwart)","b":"si + imperfecto de subj. → condicional"},{"f":"Irrealer Bedingungssatz (Vergangenheit)","b":"si + pluscuamperfecto de subj. → condicional compuesto / hubiera + Part."},{"f":"Wenn ich du wäre, …","b":"Si fuera tú, … / Yo que tú, …"},{"f":"Wenn ich es gewusst hätte, wäre ich gekommen.","b":"Si lo hubiera sabido, habría venido."},{"f":"Verboten nach si (Bedingung)","b":"Futur, condicional, subjuntivo presente"},{"f":"de + Infinitiv als Bedingung","b":"De saberlo, … = Si lo supiera …; De haberlo sabido, … = Si lo hubiera sabido …"},{"f":"Ich hätte gern … (höflich, -ra-Form)","b":"Quisiera …"}],"id":"k18"},{"nr":17,"title":"Der Imperativ","teil":"Das Verb und seine Ergänzungen","intro":"Mit dem Imperativ gibst du Anweisungen, Ratschläge und Einladungen. Im Spanischen hat nur der bejahte Imperativ von tú und vosotros eigene Formen – alles andere kommt aus dem subjuntivo, den du schon kennst.","sections":[{"h":"Bejahter Imperativ: tú","html":"<p>Die regelmäßige <em>tú<\/em>-Form entspricht der <b>3. Person Singular Präsens<\/b> Indikativ.<\/p><table><tr><th>Infinitiv<\/th><th>Imperativ (tú)<\/th><th>Deutsch<\/th><\/tr><tr><td><em>hablar<\/em><\/td><td><em>¡habla!<\/em><\/td><td>sprich!<\/td><\/tr><tr><td><em>comer<\/em><\/td><td><em>¡come!<\/em><\/td><td>iss!<\/td><\/tr><tr><td><em>vivir<\/em><\/td><td><em>¡vive!<\/em><\/td><td>lebe!<\/td><\/tr><tr><td><em>cerrar<\/em><\/td><td><em>¡cierra!<\/em><\/td><td>schließ!<\/td><\/tr><tr><td><em>volver<\/em><\/td><td><em>¡vuelve!<\/em><\/td><td>komm zurück!<\/td><\/tr><tr><td><em>pedir<\/em><\/td><td><em>¡pide!<\/em><\/td><td>bestell!<\/td><\/tr><\/table><div class=\"tip\">Der Stammwechsel bleibt erhalten: <em>Cierra la puerta. Vuelve pronto. Sigue recto.<\/em><\/div>"},{"h":"Unregelmäßige tú-Formen","html":"<p>Acht häufige Verben haben eine verkürzte Form:<\/p><table><tr><th>Infinitiv<\/th><th>tú<\/th><th>Infinitiv<\/th><th>tú<\/th><\/tr><tr><td><em>tener<\/em><\/td><td><em>ten<\/em><\/td><td><em>hacer<\/em><\/td><td><em>haz<\/em><\/td><\/tr><tr><td><em>poner<\/em><\/td><td><em>pon<\/em><\/td><td><em>decir<\/em><\/td><td><em>di<\/em><\/td><\/tr><tr><td><em>salir<\/em><\/td><td><em>sal<\/em><\/td><td><em>ir<\/em><\/td><td><em>ve<\/em><\/td><\/tr><tr><td><em>venir<\/em><\/td><td><em>ven<\/em><\/td><td><em>ser<\/em><\/td><td><em>sé<\/em><\/td><\/tr><\/table><ul><li><em>Ten cuidado con el escalón.<\/em> <small>Pass auf die Stufe auf.<\/small><\/li><li><em>Ven aquí y siéntate.<\/em> <small>Komm her und setz dich.<\/small><\/li><li><em>Sé sincero conmigo.<\/em> <small>Sei ehrlich zu mir.<\/small><\/li><\/ul><p>Ableitungen folgen dem Grundverb: <em>mantener → mantén, proponer → propón, deshacer → deshaz<\/em>.<\/p><div class=\"warn\">Achtung: <em>ve<\/em> ist sowohl Imperativ von <em>ir<\/em> als auch von <em>ver<\/em> (<em>ve esta película<\/em> – sieh dir diesen Film an); meist klärt der Kontext. <em>sé<\/em> (sei!) braucht den Akzent wie <em>sé<\/em> (ich weiß).<\/div>"},{"h":"Bejahter Imperativ: vosotros","html":"<p>Infinitiv: <b>-r<\/b> wird durch <b>-d<\/b> ersetzt. Es gibt keine Ausnahmen.<\/p><table><tr><th>Infinitiv<\/th><th>vosotros<\/th><\/tr><tr><td><em>hablar / comer / vivir<\/em><\/td><td><em>hablad / comed / vivid<\/em><\/td><\/tr><tr><td><em>tener / ir / decir<\/em><\/td><td><em>tened / id / decid<\/em><\/td><\/tr><\/table><p><b>Reflexive Verben<\/b>: Vor <em>os<\/em> fällt das <em>-d<\/em> weg.<\/p><ul><li><em>sentarse → ¡sentaos!<\/em> <small>Setzt euch!<\/small><\/li><li><em>levantarse → ¡levantaos!<\/em><\/li><li><em>vestirse → ¡vestíos!<\/em> (Akzent auf í bei -ir-Verben)<\/li><li><em>marcharse → ¡marchaos!<\/em><\/li><\/ul><p>Einzige Ausnahme: <em>irse → ¡idos!<\/em> (sehr verbreitet und inzwischen von der RAE ebenfalls akzeptiert: <em>¡iros!<\/em>).<\/p><div class=\"tip\">In der Umgangssprache hört man oft den Infinitiv statt <em>-d<\/em> (<em>¡Callaros!<\/em>); die Norm ist <em>¡Callaos!<\/em><\/div><p><small>Lateinamerika: Statt vosotros wird <em>ustedes<\/em> verwendet: <em>¡Siéntense!<\/em><\/small><\/p>"},{"h":"usted, ustedes und nosotros","html":"<p>Für <em>usted<\/em>, <em>ustedes<\/em> und <em>nosotros<\/em> nimmt man die Formen des <b>subjuntivo presente<\/b>.<\/p><table><tr><th>Infinitiv<\/th><th>usted<\/th><th>ustedes<\/th><th>nosotros<\/th><\/tr><tr><td><em>hablar<\/em><\/td><td><em>hable<\/em><\/td><td><em>hablen<\/em><\/td><td><em>hablemos<\/em><\/td><\/tr><tr><td><em>comer<\/em><\/td><td><em>coma<\/em><\/td><td><em>coman<\/em><\/td><td><em>comamos<\/em><\/td><\/tr><tr><td><em>hacer<\/em><\/td><td><em>haga<\/em><\/td><td><em>hagan<\/em><\/td><td><em>hagamos<\/em><\/td><\/tr><tr><td><em>ir<\/em><\/td><td><em>vaya<\/em><\/td><td><em>vayan<\/em><\/td><td><em>vamos<\/em> / <em>vayamos<\/em><\/td><\/tr><\/table><ul><li><em>Pase, por favor, y espere aquí.<\/em> <small>Kommen Sie bitte herein und warten Sie hier.<\/small><\/li><li><em>Empecemos por el principio.<\/em> <small>Fangen wir am Anfang an.<\/small><\/li><\/ul><p>Für „Lass(t) uns gehen“ sagt man fast immer <em>¡Vamos!<\/em> bzw. <em>¡Vámonos!<\/em>; <em>vayamos<\/em> ist förmlich. Sehr häufig ist auch <em>vamos a<\/em> + Infinitiv: <em>¡Vamos a bailar!<\/em> <small>Lasst uns tanzen!<\/small><\/p>"},{"h":"Verneinter Imperativ","html":"<p>Der verneinte Imperativ wird für <b>alle<\/b> Personen mit <em>no<\/em> + subjuntivo presente gebildet – auch für <em>tú<\/em> und <em>vosotros<\/em>.<\/p><table><tr><th>Person<\/th><th>bejaht<\/th><th>verneint<\/th><\/tr><tr><td>tú<\/td><td><em>habla<\/em><\/td><td><em>no hables<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>comed<\/em><\/td><td><em>no comáis<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>ven<\/em><\/td><td><em>no vengas<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>ve<\/em> (ir)<\/td><td><em>no vayas<\/em><\/td><\/tr><tr><td>usted<\/td><td><em>salga<\/em><\/td><td><em>no salga<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>vamos<\/em><\/td><td><em>no vayamos<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: <em>*¡No habla!<\/em> oder <em>*¡No hablad!<\/em> sind falsch. Verneint immer subjuntivo: <em>¡No hables! ¡No habléis!<\/em><\/div>"},{"h":"Pronomen beim Imperativ","html":"<p><b>Bejaht<\/b>: Pronomen werden <b>angehängt<\/b> (indirektes vor direktem Objekt). <b>Verneint<\/b>: Pronomen stehen <b>vor<\/b> dem Verb.<\/p><table><tr><th>bejaht<\/th><th>verneint<\/th><\/tr><tr><td><em>Dímelo.<\/em> <small>Sag es mir.<\/small><\/td><td><em>No me lo digas.<\/em><\/td><\/tr><tr><td><em>Siéntese.<\/em> <small>Setzen Sie sich.<\/small><\/td><td><em>No se siente.<\/em><\/td><\/tr><tr><td><em>Cómpraselo.<\/em> <small>Kauf es ihm.<\/small><\/td><td><em>No se lo compres.<\/em><\/td><\/tr><tr><td><em>Levantaos.<\/em><\/td><td><em>No os levantéis.<\/em><\/td><\/tr><\/table><p>Bei <em>nosotros<\/em> + <em>nos<\/em> oder + <em>se<\/em> fällt das <b>-s<\/b> der Verbform weg:<\/p><ul><li><em>sentemos + nos → sentémonos<\/em> <small>Setzen wir uns.<\/small><\/li><li><em>vamos + nos → vámonos<\/em> <small>Gehen wir.<\/small><\/li><li><em>digamos + se + lo → digámoselo<\/em> <small>Sagen wir es ihm.<\/small><\/li><\/ul><div class=\"tip\">Merke: <em>le/les<\/em> + <em>lo/la/los/las<\/em> wird zu <em>se<\/em>: <em>Dale el libro → Dáselo.<\/em><\/div>"},{"h":"Akzentsetzung","html":"<p>Durch angehängte Pronomen verschiebt sich die Wortbetonung nicht – aber das Wort wird länger. Dann braucht die betonte Silbe oft einen <b>geschriebenen Akzent<\/b>.<\/p><table><tr><th>ohne<\/th><th>mit Pronomen<\/th><\/tr><tr><td><em>mira<\/em><\/td><td><em>mírame<\/em><\/td><\/tr><tr><td><em>explica<\/em><\/td><td><em>explícamelo<\/em><\/td><\/tr><tr><td><em>siente<\/em> (Ud.)<\/td><td><em>siéntese<\/em><\/td><\/tr><tr><td><em>di<\/em><\/td><td><em>dime<\/em> → <em>dímelo<\/em><\/td><\/tr><tr><td><em>pon<\/em><\/td><td><em>ponlo<\/em> → <em>pónselo<\/em><\/td><\/tr><\/table><div class=\"tip\">Regel: Eine einsilbige Form + <b>ein<\/b> Pronomen bleibt ohne Akzent (<em>dame, hazlo, ponte<\/em>); ab zwei Pronomen oder bei mehrsilbigen Formen brauchst du ihn meist (<em>dámelo, cómelo<\/em>).<\/div><p>Bei <em>vosotros<\/em> gilt dieselbe Regel: <em>dadme<\/em> (kein Akzent), aber <em>decídselo, enviádsela<\/em>. Bei -ir-Verben mit <em>os<\/em> trennt der Akzent die Vokale: <em>vestíos, divertíos<\/em>.<\/p>"},{"h":"Andere Aufforderungsformen","html":"<p>Im Alltag wird der Imperativ oft durch andere, weichere oder unpersönliche Formen ersetzt:<\/p><ul><li><b>Infinitiv<\/b> auf Schildern, in Anleitungen: <em>No fumar. No tocar. Agitar antes de usar.<\/em> <small>Nicht rauchen. Nicht berühren. Vor Gebrauch schütteln.<\/small><\/li><li><b>Frage mit poder<\/b> (höflich): <em>¿Puedes bajar la música?<\/em> <small>Kannst du die Musik leiser machen?<\/small> <em>¿Podría darme la cuenta?<\/em><\/li><li><b>Präsens als Frage<\/b> (sehr alltäglich): <em>¿Me pasas la sal?<\/em> <small>Gibst du mir mal das Salz?<\/small><\/li><li><b>a + Infinitiv<\/b> (energisch, oft zu Kindern): <em>¡A dormir!<\/em> <small>Ab ins Bett!<\/small> <em>¡A comer!<\/em> <small>Essen ist fertig!<\/small><\/li><li><b>que + subjuntivo<\/b> (Wunsch, Weitergabe): <em>¡Que te mejores!<\/em> <small>Gute Besserung!<\/small> <em>Que pase.<\/em> <small>Er soll reinkommen.<\/small><\/li><li><b>Präsens<\/b> als bestimmte Anweisung: <em>Tú te quedas aquí y yo voy a por pan.<\/em> <small>Du bleibst hier, und ich hole Brot.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Der nackte Imperativ wirkt im Spanischen weniger unhöflich als im Deutschen – <em>Pásame la sal, por favor<\/em> ist völlig normal. Mit <em>usted<\/em> aber lieber <em>¿Podría …?<\/em> verwenden.<\/div>"}],"exercises":[{"type":"gap","title":"Imperativ tú (bejaht)","task":"Setze den bejahten Imperativ für tú ein.","items":[{"q":"(escuchar) ___ con atención.","a":["Escucha","escucha"],"de":"Hör aufmerksam zu."},{"q":"(beber) ___ más agua.","a":["Bebe","bebe"],"de":"Trink mehr Wasser."},{"q":"(abrir) ___ la ventana, por favor.","a":["Abre","abre"],"de":"Mach bitte das Fenster auf."},{"q":"(tener) ___ paciencia.","a":["Ten","ten"],"de":"Hab Geduld."},{"q":"(hacer) ___ los deberes ahora.","a":["Haz","haz"],"de":"Mach jetzt die Hausaufgaben."},{"q":"(salir) ___ de ahí ahora mismo.","a":["Sal","sal"],"de":"Komm sofort da raus."},{"q":"(ir) ___ a la farmacia, por favor.","a":["Ve","ve"],"de":"Geh bitte zur Apotheke."},{"q":"(ser) ___ amable con tu hermana.","a":["Sé","sé"],"de":"Sei nett zu deiner Schwester."},{"q":"(volver) ___ antes de las diez.","a":["Vuelve","vuelve"],"de":"Komm vor zehn zurück."},{"q":"(poner) ___ la leche en la nevera.","a":["Pon","pon"],"de":"Stell die Milch in den Kühlschrank."}]},{"type":"gap","title":"vosotros, usted, ustedes, nosotros","task":"Setze den bejahten Imperativ in der angegebenen Person ein.","items":[{"q":"(vosotros – cantar) ___ más alto.","a":["Cantad","cantad"],"de":"Singt lauter."},{"q":"(vosotros – sentarse) ___ , por favor.","a":["Sentaos","sentaos"],"de":"Setzt euch bitte."},{"q":"(usted – firmar) ___ aquí, por favor.","a":["Firme","firme"],"de":"Unterschreiben Sie bitte hier."},{"q":"(ustedes – pasar) ___ , están en su casa.","a":["Pasen","pasen"],"de":"Kommen Sie herein, fühlen Sie sich wie zu Hause."},{"q":"(usted – tener) ___ en cuenta el horario.","a":["Tenga","tenga"],"de":"Berücksichtigen Sie den Fahrplan."},{"q":"(nosotros – empezar) ___ ya, que es tarde.","a":["Empecemos","empecemos"],"de":"Fangen wir an, es ist spät."},{"q":"(vosotros – irse) ___ ya, que vais a perder el tren.","a":["Idos","idos","Iros","iros"],"de":"Geht jetzt, sonst verpasst ihr den Zug."},{"q":"(ustedes – seguir) ___ todo recto.","a":["Sigan","sigan"],"de":"Gehen Sie geradeaus weiter."},{"q":"(vosotros – divertirse) ___ mucho en la fiesta.","a":["Divertíos","divertíos"],"de":"Amüsiert euch gut auf der Party."}]},{"type":"gap","title":"Verneinter Imperativ","task":"Verneine den Imperativ (gleiche Person).","items":[{"q":"Habla. → No ___ .","a":["hables"],"de":"Sprich nicht."},{"q":"Comed. → No ___ .","a":["comáis"],"de":"Esst nicht."},{"q":"Ven. → No ___ .","a":["vengas"],"de":"Komm nicht."},{"q":"Haz eso. → No ___ eso.","a":["hagas"],"de":"Mach das nicht."},{"q":"Ve sola. → No ___ sola.","a":["vayas"],"de":"Geh nicht allein."},{"q":"Dilo. → No lo ___ .","a":["digas"],"de":"Sag es nicht."},{"q":"Salid. → No ___ .","a":["salgáis"],"de":"Geht nicht raus."},{"q":"Cruce (usted). → No ___ .","a":["cruce"],"de":"Überqueren Sie nicht."},{"q":"Sé tonto. → No ___ tonto.","a":["seas"],"de":"Sei nicht dumm."},{"q":"Toca. → No ___ .","a":["toques"],"de":"Fass nicht an."}]},{"type":"choice","title":"Pronomen und Akzente","task":"Wähle die korrekte Form.","items":[{"q":"Sag es mir! (tú)","options":["¡Dímelo!","¡Dimelo!","¡Me lo di!"],"a":0,"why":"Bejaht: Pronomen angehängt; bei zwei Pronomen Akzent."},{"q":"Sag es mir nicht! (tú)","options":["¡No dímelo!","¡No me lo digas!","¡No me lo dices!"],"a":1,"why":"Verneint: Pronomen vorangestellt + subjuntivo."},{"q":"Setzen Sie sich! (usted)","options":["¡Siéntase!","¡Siéntese!","¡Siéntate!"],"a":1,"why":"usted → subjuntivo siente + se, mit Akzent."},{"q":"Setzen wir uns!","options":["¡Sentémosnos!","¡Sentémonos!","¡Sentamos!"],"a":1,"why":"Vor nos fällt das -s der nosotros-Form weg."},{"q":"Steht auf! (vosotros)","options":["¡Levantados!","¡Levantaos!","¡Levantados os!"],"a":1,"why":"Reflexiv: -d fällt vor os weg."},{"q":"Gib ihm das Buch! → Gib es ihm!","options":["¡Dáselo!","¡Dálelo!","¡Daselo!"],"a":0,"why":"le + lo → se lo; zwei Pronomen → Akzent."},{"q":"Mach es! (tú)","options":["¡Hazlo!","¡Házlo!","¡Lo haz!"],"a":0,"why":"Einsilbige Form + ein Pronomen → kein Akzent."},{"q":"Erklären Sie es uns bitte. (usted)","options":["Explíquenoslo, por favor.","Expliquenoslo, por favor.","Nos lo explique, por favor."],"a":0,"why":"Bejaht: Pronomen angehängt, Akzent auf der betonten Silbe."},{"q":"Gehen wir! (umgangssprachlich)","options":["¡Vayámonos!","¡Vámonos!","¡Vamosnos!"],"a":1,"why":"vamos + nos → vámonos (s fällt weg)."}]},{"type":"gap","title":"Pronomen anhängen oder voranstellen","task":"Forme den Imperativ mit Pronomen um. Achte auf Akzente.","items":[{"q":"Compra el pan. (lo) → ___ .","a":["Cómpralo","cómpralo"],"de":"Kauf es."},{"q":"No compres el pan. (lo) → No ___ compres.","a":["lo"],"de":"Kauf es nicht."},{"q":"Ponte la chaqueta. → (la) ___ .","a":["Póntela","póntela"],"de":"Zieh sie an."},{"q":"No te pongas la chaqueta. → (la) No ___ pongas.","a":["te la"],"de":"Zieh sie nicht an."},{"q":"Enviad la carta a Ana. → (se + la) ___ .","a":["Enviádsela","enviádsela"],"de":"Schickt ihn ihr."},{"q":"Traiga los documentos. (usted, los) → ___ .","a":["Tráigalos","tráigalos"],"de":"Bringen Sie sie."},{"q":"Lavaos las manos. (vosotros, las) → ___ .","a":["Laváoslas","laváoslas"],"de":"Wascht sie euch."},{"q":"Contemos la historia a los niños. (se + la) → ___ .","a":["Contémosela","contémosela"],"de":"Erzählen wir sie ihnen."}]},{"type":"choice","title":"Welche Aufforderung passt?","task":"Wähle die passende Form.","items":[{"q":"Schild im Museum: „Nicht berühren“","options":["No toques.","No tocar.","No toca."],"a":1,"why":"Auf Schildern steht meist der Infinitiv."},{"q":"Mutter zu den Kindern um 21 Uhr: „Ab ins Bett!“","options":["¡A dormir!","¡Dormir!","¡Duermes!"],"a":0,"why":"a + Infinitiv = energische Aufforderung."},{"q":"Am Tisch, beiläufig: „Gibst du mir mal das Brot?“","options":["¿Me pasas el pan?","¿Me pases el pan?","¿Pasarme el pan?"],"a":0,"why":"Präsens als Frage = alltägliche Bitte."},{"q":"Zum Kellner: „Könnten Sie uns die Rechnung bringen?“","options":["¿Puede traernos la cuenta?","¡Tráenos la cuenta!","¿Nos trae la cuenta tú?"],"a":0,"why":"Höfliche Frage mit poder in der usted-Form."},{"q":"Zu einer kranken Freundin: „Gute Besserung!“","options":["¡Mejórate!","¡Que te mejores!","Beides ist möglich."],"a":2,"why":"Sowohl Imperativ als auch que + subjuntivo sind üblich."},{"q":"„Geh nicht!“ (tú)","options":["¡No ve!","¡No vas!","¡No vayas!"],"a":2,"why":"Verneinter Imperativ = subjuntivo: no vayas."},{"q":"„Seid still!“ (Norm)","options":["¡Callaros!","¡Callaos!","¡Callados!"],"a":1,"why":"Reflexiv vosotros: -d fällt vor os weg; callaros ist umgangssprachlich."},{"q":"„Seien Sie vorsichtig!“ (ustedes)","options":["¡Tened cuidado!","¡Tengan cuidado!","¡Tienen cuidado!"],"a":1,"why":"ustedes → subjuntivo tengan."}]}],"cards":[{"f":"Imperativ tú (regelmäßig)","b":"= 3. Person Sg. Präsens: habla, come, vive"},{"f":"tener – Imperativ (tú)","b":"¡ten!"},{"f":"poner – Imperativ (tú)","b":"¡pon!"},{"f":"salir – Imperativ (tú)","b":"¡sal!"},{"f":"venir – Imperativ (tú)","b":"¡ven!"},{"f":"hacer – Imperativ (tú)","b":"¡haz!"},{"f":"decir – Imperativ (tú)","b":"¡di!"},{"f":"ir – Imperativ (tú)","b":"¡ve!"},{"f":"ser – Imperativ (tú)","b":"¡sé!"},{"f":"Imperativ vosotros","b":"Infinitiv -r → -d: hablad, comed, vivid"},{"f":"sentarse – Imperativ (vosotros)","b":"¡sentaos! (d fällt weg)"},{"f":"irse – Imperativ (vosotros)","b":"¡idos!"},{"f":"Imperativ usted/ustedes/nosotros","b":"= subjuntivo: hable, hablen, hablemos"},{"f":"ir – Imperativ (nosotros)","b":"¡vamos! (förmlich: vayamos) – reflexiv: ¡vámonos!"},{"f":"Verneinter Imperativ","b":"no + subjuntivo (alle Personen): no hables, no comáis"},{"f":"Pronomen beim bejahten Imperativ","b":"angehängt: dímelo, siéntese"},{"f":"Pronomen beim verneinten Imperativ","b":"vorangestellt: no me lo digas"},{"f":"Setzen wir uns!","b":"¡Sentémonos! (sentemos + nos, s fällt weg)"},{"f":"Sagen wir es ihm!","b":"¡Digámoselo!"},{"f":"Gib es ihm!","b":"¡Dáselo! (le + lo → se lo)"},{"f":"Setzen Sie sich!","b":"¡Siéntese!"},{"f":"Akzent: einsilbig + 1 Pronomen","b":"kein Akzent: dame, hazlo, ponte"},{"f":"Schild: Nicht rauchen","b":"No fumar. (Infinitiv)"},{"f":"Ab ins Bett!","b":"¡A dormir! (a + Infinitiv)"},{"f":"Gibst du mir mal das Salz?","b":"¿Me pasas la sal?"},{"f":"Gute Besserung!","b":"¡Que te mejores!"}],"id":"k19"},{"nr":18,"title":"Infinitiv, Gerundio und Partizip","teil":"Das Verb und seine Ergänzungen","intro":"Infinitiv, gerundio und Partizip sind die drei unpersönlichen Verbformen: Sie zeigen keine Person an, sind aber Bausteine für unzählige Konstruktionen. Wer sie sicher bildet und richtig einsetzt, klingt sofort natürlicher.","sections":[{"h":"Der Infinitiv als Substantiv","html":"<p>Der Infinitiv kann wie ein Substantiv gebraucht werden – als Subjekt oder Objekt eines Satzes. Er ist dann immer <b>männlich<\/b>; der Artikel <em>el<\/em> ist möglich, aber oft nicht nötig.<\/p><ul><li><em>(El) Nadar es muy sano.<\/em> – Schwimmen ist sehr gesund.<\/li><li><em>Me encanta cocinar para mis amigos.<\/em> – Ich koche total gern für meine Freunde.<\/li><li><em>Me pone nervioso el constante sonar del móvil.<\/em> – Das ständige Klingeln des Handys macht mich nervös. <small>(mit Adjektiv steht der Artikel)<\/small><\/li><li><em>Fumar está prohibido.<\/em> – Rauchen ist verboten.<\/li><\/ul><p>Einige Infinitive sind zu echten Substantiven geworden und haben einen Plural: <em>el deber – los deberes<\/em> (Pflicht – Hausaufgaben), <em>el poder<\/em> (die Macht), <em>el amanecer<\/em> (der Sonnenaufgang), <em>el atardecer<\/em> (die Abenddämmerung), <em>los quehaceres<\/em> (die Hausarbeiten).<\/p><div class=\"warn\">Achtung: Im Deutschen sagt man „das Lesen“. Im Spanischen steht nach Präpositionen <b>kein<\/b> Artikel vor dem Infinitiv: <em>Antes de leer…<\/em>, nicht <em>*antes del leer<\/em>. Einzige feste Ausnahme: <em>al<\/em> + Infinitiv (s. u.).<\/div>"},{"h":"Infinitiv nach Präpositionen – al + Infinitiv","html":"<p>Nach einer Präposition steht im Spanischen immer der <b>Infinitiv<\/b> (nie das gerundio, nie eine konjugierte Form), wenn das Subjekt dasselbe bleibt. Im Deutschen entspricht das oft einem Nebensatz oder „zu + Infinitiv“.<\/p><table><tr><th>Spanisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>antes de salir<\/em><\/td><td>bevor ich/er … gehe/geht<\/td><\/tr><tr><td><em>después de comer<\/em><\/td><td>nach dem Essen<\/td><\/tr><tr><td><em>sin decir nada<\/em><\/td><td>ohne etwas zu sagen<\/td><\/tr><tr><td><em>para aprender<\/em><\/td><td>um zu lernen<\/td><\/tr><tr><td><em>en vez de llamar<\/em><\/td><td>statt anzurufen<\/td><\/tr><tr><td><em>hasta terminar<\/em><\/td><td>bis (ich) fertig bin<\/td><\/tr><\/table><p><b>al + Infinitiv<\/b> drückt Gleichzeitigkeit aus und entspricht „als“ (Vergangenheit) oder „wenn/sobald“ (Gegenwart, Zukunft):<\/p><ul><li><em>Al entrar en la cocina, olí el pastel.<\/em> – Als ich die Küche betrat, roch ich den Kuchen.<\/li><li><em>Al llegar a casa, te escribo.<\/em> – Wenn/Sobald ich zu Hause ankomme, schreibe ich dir.<\/li><li><em>Al ver la factura, Marta se puso pálida.<\/em> – Als Marta die Rechnung sah, wurde sie blass.<\/li><\/ul><div class=\"tip\">Merke: <em>al<\/em> + Infinitiv = „als / wenn / beim …“. <em>Al abrir la puerta<\/em> = beim Öffnen der Tür.<\/div><div class=\"warn\">Achtung: „ohne zu fragen“ heißt <em>sin preguntar<\/em> – das „zu“ hat keine Entsprechung. Ebenso „um zu“ = nur <em>para<\/em>.<\/div>"},{"h":"Verben + Infinitiv: ohne Präposition","html":"<p>Viele Verben schließen einen Infinitiv direkt an – ohne Präposition, wie die deutschen Modalverben:<\/p><ul><li><em>querer, poder, saber, deber, necesitar, preferir, desear<\/em><\/li><li><em>pensar<\/em> (= vorhaben): <em>Pienso pasar el verano en Asturias.<\/em> – Ich habe vor, den Sommer in Asturien zu verbringen.<\/li><li><em>esperar<\/em> (hoffen), <em>intentar<\/em> (versuchen), <em>conseguir<\/em> (schaffen), <em>olvidar<\/em> (vergessen), <em>decidir<\/em> (beschließen), <em>prometer<\/em> (versprechen)<\/li><li><em>me gusta / me encanta / me apetece<\/em> + Infinitiv<\/li><\/ul><ul><li><em>Sabemos esquiar.<\/em> – Wir können Ski fahren.<\/li><li><em>Hemos decidido vender el coche.<\/em> – Wir haben beschlossen, das Auto zu verkaufen.<\/li><li><em>No consigo abrir este bote.<\/em> – Ich schaffe es nicht, dieses Glas aufzumachen.<\/li><\/ul><div class=\"tip\">Merke: <em>saber<\/em> + Infinitiv = etwas gelernt haben und können (<em>sé nadar<\/em>); <em>poder<\/em> = die Möglichkeit/Erlaubnis haben (<em>hoy no puedo nadar, tengo fiebre<\/em>).<\/div>"},{"h":"Verben + a / de / en + Infinitiv","html":"<p>Andere Verben verlangen eine feste Präposition. Diese muss man mitlernen:<\/p><table><tr><th>Präp.<\/th><th>Verben<\/th><th>Beispiel<\/th><\/tr><tr><td><em>a<\/em><\/td><td><em>empezar, comenzar, aprender, ayudar, volver, ir, enseñar, invitar<\/em><\/td><td><em>Aprendí a conducir con 30 años.<\/em><\/td><\/tr><tr><td><em>de<\/em><\/td><td><em>dejar, terminar, acabar, tratar, acordarse, olvidarse, alegrarse<\/em><\/td><td><em>Mi padre dejó de fumar.<\/em><\/td><\/tr><tr><td><em>en<\/em><\/td><td><em>insistir, tardar, pensar (= denken an), quedar, dudar<\/em><\/td><td><em>Insiste en pagar él.<\/em><\/td><\/tr><tr><td><em>con<\/em><\/td><td><em>soñar, amenazar, contentarse<\/em><\/td><td><em>Sueña con vivir junto al mar.<\/em><\/td><\/tr><\/table><ul><li><em>Empezó a llover.<\/em> – Es fing an zu regnen.<\/li><li><em>Trata de dormir un poco.<\/em> – Versuch, ein bisschen zu schlafen.<\/li><li><em>Tardamos dos horas en encontrar aparcamiento.<\/em> – Wir brauchten zwei Stunden, um einen Parkplatz zu finden.<\/li><li><em>¿Te acordaste de regar las plantas?<\/em> – Hast du daran gedacht, die Pflanzen zu gießen?<\/li><\/ul><div class=\"warn\">Achtung: <em>olvidar<\/em> + Inf. (ohne Präposition) und <em>olvidarse de<\/em> + Inf. bedeuten dasselbe: <em>Olvidé cerrar<\/em> = <em>Me olvidé de cerrar<\/em>. Falsch ist die Mischung <em>*Olvidé de cerrar<\/em>.<\/div><div class=\"tip\">Eselsbrücke: Bewegung und Beginn → <em>a<\/em> (<em>ir a, empezar a<\/em>); Aufhören und Abstand → <em>de<\/em> (<em>dejar de, terminar de<\/em>); Beharren und Dauer → <em>en<\/em> (<em>insistir en, tardar en<\/em>).<\/div>"},{"h":"Das gerundio: Formen","html":"<p>Das gerundio ist unveränderlich. Es wird vom Infinitivstamm gebildet:<\/p><table><tr><th>Infinitiv<\/th><th>Endung<\/th><th>gerundio<\/th><\/tr><tr><td><em>trabajar<\/em><\/td><td>-ando<\/td><td><em>trabajando<\/em><\/td><\/tr><tr><td><em>beber<\/em><\/td><td>-iendo<\/td><td><em>bebiendo<\/em><\/td><\/tr><tr><td><em>escribir<\/em><\/td><td>-iendo<\/td><td><em>escribiendo<\/em><\/td><\/tr><\/table><p><b>-yendo<\/b>: Endet der Stamm auf einen Vokal, wird aus <em>-iendo<\/em> → <em>-yendo<\/em>: <em>leer → leyendo, oír → oyendo, caer → cayendo, traer → trayendo, construir → construyendo, creer → creyendo<\/em>. Auch <em>ir → yendo<\/em>.<\/p><p><b>Stammwechsel bei -ir-Verben<\/b> (e → i, o → u):<\/p><table><tr><th>e → i<\/th><th>o → u<\/th><\/tr><tr><td><em>pedir → pidiendo<\/em><\/td><td><em>dormir → durmiendo<\/em><\/td><\/tr><tr><td><em>decir → diciendo<\/em><\/td><td><em>morir → muriendo<\/em><\/td><\/tr><tr><td><em>venir → viniendo<\/em><\/td><td><em>poder → pudiendo<\/em><\/td><\/tr><tr><td><em>sentir → sintiendo<\/em><\/td><td><\/td><\/tr><tr><td><em>seguir → siguiendo<\/em><\/td><td><\/td><\/tr><tr><td><em>reír → riendo<\/em><\/td><td><\/td><\/tr><\/table><div class=\"tip\">Merke: Die -ir-Verben, die im indefinido in der 3. Person den Vokal wechseln (<em>pidió, durmió, sintió<\/em>), wechseln ihn auch im gerundio. <em>poder<\/em> (ein -er-Verb!) ist die Ausnahme: <em>pudiendo<\/em>.<\/div><p>Objektpronomen werden angehängt (dann mit Akzent) oder vor das konjugierte Verb gestellt: <em>Estoy leyéndolo<\/em> = <em>Lo estoy leyendo<\/em>.<\/p>"},{"h":"Das gerundio: Gebrauch","html":"<p><b>1. estar + gerundio<\/b> beschreibt eine Handlung, die gerade im Verlauf ist (deutsch: „gerade“, „dabei sein, zu …“):<\/p><ul><li><em>Ahora mismo estoy hablando por teléfono.<\/em> – Ich telefoniere gerade.<\/li><li><em>Cuando sonó el timbre, estábamos cenando.<\/em> – Als es klingelte, waren wir beim Abendessen.<\/li><\/ul><p><b>2. Gleichzeitige Nebenhandlung oder Art und Weise<\/b> (deutsch: „indem“, „wobei“ oder ein Adverb):<\/p><ul><li><em>Volvió a casa silbando.<\/em> – Er ging pfeifend nach Hause.<\/li><li><em>Se aprende mucho viajando.<\/em> – Man lernt viel, indem man reist.<\/li><li><em>Estudiando un poco cada día, aprobarás.<\/em> – Wenn du jeden Tag ein bisschen lernst, bestehst du.<\/li><\/ul><div class=\"warn\">Achtung: Das gerundio ist <b>nie Adjektiv<\/b>. „Eine Frau, die Gitarre spielt“ heißt <em>una mujer que toca la guitarra<\/em>, nicht <em>*una mujer tocando la guitarra<\/em> (außer als Bildunterschrift). „Kochendes Wasser“ = <em>agua hirviendo<\/em> ist eine der ganz wenigen festen Ausnahmen.<\/div><div class=\"warn\">Achtung: Das gerundio drückt nur <b>Gleichzeitigkeit<\/b> (oder unmittelbare Vorzeitigkeit) aus, keine spätere Handlung: <em>*Estudió en Granada, mudándose después a Lyon<\/em> ist falsch → <em>Estudió en Granada y después se mudó a Lyon.<\/em><\/div><div class=\"warn\">Achtung: Kein estar + gerundio für die Zukunft wie im Englischen: „Ich fahre morgen“ = <em>Salgo mañana<\/em> / <em>Voy a salir mañana<\/em>, nicht <em>*Estoy saliendo mañana<\/em>.<\/div>"},{"h":"Das Partizip: Formen","html":"<p>Regelmäßig: <em>-ar → -ado<\/em>, <em>-er/-ir → -ido<\/em>: <em>cantado, comido, vivido<\/em>. Endet der Stamm auf <em>-a, -e, -o<\/em>, bekommt das <em>i<\/em> von <em>-ido<\/em> einen Akzent (Hiatus): <em>leído, oído, traído, caído, creído, reído<\/em> (aber nach <em>u<\/em>: <em>construido, huido<\/em> ohne Akzent).<\/p><table><tr><th>Infinitiv<\/th><th>Partizip<\/th><th>Infinitiv<\/th><th>Partizip<\/th><\/tr><tr><td><em>abrir<\/em><\/td><td><em>abierto<\/em><\/td><td><em>poner<\/em><\/td><td><em>puesto<\/em><\/td><\/tr><tr><td><em>cubrir<\/em><\/td><td><em>cubierto<\/em><\/td><td><em>romper<\/em><\/td><td><em>roto<\/em><\/td><\/tr><tr><td><em>decir<\/em><\/td><td><em>dicho<\/em><\/td><td><em>ver<\/em><\/td><td><em>visto<\/em><\/td><\/tr><tr><td><em>escribir<\/em><\/td><td><em>escrito<\/em><\/td><td><em>volver<\/em><\/td><td><em>vuelto<\/em><\/td><\/tr><tr><td><em>hacer<\/em><\/td><td><em>hecho<\/em><\/td><td><em>resolver<\/em><\/td><td><em>resuelto<\/em><\/td><\/tr><tr><td><em>morir<\/em><\/td><td><em>muerto<\/em><\/td><td><em>freír<\/em><\/td><td><em>frito<\/em><\/td><\/tr><\/table><p>Ableitungen verhalten sich genauso: <em>descubrir → descubierto, describir → descrito, deshacer → deshecho, componer → compuesto, devolver → devuelto, prever → previsto<\/em>.<\/p><div class=\"tip\">Merke: <em>imprimir<\/em> und <em>freír<\/em> haben zwei Formen: <em>he imprimido / he impreso, he freído / he frito<\/em>. Als Adjektiv nimmt man die unregelmäßige: <em>patatas fritas, un texto impreso<\/em>.<\/div>"},{"h":"Das Partizip: Gebrauch","html":"<p><b>1. In zusammengesetzten Zeiten<\/b> mit <em>haber<\/em> ist es <b>unveränderlich<\/b>: <em>Las cartas que he escrito.<\/em><\/p><p><b>2. Als Adjektiv<\/b> gleicht es sich in Genus und Numerus an: <em>una ventana abierta, unos platos rotos, las tiendas cerradas<\/em>.<\/p><p><b>3. estar + Partizip<\/b> beschreibt den Zustand als Ergebnis einer Handlung (mit Angleichung):<\/p><ul><li><em>La cena está preparada.<\/em> – Das Abendessen ist fertig (zubereitet).<\/li><li><em>Los niños están dormidos.<\/em> – Die Kinder schlafen (sind eingeschlafen).<\/li><li><em>¿Está ocupado este asiento?<\/em> – Ist dieser Platz besetzt?<\/li><\/ul><p><b>4. tener + Partizip<\/b> betont, dass etwas erledigt ist und das Ergebnis vorliegt. Das Partizip richtet sich nach dem <b>Objekt<\/b>:<\/p><ul><li><em>Tengo hechos los deberes.<\/em> – Ich habe die Hausaufgaben (schon) fertig.<\/li><li><em>Ya tenemos reservadas las entradas.<\/em> – Wir haben die Karten schon reserviert (sie liegen bereit).<\/li><li><em>Llevo escritas veinte páginas.<\/em> – Ich habe bisher zwanzig Seiten geschrieben.<\/li><\/ul><div class=\"warn\">Achtung: <em>He hecho los deberes<\/em> (haber, Partizip unveränderlich) – aber <em>Tengo hechos los deberes<\/em> (tener, Partizip angeglichen). Nicht verwechseln: <em>*He hechos<\/em> ist falsch.<\/div><div class=\"tip\">Merke: <em>estar<\/em> + Partizip = Zustand („ist geschlossen“), <em>ser<\/em> + Partizip = Vorgang/Passiv („wird geschlossen“), mehr dazu in Kapitel 22.<\/div>"}],"exercises":[{"type":"gap","title":"gerundio bilden","task":"Setze das gerundio des Verbs in Klammern ein.","items":[{"q":"Mi abuela está (leer) ___ el periódico.","a":["leyendo"],"de":"Meine Oma liest gerade die Zeitung."},{"q":"¡No hagas ruido! El bebé está (dormir) ___.","a":["durmiendo"],"de":"Mach keinen Lärm! Das Baby schläft gerade."},{"q":"¿Qué estás (decir) ___? No te entiendo.","a":["diciendo"],"de":"Was sagst du da? Ich verstehe dich nicht."},{"q":"Los camareros están (servir) ___ el postre.","a":["sirviendo"],"de":"Die Kellner servieren gerade den Nachtisch."},{"q":"Estamos (oír) ___ la radio en el coche.","a":["oyendo"],"de":"Wir hören gerade Radio im Auto."},{"q":"Ya estoy (ir) ___ hacia la estación.","a":["yendo"],"de":"Ich bin schon auf dem Weg zum Bahnhof."},{"q":"Están (construir) ___ un hotel junto a la playa.","a":["construyendo"],"de":"Sie bauen gerade ein Hotel am Strand."},{"q":"No (poder) ___ dormir, se levantó a leer.","a":["pudiendo"],"de":"Da er nicht schlafen konnte, stand er auf, um zu lesen."}]},{"type":"gap","title":"Partizipien","task":"Setze das Partizip ein. Achte auf die Angleichung, wo nötig.","items":[{"q":"¿Quién ha (romper) ___ la lámpara?","a":["roto"],"de":"Wer hat die Lampe kaputt gemacht?"},{"q":"La farmacia está (abrir) ___ hasta las diez.","a":["abierta"],"de":"Die Apotheke hat bis zehn Uhr geöffnet."},{"q":"Todavía no hemos (ver) ___ esa serie.","a":["visto"],"de":"Wir haben diese Serie noch nicht gesehen."},{"q":"Tengo (planchar) ___ las camisas para el viaje.","a":["planchadas"],"de":"Ich habe die Hemden für die Reise schon gebügelt."},{"q":"Las tiendas estaban (cerrar) ___ por la fiesta.","a":["cerradas"],"de":"Die Geschäfte waren wegen des Feiertags geschlossen."},{"q":"¿Has (poner) ___ la mesa?","a":["puesto"],"de":"Hast du den Tisch gedeckt?"},{"q":"Me encantan los huevos (freír) ___.","a":["fritos"],"de":"Ich liebe Spiegeleier."},{"q":"Mis padres ya han (volver) ___ de Mallorca.","a":["vuelto"],"de":"Meine Eltern sind schon aus Mallorca zurück."},{"q":"Esta novela está (escribir) ___ en gallego.","a":["escrita"],"de":"Dieser Roman ist auf Galicisch geschrieben."}]},{"type":"gap","title":"Präposition vor dem Infinitiv","task":"Ergänze die fehlende Präposition (a, de, en, con). Wenn keine nötig ist, schreibe „–“.","items":[{"q":"Mi hermano ha dejado ___ comer carne.","a":["de"],"de":"Mein Bruder isst kein Fleisch mehr."},{"q":"Los niños empezaron ___ gritar.","a":["a"],"de":"Die Kinder fingen an zu schreien."},{"q":"Siempre insistes ___ tener razón.","a":["en"],"de":"Du bestehst immer darauf, recht zu haben."},{"q":"Pienso ___ comprarme una bici eléctrica. (pensar = vorhaben)","a":["–","-"],"de":"Ich habe vor, mir ein E-Bike zu kaufen."},{"q":"Trata ___ no llegar tarde, por favor.","a":["de"],"de":"Versuch bitte, nicht zu spät zu kommen."},{"q":"¿Cuánto tardas ___ llegar al trabajo?","a":["en"],"de":"Wie lange brauchst du zur Arbeit?"},{"q":"Sueño ___ dar la vuelta al mundo.","a":["con"],"de":"Ich träume davon, eine Weltreise zu machen."},{"q":"Queremos ___ alquilar un piso en el centro.","a":["–","-"],"de":"Wir möchten eine Wohnung im Zentrum mieten."},{"q":"Mi tía me enseñó ___ hacer croquetas.","a":["a"],"de":"Meine Tante hat mir beigebracht, Kroketten zu machen."}]},{"type":"choice","title":"Infinitiv oder gerundio?","task":"Wähle die richtige Form.","items":[{"q":"Antes de ___, apaga las luces.","options":["salir","saliendo","sales"],"a":0,"why":"Nach Präpositionen steht immer der Infinitiv."},{"q":"___ en el agua, noté que estaba helada.","options":["Al entrar","Entrar","Al entrando"],"a":0,"why":"al + Infinitiv = „als“ (Gleichzeitigkeit)."},{"q":"Se fue sin ___ adiós.","options":["diciendo","decir","dice"],"a":1,"why":"sin + Infinitiv = „ohne zu“."},{"q":"Me gusta ___ por la mañana temprano.","options":["corriendo","correr","el correr de"],"a":1,"why":"gustar wird mit dem Infinitiv ergänzt."},{"q":"Aprendí mucho inglés ___ series en versión original.","options":["viendo","ver","al ver de"],"a":0,"why":"Art und Weise (indem …) → gerundio."},{"q":"Busco una persona ___ alemán.","options":["hablando","que hable","hablado"],"a":1,"why":"Das gerundio kann kein Relativsatz/Adjektiv ersetzen."},{"q":"___ es bueno para el corazón.","options":["Caminando","Caminar","Caminado"],"a":1,"why":"Als Subjekt (Substantiv) steht der Infinitiv."},{"q":"Hay una caja ___ juguetes viejos en el desván.","options":["conteniendo","que contiene","contenida"],"a":1,"why":"Kein gerundio als Adjektiv → Relativsatz."}]},{"type":"choice","title":"Gebrauch und Feinheiten","task":"Wähle die korrekte Variante.","items":[{"q":"Ya ___ la maleta; podemos irnos.","options":["tengo hecha","tengo hecho","he hecha"],"a":0,"why":"tener + Partizip: Angleichung an das Objekt (la maleta)."},{"q":"Las ventanas ___ porque hace calor.","options":["son abiertas","están abiertas","están abierto"],"a":1,"why":"Zustand → estar + angeglichenes Partizip."},{"q":"Mañana ___ a Bilbao.","options":["estoy volando","vuelo","volando"],"a":1,"why":"Geplante Zukunft nicht mit estar + gerundio, sondern Präsens/ir a."},{"q":"Nos conocimos en 2019, ___ al año siguiente.","options":["casándonos","y nos casamos","casarnos"],"a":1,"why":"Spätere Handlung darf nicht mit gerundio ausgedrückt werden."},{"q":"Ya he ___ el libro sobre los Pirineos.","options":["leído","leido","leyendo"],"a":0,"why":"leído trägt einen Akzent (betontes i nach Vokal)."},{"q":"Cuidado, el agua está ___.","options":["hirviendo","hirviente que","hervida que"],"a":0,"why":"agua hirviendo ist eine feste Ausnahme beim adjektivischen gerundio."},{"q":"¿Las fotos? Sí, ya ___ he impreso.","options":["los","las","les"],"a":1,"why":"las fotos → las; das Partizip nach haber bleibt unverändert."},{"q":"Olvidé ___ la puerta con llave.","options":["de cerrar","cerrar","a cerrar"],"a":1,"why":"olvidar ohne Präposition; mit de nur bei olvidarse."}]}],"cards":[{"f":"al + Infinitiv","b":"als / wenn / beim … – Al llegar, llamé. (Als ich ankam, rief ich an.)"},{"f":"Infinitiv als Substantiv – Genus?","b":"immer männlich: el comer, el despertar"},{"f":"„ohne etwas zu sagen“","b":"sin decir nada"},{"f":"„bevor wir gehen“ (gleiches Subjekt)","b":"antes de salir / antes de irnos"},{"f":"aufhören zu …","b":"dejar de + Infinitiv"},{"f":"anfangen zu …","b":"empezar a / comenzar a + Infinitiv"},{"f":"versuchen zu …","b":"tratar de + Inf. / intentar + Inf."},{"f":"vorhaben zu …","b":"pensar + Infinitiv (ohne Präposition)"},{"f":"darauf bestehen zu …","b":"insistir en + Infinitiv"},{"f":"lange brauchen, um zu …","b":"tardar en + Infinitiv"},{"f":"gerundio: leer, oír, ir","b":"leyendo, oyendo, yendo"},{"f":"gerundio: dormir, morir","b":"durmiendo, muriendo"},{"f":"gerundio: pedir, decir, venir","b":"pidiendo, diciendo, viniendo"},{"f":"gerundio: poder","b":"pudiendo (Ausnahme bei -er)"},{"f":"estar + gerundio","b":"Handlung im Verlauf: Estoy cocinando. – Ich koche gerade."},{"f":"Darf das gerundio ein Adjektiv ersetzen?","b":"Nein: una caja que contiene libros (nicht *conteniendo). Ausnahme: agua hirviendo"},{"f":"Partizip: abrir, cubrir, morir","b":"abierto, cubierto, muerto"},{"f":"Partizip: decir, hacer, escribir","b":"dicho, hecho, escrito"},{"f":"Partizip: poner, romper, ver, volver","b":"puesto, roto, visto, vuelto"},{"f":"Partizip: leer, oír, traer","b":"leído, oído, traído (mit Akzent)"},{"f":"haber + Partizip – Angleichung?","b":"nein: Las he visto."},{"f":"estar + Partizip","b":"Zustand mit Angleichung: La puerta está cerrada."},{"f":"tener + Partizip","b":"Ergebnis liegt vor, Angleichung ans Objekt: Tengo hechos los deberes."},{"f":"freír / imprimir – Partizip","b":"freído/frito, imprimido/impreso; als Adjektiv: frito, impreso"},{"f":"Pronomen beim gerundio","b":"angehängt mit Akzent: estoy leyéndolo – oder vorangestellt: lo estoy leyendo"}],"id":"k20"},{"nr":19,"title":"Verbalperiphrasen","teil":"Das Verb und seine Ergänzungen","intro":"Verbalperiphrasen sind feste Verbindungen aus einem konjugierten Hilfsverb und einem Infinitiv, gerundio oder Partizip. Sie drücken genau das aus, wofür das Deutsche kleine Wörter wie „gerade“, „wieder“, „nicht mehr“, „normalerweise“ oder „seit“ braucht – und sind im gesprochenen Spanisch allgegenwärtig.","sections":[{"h":"Was ist eine Periphrase?","html":"<p>Eine Periphrase besteht aus einem <b>konjugierten Hilfsverb<\/b>, oft einer Präposition und einer <b>unpersönlichen Form<\/b>. Das Hilfsverb verliert dabei meist seine Grundbedeutung: <em>volver<\/em> heißt „zurückkehren“, aber <em>volver a llamar<\/em> heißt „noch einmal anrufen“.<\/p><table><tr><th>Typ<\/th><th>Beispiel<\/th><\/tr><tr><td>+ Infinitiv<\/td><td><em>Voy a cenar.<\/em><\/td><\/tr><tr><td>+ gerundio<\/td><td><em>Sigo esperando.<\/em><\/td><\/tr><tr><td>+ Partizip<\/td><td><em>Tengo pensado irme.<\/em><\/td><\/tr><\/table><p>Objektpronomen stehen <b>vor dem Hilfsverb<\/b> oder werden an Infinitiv/gerundio <b>angehängt<\/b>: <em>Te lo voy a contar<\/em> = <em>Voy a contártelo<\/em>; <em>La sigo buscando<\/em> = <em>Sigo buscándola<\/em>.<\/p><div class=\"warn\">Achtung: Die Pronomen dürfen nicht zwischen die beiden Verben: <em>*Voy a te llamar<\/em> ist falsch.<\/div>"},{"h":"Zukunft und Bevorstehen: ir a, estar a punto de","html":"<p><b>ir a + Infinitiv<\/b> drückt Absichten und nahe, absehbare Zukunft aus. Im gesprochenen Spanisch ist es häufiger als das Futur.<\/p><ul><li><em>Este verano vamos a hacer el Camino de Santiago.<\/em> – Diesen Sommer machen wir den Jakobsweg.<\/li><li><em>Mira esas nubes: va a llover.<\/em> – Schau dir die Wolken an, es wird gleich regnen.<\/li><li><em>Iba a llamarte, pero se me hizo tarde.<\/em> – Ich wollte dich anrufen, aber es wurde zu spät.<\/li><\/ul><p><b>estar a punto de + Infinitiv<\/b> = „im Begriff sein, etwas zu tun“, „kurz davor sein“:<\/p><ul><li><em>El tren está a punto de salir.<\/em> – Der Zug fährt jeden Moment ab.<\/li><li><em>Estuve a punto de caerme por la escalera.<\/em> – Ich wäre fast die Treppe hinuntergefallen.<\/li><\/ul><div class=\"tip\">Merke: <em>iba a<\/em> + Infinitiv im imperfecto = „wollte gerade / hatte vor“ (oft nicht verwirklicht). <em>estuve a punto de<\/em> = „beinahe, fast“.<\/div><p><small>In Lateinamerika hört man auch <em>estar por<\/em> + Infinitiv im Sinne von „gleich etwas tun“.<\/small><\/p>"},{"h":"Anfang, Wiederholung und Ende","html":"<table><tr><th>Periphrase<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>empezar a / comenzar a<\/em><\/td><td>anfangen<\/td><td><em>Empecé a trabajar a los 18.<\/em><\/td><\/tr><tr><td><em>ponerse a<\/em><\/td><td>sich daranmachen, plötzlich anfangen<\/td><td><em>Se puso a llorar.<\/em><\/td><\/tr><tr><td><em>echarse a<\/em><\/td><td>plötzlich losbrechen (reír, llorar, correr)<\/td><td><em>Nos echamos a reír.<\/em><\/td><\/tr><tr><td><em>volver a<\/em><\/td><td>wieder, noch einmal<\/td><td><em>No vuelvas a hacerlo.<\/em><\/td><\/tr><tr><td><em>acabar de<\/em><\/td><td>gerade (eben) erst<\/td><td><em>Acabo de comer.<\/em><\/td><\/tr><tr><td><em>terminar de<\/em><\/td><td>zu Ende bringen<\/td><td><em>¿Has terminado de leer?<\/em><\/td><\/tr><tr><td><em>dejar de<\/em><\/td><td>aufhören, nicht mehr<\/td><td><em>Ha dejado de nevar.<\/em><\/td><\/tr><\/table><ul><li><em>Acabo de ver a tu hermano en el súper.<\/em> – Ich habe gerade deinen Bruder im Supermarkt gesehen.<\/li><li><em>Acababan de cerrar cuando llegamos.<\/em> – Sie hatten gerade geschlossen, als wir ankamen.<\/li><li><em>Después de la operación, volvió a jugar al tenis.<\/em> – Nach der OP spielte er wieder Tennis.<\/li><li><em>No dejes de visitar la Alhambra.<\/em> – Besuch auf jeden Fall die Alhambra.<\/li><\/ul><div class=\"warn\">Achtung: „Ich habe gerade gegessen“ heißt <em>Acabo de comer<\/em> (Präsens!), nicht <em>He acabado de comer<\/em> – das bedeutet „ich bin mit dem Essen fertig (geworden)“.<\/div><div class=\"tip\">Merke: <em>no dejar de<\/em> + Infinitiv im Imperativ = „unbedingt tun“; <em>no acabar de<\/em> + Infinitiv = „nicht ganz, nicht so richtig“: <em>No acabo de entenderlo.<\/em> – Ich verstehe es nicht so ganz.<\/div>"},{"h":"Pflicht, Notwendigkeit und Vermutung","html":"<table><tr><th>Form<\/th><th>Bedeutung<\/th><\/tr><tr><td><em>tener que<\/em> + Inf.<\/td><td>müssen (persönlich, äußerer Zwang)<\/td><\/tr><tr><td><em>hay que<\/em> + Inf.<\/td><td>man muss (unpersönlich, nur 3. Sg.)<\/td><\/tr><tr><td><em>deber<\/em> + Inf.<\/td><td>sollen, müssen (moralische Pflicht)<\/td><\/tr><tr><td><em>deber de<\/em> + Inf.<\/td><td>wohl, wahrscheinlich (Vermutung)<\/td><\/tr><\/table><ul><li><em>Mañana tengo que madrugar.<\/em> – Morgen muss ich früh aufstehen.<\/li><li><em>Para entrar en el museo hay que reservar.<\/em> – Für das Museum muss man reservieren.<\/li><li><em>Deberías descansar más.<\/em> – Du solltest dich mehr ausruhen.<\/li><li><em>No contesta; debe de estar en la ducha.<\/em> – Er geht nicht ran, er ist wohl unter der Dusche.<\/li><li><em>Debían de ser las tres cuando oí el ruido.<\/em> – Es muss etwa drei Uhr gewesen sein, als ich das Geräusch hörte.<\/li><\/ul><div class=\"warn\">Achtung: <em>hay que<\/em> hat kein Subjekt: „Wir müssen gehen“ = <em>Tenemos que irnos<\/em>, nicht <em>*Hay que nos vamos<\/em>. Und <em>no tener que<\/em> = „nicht müssen“, <em>no deber<\/em> = „nicht dürfen“: <em>No tienes que venir<\/em> (du musst nicht
