kommen) ≠ <em>No debes venir<\/em> (du darfst/solltest nicht kommen).<\/div><div class=\"tip\">Merke: Für die Vermutung wird im gesprochenen Spanisch oft auch einfach <em>deber<\/em> ohne <em>de<\/em> verwendet. Umgekehrt gilt <em>deber de<\/em> für eine Pflicht als falsch – im Zweifel also: Pflicht ohne <em>de<\/em>, Vermutung mit <em>de<\/em>.<\/div>"},{"h":"Gewohnheit: soler + Infinitiv","html":"<p><b>soler<\/b> (o → ue) + Infinitiv entspricht „normalerweise, gewöhnlich, pflegen zu“. Es wird praktisch nur im <b>Präsens<\/b> und im <b>imperfecto<\/b> gebraucht.<\/p><ul><li><em>Los domingos suelo desayunar churros.<\/em> – Sonntags frühstücke ich normalerweise Churros.<\/li><li><em>¿A qué hora soléis cenar?<\/em> – Wann esst ihr gewöhnlich zu Abend?<\/li><li><em>De niña, solía pasar los veranos en el pueblo.<\/em> – Als Kind verbrachte ich die Sommer meist im Dorf.<\/li><\/ul><div class=\"warn\">Achtung: <em>soler<\/em> drückt Gewohnheit aus und passt nicht zu einmaligen, abgeschlossenen Handlungen. Ein indefinido wie <em>*solí ir<\/em> ist daher praktisch ungebräuchlich.<\/div>"},{"h":"Periphrasen mit gerundio: Dauer und Verlauf","html":"<p><b>llevar + Zeitraum + gerundio<\/b> = „seit … etwas tun“ (die Handlung dauert noch an):<\/p><ul><li><em>Llevo dos años estudiando ruso.<\/em> – Ich lerne seit zwei Jahren Russisch.<\/li><li><em>¿Cuánto tiempo llevas esperando?<\/em> – Wie lange wartest du schon?<\/li><li>Verneint mit <em>sin<\/em> + Infinitiv: <em>Llevamos una semana sin ver el sol.<\/em> – Seit einer Woche haben wir die Sonne nicht gesehen.<\/li><\/ul><div class=\"tip\">Gleichbedeutend: <em>Hace dos años que estudio ruso<\/em> = <em>Estudio ruso desde hace dos años<\/em> = <em>Llevo dos años estudiando ruso<\/em>.<\/div><p><b>seguir / continuar + gerundio<\/b> = „immer noch, weiterhin“:<\/p><ul><li><em>¿Sigues viviendo en Valencia?<\/em> – Wohnst du immer noch in Valencia?<\/li><li><em>Continuó hablando aunque nadie lo escuchaba.<\/em> – Er redete weiter, obwohl ihm niemand zuhörte.<\/li><li>Verneint: <em>sigo sin<\/em> + Infinitiv: <em>Sigo sin entender el problema.<\/em> – Ich verstehe das Problem immer noch nicht.<\/li><\/ul><div class=\"warn\">Achtung: Nach <em>seguir<\/em> steht nie der Infinitiv: <em>*Sigo trabajar<\/em> oder <em>*sigo a trabajar<\/em> (italienische Falle: <em>continuo a lavorare<\/em>) → <em>Sigo trabajando<\/em>.<\/div>"},{"h":"ir, venir, andar, acabar + gerundio","html":"<table><tr><th>Periphrase<\/th><th>Nuance<\/th><\/tr><tr><td><em>ir<\/em> + gerundio<\/td><td>allmählich, nach und nach<\/td><\/tr><tr><td><em>venir<\/em> + gerundio<\/td><td>schon seit einiger Zeit (bis heute), immer wieder<\/td><\/tr><tr><td><em>andar<\/em> + gerundio<\/td><td>herum-…, ständig (oft abwertend)<\/td><\/tr><tr><td><em>acabar<\/em> + gerundio<\/td><td>schließlich, am Ende<\/td><\/tr><\/table><ul><li><em>Poco a poco voy entendiendo el sistema.<\/em> – Nach und nach verstehe ich das System.<\/li><li><em>Los precios vienen subiendo desde hace meses.<\/em> – Die Preise steigen schon seit Monaten.<\/li><li><em>Anda diciendo por ahí que me voy a mudar.<\/em> – Er erzählt überall herum, dass ich umziehe.<\/li><li><em>Al final acabamos cenando en casa.<\/em> – Am Ende haben wir doch zu Hause gegessen.<\/li><\/ul><div class=\"tip\">Merke: <em>acabar<\/em> + gerundio = <em>acabar por<\/em> + Infinitiv: <em>Acabó aceptando<\/em> = <em>Acabó por aceptar<\/em> – Schließlich nahm er an. Nicht verwechseln mit <em>acabar de<\/em> (= gerade erst).<\/div>"},{"h":"Weitere nützliche Periphrasen","html":"<ul><li><b>quedar en<\/b> + Infinitiv = vereinbaren, ausmachen: <em>Quedamos en vernos el sábado.<\/em> – Wir haben ausgemacht, uns am Samstag zu treffen.<\/li><li><b>llegar a<\/b> + Infinitiv = es so weit bringen, sogar: <em>Llegó a ser alcaldesa.<\/em> – Sie wurde sogar Bürgermeisterin. <em>Llegué a pensar que no vendrías.<\/em> – Ich dachte schon, du kämst nicht.<\/li><li><b>tener<\/b> + Partizip = schon erledigt haben / fest vorhaben: <em>Tengo pensado cambiar de trabajo.<\/em> – Ich habe vor, den Job zu wechseln.<\/li><li><b>haber de<\/b> + Infinitiv = müssen (gehoben, schriftlich): <em>Has de tener paciencia.<\/em> – Du musst Geduld haben.<\/li><\/ul><div class=\"warn\">Achtung: <em>quedar en<\/em> + Inf. (vereinbaren) ≠ <em>quedar con alguien<\/em> (sich mit jemandem verabreden): <em>He quedado con Ana. Hemos quedado en ir al cine.<\/em><\/div>"},{"h":"Übersicht: deutsche Signalwörter","html":"<table><tr><th>Deutsch<\/th><th>Spanisch<\/th><th>Beispiel<\/th><\/tr><tr><td>gerade (eben)<\/td><td><em>acabar de<\/em> + Inf.<\/td><td><em>Acaba de salir.<\/em><\/td><\/tr><tr><td>gerade (im Verlauf)<\/td><td><em>estar<\/em> + gerundio<\/td><td><em>Está saliendo.<\/em><\/td><\/tr><tr><td>gleich, kurz davor<\/td><td><em>estar a punto de<\/em><\/td><td><em>Está a punto de salir.<\/em><\/td><\/tr><tr><td>wieder, noch einmal<\/td><td><em>volver a<\/em> + Inf.<\/td><td><em>Volvió a salir.<\/em><\/td><\/tr><tr><td>nicht mehr<\/td><td><em>dejar de<\/em> + Inf.<\/td><td><em>Dejó de salir.<\/em><\/td><\/tr><tr><td>immer noch<\/td><td><em>seguir<\/em> + gerundio<\/td><td><em>Sigue saliendo.<\/em><\/td><\/tr><tr><td>normalerweise<\/td><td><em>soler<\/em> + Inf.<\/td><td><em>Suele salir.<\/em><\/td><\/tr><tr><td>seit (Dauer)<\/td><td><em>llevar<\/em> + Zeit + gerundio<\/td><td><em>Lleva un mes saliendo con Eva.<\/em><\/td><\/tr><tr><td>nach und nach<\/td><td><em>ir<\/em> + gerundio<\/td><td><em>Va mejorando.<\/em><\/td><\/tr><tr><td>schließlich<\/td><td><em>acabar<\/em> + gerundio<\/td><td><em>Acabó saliendo.<\/em><\/td><\/tr><tr><td>wohl, vermutlich<\/td><td><em>deber de<\/em> + Inf.<\/td><td><em>Debe de estar fuera.<\/em><\/td><\/tr><\/table><div class=\"tip\">Merke: Wenn im deutschen Satz eines dieser Signalwörter steht, ist im Spanischen fast immer eine Periphrase die natürlichste Lösung.<\/div>"}],"exercises":[{"type":"choice","title":"Welche Periphrase passt?","task":"Wähle die passende Form.","items":[{"q":"Mira el cielo: ___ a nevar.","options":["va","acaba","suele"],"a":0,"why":"Absehbare Zukunft → ir a + Infinitiv."},{"q":"¿Pablo? No está, ___ de salir.","options":["vuelve","acaba","deja"],"a":1,"why":"„gerade eben“ → acabar de."},{"q":"Mi madre ___ de fumar hace diez años.","options":["dejó","acabó","volvió"],"a":0,"why":"„aufhören, nicht mehr“ → dejar de."},{"q":"Perdona, ¿puedes ___ a explicarlo?","options":["acabar","volver","dejar"],"a":1,"why":"„noch einmal“ → volver a."},{"q":"Los sábados ___ levantarnos tarde.","options":["solemos","llevamos","seguimos"],"a":0,"why":"„normalerweise“ → soler + Infinitiv."},{"q":"Cuando vio la nota, ___ a llorar.","options":["se puso","acabó","dejó"],"a":0,"why":"Plötzlicher Beginn → ponerse a."},{"q":"Date prisa, la película está ___ empezar.","options":["por punto de","a punto de","acabando de"],"a":1,"why":"„kurz davor“ → estar a punto de."},{"q":"Para viajar a Japón ___ tener el pasaporte en regla.","options":["hay que","tiene","debe de"],"a":0,"why":"Allgemeine, unpersönliche Notwendigkeit → hay que."}]},{"type":"gap","title":"Periphrasen ergänzen","task":"Setze die richtige Form des Hilfsverbs in Klammern ein (Präsens, wenn nicht anders angegeben).","items":[{"q":"(Yo – llevar) ___ tres meses buscando trabajo.","a":["Llevo","llevo"],"de":"Ich suche seit drei Monaten Arbeit."},{"q":"¿Todavía (tú – seguir) ___ jugando al balonmano?","a":["sigues"],"de":"Spielst du immer noch Handball?"},{"q":"Nosotros (soler) ___ cenar a las nueve y media.","a":["solemos"],"de":"Wir essen normalerweise um halb zehn zu Abend."},{"q":"Los niños (acabar) ___ de llegar del colegio.","a":["acaban"],"de":"Die Kinder sind gerade aus der Schule gekommen."},{"q":"Cuando yo era pequeño, mi padre (soler, imperfecto) ___ llevarme al río.","a":["solía"],"de":"Als ich klein war, nahm mich mein Vater oft mit zum Fluss."},{"q":"Vosotros (tener) ___ que entregar el trabajo el lunes.","a":["tenéis"],"de":"Ihr müsst die Arbeit am Montag abgeben."},{"q":"La situación (ir) ___ mejorando poco a poco.","a":["va"],"de":"Die Lage bessert sich nach und nach."},{"q":"Ayer (nosotras – quedar, indefinido) ___ en vernos a las seis.","a":["quedamos"],"de":"Gestern haben wir ausgemacht, uns um sechs zu treffen."},{"q":"Al final, ellos (acabar, indefinido) ___ comprando la casa más cara.","a":["acabaron"],"de":"Am Ende kauften sie doch das teuerste Haus."}]},{"type":"gap","title":"Infinitiv oder gerundio?","task":"Setze das Verb in Klammern als Infinitiv oder gerundio ein.","items":[{"q":"Llevo media hora (esperar) ___ el autobús.","a":["esperando"],"de":"Ich warte seit einer halben Stunde auf den Bus."},{"q":"Voy a (llamar) ___ a la abuela.","a":["llamar"],"de":"Ich rufe jetzt die Oma an."},{"q":"Sigue (llover) ___ en el norte.","a":["lloviendo"],"de":"Im Norden regnet es immer noch."},{"q":"Lleva dos días sin (comer) ___.","a":["comer"],"de":"Er hat seit zwei Tagen nichts gegessen."},{"q":"Todo el día anda (quejarse) ___ de todo.","a":["quejándose"],"de":"Er beschwert sich den ganzen Tag über alles."},{"q":"Hemos vuelto a (perder) ___ el partido.","a":["perder"],"de":"Wir haben das Spiel wieder verloren."},{"q":"Las ventas vienen (bajar) ___ desde enero.","a":["bajando"],"de":"Der Umsatz geht seit Januar zurück."},{"q":"Sigo sin (saber) ___ qué regalarle.","a":["saber"],"de":"Ich weiß immer noch nicht, was ich ihm schenken soll."},{"q":"Después de mucho discutir, acabó (darme) ___ la razón.","a":["dándome"],"de":"Nach langer Diskussion gab er mir schließlich recht."}]},{"type":"choice","title":"deber, deber de, tener que, hay que","task":"Wähle die passende Variante.","items":[{"q":"Hay luz en su ventana; ___ estar en casa.","options":["tiene que de","debe de","hay que"],"a":1,"why":"Vermutung → deber de."},{"q":"Los conductores ___ respetar los límites de velocidad.","options":["deben","deben de","hay que"],"a":0,"why":"Pflicht → deber ohne de."},{"q":"Para hacer una buena paella ___ usar arroz bomba.","options":["tiene","hay que","debe de"],"a":1,"why":"Allgemeine Regel ohne Subjekt → hay que."},{"q":"Lo siento, esta noche no puedo; ___ trabajar.","options":["hay que","tengo que","debo de"],"a":1,"why":"Persönliche Verpflichtung → tener que."},{"q":"No ___ venir si no quieres, es voluntario.","options":["debes","tienes que","debes de"],"a":1,"why":"„nicht müssen“ → no tener que."},{"q":"Esa chaqueta ___ costar una fortuna.","options":["debe de","hay que","tiene"],"a":0,"why":"Schätzung/Vermutung → deber de."},{"q":"No ___ conducir después de beber.","options":["tienes que","debes","debes de"],"a":1,"why":"„nicht dürfen“ (moralisch) → no deber."}]},{"type":"gap","title":"Übersetzen mit Periphrase","task":"Ergänze die fehlende konjugierte Form, sodass der Satz die deutsche Bedeutung wiedergibt.","items":[{"q":"Ich habe gerade gefrühstückt. → ___ de desayunar.","a":["Acabo","acabo"],"de":"Acabo de desayunar."},{"q":"Sie hat nicht mehr angerufen. → ___ de llamar.","a":["Dejó","dejó","Ha dejado","ha dejado"],"de":"Dejó de llamar."},{"q":"Wir wohnen seit fünf Jahren hier. → ___ cinco años viviendo aquí.","a":["Llevamos","llevamos"],"de":"Llevamos cinco años viviendo aquí."},{"q":"Er ist immer noch krank. → ___ enfermo.","a":["Sigue","sigue","Continúa","continúa"],"de":"Sigue enfermo."},{"q":"Ich wäre fast eingeschlafen. → ___ a punto de dormirme.","a":["Estuve","estuve"],"de":"Estuve a punto de dormirme."},{"q":"Normalerweise gehst du zu Fuß. → ___ ir andando.","a":["Sueles","sueles"],"de":"Sueles ir andando."},{"q":"Ich wollte dir gerade schreiben. → ___ a escribirte.","a":["Iba","iba"],"de":"Iba a escribirte."},{"q":"Ihr habt den Schlüssel wieder vergessen. → ___ a olvidar la llave.","a":["Habéis vuelto","habéis vuelto","Volvisteis","volvisteis"],"de":"Habéis vuelto a olvidar la llave."}]}],"cards":[{"f":"ir a + Infinitiv","b":"nahe Zukunft, Absicht: Voy a cocinar."},{"f":"iba a + Infinitiv","b":"wollte gerade / hatte vor (oft nicht realisiert)"},{"f":"estar a punto de + Inf.","b":"kurz davor sein; estuve a punto de = beinahe"},{"f":"acabar de + Inf.","b":"gerade eben: Acabo de llegar. – Ich bin gerade angekommen."},{"f":"„gerade“ – zwei Bedeutungen","b":"eben erst: acabar de + Inf. / im Verlauf: estar + gerundio"},{"f":"volver a + Inf.","b":"wieder, noch einmal: Volvió a llamar."},{"f":"dejar de + Inf.","b":"aufhören, nicht mehr: Dejé de correr."},{"f":"no dejes de + Inf.","b":"tu das auf jeden Fall!"},{"f":"empezar a / ponerse a","b":"anfangen / sich daranmachen, plötzlich anfangen"},{"f":"echarse a reír / llorar","b":"in Lachen / Tränen ausbrechen"},{"f":"tener que + Inf.","b":"müssen (persönlich)"},{"f":"hay que + Inf.","b":"man muss (unpersönlich)"},{"f":"deber + Inf. / deber de + Inf.","b":"sollen, müssen (Pflicht) / wohl, vermutlich"},{"f":"no tener que vs. no deber","b":"nicht müssen vs. nicht dürfen/sollen"},{"f":"soler + Inf.","b":"normalerweise, pflegen zu; nur Präsens & imperfecto"},{"f":"llevar + Zeit + gerundio","b":"seit … etwas tun: Llevo un año viviendo aquí."},{"f":"llevar + Zeit + sin + Inf.","b":"seit … nicht mehr: Lleva un mes sin fumar."},{"f":"seguir + gerundio","b":"immer noch, weiterhin (nie + Infinitiv!)"},{"f":"seguir sin + Inf.","b":"immer noch nicht: Sigo sin entenderlo."},{"f":"ir + gerundio","b":"allmählich, nach und nach: Va aprendiendo."},{"f":"venir + gerundio","b":"schon seit einiger Zeit: Vienen avisando desde hace años."},{"f":"andar + gerundio","b":"herum-…, ständig: Anda contando mentiras."},{"f":"acabar + gerundio","b":"schließlich, am Ende = acabar por + Inf."},{"f":"quedar en + Inf.","b":"vereinbaren: Quedamos en llamarnos."},{"f":"llegar a + Inf.","b":"es so weit bringen, sogar: Llegó a ser ministro."},{"f":"Pronomen bei Periphrasen","b":"vor dem Hilfsverb oder angehängt: Lo voy a ver / Voy a verlo"},{"f":"IT continuare a + Inf. → ES?","b":"seguir/continuar + gerundio: Sigo trabajando."}],"id":"k21"},{"nr":20,"title":"Die indirekte Rede","teil":"Das Verb und seine Ergänzungen","intro":"In der indirekten Rede gibt man wieder, was jemand gesagt, gefragt oder verlangt hat. Anders als im Deutschen gibt es keinen eigenen Konjunktiv dafür; entscheidend sind die Zeit des Einleitungsverbs und die Anpassung von Pronomen, Orts- und Zeitangaben.","sections":[{"h":"Grundlagen und Einleitungsverben","html":"<p>Die indirekte Rede wird mit einem Verb des Sagens und <em>que<\/em> eingeleitet. <em>que<\/em> darf – anders als „dass“ im Deutschen – <b>nicht wegfallen<\/b>.<\/p><table><tr><th>Verb<\/th><th>Bedeutung<\/th><\/tr><tr><td><em>decir<\/em><\/td><td>sagen<\/td><\/tr><tr><td><em>contar<\/em><\/td><td>erzählen<\/td><\/tr><tr><td><em>explicar<\/em><\/td><td>erklären<\/td><\/tr><tr><td><em>preguntar<\/em><\/td><td>fragen<\/td><\/tr><tr><td><em>pedir<\/em><\/td><td>bitten<\/td><\/tr><tr><td><em>contestar / responder<\/em><\/td><td>antworten<\/td><\/tr><tr><td><em>comentar, añadir, asegurar<\/em><\/td><td>bemerken, hinzufügen, versichern<\/td><\/tr><\/table><ul><li><em>Carmen dice que está harta del calor.<\/em> – Carmen sagt, sie habe die Hitze satt.<\/li><li><em>Nos explicó que el vuelo se había retrasado.<\/em> – Er erklärte uns, der Flug habe sich verspätet.<\/li><\/ul><div class=\"warn\">Achtung: Der deutsche Konjunktiv I („sie habe“, „er sei“) hat keine Entsprechung. Im Spanischen steht der normale <b>Indikativ<\/b>: <em>Dice que es médico<\/em> – Er sagt, er sei Arzt.<\/div><div class=\"warn\">Achtung: Nicht <em>*Dice está cansada<\/em>, sondern <em>Dice que está cansada<\/em>.<\/div>"},{"h":"Einleitungsverb im Präsens: keine Zeitenverschiebung","html":"<p>Steht das Einleitungsverb im <b>Präsens<\/b>, <b>Perfekt<\/b> (mit Gegenwartsbezug) oder <b>Futur<\/b>, bleiben die Zeiten der direkten Rede erhalten. Nur Personen und Pronomen werden angepasst.<\/p><table><tr><th>direkte Rede<\/th><th>indirekte Rede<\/th><\/tr><tr><td><em>«Estoy en el tren.»<\/em><\/td><td><em>Dice que está en el tren.<\/em><\/td><\/tr><tr><td><em>«He perdido el móvil.»<\/em><\/td><td><em>Dice que ha perdido el móvil.<\/em><\/td><\/tr><tr><td><em>«Llegué tarde.»<\/em><\/td><td><em>Dice que llegó tarde.<\/em><\/td><\/tr><tr><td><em>«Os llamaré.»<\/em><\/td><td><em>Dice que nos llamará.<\/em><\/td><\/tr><\/table><p>Eine <b>Aufforderung<\/b> (Imperativ) wird zu <em>que<\/em> + <b>presente de subjuntivo<\/b>:<\/p><ul><li><em>«¡Cierra la ventana!»<\/em> → <em>Dice que cierres la ventana.<\/em> – Sie sagt, du sollst das Fenster schließen.<\/li><li><em>«No toquéis nada.»<\/em> → <em>Nos pide que no toquemos nada.<\/em><\/li><\/ul><div class=\"tip\">Merke: <em>decir que<\/em> + Indikativ = mitteilen; <em>decir que<\/em> + subjuntivo = auffordern. <em>Dice que viene<\/em> (er sagt, er kommt) ≠ <em>Dice que vengas<\/em> (er sagt, du sollst kommen).<\/div>"},{"h":"Indirekte Fragen","html":"<p><b>Ja/Nein-Fragen<\/b> werden mit <em>si<\/em> (ob, ohne Akzent) angeschlossen:<\/p><ul><li><em>«¿Tienes hambre?»<\/em> → <em>Me pregunta si tengo hambre.<\/em> – Er fragt mich, ob ich Hunger habe.<\/li><\/ul><p><b>Fragen mit Fragewort<\/b> behalten das Fragewort – <b>mit Akzent<\/b>:<\/p><ul><li><em>«¿Dónde vives?»<\/em> → <em>Quiere saber dónde vivo.<\/em><\/li><li><em>«¿Cuándo empieza la clase?»<\/em> → <em>Pregunta cuándo empieza la clase.<\/em><\/li><li><em>«¿Qué has comprado?»<\/em> → <em>Me pregunta qué he comprado.<\/em><\/li><li><em>«¿Cuánto cuesta?»<\/em> → <em>No sé cuánto cuesta.<\/em><\/li><\/ul><div class=\"warn\">Achtung: <em>si<\/em> = ob (kein Akzent), <em>sí<\/em> = ja. Und das Fragewort behält seinen Akzent: <em>No sé qué hacer<\/em>, nicht <em>*No sé que hacer<\/em>.<\/div><div class=\"tip\">Umgangssprachlich hört man oft ein zusätzliches <em>que<\/em>: <em>Me preguntó que si quería venir.<\/em> In der Schriftsprache lässt man es weg.<\/div><p>Indirekte Fragen stehen <b>ohne Fragezeichen<\/b>, wenn der Gesamtsatz eine Aussage ist: <em>Me preguntó dónde estaba el baño.<\/em><\/p>"},{"h":"Einleitungsverb in der Vergangenheit: Zeitenverschiebung","html":"<p>Steht das Einleitungsverb in einer <b>Vergangenheitszeit<\/b> (<em>dijo, decía, había dicho<\/em>), werden die Zeiten „eine Stufe zurück“ verschoben:<\/p><table><tr><th>direkte Rede<\/th><th>indirekte Rede<\/th><\/tr><tr><td>presente <em>«Tengo frío.»<\/em><\/td><td>imperfecto: <em>Dijo que tenía frío.<\/em><\/td><\/tr><tr><td>perfecto <em>«He terminado.»<\/em><\/td><td>pluscuamperfecto: <em>Dijo que había terminado.<\/em><\/td><\/tr><tr><td>indefinido <em>«Vi a Rosa.»<\/em><\/td><td>pluscuamperfecto: <em>Dijo que había visto a Rosa.<\/em><\/td><\/tr><tr><td>futuro <em>«Volveré pronto.»<\/em><\/td><td>condicional: <em>Dijo que volvería pronto.<\/em><\/td><\/tr><tr><td><em>ir a<\/em> + Inf. <em>«Voy a dimitir.»<\/em><\/td><td><em>iba a<\/em> + Inf.: <em>Dijo que iba a dimitir.<\/em><\/td><\/tr><tr><td>Imperativ <em>«¡Espérame!»<\/em><\/td><td>imperf. de subjuntivo: <em>Me dijo que lo esperara.<\/em><\/td><\/tr><tr><td>pres. de subj. <em>«Quiero que me ayudes.»<\/em><\/td><td>imperf. de subj.: <em>Dijo que quería que lo ayudara.<\/em><\/td><\/tr><\/table><p><b>Unverändert<\/b> bleiben: imperfecto, pluscuamperfecto, condicional, imperfecto de subjuntivo.<\/p><ul><li><em>«Antes vivía en Lugo.»<\/em> → <em>Dijo que antes vivía en Lugo.<\/em><\/li><li><em>«Me gustaría ayudarte.»<\/em> → <em>Dijo que le gustaría ayudarme.<\/em><\/li><\/ul><div class=\"tip\">Merke: Im gesprochenen Spanisch bleibt das indefinido oft stehen: <em>Dijo que vio a Rosa<\/em> ist ebenfalls üblich. Das pluscuamperfecto ist die sichere Wahl.<\/div>"},{"h":"Wann man nicht verschieben muss","html":"<p>Gilt der Inhalt <b>noch heute<\/b>, darf man auch nach einem Einleitungsverb in der Vergangenheit die ursprüngliche Zeit beibehalten. Damit betont man, dass die Aussage weiter gültig ist:<\/p><ul><li><em>Me dijo que está embarazada.<\/em> – Sie hat mir gesagt, dass sie schwanger ist (sie ist es noch).<\/li><li><em>El profesor explicó que la Tierra gira alrededor del Sol.<\/em> – allgemeine Wahrheit, keine Verschiebung nötig.<\/li><li><em>Ayer me dijeron que la reunión será el jueves.<\/em> – Der Donnerstag liegt noch in der Zukunft.<\/li><\/ul><div class=\"tip\">Merke: Verschiebung = neutrales Wiedergeben; keine Verschiebung = „und das gilt immer noch“. Bei Unsicherheit ist die Verschiebung nie falsch.<\/div>"},{"h":"Aufforderungen und Bitten wiedergeben","html":"<p>Befehle, Bitten und Ratschläge werden mit <em>decir, pedir, aconsejar, recomendar, ordenar<\/em> + <em>que<\/em> + <b>subjuntivo<\/b> wiedergegeben:<\/p><table><tr><th>Einleitung<\/th><th>Form<\/th><th>Beispiel<\/th><\/tr><tr><td>Präsens<\/td><td>presente de subj.<\/td><td><em>Me pide que la acompañe.<\/em><\/td><\/tr><tr><td>Vergangenheit<\/td><td>imperfecto de subj.<\/td><td><em>Me pidió que la acompañara.<\/em><\/td><\/tr><\/table><ul><li><em>«Por favor, traed algo de beber.»<\/em> → <em>Nos pidió que lleváramos algo de beber.<\/em><\/li><li><em>«No conduzcas tan rápido.»<\/em> → <em>Le dije que no condujera tan rápido.<\/em><\/li><li><em>«Haz más deporte.»<\/em> → <em>El médico me aconsejó que hiciera más deporte.<\/em><\/li><\/ul><div class=\"warn\">Achtung: Deutsch „Er sagte mir, ich solle warten“ – nicht wörtlich mit <em>deber<\/em> übersetzen; natürlich ist: <em>Me dijo que esperara.<\/em><\/div><div class=\"tip\">Das imperfecto de subjuntivo hat zwei Formen: <em>esperara<\/em> = <em>esperase<\/em>. Beide sind korrekt.<\/div>"},{"h":"Pronomen, Possessiva und Verben der Richtung","html":"<p>Personen und alles, was von ihnen abhängt, werden aus der Sicht des Berichtenden angepasst:<\/p><ul><li><em>Ana: «Mi hermano me ha llamado.»<\/em> → <em>Ana dice que su hermano la ha llamado.<\/em><\/li><li><em>Pedro (zu mir): «Te devolveré tu libro.»<\/em> → <em>Pedro me dijo que me devolvería mi libro.<\/em><\/li><\/ul><p>Ändert sich der Standpunkt, wechseln auch die Richtungsverben:<\/p><table><tr><th>direkt<\/th><th>indirekt (anderer Ort)<\/th><\/tr><tr><td><em>venir<\/em> – kommen<\/td><td><em>ir<\/em> – gehen, fahren<\/td><\/tr><tr><td><em>traer<\/em> – mitbringen<\/td><td><em>llevar<\/em> – mitnehmen, hinbringen<\/td><\/tr><\/table><ul><li><em>Lola (in Madrid): «Ven a Madrid y trae la guitarra.»<\/em> → <em>Lola me dijo que fuera a Madrid y que llevara la guitarra.<\/em><\/li><\/ul><div class=\"tip\">Merke: <em>venir/traer<\/em> = zum Sprecher hin. Ist der Berichtende nicht mehr am Ort des Sprechers, wird daraus <em>ir/llevar<\/em>.<\/div>"},{"h":"Orts- und Zeitangaben","html":"<p>Ändern sich Zeitpunkt oder Ort, passt man die Angaben an:<\/p><table><tr><th>direkte Rede<\/th><th>indirekte Rede<\/th><\/tr><tr><td><em>hoy<\/em><\/td><td><em>aquel día / ese día<\/em><\/td><\/tr><tr><td><em>ayer<\/em><\/td><td><em>el día anterior<\/em><\/td><\/tr><tr><td><em>mañana<\/em><\/td><td><em>al día siguiente<\/em><\/td><\/tr><tr><td><em>ahora<\/em><\/td><td><em>entonces, en ese momento<\/em><\/td><\/tr><tr><td><em>la semana que viene<\/em><\/td><td><em>la semana siguiente<\/em><\/td><\/tr><tr><td><em>hace un año<\/em><\/td><td><em>un año antes<\/em><\/td><\/tr><tr><td><em>aquí<\/em><\/td><td><em>allí<\/em><\/td><\/tr><tr><td><em>este / esta<\/em><\/td><td><em>aquel / aquella, ese / esa<\/em><\/td><\/tr><\/table><ul><li><em>«Mañana salgo de aquí.»<\/em> → <em>Dijo que al día siguiente salía de allí.<\/em><\/li><li><em>«Esta casa la compré ayer.»<\/em> → <em>Contó que aquella casa la había comprado el día anterior.<\/em><\/li><\/ul><div class=\"warn\">Achtung: Die Anpassung ist nur nötig, wenn sich die Situation wirklich geändert hat. Erzählt man am selben Tag: <em>Esta mañana me ha dicho que hoy no viene<\/em> – <em>hoy<\/em> bleibt.<\/div>"}],"exercises":[{"type":"gap","title":"Einleitung im Präsens","task":"Gib die Aussage in indirekter Rede wieder. Setze das Verb ein (keine Zeitenverschiebung).","items":[{"q":"Marta: «Estoy muy cansada.» → Marta dice que ___ muy cansada.","a":["está"],"de":"Marta sagt, sie sei sehr müde."},{"q":"Luis: «He aprobado el examen.» → Luis dice que ___ aprobado el examen.","a":["ha"],"de":"Luis sagt, er habe die Prüfung bestanden."},{"q":"Mis padres: «Volveremos el domingo.» → Mis padres dicen que ___ el domingo.","a":["volverán"],"de":"Meine Eltern sagen, sie kämen am Sonntag zurück."},{"q":"Tu jefa: «¡Llámame!» → Tu jefa dice que la ___.","a":["llames"],"de":"Deine Chefin sagt, du sollst sie anrufen."},{"q":"El guía (zu uns): «No hagáis fotos.» → El guía dice que no ___ fotos.","a":["hagamos"],"de":"Der Führer sagt, wir sollen keine Fotos machen."},{"q":"Elena: «¿Tienes tiempo?» → Elena pregunta ___ tienes tiempo.","a":["si"],"de":"Elena fragt, ob du Zeit hast."},{"q":"Javi: «¿Dónde está la estación?» → Javi pregunta ___ está la estación.","a":["dónde"],"de":"Javi fragt, wo der Bahnhof ist."},{"q":"Los niños: «Fuimos al zoo.» → Los niños cuentan que ___ al zoo.","a":["fueron"],"de":"Die Kinder erzählen, sie seien in den Zoo gegangen."}]},{"type":"gap","title":"Zeitenverschiebung","task":"Das Einleitungsverb steht in der Vergangenheit. Setze das Verb in der richtigen Zeit ein.","items":[{"q":"«Vivo en Zaragoza.» → Dijo que ___ en Zaragoza.","a":["vivía"],"de":"Er sagte, er wohne in Saragossa."},{"q":"«He comprado pan.» → Dijo que ___ comprado pan.","a":["había"],"de":"Sie sagte, sie habe Brot gekauft."},{"q":"«Te llamaré mañana.» → Me dijo que me ___ al día siguiente.","a":["llamaría"],"de":"Er sagte mir, er werde mich am nächsten Tag anrufen."},{"q":"«Perdimos el tren.» → Contaron que ___ perdido el tren.","a":["habían"],"de":"Sie erzählten, sie hätten den Zug verpasst."},{"q":"«Voy a cambiar de piso.» → Dijo que ___ a cambiar de piso.","a":["iba"],"de":"Er sagte, er werde umziehen."},{"q":"«De niño era muy tímido.» → Dijo que de niño ___ muy tímido.","a":["era"],"de":"Er sagte, er sei als Kind sehr schüchtern gewesen."},{"q":"«Me encantaría ir.» → Dijo que le ___ ir.","a":["encantaría"],"de":"Sie sagte, sie würde sehr gern hingehen."},{"q":"«Podéis quedaros aquí.» → Nos dijo que ___ quedarnos allí.","a":["podíamos"],"de":"Er sagte uns, wir könnten dort bleiben."},{"q":"«¿Has visto mis llaves?» → Me preguntó si ___ visto sus llaves.","a":["había"],"de":"Er fragte mich, ob ich seine Schlüssel gesehen hätte."}]},{"type":"gap","title":"Aufforderungen wiedergeben","task":"Setze das Verb im imperfecto de subjuntivo ein (Form auf -ra).","items":[{"q":"«¡Ven pronto!» → Me dijo que (venir) ___ pronto.","a":["viniera","viniese"],"de":"Er sagte mir, ich solle bald kommen."},{"q":"«Apaga el móvil.» → El profesor le pidió que (apagar) ___ el móvil.","a":["apagara","apagase"],"de":"Der Lehrer bat ihn, das Handy auszuschalten."},{"q":"«No digas nada.» → Me pidió que no (decir) ___ nada.","a":["dijera","dijese"],"de":"Sie bat mich, nichts zu sagen."},{"q":"«Haced los deberes.» → Mamá nos dijo que (hacer) ___ los deberes.","a":["hiciéramos","hiciésemos"],"de":"Mama sagte, wir sollten die Hausaufgaben machen."},{"q":"«Tened cuidado.» → Nos dijeron que (tener) ___ cuidado.","a":["tuviéramos","tuviésemos"],"de":"Sie sagten uns, wir sollten vorsichtig sein."},{"q":"«Duerme más.» → El médico le aconsejó que (dormir) ___ más.","a":["durmiera","durmiese"],"de":"Der Arzt riet ihm, mehr zu schlafen."},{"q":"«Pon la mesa.» → Mi padre me dijo que (poner) ___ la mesa.","a":["pusiera","pusiese"],"de":"Mein Vater sagte mir, ich solle den Tisch decken."},{"q":"«Sé puntual.» → Le pidieron que (ser) ___ puntual.","a":["fuera","fuese"],"de":"Man bat ihn, pünktlich zu sein."}]},{"type":"choice","title":"Fragen, Pronomen, Ort und Zeit","task":"Wähle die passende Form für die indirekte Rede.","items":[{"q":"«¿Quieres venir?» → Me preguntó ___ quería ir.","options":["si","sí","que"],"a":0,"why":"Ja/Nein-Frage → si (ohne Akzent)."},{"q":"«¿Qué hora es?» → Le pregunté ___ hora era.","options":["que","qué","si"],"a":1,"why":"Das Fragewort behält den Akzent."},{"q":"«Mañana es mi cumpleaños.» (letzte Woche gesagt) → Dijo que ___ era su cumpleaños.","options":["mañana","al día siguiente","el día anterior"],"a":1,"why":"mañana → al día siguiente."},{"q":"«Ayer estuve enfermo.» (vor einem Monat gesagt) → Dijo que ___ había estado enfermo.","options":["ayer","al día siguiente","el día anterior"],"a":2,"why":"ayer → el día anterior."},{"q":"«Aquí se come muy bien.» → Comentó que ___ se comía muy bien.","options":["aquí","allí","acá"],"a":1,"why":"Ortswechsel: aquí → allí."},{"q":"«Trae tu cámara.» (der Berichtende ist woanders) → Me dijo que ___ mi cámara.","options":["trajera","llevara","traía"],"a":1,"why":"Perspektivwechsel: traer → llevar; Aufforderung → subjuntivo."},{"q":"«Ven a mi casa.» (der Berichtende ist woanders) → Me dijo que ___ a su casa.","options":["viniera","fuera","iba"],"a":1,"why":"Aus Sicht des Berichtenden: venir → ir; Aufforderung → imperfecto de subjuntivo."},{"q":"«Este pueblo es precioso.» → Dijo que ___ pueblo era precioso.","options":["este","aquel","esto"],"a":1,"why":"este → aquel (zeitlich/räumlich entfernt)."}]},{"type":"choice","title":"Gemischte Fälle","task":"Wähle die korrekte Wiedergabe.","items":[{"q":"Ana: «Estoy embarazada.» (Sie ist es immer noch.)","options":["Ana me dijo que está embarazada.","Ana me dijo que estuvo embarazada.","Ana me dijo que estaría embarazada."],"a":0,"why":"Inhalt gilt noch → keine Verschiebung möglich (estaba wäre auch korrekt)."},{"q":"Er sagt: „Kommt morgen!“","options":["Dice que venís mañana.","Dice que vengáis mañana.","Dice que vinierais mañana."],"a":1,"why":"Aufforderung + Einleitung im Präsens → presente de subjuntivo."},{"q":"Sie sagte, sie sei Ärztin.","options":["Dijo que sea médica.","Dijo que era médica.","Dijo que fuera médica."],"a":1,"why":"Mitteilung → Indikativ; presente → imperfecto."},{"q":"Sie sagte, ich solle Ärztin werden.","options":["Dijo que era médica.","Dijo que debía de ser médica.","Me dijo que fuera médica."],"a":2,"why":"Aufforderung → imperfecto de subjuntivo, nicht deber de."},{"q":"«¿Cuándo terminarás?» → Me preguntó cuándo ___.","options":["terminaré","terminaría","terminara"],"a":1,"why":"futuro → condicional; indirekte Frage → Indikativ."},{"q":"«No sé dónde he dejado las gafas.» → Dijo que no sabía dónde ___ las gafas.","options":["ha dejado","había dejado","dejara"],"a":1,"why":"perfecto → pluscuamperfecto."},{"q":"«Quiero que me ayudes.» → Me dijo que quería que lo ___.","options":["ayudes","ayudara","ayudaba"],"a":1,"why":"presente de subjuntivo → imperfecto de subjuntivo."},{"q":"„Er fragt, ob wir Hunger haben.“","options":["Pregunta si tenemos hambre.","Pregunta sí tenemos hambre.","Pregunta que tenemos hambre."],"a":0,"why":"„ob“ = si ohne Akzent; Präsens bleibt."}]}],"cards":[{"f":"Konjunktiv I in der indirekten Rede?","b":"gibt es nicht – Indikativ: Dice que es médico."},{"f":"que in der indirekten Rede","b":"Pflicht: Dice que viene. (nie weglassen)"},{"f":"„ob“ in indirekten Fragen","b":"si (ohne Akzent): Pregunta si vienes."},{"f":"Fragewort in indirekten Fragen","b":"mit Akzent: No sé dónde vive."},{"f":"Einleitung im Präsens","b":"keine Zeitenverschiebung: Dice que está cansado."},{"f":"Imperativ → Einleitung im Präsens","b":"presente de subjuntivo: Dice que vengas."},{"f":"Imperativ → Einleitung in Vergangenheit","b":"imperfecto de subjuntivo: Me dijo que fuera."},{"f":"decir que + Ind. / + Subj.","b":"mitteilen / auffordern"},{"f":"presente → (dijo que)","b":"imperfecto: tengo → tenía"},{"f":"perfecto / indefinido → (dijo que)","b":"pluscuamperfecto: había terminado"},{"f":"futuro → (dijo que)","b":"condicional: volverá → volvería"},{"f":"ir a + Inf. → (dijo que)","b":"iba a + Inf."},{"f":"Unverändert bei Verschiebung","b":"imperfecto, pluscuamperfecto, condicional, imperf. de subj."},{"f":"Verschiebung optional","b":"wenn die Aussage noch gilt: Me dijo que está embarazada."},{"f":"Er sagte, ich solle warten.","b":"Me dijo que esperara/esperase."},{"f":"hoy →","b":"aquel día / ese día"},{"f":"ayer →","b":"el día anterior"},{"f":"mañana →","b":"al día siguiente"},{"f":"ahora →","b":"entonces / en ese momento"},{"f":"la semana que viene →","b":"la semana siguiente"},{"f":"aquí → / este →","b":"allí / aquel"},{"f":"venir → / traer →","b":"ir / llevar (Perspektivwechsel)"},{"f":"Pronomen anpassen: Ana: «Mi hermano me llamó.»","b":"Ana dijo que su hermano la había llamado."},{"f":"Me preguntó que si…","b":"umgangssprachlich; schriftlich: Me preguntó si…"}],"id":"k24"},{"nr":21,"title":"Reflexive Verben, se und das Passiv","teil":"Das Verb und seine Ergänzungen","intro":"Das kleine Wort se hat im Spanischen viele Aufgaben: Es bildet reflexive und reziproke Verben, verändert Bedeutungen, macht Sätze unpersönlich oder passiv und beschreibt Missgeschicke. Dazu kommen das „echte“ Passiv mit ser und das Zustandspassiv mit estar.","sections":[{"h":"Reflexive Verben: Formen und Stellung","html":"<p>Reflexive Verben haben ein Reflexivpronomen, das sich auf das Subjekt bezieht. Im Infinitiv hängt <em>se<\/em> am Verb: <em>levantarse<\/em>.<\/p><table><tr><th>Person<\/th><th>levantarse<\/th><th>Deutsch<\/th><\/tr><tr><td><em>yo<\/em><\/td><td><em>me levanto<\/em><\/td><td>ich stehe auf<\/td><\/tr><tr><td><em>tú<\/em><\/td><td><em>te levantas<\/em><\/td><td>du stehst auf<\/td><\/tr><tr><td><em>él/ella/usted<\/em><\/td><td><em>se levanta<\/em><\/td><td>er/sie steht auf<\/td><\/tr><tr><td><em>nosotros<\/em><\/td><td><em>nos levantamos<\/em><\/td><td>wir stehen auf<\/td><\/tr><tr><td><em>vosotros<\/em><\/td><td><em>os levantáis<\/em><\/td><td>ihr steht auf<\/td><\/tr><tr><td><em>ellos/ustedes<\/em><\/td><td><em>se levantan<\/em><\/td><td>sie stehen auf<\/td><\/tr><\/table><p><b>Stellung:<\/b> vor dem konjugierten Verb; angehängt an Infinitiv, gerundio und bejahten Imperativ:<\/p><ul><li><em>Me ducho por la noche.<\/em> – Ich dusche abends.<\/li><li><em>Me voy a duchar<\/em> = <em>Voy a ducharme.<\/em><\/li><li><em>¡Dúchate ya!<\/em> – Dusch dich jetzt! – <em>¡No te duches con agua fría!<\/em><\/li><li><em>¿Cómo te llamas? – Me llamo Iker.<\/em><\/li><\/ul><div class=\"warn\">Achtung: Beim Imperativ fallen Buchstaben weg: <em>sentemos + nos → sentémonos<\/em> (ohne -s), <em>sentad + os → sentaos<\/em> (ohne -d). Ausnahme: <em>idos<\/em> (von <em>irse<\/em>); das verbreitete <em>iros<\/em> wird inzwischen ebenfalls akzeptiert.<\/div><p><small>Lateinamerika: <em>ustedes se levantan<\/em> statt <em>vosotros os levantáis<\/em>.<\/small><\/p>"},{"h":"Gebrauch: reflexiv, Körperteile, reziprok","html":"<p>Viele Verben, die im Deutschen nicht reflexiv sind, sind es im Spanischen – und umgekehrt:<\/p><ul><li><em>despertarse<\/em> (aufwachen), <em>acostarse<\/em> (ins Bett gehen), <em>casarse<\/em> (heiraten), <em>quejarse<\/em> (sich beschweren), <em>darse cuenta de<\/em> (merken), <em>enfadarse<\/em> (sich ärgern)<\/li><li>aber: <em>descansar<\/em> (sich ausruhen), <em>mejorar<\/em> (sich bessern), <em>cambiar<\/em> (sich ändern) sind meist nicht reflexiv.<\/li><\/ul><p><b>Körperteile und Kleidung<\/b> bekommen den bestimmten Artikel, nicht das Possessivum:<\/p><ul><li><em>Me lavo los dientes.<\/em> – Ich putze mir die Zähne.<\/li><li><em>Ponte el abrigo.<\/em> – Zieh deinen Mantel an.<\/li><li><em>Se rompió el brazo esquiando.<\/em> – Er hat sich beim Skifahren den Arm gebrochen.<\/li><\/ul><p><b>Reziprok<\/b> („einander, sich gegenseitig“) im Plural:<\/p><ul><li><em>Mis abuelos se quieren mucho.<\/em> – Meine Großeltern lieben sich sehr.<\/li><li><em>Nos escribimos cada semana.<\/em> – Wir schreiben uns jede Woche.<\/li><li>Zur Verdeutlichung: <em>Se miraron el uno al otro.<\/em> – Sie sahen einander an.<\/li><\/ul><div class=\"warn\">Achtung: Nicht <em>*Lavo mis manos<\/em>, sondern <em>Me lavo las manos<\/em>. Das Pronomen zeigt bereits, wessen Hände gemeint sind.<\/div>"},{"h":"Bedeutungsänderung durch se","html":"<table><tr><th>ohne se<\/th><th>mit se<\/th><\/tr><tr><td><em>ir<\/em> – gehen, fahren<\/td><td><em>irse<\/em> – weggehen, aufbrechen<\/td><\/tr><tr><td><em>dormir<\/em> – schlafen<\/td><td><em>dormirse<\/em> – einschlafen; verschlafen<\/td><\/tr><tr><td><em>quedar<\/em> – sich verabreden; übrig sein; liegen<\/td><td><em>quedarse<\/em> – bleiben<\/td><\/tr><tr><td><em>llevar<\/em> – tragen, bringen<\/td><td><em>llevarse<\/em> – mitnehmen; sich verstehen<\/td><\/tr><tr><td><em>parecer<\/em> – scheinen<\/td><td><em>parecerse a<\/em> – ähneln<\/td><\/tr><tr><td><em>acordar<\/em> – vereinbaren<\/td><td><em>acordarse de<\/em> – sich erinnern<\/td><\/tr><tr><td><em>despedir<\/em> – entlassen<\/td><td><em>despedirse<\/em> – sich verabschieden<\/td><\/tr><tr><td><em>poner<\/em> – stellen, legen<\/td><td><em>ponerse<\/em> – anziehen; werden<\/td><\/tr><\/table><ul><li><em>Ya es tarde, me voy.<\/em> – Es ist spät, ich gehe.<\/li><li><em>Anoche me dormí en el sofá.<\/em> – Gestern Abend bin ich auf dem Sofa eingeschlafen.<\/li><li><em>Hemos quedado a las ocho. – Me quedo en casa.<\/em> – Wir sind um acht verabredet. – Ich bleibe zu Hause.<\/li><li><em>Me llevo bien con mi suegra.<\/em> – Ich verstehe mich gut mit meiner Schwiegermutter.<\/li><li><em>Lucía se parece mucho a su padre.<\/em> – Lucía sieht ihrem Vater sehr ähnlich.<\/li><\/ul><div class=\"tip\">Merke: Bei Verben wie <em>comer, beber, leer<\/em> betont <em>se<\/em> die Vollständigkeit: <em>Se comió toda la tarta.<\/em> – Er hat die ganze Torte aufgegessen.<\/div>"},{"h":"„werden“: ponerse, volverse, hacerse & Co.","html":"<p>Für das deutsche „werden“ (Veränderung) gibt es kein einzelnes Verb. Man wählt nach Art der Veränderung:<\/p><table><tr><th>Verb<\/th><th>Art der Veränderung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>ponerse<\/em> + Adj.<\/td><td>vorübergehend: Stimmung, Aussehen<\/td><td><em>se puso rojo / nervioso<\/em><\/td><\/tr><tr><td><em>volverse<\/em> + Adj.<\/td><td>tiefgreifend, oft unerwartet<\/td><td><em>se volvió muy egoísta<\/em><\/td><\/tr><tr><td><em>hacerse<\/em> + Adj./Subst.<\/td><td>durch Entwicklung, eigenes Zutun<\/td><td><em>se hizo rico / budista<\/em><\/td><\/tr><tr><td><em>quedarse<\/em> + Adj.<\/td><td>Endzustand, oft nach einem Ereignis<\/td><td><em>se quedó sordo / sin trabajo<\/em><\/td><\/tr><tr><td><em>convertirse en<\/em> + Subst.<\/td><td>Verwandlung<\/td><td><em>se convirtió en un éxito<\/em><\/td><\/tr><tr><td><em>llegar a ser<\/em> + Subst.<\/td><td>Ziel nach langem Weg<\/td><td><em>llegó a ser directora<\/em><\/td><\/tr><\/table><ul><li><em>Me pongo triste cuando llueve.<\/em> – Ich werde traurig, wenn es regnet.<\/li><li><em>Con los años se ha vuelto muy desconfiado.<\/em> – Mit den Jahren ist er sehr misstrauisch geworden.<\/li><li><em>Se hace tarde.<\/em> – Es wird spät.<\/li><li><em>Mi prima se quedó embarazada.<\/em> – Meine Cousine wurde schwanger.<\/li><\/ul><div class=\"warn\">Achtung: Für Berufswünsche und Zukunft nimmt man meist einfach <em>ser<\/em>: „Sie will Ärztin werden“ = <em>Quiere ser médica.<\/em> „Er wird Lehrer“ = <em>Va a ser profesor.<\/em> Nie <em>*ponerse médica<\/em>.<\/div><div class=\"tip\">Eselsbrücke: <em>ponerse<\/em> = Gesicht und Gefühle; <em>volverse<\/em> = Charakter; <em>hacerse<\/em> = Weg/Entscheidung; <em>quedarse<\/em> = was übrig bleibt.<\/div>"},{"h":"Unpersönliches se","html":"<p>Mit <em>se<\/em> + Verb in der <b>3. Person Singular<\/b> macht man eine allgemeine Aussage ohne bestimmtes Subjekt (deutsch: „man“):<\/p><ul><li><em>Aquí se vive bien.<\/em> – Hier lebt es sich gut. / Hier lebt man gut.<\/li><li><em>En este bar se come de maravilla.<\/em> – In dieser Bar isst man fantastisch.<\/li><li><em>¿Cómo se va a la playa?<\/em> – Wie kommt man zum Strand?<\/li><\/ul><p>Ist das Objekt eine <b>bestimmte Person<\/b> (mit <em>a<\/em>), bleibt das Verb im <b>Singular<\/b>:<\/p><ul><li><em>Se busca a los culpables.<\/em> – Man sucht die Schuldigen.<\/li><li><em>Se entrevistó a todos los candidatos.<\/em> – Alle Kandidaten wurden befragt.<\/li><\/ul><div class=\"warn\">Achtung: Bei reflexiven Verben geht <em>se<\/em> nicht zweimal (<em>*se se levanta<\/em>). Dann nimmt man <em>uno/una<\/em> oder die 2. Person: <em>Uno se acostumbra a todo.<\/em> – Man gewöhnt sich an alles.<\/div>"},{"h":"Passives se","html":"<p>Ist das Objekt eine <b>Sache<\/b> (ohne <em>a<\/em>), wird sie grammatisch zum Subjekt, und das Verb richtet sich nach ihr (Singular oder Plural):<\/p><ul><li><em>Se habla español.<\/em> – Hier wird Spanisch gesprochen.<\/li><li><em>Se venden pisos.<\/em> – Wohnungen zu verkaufen.<\/li><li><em>Se necesitan camareros.<\/em> – Kellner gesucht.<\/li><li><em>En verano se alquilan muchas casas.<\/em> – Im Sommer werden viele Häuser vermietet.<\/li><\/ul><table><tr><th>Objekt<\/th><th>Verb<\/th><th>Beispiel<\/th><\/tr><tr><td>Sache Sg.<\/td><td>Singular<\/td><td><em>Se arregla el ordenador.<\/em><\/td><\/tr><tr><td>Sache Pl.<\/td><td>Plural<\/td><td><em>Se arreglan ordenadores.<\/em><\/td><\/tr><tr><td>Person mit <em>a<\/em><\/td><td>immer Singular<\/td><td><em>Se ayuda a los vecinos.<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: <em>*Se vende pisos<\/em> ist ein häufiger Fehler (auch auf Schildern in Spanien zu sehen). Korrekt: <em>Se venden pisos<\/em>.<\/div><div class=\"tip\">Merke: Das passive <em>se<\/em> ist im Spanischen die häufigste Passivform – viel häufiger als <em>ser<\/em> + Partizip. Ein Urheber (<em>por …<\/em>) wird dabei nicht genannt.<\/div>"},{"h":"se für Unvorhergesehenes","html":"<p>Bei Missgeschicken stellt das Spanische die Sache als Subjekt dar und die betroffene Person als indirektes Objekt. So klingt es, als sei es „einfach passiert“:<\/p><p><b>se + me/te/le/nos/os/les + Verb (nach der Sache) + Sache<\/b><\/p><ul><li><em>Se me olvidó tu cumpleaños.<\/em> – Ich habe deinen Geburtstag vergessen.<\/li><li><em>Se me cayó el vaso.<\/em> – Mir ist das Glas heruntergefallen.<\/li><li><em>Se nos rompieron dos platos.<\/em> – Uns sind zwei Teller kaputtgegangen.<\/li><li><em>A Pedro se le perdieron las llaves.<\/em> – Pedro hat seine Schlüssel verloren.<\/li><li><em>¿Se te ha ocurrido algo?<\/em> – Ist dir etwas eingefallen?<\/li><\/ul><p>Typische Verben: <em>olvidar, caer, romper, perder, ocurrir, acabar<\/em> (<em>se nos acabó la leche<\/em> – die Milch ist uns ausgegangen), <em>quemar, escapar, estropear<\/em>.<\/p><div class=\"warn\">Achtung: Das Verb richtet sich nach der Sache, nicht nach der Person: <em>Se me cayeron las gafas<\/em> (Plural wegen <em>las gafas<\/em>), nicht <em>*Se me caí<\/em>.<\/div>"},{"h":"Passiv mit ser – Zustandspassiv mit estar","html":"<p><b>ser + Partizip<\/b> (Vorgangspassiv, deutsch „werden“) gleicht das Partizip an das Subjekt an. Der Urheber wird mit <em>por<\/em> eingeleitet. Es ist typisch für Nachrichten, Geschichte und Schriftsprache:<\/p><ul><li><em>El puente fue inaugurado en 1998.<\/em> – Die Brücke wurde 1998 eingeweiht.<\/li><li><em>Las ruinas fueron descubiertas por unos pastores.<\/em> – Die Ruinen wurden von Hirten entdeckt.<\/li><li><em>La ladrona ha sido detenida.<\/em> – Die Diebin ist festgenommen worden.<\/li><\/ul><p><b>estar + Partizip<\/b> (Zustandspassiv, deutsch „sein“) beschreibt das Ergebnis:<\/p><table><tr><th>Vorgang (ser)<\/th><th>Zustand (estar)<\/th><\/tr><tr><td><em>Las puertas son cerradas cada noche por el vigilante.<\/em><br><small>werden geschlossen<\/small><\/td><td><em>Las puertas están cerradas.<\/em><br><small>sind geschlossen<\/small><\/td><\/tr><tr><td><em>La casa fue construida en 1920.<\/em><br><small>wurde gebaut<\/small><\/td><td><em>La casa está bien construida.<\/em><br><small>ist gut gebaut<\/small><\/td><\/tr><\/table><div class=\"warn\">Achtung: Nur das direkte Objekt kann Subjekt eines ser-Passivs werden. „Mir wurde ein Buch geschenkt“ ≠ <em>*Fui regalado un libro<\/em> → <em>Me regalaron un libro<\/em>.<\/div><div class=\"tip\">Merke: Im Alltag wirkt <em>ser<\/em> + Partizip in der Gegenwart oft steif. Stattdessen nimmt man <em>se<\/em> oder die 3. Person Plural.<\/div>"},{"h":"Andere Wege, „man“ und Passiv auszudrücken","html":"<p><b>3. Person Plural<\/b> ohne Subjekt – wenn der Handelnde unbekannt oder unwichtig ist:<\/p><ul><li><em>Dicen que va a hacer frío.<\/em> – Man sagt, es wird kalt.<\/li><li><em>Me han robado la bici.<\/em> – Mir ist das Fahrrad gestohlen worden.<\/li><li><em>Te llaman por teléfono.<\/em> – Du wirst am Telefon verlangt.<\/li><\/ul><p><b>Vorangestelltes Objekt + Pronomen<\/b> – betont das Objekt wie ein deutsches Passiv:<\/p><ul><li><em>Esta iglesia la construyeron los templarios.<\/em> – Diese Kirche wurde von den Templern erbaut.<\/li><\/ul><p><b>uno/una<\/b> oder <b>tú<\/b> für persönliche Verallgemeinerungen:<\/p><ul><li><em>Cuando uno está cansado, no piensa bien.<\/em> – Wenn man müde ist, denkt man nicht klar.<\/li><li><em>Si estudias cada día, al final aprendes.<\/em> – Wenn man jeden Tag lernt, lernt man am Ende auch.<\/li><\/ul><div class=\"tip\">Übersicht „man“: <em>se<\/em> (allgemein), 3. Pl. (unbekannte andere Leute, Sprecher ausgeschlossen), <em>uno<\/em>/<em>tú<\/em> (Sprecher eingeschlossen).<\/div>"}],"exercises":[{"type":"gap","title":"Reflexivpronomen","task":"Setze das passende Reflexivpronomen ein.","items":[{"q":"Normalmente ___ despierto a las siete.","a":["me"],"de":"Normalerweise wache ich um sieben auf."},{"q":"¿A qué hora ___ acostáis los sábados?","a":["os"],"de":"Wann geht ihr samstags ins Bett?"},{"q":"Mis vecinos ___ quejan siempre del ruido.","a":["se"],"de":"Meine Nachbarn beschweren sich immer über den Lärm."},{"q":"Nosotros ___ conocimos en un concierto.","a":["nos"],"de":"Wir haben uns auf einem Konzert kennengelernt."},{"q":"¿Cómo ___ llamas?","a":["te"],"de":"Wie heißt du?"},{"q":"Voy a duchar___ antes de cenar.","a":["me"],"de":"Ich dusche, bevor ich zu Abend esse."},{"q":"¡Siénta___, por favor! (tú)","a":["te"],"de":"Setz dich bitte!"},{"q":"Ana y Luis ___ casan en mayo.","a":["se"],"de":"Ana und Luis heiraten im Mai."}]},{"type":"choice","title":"Mit oder ohne se?","task":"Wähle die passende Form.","items":[{"q":"Estoy muy cansado; ___ a casa.","options":["voy","me voy"],"a":1,"why":"Weggehen/Aufbrechen → irse."},{"q":"Anoche ___ viendo la tele.","options":["dormí","me dormí"],"a":1,"why":"Einschlafen → dormirse."},{"q":"Hoy ___ en casa, está lloviendo.","options":["quedo","me quedo"],"a":1,"why":"Bleiben → quedarse."},{"q":"Tu hija ___ mucho a ti.","options":["parece","se parece"],"a":1,"why":"Ähneln → parecerse a."},{"q":"Este plan me ___ fantástico.","options":["parece","se parece"],"a":0,"why":"Scheinen/finden → parecer."},{"q":"¿Te ___ bien con tus compañeros de piso?","options":["llevas","lleva"],"a":0,"why":"Sich verstehen → llevarse bien con (2. Sg.: te llevas)."},{"q":"¿Puedo ___ este libro? Te lo devuelvo mañana.","options":["llevar","llevarme"],"a":1,"why":"Mitnehmen (für sich) → llevarse."},{"q":"No ___ de su nombre.","options":["acuerdo","me acuerdo"],"a":1,"why":"Sich erinnern → acordarse de."}]},{"type":"choice","title":"„werden“","task":"Wähle das passende Verb für „werden“.","items":[{"q":"Cuando habla en público, ___ muy nerviosa.","options":["se pone","se hace","se vuelve"],"a":0,"why":"Vorübergehender Zustand/Gefühl → ponerse."},{"q":"Después del accidente, ___ ciego de un ojo.","options":["se puso","se quedó","se hizo"],"a":1,"why":"Endzustand nach einem Ereignis → quedarse."},{"q":"Trabajó duro y ___ millonario.","options":["se hizo","se puso","se quedó"],"a":0,"why":"Entwicklung durch eigenes Zutun → hacerse."},{"q":"Desde que ganó la lotería, ___ muy arrogante.","options":["se ha puesto","se ha vuelto","se ha quedado"],"a":1,"why":"Tiefgreifende Charakterveränderung → volverse."},{"q":"La pequeña librería ___ en una cadena nacional.","options":["se hizo","se convirtió","se puso"],"a":1,"why":"Verwandlung + Substantiv → convertirse en."},{"q":"Empezó de aprendiz y ___ jefe de cocina.","options":["llegó a ser","se puso","se quedó"],"a":0,"why":"Ziel nach langem Weg → llegar a ser."},{"q":"Vámonos, ___ tarde.","options":["se pone","se hace","se vuelve"],"a":1,"why":"Feste Wendung: hacerse tarde."},{"q":"Al oír su nombre, ___ roja como un tomate.","options":["se volvió","se puso","se hizo"],"a":1,"why":"Gesichtsfarbe (vorübergehend) → ponerse."}]},{"type":"gap","title":"Unpersönliches und passives se","task":"Setze das Verb in Klammern im Präsens ein (se + 3. Person Singular oder Plural).","items":[{"q":"En esta tienda se (vender) ___ productos ecológicos.","a":["venden"],"de":"In diesem Laden werden Bioprodukte verkauft."},{"q":"En Galicia se (comer) ___ muy bien.","a":["come"],"de":"In Galicien isst man sehr gut."},{"q":"Se (necesitar) ___ profesores de alemán.","a":["necesitan"],"de":"Deutschlehrer gesucht."},{"q":"Se (buscar) ___ a dos testigos del accidente.","a":["busca"],"de":"Zwei Unfallzeugen werden gesucht."},{"q":"¿Cómo se (escribir) ___ tu apellido?","a":["escribe"],"de":"Wie schreibt man deinen Nachnamen?"},{"q":"En el norte se (hablar) ___ dos lenguas oficiales.","a":["hablan"],"de":"Im Norden werden zwei Amtssprachen gesprochen."},{"q":"Aquí se (prohibir) ___ fumar.","a":["prohíbe"],"de":"Hier ist Rauchen verboten."},{"q":"Se (reparar) ___ bicicletas y patinetes.","a":["reparan"],"de":"Fahrräder und Roller werden repariert."},{"q":"En esta empresa se (tratar) ___ bien a los empleados.","a":["trata"],"de":"In dieser Firma werden die Angestellten gut behandelt."}]},{"type":"gap","title":"Missgeschicke mit se","task":"Ergänze das indirekte Pronomen (me, te, le, nos, os, les).","items":[{"q":"Lo siento, se ___ olvidó traer el libro. (yo)","a":["me"],"de":"Tut mir leid, ich habe vergessen, das Buch mitzubringen."},{"q":"A los niños se ___ rompió el juguete.","a":["les"],"de":"Den Kindern ist das Spielzeug kaputtgegangen."},{"q":"¿Se ___ ha perdido algo? (tú)","a":["te"],"de":"Hast du etwas verloren?"},{"q":"A mi abuelo se ___ caen siempre las gafas.","a":["le"],"de":"Meinem Opa fällt immer die Brille herunter."},{"q":"Se ___ acabó la gasolina en plena autopista. (nosotros)","a":["nos"],"de":"Mitten auf der Autobahn ist uns das Benzin ausgegangen."},{"q":"¿Se ___ quemó la cena otra vez? (vosotros)","a":["os"],"de":"Ist euch das Abendessen wieder angebrannt?"},{"q":"A Marta se ___ ocurrió una idea genial.","a":["le"],"de":"Marta ist eine geniale Idee gekommen."}]},{"type":"choice","title":"Passiv: ser, estar oder Umschreibung?","task":"Wähle die korrekte Variante.","items":[{"q":"La catedral ___ construida en el siglo XIII.","options":["fue","estuvo","era"],"a":0,"why":"Abgeschlossener Vorgang → ser-Passiv im indefinido."},{"q":"Lo siento, el museo ___ cerrado los lunes.","options":["es","está","se"],"a":1,"why":"Zustand → estar + Partizip."},{"q":"Las cartas fueron ___ por la secretaria.","options":["escrito","escritas","escribidas"],"a":1,"why":"ser-Passiv: Partizip angeglichen (las cartas → escritas)."},{"q":"„Mir wurde ein Buch geschenkt.“","options":["Fui regalado un libro.","Me regalaron un libro.","Estuve regalado un libro."],"a":1,"why":"Indirektes Objekt kann nicht Passivsubjekt werden → 3. Person Plural."},{"q":"„Man sagt, dass das Restaurant schließt.“","options":["Dicen que el restaurante cierra.","Es dicho que el restaurante cierra.","Están dichos que el restaurante cierra."],"a":0,"why":"Allgemeines „man sagt“ → 3. Person Plural (oder se dice)."},{"q":"El ladrón ___ detenido por la policía ayer.","options":["estuvo","fue","se"],"a":1,"why":"Vorgang mit Urheber (por) → ser-Passiv."},{"q":"„Hier werden Häuser verkauft.“","options":["Aquí se vende casas.","Aquí se venden casas.","Aquí son vendido casas."],"a":1,"why":"Passives se: Verb richtet sich nach casas (Plural)."},{"q":"Cuando llegamos, la mesa ya ___ puesta.","options":["era","estaba","fue"],"a":1,"why":"Ergebniszustand → estar + Partizip."}]}],"cards":[{"f":"Stellung des Reflexivpronomens","b":"vor konj. Verb; angehängt an Infinitiv, gerundio, bejahten Imperativ"},{"f":"Imperativ: sentarse (nosotros / vosotros)","b":"sentémonos / sentaos"},{"f":"Ich putze mir die Zähne.","b":"Me lavo los dientes. (Artikel statt Possessiv)"},{"f":"reziprokes se","b":"einander: Se quieren. Nos llamamos a menudo."},{"f":"ir / irse","b":"gehen, fahren / weggehen, aufbrechen"},{"f":"dormir / dormirse","b":"schlafen / einschlafen, verschlafen"},{"f":"quedar / quedarse","b":"sich verabreden, übrig sein / bleiben"},{"f":"llevar / llevarse","b":"tragen, bringen / mitnehmen; sich verstehen (llevarse bien)"},{"f":"parecer / parecerse a","b":"scheinen / ähneln"},{"f":"acordar / acordarse de","b":"vereinbaren / sich erinnern"},{"f":"ponerse + Adj.","b":"werden (vorübergehend): ponerse nervioso, rojo"},{"f":"volverse + Adj.","b":"werden (Charakter, tiefgreifend): volverse loco"},{"f":"hacerse + Adj./Subst.","b":"werden (Entwicklung, Zutun): hacerse rico, vegetariano"},{"f":"quedarse + Adj.","b":"werden (Endzustand): quedarse sordo, viudo, sin trabajo"},{"f":"convertirse en","b":"sich verwandeln in, werden zu + Substantiv"},{"f":"llegar a ser","b":"(nach langem Weg) werden: llegó a ser presidenta"},{"f":"unpersönliches se","b":"se + 3. Sg.: Aquí se vive bien. Se busca a los culpables."},{"f":"passives se","b":"Verb richtet sich nach der Sache: Se venden pisos."},{"f":"„Se vende pisos“ – richtig?","b":"falsch → Se venden pisos"},{"f":"„man“ bei reflexiven Verben","b":"uno: Uno se acostumbra."},{"f":"Mir ist das Glas heruntergefallen.","b":"Se me cayó el vaso."},{"f":"Ich habe es vergessen (ungewollt).","b":"Se me olvidó."},{"f":"Uns ist die Milch ausgegangen.","b":"Se nos acabó la leche."},{"f":"ser + Partizip","b":"Vorgangspassiv, angeglichen, Urheber mit por; eher schriftlich"},{"f":"estar + Partizip","b":"Zustandspassiv: La puerta está cerrada."},{"f":"Mir wurde ein Buch geschenkt.","b":"Me regalaron un libro. (nicht *Fui regalado)"},{"f":"„man sagt“","b":"Dicen que… / Se dice que…"}],"id":"k22"},{"nr":22,"title":"gustar & Co. und Verbanschlüsse","teil":"Das Verb und seine Ergänzungen","intro":"Bei gustar und ähnlichen Verben ist die Satzstruktur gegenüber dem Deutschen „umgedreht“: Das, was gefällt, ist das Subjekt. Außerdem geht es um das a vor Personen und um Verben mit fester Präposition – zwei Bereiche, in denen deutsche Lerner besonders oft danebenliegen.","sections":[{"h":"Die gustar-Konstruktion","html":"<p>Wörtlich bedeutet <em>gustar<\/em> „gefallen“. Die Person, der etwas gefällt, steht als <b>indirektes Objekt<\/b> (<em>me, te, le, nos, os, les<\/em>), das Gefallende ist das <b>Subjekt<\/b>. Darum richtet sich das Verb nach der Sache:<\/p><table><tr><th>Pronomen<\/th><th>Sg./Infinitiv<\/th><th>Plural<\/th><\/tr><tr><td><em>me<\/em><\/td><td><em>me gusta el té<\/em><\/td><td><em>me gustan los gatos<\/em><\/td><\/tr><tr><td><em>te<\/em><\/td><td><em>te gusta bailar<\/em><\/td><td><em>te gustan las setas<\/em><\/td><\/tr><tr><td><em>le<\/em><\/td><td><em>le gusta el fútbol<\/em><\/td><td><em>le gustan los cómics<\/em><\/td><\/tr><tr><td><em>nos<\/em><\/td><td><em>nos gusta el mar<\/em><\/td><td><em>nos gustan las fiestas<\/em><\/td><\/tr><tr><td><em>os<\/em><\/td><td><em>os gusta leer<\/em><\/td><td><em>os gustan los museos<\/em><\/td><\/tr><tr><td><em>les<\/em><\/td><td><em>les gusta viajar<\/em><\/td><td><em>les gustan los perros<\/em><\/td><\/tr><\/table><p>Mit einem oder mehreren <b>Infinitiven<\/b> steht immer der Singular: <em>Me gusta nadar y montar en bici.<\/em><\/p><div class=\"warn\">Achtung: Nicht <em>*Yo gusto el chocolate<\/em>, sondern <em>Me gusta el chocolate<\/em>. Und nicht <em>*Me gusta las fresas<\/em>, sondern <em>Me gustan las fresas<\/em> – das Verb folgt der Sache.<\/div><div class=\"tip\">Merke: Die Sache steht mit Artikel: <em>Me gusta el café<\/em> (Kaffee allgemein), nicht <em>*Me gusta café<\/em>.<\/div>"},{"h":"Betonung, Verneinung, Vergangenheit","html":"<p>Zur <b>Betonung<\/b> oder Klarstellung kommt <em>a<\/em> + Name/betontes Pronomen dazu. Das unbetonte Pronomen bleibt trotzdem stehen:<\/p><ul><li><em>A mí me gusta el invierno, pero a ella no.<\/em> – Mir gefällt der Winter, ihr aber nicht.<\/li><li><em>A Juan le gusta cocinar.<\/em> – Juan kocht gern.<\/li><li><em>A mis padres les gustan las películas antiguas.<\/em> – Meine Eltern mögen alte Filme.<\/li><\/ul><p><b>Kurzreaktionen:<\/b><\/p><table><tr><th>Aussage<\/th><th>gleiche Meinung<\/th><th>andere Meinung<\/th><\/tr><tr><td><em>Me gusta el jazz.<\/em><\/td><td><em>A mí también.<\/em><\/td><td><em>A mí no.<\/em><\/td><\/tr><tr><td><em>No me gusta el jazz.<\/em><\/td><td><em>A mí tampoco.<\/em><\/td><td><em>A mí sí.<\/em><\/td><\/tr><\/table><p><b>Verneinung:<\/b> <em>no<\/em> steht vor dem Pronomen: <em>No me gustan las aceitunas.<\/em><\/p><p><b>Vergangenheit:<\/b> dieselben Regeln wie bei anderen Verben:<\/p><ul><li><em>¿Te gustó la exposición?<\/em> – Hat dir die Ausstellung gefallen?<\/li><li><em>De niño no me gustaban las verduras.<\/em> – Als Kind mochte ich kein Gemüse.<\/li><li><em>Nos ha gustado mucho el hotel.<\/em> – Das Hotel hat uns sehr gefallen.<\/li><\/ul><div class=\"warn\">Achtung: <em>*A Juan gusta<\/em> ohne <em>le<\/em> ist falsch – das unbetonte Pronomen ist Pflicht, <em>a + Person<\/em> ist optional.<\/div><div class=\"tip\">Merke: <em>gustar<\/em> mit Personen als Subjekt bedeutet meist Anziehung: <em>Me gustas.<\/em> – Ich finde dich toll / Ich steh auf dich. Für Sympathie sagt man eher <em>Me cae bien.<\/em><\/div>"},{"h":"Verben wie gustar","html":"<table><tr><th>Verb<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>encantar<\/em><\/td><td>sehr gefallen, lieben<\/td><td><em>Me encanta el flamenco.<\/em><\/td><\/tr><tr><td><em>interesar<\/em><\/td><td>interessieren<\/td><td><em>¿Te interesa la política?<\/em><\/td><\/tr><tr><td><em>molestar<\/em><\/td><td>stören<\/td><td><em>Me molesta el humo.<\/em><\/td><\/tr><tr><td><em>doler<\/em> (ue)<\/td><td>wehtun<\/td><td><em>Me duelen los pies.<\/em><\/td><\/tr><tr><td><em>parecer<\/em><\/td><td>finden, halten für<\/td><td><em>Me parece una buena idea.<\/em><\/td><\/tr><tr><td><em>faltar<\/em><\/td><td>fehlen<\/td><td><em>Nos faltan dos sillas.<\/em><\/td><\/tr><tr><td><em>quedar<\/em><\/td><td>übrig sein; stehen (Kleidung)<\/td><td><em>Me quedan diez euros. Te queda bien.<\/em><\/td><\/tr><tr><td><em>apetecer<\/em><\/td><td>Lust haben (Spanien)<\/td><td><em>¿Te apetece un helado?<\/em><\/td><\/tr><tr><td><em>importar<\/em><\/td><td>wichtig sein, ausmachen<\/td><td><em>¿Te importa si abro?<\/em><\/td><\/tr><tr><td><em>preocupar<\/em><\/td><td>Sorgen machen<\/td><td><em>Le preocupa su salud.<\/em><\/td><\/tr><tr><td><em>sobrar<\/em><\/td><td>übrig sein, zu viel sein<\/td><td><em>Sobra comida.<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: <em>encantar<\/em> ist schon stark – nie <em>*muy<\/em>; auch <em>mucho<\/em> wird meist weggelassen, weil es redundant wirkt: besser <em>Me encanta<\/em> als <em>Me encanta mucho<\/em>. Bei <em>gustar<\/em> ist <em>mucho<\/em> ganz normal: <em>Me gusta mucho.<\/em><\/div><div class=\"warn\">Achtung: <em>Me duele la cabeza<\/em> – Kopfweh haben, mit Artikel. Nicht <em>*Mi cabeza duele<\/em>.<\/div><div class=\"tip\">Merke: <em>¿Qué te parece…?<\/em> = Was hältst du von …? – <em>Me parece genial / fatal / bien.<\/em><\/div>"},{"h":"Das a vor Personen (a personal)","html":"<p>Ist das <b>direkte Objekt<\/b> eine bestimmte Person (oder ein vertrautes Tier), steht davor <em>a<\/em>. Im Deutschen gibt es dafür keine Entsprechung:<\/p><ul><li><em>Veo a María todos los días.<\/em> – Ich sehe María jeden Tag.<\/li><li><em>Quiero mucho a mis sobrinos.<\/em> – Ich habe meine Neffen sehr lieb.<\/li><li><em>¿Conoces a alguien en Bilbao? – No, no conozco a nadie.<\/em><\/li><li><em>Llevo al perro al veterinario.<\/em> – Ich bringe den Hund zum Tierarzt.<\/li><\/ul><table><tr><th>mit a<\/th><th>ohne a<\/th><\/tr><tr><td><em>Busco a mi hermana.<\/em><br><small>eine bestimmte Person<\/small><\/td><td><em>Busco un piso.<\/em><br><small>Sache<\/small><\/td><\/tr><tr><td><em>Busco a alguien que hable ruso.<\/em><br><small>alguien/nadie immer mit a<\/small><\/td><td><em>Busco una canguro.<\/em><br><small>irgendeine, unbestimmt<\/small><\/td><\/tr><tr><td><em>Quiero a Pablo.<\/em><br><small>ich liebe Pablo<\/small><\/td><td><em>Quiero un café.<\/em><br><small>ich möchte einen Kaffee<\/small><\/td><\/tr><\/table><p><b>Kein a<\/b> nach <em>hay<\/em> und nach <em>tener<\/em> im Sinn von „haben“:<\/p><ul><li><em>Tengo tres primos en México.<\/em> – Ich habe drei Cousins in Mexiko.<\/li><li><em>Hay un señor en la puerta.<\/em> – An der Tür ist ein Herr.<\/li><\/ul><div class=\"warn\">Achtung: Das <em>a<\/em> steht nur beim <b>direkten<\/b> Objekt. Beim Subjekt nie: <em>María ve la tele<\/em>, nicht <em>*A María ve…<\/em>.<\/div><div class=\"tip\">Merke: <em>a + el = al<\/em>: <em>Saludé al director.<\/em><\/div>"},{"h":"Verben mit fester Präposition","html":"<table><tr><th>Verb<\/th><th>Deutsch<\/th><th>Beispiel<\/th><\/tr><tr><td><em>pensar en<\/em><\/td><td>denken an<\/td><td><em>Pienso mucho en ti.<\/em><\/td><\/tr><tr><td><em>soñar con<\/em><\/td><td>träumen von<\/td><td><em>Anoche soñé con mi abuela.<\/em><\/td><\/tr><tr><td><em>casarse con<\/em><\/td><td>heiraten (jdn.)<\/td><td><em>Se casó con un chileno.<\/em><\/td><\/tr><tr><td><em>enamorarse de<\/em><\/td><td>sich verlieben in<\/td><td><em>Me enamoré de Sevilla.<\/em><\/td><\/tr><tr><td><em>acordarse de<\/em><\/td><td>sich erinnern an<\/td><td><em>¿Te acuerdas de mí?<\/em><\/td><\/tr><tr><td><em>depender de<\/em><\/td><td>abhängen von<\/td><td><em>Depende del tiempo.<\/em><\/td><\/tr><tr><td><em>consistir en<\/em><\/td><td>bestehen in<\/td><td><em>¿En qué consiste el trabajo?<\/em><\/td><\/tr><tr><td><em>quejarse de<\/em><\/td><td>sich beschweren über<\/td><td><em>Se queja del jefe.<\/em><\/td><\/tr><tr><td><em>tardar en<\/em><\/td><td>(lange) brauchen für<\/td><td><em>Tardó un mes en contestar.<\/em><\/td><\/tr><tr><td><em>contar con<\/em><\/td><td>rechnen mit, zählen auf<\/td><td><em>Puedes contar conmigo.<\/em><\/td><\/tr><\/table><p>Weitere: <em>confiar en<\/em> (vertrauen), <em>fijarse en<\/em> (achten auf), <em>reírse de<\/em> (lachen über), <em>olvidarse de<\/em> (vergessen), <em>despedirse de<\/em> (sich verabschieden von), <em>preocuparse por<\/em> (sich sorgen um), <em>interesarse por<\/em> (sich interessieren für), <em>encontrarse con<\/em> (zufällig treffen).<\/p><div class=\"warn\">Achtung: Die deutsche Präposition hilft selten: „denken an“ = <em>pensar en<\/em> (nicht <em>*a<\/em>), „sich verlieben in“ = <em>enamorarse de<\/em> (nicht <em>*en<\/em>), „heiraten“ = <em>casarse con<\/em>.<\/div><div class=\"tip\">Merke: Die Präposition bleibt auch in Fragen und Relativsätzen vorn: <em>¿En qué piensas?<\/em> – Woran denkst du? <em>La chica con la que se casó…<\/em><\/div>"},{"h":"Anderer Anschluss als im Deutschen","html":"<p>Viele Verben haben ein anderes Objekt als ihre deutschen Entsprechungen:<\/p><table><tr><th>Spanisch<\/th><th>Deutsch<\/th><th>Beispiel<\/th><\/tr><tr><td><em>ayudar a alguien<\/em><\/td><td>jdm. helfen<\/td><td><em>La ayudo.<\/em> (dir. Objekt)<\/td><\/tr><tr><td><em>llamar a alguien<\/em><\/td><td>jdn. anrufen<\/td><td><em>Te llamo luego.<\/em><\/td><\/tr><tr><td><em>preguntar por alguien<\/em><\/td><td>nach jdm. fragen<\/td><td><em>Tu madre preguntó por ti.<\/em><\/td><\/tr><tr><td><em>preguntar a alguien<\/em><\/td><td>jdn. fragen<\/td><td><em>Pregúntale a Luis.<\/em><\/td><\/tr><tr><td><em>esperar a alguien<\/em><\/td><td>auf jdn. warten<\/td><td><em>Te espero abajo.<\/em><\/td><\/tr><tr><td><em>buscar algo<\/em><\/td><td>nach etw. suchen<\/td><td><em>Busco mis gafas.<\/em><\/td><\/tr><tr><td><em>escuchar algo<\/em><\/td><td>etw. zuhören<\/td><td><em>Escucha la canción.<\/em><\/td><\/tr><tr><td><em>pagar algo<\/em><\/td><td>für etw. bezahlen<\/td><td><em>Yo pago las bebidas.<\/em><\/td><\/tr><tr><td><em>pedir algo<\/em><\/td><td>um etw. bitten<\/td><td><em>Pidió ayuda.<\/em><\/td><\/tr><tr><td><em>agradecer algo<\/em><\/td><td>für etw. danken<\/td><td><em>Te agradezco el consejo.<\/em><\/td><\/tr><tr><td><em>seguir a alguien<\/em><\/td><td>jdm. folgen<\/td><td><em>Síganme, por favor.<\/em><\/td><\/tr><tr><td><em>felicitar a alguien<\/em><\/td><td>jdm. gratulieren<\/td><td><em>La felicité.<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: „Ich helfe ihr“ = <em>La ayudo<\/em> (direktes Objekt), nicht <em>*Le ayudo<\/em> wie ein deutscher Dativ. <small>(In Teilen Spaniens hört man <em>le ayudo<\/em>, Standard ist <em>la/lo<\/em>.)<\/small><\/div><div class=\"warn\">Achtung: „Ich warte auf den Bus“ = <em>Espero el autobús<\/em> – keine Präposition für Sachen, <em>a<\/em> nur vor Personen: <em>Espero a Carmen.<\/em><\/div>"}],"exercises":[{"type":"choice","title":"gusta oder gustan?","task":"Wähle die richtige Form.","items":[{"q":"Me ___ las películas de miedo.","options":["gusta","gustan"],"a":1,"why":"Subjekt las películas (Plural) → gustan."},{"q":"A mi hermana le ___ bailar salsa.","options":["gusta","gustan"],"a":0,"why":"Infinitiv als Subjekt → Singular."},{"q":"¿Os ___ el pescado crudo?","options":["gusta","gustan"],"a":0,"why":"el pescado (Singular) → gusta."},{"q":"No nos ___ nada los lunes.","options":["gusta","gustan"],"a":1,"why":"los lunes (Plural) → gustan."},{"q":"A los niños les ___ jugar y correr.","options":["gusta","gustan"],"a":0,"why":"Auch mehrere Infinitive → Singular."},{"q":"De pequeña me ___ mucho los cuentos de piratas.","options":["gustaba","gustaban"],"a":1,"why":"los cuentos (Plural) → gustaban."},{"q":"¿Te ___ el concierto de anoche?","options":["gustó","gustaste"],"a":0,"why":"Subjekt el concierto (3. Sg.) → gustó."},{"q":"– No me gusta la playa. – A mí ___. Prefiero la montaña.","options":["también","tampoco","sí"],"a":1,"why":"Zustimmung zu einer verneinten Aussage → tampoco."}]},{"type":"gap","title":"Pronomen und Verbform","task":"Ergänze die fehlende Form (Pronomen oder Verb in Klammern im Präsens).","items":[{"q":"A Carlos ___ encanta el teatro.","a":["le"],"de":"Carlos liebt das Theater."},{"q":"A nosotros nos (interesar) ___ mucho la historia.","a":["interesa"],"de":"Uns interessiert Geschichte sehr."},{"q":"Me (doler) ___ los oídos con esta música.","a":["duelen"],"de":"Mir tun bei dieser Musik die Ohren weh."},{"q":"¿___ apetece un café? (a ti)","a":["Te","te"],"de":"Hast du Lust auf einen Kaffee?"},{"q":"A mis vecinos les (molestar) ___ los perros que ladran.","a":["molestan"],"de":"Bellende Hunde stören meine Nachbarn."},{"q":"Solo nos (quedar) ___ cinco minutos.","a":["quedan"],"de":"Wir haben nur noch fünf Minuten."},{"q":"¿Qué ___ parece mi propuesta? (a vosotros)","a":["os"],"de":"Was haltet ihr von meinem Vorschlag?"},{"q":"A ustedes ___ falta experiencia.","a":["les"],"de":"Ihnen fehlt Erfahrung."},{"q":"No me (importar) ___ esperar un poco.","a":["importa"],"de":"Es macht mir nichts aus, ein bisschen zu warten."}]},{"type":"gap","title":"a personal – ja oder nein?","task":"Setze a, al oder – (kein a) ein.","items":[{"q":"Esta tarde voy a visitar ___ mis abuelos.","a":["a"],"de":"Heute Nachmittag besuche ich meine Großeltern."},{"q":"Tengo ___ dos hermanas mayores.","a":["–","-"],"de":"Ich habe zwei ältere Schwestern."},{"q":"¿Has visto ___ profesor hoy?","a":["al"],"de":"Hast du heute den Lehrer gesehen?"},{"q":"Estamos buscando ___ un piso con terraza.","a":["–","-"],"de":"Wir suchen eine Wohnung mit Terrasse."},{"q":"No conozco ___ nadie en esta fiesta.","a":["a"],"de":"Ich kenne niemanden auf dieser Party."},{"q":"Hay ___ mucha gente en la cola.","a":["–","-"],"de":"Es stehen viele Leute in der Schlange."},{"q":"¿Puedes ayudar ___ tu hermano con los deberes?","a":["a"],"de":"Kannst du deinem Bruder bei den Hausaufgaben helfen?"},{"q":"Necesito ___ un fontanero urgentemente.","a":["–","-"],"de":"Ich brauche dringend einen Klempner (irgendeinen)."},{"q":"Saca ___ perro a pasear, por favor.","a":["al"],"de":"Geh bitte mit dem Hund Gassi."}]},{"type":"choice","title":"Die richtige Präposition","task":"Wähle die passende Präposition.","items":[{"q":"Siempre pienso ___ ti cuando oigo esta canción.","options":["a","en","de"],"a":1,"why":"pensar en = denken an."},{"q":"Mi amiga se casó ___ un músico.","options":["con","a","de"],"a":0,"why":"casarse con = jdn. heiraten."},{"q":"Se enamoró ___ su profesora de yoga.","options":["en","de","con"],"a":1,"why":"enamorarse de = sich verlieben in."},{"q":"¿Te acuerdas ___ aquel verano en Cádiz?","options":["en","de","a"],"a":1,"why":"acordarse de = sich erinnern an."},{"q":"El precio depende ___ la temporada.","options":["de","en","por"],"a":0,"why":"depender de = abhängen von."},{"q":"La prueba consiste ___ tres ejercicios.","options":["de","en","con"],"a":1,"why":"consistir en = bestehen in/aus."},{"q":"Sueño ___ tener una casa en el campo.","options":["de","con","en"],"a":1,"why":"soñar con = träumen von."},{"q":"Siempre se queja ___ la comida del comedor.","options":["en","de","a"],"a":1,"why":"quejarse de = sich beschweren über."},{"q":"Para la mudanza puedes contar ___ nosotros.","options":["con","en","de"],"a":0,"why":"contar con = zählen auf."},{"q":"¿Cuánto tardaste ___ pintar la habitación?","options":["de","por","en"],"a":2,"why":"tardar en = brauchen für."}]},{"type":"choice","title":"Andere Rektion als im Deutschen","task":"Wähle die korrekte Variante.","items":[{"q":"„Ich warte auf dich am Eingang.“","options":["Te espero en la entrada.","Espero por ti en la entrada.","Espero en ti en la entrada."],"a":0,"why":"esperar a alguien: direktes Objekt, keine Präposition „auf“."},{"q":"„Deine Mutter hat nach dir gefragt.“","options":["Tu madre te preguntó.","Tu madre preguntó por ti.","Tu madre preguntó a ti."],"a":1,"why":"nach jdm. fragen → preguntar por; te preguntó hieße „sie hat dich gefragt“."},{"q":"„Ich helfe meiner Mutter.“ → Ich helfe ihr.","options":["La ayudo.","Ayudo a ella.","Ayudo la."],"a":0,"why":"ayudar hat ein direktes Objekt → la."},{"q":"„Wir bezahlen für das Abendessen.“","options":["Pagamos para la cena.","Pagamos la cena.","Pagamos a la cena."],"a":1,"why":"pagar algo – ohne Präposition."},{"q":"„Danke für deine Hilfe!“ (mit agradecer)","options":["Te agradezco de tu ayuda.","Te agradezco tu ayuda.","Agradezco a tu ayuda."],"a":1,"why":"agradecer algo a alguien – die Sache ist direktes Objekt."},{"q":"„Ich suche nach meinem Handy.“","options":["Busco por mi móvil.","Busco mi móvil.","Busco a mi móvil."],"a":1,"why":"buscar algo – ohne Präposition, kein a bei Sachen."},{"q":"„Ruf deine Schwester an!“","options":["¡Llama a tu hermana!","¡Llama tu hermana!","¡Llama con tu hermana!"],"a":0,"why":"llamar a alguien – a personal vor der Person."},{"q":"„Hör mir zu!“","options":["¡Escucha a mí!","¡Escúchame!","¡Escucha me!"],"a":1,"why":"escuchar + direktes Objekt; Pronomen an den Imperativ angehängt."}]}],"cards":[{"f":"Ich mag Erdbeeren.","b":"Me gustan las fresas. (Verb folgt der Sache)"},{"f":"gustar + Infinitiv(e)","b":"immer Singular: Me gusta leer y escribir."},{"f":"Juan kocht gern.","b":"A Juan le gusta cocinar. (le ist Pflicht)"},{"f":"Mir auch. / Mir auch nicht.","b":"A mí también. / A mí tampoco."},{"f":"Mir schon. / Mir nicht.","b":"A mí sí. / A mí no."},{"f":"Hat dir der Film gefallen?","b":"¿Te gustó la película?"},{"f":"Me gustas.","b":"Ich finde dich toll (Anziehung). Sympathie: Me caes bien."},{"f":"encantar + muy/mucho?","b":"muy nie; mucho meist weglassen (redundant): Me encanta."},{"f":"Mir tut der Rücken weh.","b":"Me duele la espalda."},{"f":"Was hältst du davon?","b":"¿Qué te parece?"},{"f":"Mir fehlt Zeit.","b":"Me falta tiempo."},{"f":"quedar (wie gustar)","b":"übrig sein: Me quedan 5 €. / stehen: Te queda bien."},{"f":"Hast du Lust auf …? (Spanien)","b":"¿Te apetece…?"},{"f":"Macht es dir etwas aus, wenn …?","b":"¿Te importa si…?"},{"f":"a personal","b":"vor bestimmten Personen als dir. Objekt: Veo a Ana."},{"f":"a personal nach tener / hay?","b":"nein: Tengo dos hijos. Hay un señor."},{"f":"alguien / nadie als Objekt","b":"immer mit a: No veo a nadie."},{"f":"Quiero a Pablo / Quiero un café","b":"Ich liebe Pablo / Ich möchte einen Kaffee"},{"f":"denken an / träumen von","b":"pensar en / soñar con"},{"f":"heiraten / sich verlieben in","b":"casarse con / enamorarse de"},{"f":"sich erinnern an / abhängen von","b":"acordarse de / depender de"},{"f":"bestehen in / sich beschweren über","b":"consistir en / quejarse de"},{"f":"brauchen für / zählen auf","b":"tardar en / contar con"},{"f":"jdm. helfen","b":"ayudar a alguien → la/lo ayudo (dir. Objekt)"},{"f":"auf jdn. warten / nach etw. suchen","b":"esperar a alguien / buscar algo"},{"f":"nach jdm. fragen / jdn. fragen","b":"preguntar por alguien / preguntar a alguien"},{"f":"für etw. bezahlen / danken","b":"pagar algo / agradecer algo"}],"id":"k23"},{"nr":23,"title":"Das Adverb","teil":"Das Verb und seine Ergänzungen","intro":"Adverbien sagen, wie, wann, wo und wie sehr etwas geschieht. Anders als im Deutschen unterscheidet das Spanische Adjektiv und Adverb meist klar (bueno – bien, rápido – rápidamente).","sections":[{"h":"Adverbien auf -mente","html":"<p>Viele Adverbien bildet man aus der <b>femininen Singularform<\/b> des Adjektivs + <em>-mente<\/em>. Adjektive mit nur einer Form nehmen diese:<\/p><table><tr><th>Adjektiv<\/th><th>Adverb<\/th><th>Deutsch<\/th><\/tr><tr><td><em>lento → lenta<\/em><\/td><td><em>lentamente<\/em><\/td><td>langsam<\/td><\/tr><tr><td><em>tranquilo → tranquila<\/em><\/td><td><em>tranquilamente<\/em><\/td><td>ruhig<\/td><\/tr><tr><td><em>feliz<\/em><\/td><td><em>felizmente<\/em><\/td><td>glücklich(erweise)<\/td><\/tr><tr><td><em>amable<\/em><\/td><td><em>amablemente<\/em><\/td><td>freundlich<\/td><\/tr><\/table><p>Ein Akzent des Adjektivs <b>bleibt erhalten<\/b>: <em>rápido → rápidamente<\/em>, <em>fácil → fácilmente<\/em>, <em>último → últimamente<\/em>, <em>cortés → cortésmente<\/em>.<\/p><p>Bei zwei oder mehr Adverbien hintereinander steht <em>-mente<\/em> normalerweise nur am <b>letzten<\/b>; die übrigen stehen in der Femininform (Wiederholung ist möglich, klingt aber schwerfällig):<\/p><p><em>Habla clara y lentamente.<\/em> – Er spricht deutlich und langsam.<br><em>Lo hizo rápida, eficaz y silenciosamente.<\/em><\/p><div class=\"warn\">Achtung: Nicht <em>*rapidomente<\/em> oder <em>*claromente<\/em> – immer die feminine Form: <em>rápidamente, claramente<\/em>.<\/div><div class=\"tip\">Zu lange -mente-Ketten klingen schwer. Alternative: <em>con<\/em> + Substantiv (<em>con cuidado<\/em> = <em>cuidadosamente<\/em>) oder <em>de manera / de forma<\/em> + Adjektiv (<em>de forma clara<\/em>).<\/div>"},{"h":"Ursprüngliche Adverbien der Zeit","html":"<table><tr><th>Spanisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>ya<\/em><\/td><td>schon, jetzt<\/td><\/tr><tr><td><em>todavía / aún<\/em><\/td><td>noch<\/td><\/tr><tr><td><em>siempre<\/em><\/td><td>immer<\/td><\/tr><tr><td><em>nunca / jamás<\/em><\/td><td>nie / niemals<\/td><\/tr><tr><td><em>pronto<\/em><\/td><td>bald; früh<\/td><\/tr><tr><td><em>temprano<\/em><\/td><td>früh<\/td><\/tr><tr><td><em>tarde<\/em><\/td><td>spät<\/td><\/tr><tr><td><em>hoy, ayer, mañana, anoche<\/em><\/td><td>heute, gestern, morgen, gestern Abend<\/td><\/tr><\/table><p><em>Ya he cenado.<\/em> – Ich habe schon gegessen.<br><em>¿Aún estás en la oficina?<\/em> – Bist du noch im Büro?<br><em>Hasta pronto.<\/em> – Bis bald.<br><em>Mañana me levanto temprano.<\/em> – Morgen stehe ich früh auf.<\/p><p><b><em>aún<\/em> ↔ <em>aun<\/em>:<\/b> Mit Akzent bedeutet <em>aún<\/em> „noch“ (= <em>todavía<\/em>), ohne Akzent bedeutet <em>aun<\/em> „sogar, selbst“ (= <em>incluso<\/em>):<br><em>Aún no ha llegado.<\/em> – Er ist noch nicht angekommen.<br><em>Aun así, no me convence.<\/em> – Trotzdem überzeugt es mich nicht.<br><em>Es aún más caro.<\/em> – Es ist noch teurer.<\/p><div class=\"warn\">Achtung: „früh“ als Tageszeit ist <em>temprano<\/em>; <em>pronto<\/em> heißt vor allem „bald“. „Zu spät kommen“ = <em>llegar tarde<\/em> (ohne <em>demasiado<\/em>).<\/div>"},{"h":"Ursprüngliche Adverbien des Ortes und der Art","html":"<p>Die Ortsadverbien entsprechen den Demonstrativa:<\/p><table><tr><th>Adverb<\/th><th>Bedeutung<\/th><th>vgl.<\/th><\/tr><tr><td><em>aquí / acá<\/em><\/td><td>hier, hierher<\/td><td><em>este<\/em><\/td><\/tr><tr><td><em>ahí<\/em><\/td><td>da (beim Angesprochenen)<\/td><td><em>ese<\/em><\/td><\/tr><tr><td><em>allí / allá<\/em><\/td><td>dort, dorthin<\/td><td><em>aquel<\/em><\/td><\/tr><\/table><p><em>acá<\/em> und <em>allá<\/em> sind weniger genau und betonen oft die Richtung: <em>Ven acá.<\/em> – Komm her. <em>más allá<\/em> – weiter weg. In Lateinamerika ersetzt <em>acá<\/em> häufig <em>aquí<\/em>.<\/p><p><em>cerca<\/em> (nah) und <em>lejos<\/em> (weit) brauchen vor einem Bezugswort <em>de<\/em>:<br><em>Vivo cerca del centro.<\/em> – Ich wohne nahe dem Zentrum.<br><em>La playa está lejos.<\/em> – Der Strand ist weit weg.<\/p><p>Weitere wichtige Adverbien: <em>bien<\/em> (gut), <em>mal<\/em> (schlecht), <em>así<\/em> (so), <em>despacio<\/em> (langsam), <em>arriba / abajo<\/em> (oben / unten), <em>delante / detrás<\/em> (vorne / hinten), <em>dentro / fuera<\/em> (drinnen / draußen).<\/p><div class=\"tip\">Allein steht das Adverb (<em>Está cerca.<\/em>), mit Bezugswort die Präposition dazu (<em>Está cerca de la estación.<\/em>) – genauso bei <em>delante de, detrás de, encima de, dentro de<\/em>.<\/div>"},{"h":"Adverbiale Ausdrücke","html":"<p>Viele Adverbien bestehen aus mehreren Wörtern:<\/p><table><tr><th>Spanisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>a menudo<\/em><\/td><td>oft<\/td><\/tr><tr><td><em>a veces<\/em><\/td><td>manchmal<\/td><\/tr><tr><td><em>de vez en cuando<\/em><\/td><td>ab und zu<\/td><\/tr><tr><td><em>de repente<\/em><\/td><td>plötzlich<\/td><\/tr><tr><td><em>en seguida / enseguida<\/em><\/td><td>sofort, gleich<\/td><\/tr><tr><td><em>por fin<\/em><\/td><td>endlich<\/td><\/tr><tr><td><em>de nuevo<\/em><\/td><td>wieder, erneut<\/td><\/tr><tr><td><em>a propósito<\/em><\/td><td>absichtlich; übrigens<\/td><\/tr><tr><td><em>sin querer<\/em><\/td><td>aus Versehen<\/td><\/tr><tr><td><em>a la derecha / a la izquierda<\/em><\/td><td>rechts / links<\/td><\/tr><\/table><p><em>De vez en cuando vamos a la sierra.<\/em> – Ab und zu fahren wir in die Berge.<br><em>De repente se fue la luz.<\/em> – Plötzlich fiel der Strom aus.<br><em>¡Por fin es viernes!<\/em> – Endlich ist Freitag!<br><em>Lo siento, lo he roto sin querer.<\/em> – Tut mir leid, ich habe es aus Versehen kaputt gemacht.<\/p><div class=\"warn\">Achtung: <em>por fin<\/em> = endlich (erleichtert), <em>al final<\/em> = am Ende, schließlich (zeitlich).<\/div>"},{"h":"Adjektiv als Adverb","html":"<p>Manche Adjektive werden in der maskulinen Singularform <b>unverändert als Adverb<\/b> gebraucht – vor allem in festen Verbindungen:<\/p><p><em>hablar alto / bajo<\/em> – laut / leise sprechen<br><em>hablar claro<\/em> – deutlich (offen) reden<br><em>trabajar duro<\/em> – hart arbeiten<br><em>ir rápido / conducir rápido<\/em> – schnell fahren<br><em>pisar fuerte<\/em> – fest auftreten<br><em>jugar limpio<\/em> – fair spielen<br><em>respirar hondo<\/em> – tief durchatmen<\/p><p><em>Mis vecinas hablan muy alto.<\/em> – Meine Nachbarinnen sprechen sehr laut. (nicht <em>*altas<\/em>!)<\/p><div class=\"warn\">Achtung: Als Adverb ist das Wort unveränderlich. Bezieht sich das Adjektiv dagegen auf das Subjekt, wird es angeglichen: <em>Las niñas llegaron cansadas.<\/em> – Die Mädchen kamen müde an. (Zustand der Mädchen)<\/div><div class=\"tip\">In Lateinamerika ist dieser Gebrauch noch verbreiteter: <em>¡Qué lindo canta!<\/em> – Wie schön sie singt!<\/div>"},{"h":"Stellung des Adverbs","html":"<p><b>Beim Verb:<\/b> meist direkt nach dem Verb oder am Satzende:<br><em>Conduce muy bien.<\/em> – Er fährt sehr gut.<br><em>Desayuno tranquilamente en casa.<\/em><\/p><p><b>Vor Adjektiv oder Adverb<\/b>, das es näher bestimmt:<br><em>Es bastante caro.<\/em> – Es ist ziemlich teuer.<br><em>Llegó demasiado tarde.<\/em> – Er kam zu spät.<\/p><p><b>Satzadverbien<\/b> und Zeitangaben können auch am Anfang stehen und den ganzen Satz bewerten:<br><em>Afortunadamente, nadie se hizo daño.<\/em> – Zum Glück wurde niemand verletzt.<br><em>Normalmente como a las dos.<\/em> – No
