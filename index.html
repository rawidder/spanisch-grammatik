 antigua.","options":["San","Santo"],"a":1,"why":"Vor Tomás (und Domingo) bleibt Santo."},{"q":"¿Tienes ___ pregunta?","options":["algún","alguna"],"a":1,"why":"Feminin → alguna, keine Verkürzung."},{"q":"Fue un día muy ___.","options":["malo","mal"],"a":0,"why":"Nachgestellt → volle Form."}]},{"type":"choice","title":"Stellung und Bedeutung","task":"Welche Bedeutung passt?","items":[{"q":"Cervantes fue un gran escritor.","options":["ein großgewachsener Schriftsteller","ein bedeutender Schriftsteller"],"a":1,"why":"Vorangestelltes gran = großartig, bedeutend."},{"q":"¡El pobre chico ha perdido el autobús!","options":["der mittellose Junge","der bedauernswerte Junge"],"a":1,"why":"Vorangestelltes pobre = bedauernswert."},{"q":"Ayudan a las familias pobres del barrio.","options":["mittellose Familien","bedauernswerte Familien"],"a":0,"why":"Nachgestelltes pobre = arm an Geld."},{"q":"Ana es una vieja amiga de mi madre.","options":["eine betagte Freundin","eine langjährige Freundin"],"a":1,"why":"Vorangestelltes viejo = langjährig."},{"q":"Nos vimos el mismo día.","options":["am selben Tag","am Tag selbst"],"a":0,"why":"Vorangestelltes mismo = derselbe."},{"q":"Hemos comprado un coche nuevo.","options":["ein fabrikneues Auto","ein anderes Auto (evtl. gebraucht)"],"a":0,"why":"Nachgestelltes nuevo = neu hergestellt."},{"q":"Es una noticia cierta.","options":["eine gewisse Nachricht","eine wahre Nachricht"],"a":1,"why":"Nachgestelltes cierto = wahr, zutreffend."},{"q":"Mi abuelo vive en una casa grande.","options":["ein großes Haus","ein großartiges Haus"],"a":0,"why":"Nachgestelltes grande = groß (Größe)."}]},{"type":"gap","title":"Vergleiche bilden","task":"Ergänze que, como, de, tan, tanto/-a/-os/-as, mejor, peor, mayor oder menor.","items":[{"q":"Madrid es más grande ___ Sevilla.","a":["que"],"de":"Madrid ist größer als Sevilla."},{"q":"Mi hermana es tan alta ___ yo.","a":["como"],"de":"Meine Schwester ist so groß wie ich."},{"q":"En la fiesta había más ___ cincuenta personas.","a":["de"],"de":"Auf dem Fest waren mehr als fünfzig Leute."},{"q":"Este ejercicio no es ___ difícil como parece.","a":["tan"],"de":"Diese Übung ist nicht so schwer, wie sie aussieht."},{"q":"Nunca he visto ___ gente como hoy.","a":["tanta"],"de":"Ich habe noch nie so viele Leute gesehen wie heute."},{"q":"Ella tiene ___ libros como su profesor.","a":["tantos"],"de":"Sie hat so viele Bücher wie ihr Lehrer."},{"q":"Esta paella está ___ que la de ayer. (bueno → besser)","a":["mejor"],"de":"Diese Paella ist besser als die von gestern."},{"q":"Luis tiene 40 años y su mujer 35: ella es ___ que él. (Alter)","a":["menor","más joven"],"de":"Luis ist 40 und seine Frau 35: Sie ist jünger als er."},{"q":"Hoy el tráfico está ___ que nunca. (malo → schlechter)","a":["peor"],"de":"Heute ist der Verkehr schlimmer als je zuvor."},{"q":"Duermo ___ como tú, unas ocho horas.","a":["tanto"],"de":"Ich schlafe so viel wie du, ungefähr acht Stunden."}]},{"type":"gap","title":"Superlativ auf -ísimo","task":"Bilde den absoluten Superlativ auf -ísimo in der passenden Form.","items":[{"q":"La tarta de tu abuela está (rico) ___.","a":["riquísima"],"de":"Der Kuchen deiner Oma ist superlecker."},{"q":"El examen fue (fácil) ___.","a":["facilísimo"],"de":"Die Prüfung war kinderleicht."},{"q":"Hemos esperado una cola (largo) ___.","a":["larguísima"],"de":"Wir haben in einer sehr langen Schlange gewartet."},{"q":"Los novios están (feliz) ___.","a":["felicísimos"],"de":"Das Brautpaar ist überglücklich."},{"q":"Tus padres son (amable) ___.","a":["amabilísimos"],"de":"Deine Eltern sind äußerst freundlich."},{"q":"Tenemos (poco) ___ tiempo.","a":["poquísimo"],"de":"Wir haben äußerst wenig Zeit."},{"q":"Estas chicas son (guapo) ___.","a":["guapísimas"],"de":"Diese Mädchen sind bildhübsch."},{"q":"Se casó (joven) ___, a los diecinueve años.","a":["jovencísima","jovencísimo"],"de":"Sie/Er hat sehr jung geheiratet, mit neunzehn."}]},{"type":"choice","title":"Steigerung: Fehler erkennen","task":"Welcher Satz ist korrekt?","items":[{"q":"Das ist das beste Restaurant der Stadt.","options":["Es el restaurante más bueno en la ciudad.","Es el mejor restaurante de la ciudad.","Es el restaurante el mejor de la ciudad."],"a":1,"why":"bueno → mejor, Bereich mit de, Artikel nur einmal."},{"q":"Mein älterer Bruder wohnt in Bilbao.","options":["Mi hermano mayor vive en Bilbao.","Mi hermano más grande vive en Bilbao.","Mi mayor hermano vive en Bilbao."],"a":0,"why":"Alter → mayor, nachgestellt."},{"q":"Sie ist die intelligenteste Schülerin der Klasse.","options":["Es la alumna más inteligente de la clase.","Es la más alumna inteligente de la clase.","Es la alumna más inteligente en la clase."],"a":0,"why":"Artikel + Substantiv + más + Adjektiv + de."},{"q":"Er ist größer als ich.","options":["Es más alto que mí.","Es más alto que yo.","Es más alto como yo."],"a":1,"why":"Nach que steht das Subjektpronomen yo."},{"q":"Ich habe nicht so viel Geld wie du.","options":["No tengo tan dinero como tú.","No tengo tanto dinero como tú.","No tengo tanto dinero que tú."],"a":1,"why":"Vor Substantiv tanto (angeglichen) + como."},{"q":"Es kostet weniger als 20 Euro.","options":["Cuesta menos que 20 euros.","Cuesta menos de 20 euros."],"a":1,"why":"Vor Zahlen steht de."},{"q":"Diese Hosen sind die schlechtesten.","options":["Estos pantalones son los peores.","Estos pantalones son los más peores.","Estos pantalones son los peors."],"a":0,"why":"malo → peor, Plural peores."},{"q":"Ein Mann und eine Frau, beide sehr sympathisch.","options":["un hombre y una mujer muy simpáticas","un hombre y una mujer muy simpáticos"],"a":1,"why":"Gemischte Gruppe → maskuliner Plural."}]}],"cards":[{"f":"Adjektive auf -e / -ista: weibliche Form?","b":"keine eigene: un chico amable, una chica amable; optimista"},{"f":"trabajador → feminin","b":"trabajadora (-or, -ón, -án bilden -a)"},{"f":"mejor, peor, mayor, menor – feminin?","b":"unveränderlich im Genus: la mejor idea"},{"f":"español, alemán, inglés → feminin","b":"española, alemana, inglesa"},{"f":"feliz → Plural","b":"felices (z → c)"},{"f":"Adjektiv bei gemischten Substantiven","b":"maskuliner Plural: un padre y una madre simpáticos"},{"f":"un gran hombre / un hombre grande","b":"ein großartiger Mann / ein großgewachsener Mann"},{"f":"la pobre mujer / una mujer pobre","b":"die bedauernswerte Frau / eine mittellose Frau"},{"f":"un viejo amigo / un amigo viejo","b":"ein langjähriger Freund / ein betagter Freund"},{"f":"mi nuevo coche / un coche nuevo","b":"mein neues (anderes) Auto / ein fabrikneues Auto"},{"f":"el mismo día / el rey mismo","b":"derselbe Tag / der König selbst"},{"f":"cierto día / una noticia cierta","b":"eines Tages, ein gewisser Tag / eine wahre Nachricht"},{"f":"bueno, malo, primero, tercero, alguno, ninguno vor m. Sg.","b":"buen, mal, primer, tercer, algún, ningún"},{"f":"grande / cualquiera vor Singular (m + f)","b":"gran / cualquier: una gran idea, cualquier persona"},{"f":"San oder Santo?","b":"San Pedro, San Juan – aber Santo Tomás, Santo Domingo"},{"f":"größer als / weniger teuer als","b":"más grande que / menos caro que"},{"f":"so groß wie","b":"tan alto como"},{"f":"so viele Bücher wie / so viel Geduld wie","b":"tantos libros como / tanta paciencia como"},{"f":"mehr als 100 Personen","b":"más de cien personas (de vor Zahlen)"},{"f":"Ich habe nur 10 Euro.","b":"No tengo más que diez euros."},{"f":"die schönste Stadt Spaniens","b":"la ciudad más bonita de España"},{"f":"rico, largo, feliz → -ísimo","b":"riquísimo, larguísimo, felicísimo"},{"f":"amable, joven → -ísimo","b":"amabilísimo, jovencísimo"},{"f":"bueno / malo – Komparativ und Superlativ","b":"mejor, óptimo / peor, pésimo"},{"f":"grande / pequeño – Komparativ und Superlativ","b":"mayor, máximo / menor, mínimo"},{"f":"mein älterer Bruder","b":"mi hermano mayor (Alter → mayor)"},{"f":"Mir geht es besser.","b":"Me siento mejor. (bien → mejor)"}],"id":"k04"},{"nr":5,"title":"Possessiva und Demonstrativa","teil":"Das Substantiv und seine Begleiter","intro":"Possessiva zeigen, wem etwas gehört, Demonstrativa, wo es sich befindet. Beide richten sich nach dem Substantiv – und das Spanische unterscheidet bei den Demonstrativa drei Entfernungsstufen statt zwei.","sections":[{"h":"Unbetonte Possessivbegleiter","html":"<p>Sie stehen <b>vor<\/b> dem Substantiv, ohne Artikel:<\/p><table><tr><th>Besitzer<\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>yo<\/td><td><em>mi<\/em><\/td><td><em>mis<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>tu<\/em><\/td><td><em>tus<\/em><\/td><\/tr><tr><td>él, ella, usted<\/td><td><em>su<\/em><\/td><td><em>sus<\/em><\/td><\/tr><tr><td>nosotros/-as<\/td><td><em>nuestro/-a<\/em><\/td><td><em>nuestros/-as<\/em><\/td><\/tr><tr><td>vosotros/-as<\/td><td><em>vuestro/-a<\/em><\/td><td><em>vuestros/-as<\/em><\/td><\/tr><tr><td>ellos, ellas, ustedes<\/td><td><em>su<\/em><\/td><td><em>sus<\/em><\/td><\/tr><\/table><p>Das Possessiv richtet sich in Zahl (bei <em>nuestro/vuestro<\/em> auch im Genus) nach dem <b>Besitz<\/b>, nicht nach dem Besitzer:<\/p><ul><li><em>nuestra casa, nuestros hijos<\/em> – unser Haus, unsere Kinder<\/li><li><em>Ana y sus hermanos<\/em> – Ana und ihre Brüder/Geschwister<\/li><\/ul><div class=\"warn\">Achtung: <em>mi, tu, su<\/em> haben keine Genusform: <em>mi madre<\/em>, nicht <em>mía madre<\/em>. Und <em>tu<\/em> (dein) ohne Akzent, <em>tú<\/em> (du) mit.<\/div><div class=\"tip\">Merke: In Lateinamerika ersetzt <em>su/sus<\/em> (de ustedes) das Possessiv <em>vuestro<\/em>: <em>¿Dónde está su casa?<\/em> – Wo ist euer Haus?<\/div>"},{"h":"su – sein, ihr, Ihr? Mehrdeutigkeit klären","html":"<p><em>su<\/em> steht für <b>sein, ihr<\/b> und <b>Ihr<\/b> – bei einem oder mehreren Besitzern, bei Personen wie bei Sachen (<em>la ciudad y sus calles<\/em> – die Stadt und ihre Straßen).<\/p><p><em>Pablo habló con Elena de su proyecto.<\/em> – Wessen Projekt? Unklar!<\/p><p>Zur Klarstellung ersetzt man <em>su<\/em> durch Artikel + Substantiv + <em>de<\/em> + Person:<\/p><table><tr><th>mehrdeutig<\/th><th>eindeutig<\/th><\/tr><tr><td><em>su coche<\/em><\/td><td><em>el coche de él<\/em> – sein Auto<\/td><\/tr><tr><td><\/td><td><em>el coche de ella<\/em> – ihr Auto<\/td><\/tr><tr><td><\/td><td><em>el coche de usted<\/em> – Ihr Auto<\/td><\/tr><tr><td><\/td><td><em>el coche de ellos<\/em> – ihr Auto (Pl.)<\/td><\/tr><\/table><p>Beispiel: <em>Perdone, ¿estas maletas son de usted?<\/em> – Entschuldigung, sind das Ihre Koffer?<\/p><div class=\"tip\">Merke: Im Kontext ist <em>su<\/em> meist eindeutig. Die Form mit <em>de<\/em> verwendet man nur bei echter Verwechslungsgefahr.<\/div>"},{"h":"Betonte Possessiva: mío, tuyo, suyo …","html":"<table><tr><th>Besitzer<\/th><th>Formen<\/th><\/tr><tr><td>yo<\/td><td><em>mío, mía, míos, mías<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>tuyo, tuya, tuyos, tuyas<\/em><\/td><\/tr><tr><td>él, ella, usted<\/td><td><em>suyo, suya, suyos, suyas<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>nuestro, nuestra, nuestros, nuestras<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>vuestro, vuestra, vuestros, vuestras<\/em><\/td><\/tr><tr><td>ellos, ustedes<\/td><td><em>suyo, suya, suyos, suyas<\/em><\/td><\/tr><\/table><p>Sie haben alle vier Formen und richten sich nach dem Besitz. Verwendung:<\/p><ul><li><b>nach dem Substantiv<\/b> („von mir“): <em>un amigo mío<\/em> – ein Freund von mir; <em>unas primas suyas<\/em> – Cousinen von ihm/ihr. Auch in Ausrufen: <em>¡Dios mío!<\/em><\/li><li><b>nach ser<\/b> (Besitz feststellen): <em>¿De quién es esta llave? – Es mía.<\/em><\/li><li><b>mit Artikel als Pronomen<\/b> (ersetzt das Substantiv): <em>Tu móvil es más nuevo que el mío.<\/em> – <em>Mis padres viven en Bilbao, ¿y los tuyos?<\/em><\/li><li><b>lo + Possessiv<\/b> = „meine Sache“: <em>Lo mío es la música.<\/em> – Mein Ding ist die Musik.<\/li><\/ul><div class=\"warn\">Achtung: „ein Freund von mir“ ist <em>un amigo mío<\/em>, nicht <em>un amigo de mí<\/em>. Und nicht <em>mi amigo<\/em> – das wäre „mein (bestimmter) Freund“.<\/div>"},{"h":"Kein Possessiv bei Körperteilen und Kleidung","html":"<p>Wenn klar ist, wem der Körperteil oder das Kleidungsstück gehört, steht der bestimmte Artikel – die Person zeigt meist ein Reflexiv- oder Objektpronomen:<\/p><ul><li><em>Me lavo las manos.<\/em> – Ich wasche mir die Hände.<\/li><li><em>Se ha roto el brazo.<\/em> – Er/Sie hat sich den Arm gebrochen.<\/li><li><em>Quítate los zapatos.<\/em> – Zieh deine Schuhe aus.<\/li><li><em>Le duelen los pies.<\/em> – Ihm/Ihr tun die Füße weh.<\/li><li><em>Levantad la mano.<\/em> – Hebt die Hand.<\/li><\/ul><p>Ebenso bei Dingen, die man selbstverständlich bei sich hat: <em>He perdido las llaves.<\/em> – Ich habe meine Schlüssel verloren. <em>¿Dónde has aparcado el coche?<\/em><\/p><p>Das Possessiv steht nur, wenn es betont oder zur Unterscheidung nötig ist: <em>Esa no es tu chaqueta, es la mía.<\/em><\/p><div class=\"warn\">Achtung: nicht <em>Me lavo mis manos<\/em> – das klingt im Spanischen merkwürdig, als hätte man noch fremde Hände zur Auswahl.<\/div>"},{"h":"Demonstrativa: este, ese, aquel","html":"<p>Spanisch hat drei Entfernungsstufen:<\/p><table><tr><th><\/th><th>nah beim Sprecher<\/th><th>nah beim Hörer<\/th><th>weit weg<\/th><\/tr><tr><td>m. Sg.<\/td><td><em>este<\/em><\/td><td><em>ese<\/em><\/td><td><em>aquel<\/em><\/td><\/tr><tr><td>f. Sg.<\/td><td><em>esta<\/em><\/td><td><em>esa<\/em><\/td><td><em>aquella<\/em><\/td><\/tr><tr><td>m. Pl.<\/td><td><em>estos<\/em><\/td><td><em>esos<\/em><\/td><td><em>aquellos<\/em><\/td><\/tr><tr><td>f. Pl.<\/td><td><em>estas<\/em><\/td><td><em>esas<\/em><\/td><td><em>aquellas<\/em><\/td><\/tr><tr><td>Ort<\/td><td><em>aquí<\/em><\/td><td><em>ahí<\/em><\/td><td><em>allí / allá<\/em><\/td><\/tr><\/table><ul><li><em>Este libro que tengo aquí es muy bueno.<\/em> – dieses Buch hier<\/li><li><em>¿Me pasas esa botella que tienes ahí?<\/em> – die Flasche da (bei dir)<\/li><li><em>¿Ves aquella casa allí, en la colina?<\/em> – das Haus dort drüben<\/li><\/ul><p><b>Zeitlich<\/b>: <em>este<\/em> = Gegenwart (<em>esta semana, este año<\/em>), <em>ese<\/em> = gerade Erwähntes oder nicht weit Zurückliegendes (<em>ese día<\/em>), <em>aquel<\/em> = ferne Vergangenheit (<em>en aquella época, aquellos años<\/em>).<\/p><div class=\"warn\">Achtung: <em>este<\/em> endet auf -e, das Femininum auf -a (<em>esta<\/em>), der Plural auf -os (<em>estos<\/em>), nicht <em>estes<\/em>. Vor feminin betontem a-: <em>esta agua, esa aula<\/em>.<\/div><div class=\"tip\">Merke: Nachgestellt (Artikel + Substantiv + <em>ese/este<\/em>) klingt das Demonstrativ abwertend: <em>el tipo ese<\/em> – der Typ da.<\/div>"},{"h":"Demonstrativpronomen und neutrale Formen","html":"<p>Ohne Substantiv sind die Demonstrativa Pronomen – die Formen sind gleich:<\/p><ul><li><em>¿Qué falda te gusta más, esta o esa?<\/em> – Welcher Rock gefällt dir besser, dieser oder der da?<\/li><li><em>Estos son mis padres.<\/em> – Das sind meine Eltern.<\/li><\/ul><div class=\"tip\">Merke: Früher schrieb man die Pronomen mit Akzent (<em>éste, ésa, aquél<\/em>). Nach den Regeln der RAE von 2010 ist das nicht mehr nötig – schreiben Sie sie ohne Akzent.<\/div><p>Die <b>neutralen Formen<\/b> <em>esto, eso, aquello<\/em> beziehen sich nie auf ein bestimmtes Substantiv, sondern auf Unbekanntes, Situationen oder Aussagen. Sie haben keinen Plural und tragen nie einen Akzent:<\/p><ul><li><em>¿Qué es esto?<\/em> – Was ist das (hier)?<\/li><li><em>Eso no es verdad.<\/em> – Das stimmt nicht.<\/li><li><em>¿Te acuerdas de aquello que pasó en la boda?<\/em> – Erinnerst du dich an das, was auf der Hochzeit passiert ist?<\/li><li><em>Por eso no vino.<\/em> – Deshalb ist er nicht gekommen.<\/li><\/ul><div class=\"warn\">Achtung: Deutsches „Das ist …“ bei Personen und Dingen, deren Bezeichnung man kennt, ist ein angeglichenes Pronomen: <em>Esta es mi hermana. Estos son mis hijos.<\/em> Nur bei Unbekanntem: <em>¿Qué es eso?<\/em><\/div>"}],"exercises":[{"type":"gap","title":"Unbetonte Possessiva","task":"Setze den passenden Possessivbegleiter ein.","items":[{"q":"(yo) ___ hermanos viven en Valencia.","a":["Mis"],"de":"Meine Geschwister wohnen in Valencia."},{"q":"(nosotros) ___ casa tiene un jardín pequeño.","a":["Nuestra"],"de":"Unser Haus hat einen kleinen Garten."},{"q":"¿Dónde están (tú) ___ llaves?","a":["tus"],"de":"Wo sind deine Schlüssel?"},{"q":"Señora Díaz, ¿es este (usted) ___ paraguas?","a":["su"],"de":"Frau Díaz, ist das Ihr Regenschirm?"},{"q":"Chicos, ¿habéis terminado (vosotros) ___ deberes?","a":["vuestros"],"de":"Leute, habt ihr eure Hausaufgaben fertig?"},{"q":"Mis vecinos han vendido (ellos) ___ coche.","a":["su"],"de":"Meine Nachbarn haben ihr Auto verkauft."},{"q":"Os presento a (nosotros) ___ hijas, Lucía y Marta.","a":["nuestras"],"de":"Ich stelle euch unsere Töchter Lucía und Marta vor."},{"q":"Carmen siempre habla de (ella) ___ viajes.","a":["sus"],"de":"Carmen spricht immer von ihren Reisen."}]},{"type":"choice","title":"Betont oder unbetont?","task":"Wähle die richtige Form.","items":[{"q":"Esta tarde viene a cenar un compañero ___.","options":["mi","mío","de mí"],"a":1,"why":"Nach dem Substantiv steht die betonte Form: un compañero mío."},{"q":"–¿De quién es este bolso? –Es ___.","options":["mi","mía","mío"],"a":2,"why":"Nach ser, Bezug auf el bolso (m.) → mío."},{"q":"Mi casa es pequeña, pero ___ es enorme.","options":["tu","la tuya","tuya"],"a":1,"why":"Als Pronomen (ersetzt casa) mit Artikel: la tuya."},{"q":"Nuestros hijos van al colegio; ¿y ___?","options":["los vuestros","vuestros","las vuestras"],"a":0,"why":"Ersetzt hijos (m. Pl.) → los vuestros."},{"q":"¡Dios ___, qué susto!","options":["mi","mío"],"a":1,"why":"Feste Wendung mit nachgestellter betonter Form."},{"q":"Estas gafas no son mías, son ___. (de ella)","options":["suyos","suyas","sus"],"a":1,"why":"Bezug auf gafas (f. Pl.) → suyas."},{"q":"___ es el deporte; lo de cocinar no me interesa.","options":["Lo mío","El mío","Mi"],"a":0,"why":"lo mío = meine Sache, mein Ding."},{"q":"Unos primos ___ viven en México. (de nosotros)","options":["nuestros","nuestro","nos"],"a":0,"why":"Nach dem Substantiv: unos primos nuestros."}]},{"type":"choice","title":"Possessiv oder Artikel?","task":"Wähle die im Spanischen natürliche Variante.","items":[{"q":"Ich putze mir die Zähne.","options":["Me lavo mis dientes.","Me lavo los dientes.","Lavo mis dientes."],"a":1,"why":"Körperteile: Reflexivpronomen + bestimmter Artikel."},{"q":"Zieh deine Jacke an, es ist kalt.","options":["Ponte tu chaqueta.","Ponte la chaqueta."],"a":1,"why":"Kleidung: bestimmter Artikel statt Possessiv."},{"q":"Ihm tut der Rücken weh.","options":["Le duele la espalda.","Le duele su espalda."],"a":0,"why":"Le zeigt die Person, der Körperteil steht mit Artikel."},{"q":"Ich habe meinen Geldbeutel verloren.","options":["He perdido la cartera.","He perdido mi cartera.","Beides ist möglich."],"a":2,"why":"Bei Gegenständen ist der Artikel üblich, das Possessiv aber nicht falsch."},{"q":"Das ist nicht deine Jacke, das ist meine.","options":["No es la chaqueta, es la mía.","No es tu chaqueta, es la mía."],"a":1,"why":"Kontrast der Besitzer → Possessiv nötig."},{"q":"Sie hat sich das Bein gebrochen.","options":["Se ha roto la pierna.","Ha roto su pierna."],"a":0,"why":"Reflexiv + Artikel bei Körperteilen."},{"q":"Hebt die Hand, wenn ihr fertig seid.","options":["Levantad vuestra mano.","Levantad la mano."],"a":1,"why":"Körperteil → bestimmter Artikel."}]},{"type":"gap","title":"Klarstellung von su","task":"Ersetze su durch die eindeutige Form mit de (z. B. de él, de ella, de usted, de ellos).","items":[{"q":"Señor Ruiz, ¿este abrigo es de ___? (Sie)","a":["usted"],"de":"Herr Ruiz, ist dieser Mantel Ihrer?"},{"q":"Juan y Sara tienen coche; vamos en el coche de ___. (sie, Sara)","a":["ella"],"de":"Juan und Sara haben ein Auto; wir fahren mit ihrem (Saras) Auto."},{"q":"No es la casa de Marta, es la casa de ___. (er, ihr Mann)","a":["él"],"de":"Es ist nicht Martas Haus, es ist sein Haus."},{"q":"Los niños dejaron sus bicis aquí: son las bicis de ___. (sie, Pl.)","a":["ellos"],"de":"Die Kinder haben ihre Fahrräder hier gelassen: Es sind ihre Fahrräder."},{"q":"Mis vecinas me han invitado a la fiesta de ___. (sie, Pl. f.)","a":["ellas"],"de":"Meine Nachbarinnen haben mich zu ihrem Fest eingeladen."},{"q":"Señoras, ¿estas maletas son de ___? (Sie, Pl.)","a":["ustedes"],"de":"Meine Damen, sind das Ihre Koffer?"}]},{"type":"choice","title":"este, ese oder aquel?","task":"Wähle das passende Demonstrativ.","items":[{"q":"___ zapatos que llevo son nuevos.","options":["Estos","Esos","Aquellos"],"a":0,"why":"Was der Sprecher trägt → nah beim Sprecher: estos."},{"q":"¿Qué es ___ que tienes en la mano?","options":["esto","eso","aquello"],"a":1,"why":"Beim Hörer, unbekannte Sache → eso."},{"q":"¿Ves ___ montañas al fondo?","options":["estas","esas","aquellas"],"a":2,"why":"Weit entfernt → aquellas."},{"q":"___ semana tengo mucho trabajo.","options":["Esta","Esa","Aquella"],"a":0,"why":"Gegenwart → esta semana."},{"q":"En ___ época no había teléfonos móviles.","options":["esta","aquella"],"a":1,"why":"Ferne Vergangenheit → aquella época."},{"q":"Pásame ___ libro que está ahí, al lado de ti.","options":["este","ese","aquel"],"a":1,"why":"Ahí, beim Hörer → ese."},{"q":"–Me han dicho que te mudas. –¿Quién te ha dicho ___?","options":["esto","eso","ese"],"a":1,"why":"Bezug auf eine gerade gemachte Aussage → neutral eso."},{"q":"___ es mi hermano Andrés.","options":["Esto","Este"],"a":1,"why":"Person bekannter Bezeichnung → angeglichenes Pronomen este."},{"q":"No bebas ___ agua, no es potable.","options":["ese","esa"],"a":1,"why":"agua ist feminin; nur der Artikel el ändert sich, das Demonstrativ nicht."},{"q":"Por ___ no te llamé: estaba enfermo.","options":["eso","ese","esa"],"a":0,"why":"por eso = deshalb, neutrale Form."}]},{"type":"gap","title":"Demonstrativa angleichen","task":"Setze die passende Form von este, ese oder aquel ein (Hinweis in Klammern).","items":[{"q":"(nah beim Sprecher) ___ fotos son de mis vacaciones.","a":["Estas"],"de":"Diese Fotos sind von meinem Urlaub."},{"q":"(beim Hörer) ¿Cuánto cuesta ___ camisa que tienes?","a":["esa"],"de":"Wie viel kostet das Hemd, das du hast?"},{"q":"(weit weg) ___ edificios del fondo son muy antiguos.","a":["Aquellos"],"de":"Die Gebäude dort hinten sind sehr alt."},{"q":"(ferne Vergangenheit) En ___ tiempos vivíamos en el campo.","a":["aquellos"],"de":"Damals lebten wir auf dem Land."},{"q":"(nah beim Sprecher, neutral) ¿Me explicas qué significa ___?","a":["esto"],"de":"Erklärst du mir, was das hier bedeutet?"},{"q":"(nah beim Sprecher) ___ año queremos viajar a Perú.","a":["Este"],"de":"Dieses Jahr wollen wir nach Peru reisen."},{"q":"(beim Hörer) ¿Son tuyos ___ libros?","a":["esos"],"de":"Sind die Bücher da deine?"},{"q":"(weit weg) ¿Conoces a ___ chica de allí?","a":["aquella"],"de":"Kennst du das Mädchen dort drüben?"}]}],"cards":[{"f":"unbetonte Possessiva (yo, tú, él)","b":"mi(s), tu(s), su(s)"},{"f":"unser / euer","b":"nuestro/-a/-os/-as, vuestro/-a/-os/-as"},{"f":"Wonach richtet sich das Possessiv?","b":"nach dem Besitz, nicht nach dem Besitzer: nuestras casas"},{"f":"su kann heißen …","b":"sein, ihr, Ihr (Sg. und Pl.)"},{"f":"sein Auto / ihr Auto (eindeutig)","b":"el coche de él / el coche de ella"},{"f":"Ist das Ihr Koffer? (eindeutig)","b":"¿Es la maleta de usted?"},{"f":"euer Haus (Lateinamerika)","b":"su casa (= de ustedes)"},{"f":"betonte Possessiva (yo, tú, él)","b":"mío/-a/-os/-as, tuyo, suyo"},{"f":"ein Freund von mir","b":"un amigo mío"},{"f":"Das gehört mir. (la llave)","b":"Es mía."},{"f":"deins (dein Auto) / unsere (unsere Kinder)","b":"el tuyo / los nuestros"},{"f":"Mein Ding ist die Musik.","b":"Lo mío es la música."},{"f":"Ich wasche mir die Hände.","b":"Me lavo las manos. (Artikel statt Possessiv)"},{"f":"Zieh deine Schuhe aus.","b":"Quítate los zapatos."},{"f":"este / ese / aquel – Entfernung","b":"nah beim Sprecher / beim Hörer / weit weg"},{"f":"este, ese, aquel – Ortsadverbien","b":"aquí / ahí / allí (allá)"},{"f":"Formen von este","b":"este, esta, estos, estas"},{"f":"Formen von aquel","b":"aquel, aquella, aquellos, aquellas"},{"f":"diese Woche / damals (in jener Zeit)","b":"esta semana / en aquella época"},{"f":"neutrale Demonstrativa","b":"esto, eso, aquello (kein Plural, nie Akzent)"},{"f":"Was ist das?","b":"¿Qué es esto? / ¿Qué es eso?"},{"f":"Das stimmt nicht. / deshalb","b":"Eso no es verdad. / por eso"},{"f":"Das ist meine Schwester.","b":"Esta es mi hermana. (angeglichen, nicht esto)"},{"f":"éste oder este als Pronomen?","b":"heute ohne Akzent (RAE 2010): este, esa, aquel"},{"f":"dieses Wasser","b":"esta agua (Demonstrativ bleibt feminin)"},{"f":"el chico ese","b":"nachgestelltes Demonstrativ = abwertend: der Typ da"}],"id":"k05"},{"nr":6,"title":"Indefinita und Verneinung","teil":"Das Substantiv und seine Begleiter","intro":"Wörter wie jemand, nichts, jeder oder kein gehören zu den häufigsten der Sprache. Im Spanischen kommt hinzu, dass sich Verneinungen verdoppeln – ein Punkt, an dem Deutschsprachige oft stolpern.","sections":[{"h":"alguien / nadie – algo / nada","html":"<p>Diese vier Wörter sind unveränderlich und stehen allein (ohne Substantiv).<\/p><table><tr><th>bejaht<\/th><th>verneint<\/th><\/tr><tr><td><em>alguien<\/em> jemand<\/td><td><em>nadie<\/em> niemand<\/td><\/tr><tr><td><em>algo<\/em> etwas<\/td><td><em>nada<\/em> nichts<\/td><\/tr><\/table><p><em>¿Ha llamado alguien?<\/em> – Hat jemand angerufen?<br><em>No he comprado nada.<\/em> – Ich habe nichts gekauft.<\/p><p>Als direktes Objekt verlangen <em>alguien<\/em> und <em>nadie<\/em> das personale <em>a<\/em>:<br><em>¿Conoces a alguien en Bilbao?<\/em> – Kennst du jemanden in Bilbao?<br><em>No veo a nadie.<\/em> – Ich sehe niemanden.<\/p><p><em>algo<\/em> und <em>nada<\/em> können auch Adjektive und Adverbien abstufen: <em>Estoy algo cansada.<\/em> – Ich bin etwas müde. <em>No es nada fácil.<\/em> – Das ist gar nicht leicht.<\/p><div class=\"tip\">Etwas Neues = <em>algo nuevo<\/em>, nichts Besonderes = <em>nada especial<\/em> – das Adjektiv steht maskulin Singular dahinter, ohne <em>de<\/em>.<\/div>"},{"h":"alguno / ninguno","html":"<p><em>alguno<\/em> (irgendein, einige) und <em>ninguno<\/em> (kein, keiner) richten sich nach dem Substantiv. Vor maskulinem Singular verkürzen sie sich zu <em>algún<\/em> / <em>ningún<\/em> (mit Akzent!).<\/p><table><tr><th><\/th><th>mask.<\/th><th>fem.<\/th><\/tr><tr><td>Sg.<\/td><td><em>algún / alguno<\/em><\/td><td><em>alguna<\/em><\/td><\/tr><tr><td>Pl.<\/td><td><em>algunos<\/em><\/td><td><em>algunas<\/em><\/td><\/tr><tr><td>Sg.<\/td><td><em>ningún / ninguno<\/em><\/td><td><em>ninguna<\/em><\/td><\/tr><\/table><p><em>¿Tienes algún plan para el sábado?<\/em> – Hast du irgendeinen Plan für Samstag?<br><em>Algunas tiendas cierran a mediodía.<\/em> – Einige Geschäfte schließen mittags.<br><em>No queda ninguna entrada.<\/em> – Es ist keine Karte mehr übrig.<br><em>De mis primos, ninguno vive aquí.<\/em> – Von meinen Cousins wohnt keiner hier.<\/p><div class=\"warn\">Achtung: <em>ninguno<\/em> steht fast nie im Plural. „Ich habe keine Probleme“ heißt <em>No tengo ningún problema<\/em> oder einfach <em>No tengo problemas<\/em>.<\/div><div class=\"tip\">Nachgestellt verstärkt <em>alguno<\/em> die Verneinung: <em>sin duda alguna<\/em> – ohne jeden Zweifel.<\/div>"},{"h":"cualquiera / cualquier","html":"<p><em>cualquiera<\/em> bedeutet „jeder beliebige, irgendein(e)“. Vor einem Substantiv (m. und f.) wird es zu <em>cualquier<\/em> verkürzt; nach dem Substantiv oder allein bleibt <em>cualquiera<\/em>.<\/p><p><em>Ven cualquier día.<\/em> – Komm an irgendeinem Tag.<br><em>Cualquier persona puede participar.<\/em> – Jede beliebige Person kann teilnehmen.<br><em>Dame un bolígrafo cualquiera.<\/em> – Gib mir irgendeinen Kuli.<br><em>Eso lo sabe cualquiera.<\/em> – Das weiß doch jeder.<\/p><p>Der seltene Plural lautet <em>cualesquiera<\/em> (gehoben).<\/p><div class=\"tip\"><em>un cualquiera / una cualquiera<\/em> ist abwertend („ein Niemand“) – lieber vermeiden.<\/div>"},{"h":"todo und cada","html":"<table><tr><th>Spanisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>todo el día<\/em><\/td><td>den ganzen Tag<\/td><\/tr><tr><td><em>toda la casa<\/em><\/td><td>das ganze Haus<\/td><\/tr><tr><td><em>todos los días<\/em><\/td><td>jeden Tag, alle Tage<\/td><\/tr><tr><td><em>todas las semanas<\/em><\/td><td>jede Woche<\/td><\/tr><tr><td><em>todo lo que<\/em><\/td><td>alles, was<\/td><\/tr><\/table><p>Bei <em>todo<\/em> + Substantiv steht der Artikel dazwischen. <em>todo<\/em> allein bedeutet „alles“: <em>Lo sé todo.<\/em> – Ich weiß alles. (Als Objekt meist mit <em>lo<\/em> davor.)<\/p><p><em>Haz todo lo que quieras.<\/em> – Mach alles, was du willst.<br><em>Todos estamos de acuerdo.<\/em> – Wir sind alle einverstanden.<\/p><p><em>cada<\/em> (jeder einzelne) ist unveränderlich und steht ohne Artikel: <em>cada alumno<\/em>, <em>cada vez<\/em>, <em>cada dos horas<\/em> (alle zwei Stunden). Allein steht <em>cada uno / cada una<\/em>: <em>Cada uno paga lo suyo.<\/em> – Jeder zahlt seins.<\/p><div class=\"warn\">Achtung: <em>todo el día<\/em> (den ganzen Tag) ≠ <em>todos los días<\/em> (jeden Tag). <em>cada<\/em> betont das Einzelne: <em>Cada día aprendo algo.<\/em> – Jeden Tag (Tag für Tag) lerne ich etwas.<\/div>"},{"h":"otro, mucho, poco und Co.","html":"<p><em>otro<\/em> (ein anderer, noch ein) steht <b>nie<\/b> mit unbestimmtem Artikel:<\/p><p><em>Quiero otro café.<\/em> – Ich möchte noch einen Kaffee.<br><em>Vamos a otra playa.<\/em> – Wir fahren an einen anderen Strand.<br><em>los otros invitados<\/em> – die anderen Gäste<br><em>otros dos días<\/em> – zwei weitere Tage (Zahl steht nach <em>otro<\/em>)<\/p><div class=\"warn\">Achtung: Nie <em>*un otro<\/em>! „ein anderes Mal“ = <em>otra vez<\/em> (auch: noch einmal).<\/div><p>Mengenwörter richten sich in Geschlecht und Zahl nach dem Substantiv:<\/p><table><tr><th>Wort<\/th><th>Beispiel<\/th><\/tr><tr><td><em>mucho<\/em> viel<\/td><td><em>muchas ideas<\/em><\/td><\/tr><tr><td><em>poco<\/em> wenig<\/td><td><em>poca paciencia<\/em><\/td><\/tr><tr><td><em>demasiado<\/em> zu viel<\/td><td><em>demasiados coches<\/em><\/td><\/tr><tr><td><em>bastante<\/em> genug, ziemlich viel<\/td><td><em>bastantes amigos<\/em><\/td><\/tr><tr><td><em>varios<\/em> mehrere<\/td><td><em>varias veces<\/em><\/td><\/tr><tr><td><em>ambos<\/em> beide<\/td><td><em>ambas manos<\/em><\/td><\/tr><\/table><p>Vor Verben, Adjektiven oder Adverbien sind sie unveränderlich: <em>Las niñas comen mucho.<\/em> <em>Es demasiado caro.<\/em> <em>Están bastante lejos.<\/em><\/p><div class=\"tip\"><em>un poco de<\/em> = ein bisschen (<em>un poco de sal<\/em>), <em>poco<\/em> allein = wenig (<em>poca sal<\/em>). <em>ambos<\/em> klingt formell, alltäglich sagt man <em>los dos / las dos<\/em>.<\/div>"},{"h":"Doppelte Verneinung","html":"<p>Steht ein Verneinungswort (<em>nada, nadie, nunca, ninguno, tampoco, ni<\/em>) <b>nach<\/b> dem Verb, muss vor dem Verb zusätzlich <em>no<\/em> stehen. Das ist keine Verstärkung, sondern Pflicht.<\/p><p><em>No ha venido nadie.<\/em> – Niemand ist gekommen.<br><em>No como nunca carne.<\/em> – Ich esse nie Fleisch.<br><em>No me gusta ninguna.<\/em> – Mir gefällt keine.<br><em>Pablo no sabe nada.<\/em> – Pablo weiß nichts.<\/p><p>Steht das Verneinungswort <b>vor<\/b> dem Verb, fällt <em>no<\/em> weg:<\/p><p><em>Nadie ha venido.<\/em> <em>Nunca como carne.<\/em> <em>Ninguna me gusta.<\/em><\/p><p>Auch mehrere Verneinungswörter können kombiniert werden: <em>Nunca le digo nada a nadie.<\/em> – Ich sage nie jemandem etwas.<\/p><div class=\"warn\">Achtung: <em>*Viene nadie<\/em> ist falsch. Entweder <em>No viene nadie<\/em> oder <em>Nadie viene<\/em>.<\/div><div class=\"tip\"><em>jamás<\/em> = nie(mals), stärker als <em>nunca<\/em>; <em>nunca jamás<\/em> = nie im Leben.<\/div>"},{"h":"también / tampoco, ni … ni","html":"<p><em>también<\/em> (auch) bestätigt eine bejahte Aussage, <em>tampoco<\/em> (auch nicht) eine verneinte:<\/p><p><em>– Me gusta el jazz. – A mí también.<\/em><br><em>– No tengo hambre. – Yo tampoco.<\/em> (Ich auch nicht.)<br><em>Tampoco lo sé.<\/em> = <em>No lo sé tampoco.<\/em> (doppelte Verneinung!)<\/p><div class=\"warn\">Achtung: „Ich auch nicht“ heißt nie <em>*yo también no<\/em>, sondern <em>yo tampoco<\/em>.<\/div><p><em>ni … ni<\/em> = weder … noch. Nach dem Verb mit <em>no<\/em>:<\/p><p><em>No bebo ni café ni té.<\/em> – Ich trinke weder Kaffee noch Tee.<br><em>Ni Ana ni Luis saben conducir.<\/em> – Weder Ana noch Luis können Auto fahren. (Verb im Plural)<\/p><p><em>ni<\/em> allein = nicht einmal: <em>No me ha dicho ni hola.<\/em> – Er hat nicht einmal Hallo gesagt. <em>ni siquiera<\/em> verstärkt das noch.<\/p>"},{"h":"ya no / todavía no","html":"<table><tr><th>Spanisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>ya<\/em><\/td><td>schon<\/td><\/tr><tr><td><em>ya no<\/em><\/td><td>nicht mehr<\/td><\/tr><tr><td><em>todavía / aún<\/em><\/td><td>noch<\/td><\/tr><tr><td><em>todavía no / aún no<\/em><\/td><td>noch nicht<\/td><\/tr><\/table><p><em>Ya no vivo en Málaga.<\/em> – Ich wohne nicht mehr in Málaga.<br><em>Todavía no he terminado.<\/em> – Ich bin noch nicht fertig.<br><em>¿Todavía trabajas allí?<\/em> – Arbeitest du noch dort?<\/p><div class=\"warn\">Achtung: „nicht mehr“ ist zeitlich <em>ya no<\/em>, nicht <em>*no más<\/em>. Mengenmäßig („kein … mehr“): <em>No quiero más pan.<\/em> – Ich will kein Brot mehr.<\/div><div class=\"tip\">In Lateinamerika bedeutet <em>no más<\/em> oft „nur“ oder dient als Aufforderung: <em>Pase no más.<\/em> – Kommen Sie ruhig herein.<\/div>"}],"exercises":[{"type":"choice","title":"alguien, algo, nadie, nada","task":"Wähle das passende Wort.","items":[{"q":"¿Hay ___ en casa? Veo luz en la ventana.","options":["algo","alguien","nada"],"a":1,"why":"Gefragt wird nach einer Person: alguien."},{"q":"No he entendido ___ de la conferencia.","options":["nada","nadie","algo"],"a":0,"why":"Sache + Verneinung: nada."},{"q":"¿Quieres ___ de beber?","options":["nada","alguien","algo"],"a":2,"why":"Bejahte Frage nach einer Sache: algo."},{"q":"En la reunión no conocía a ___.","options":["alguien","nadie","nada"],"a":1,"why":"Person + Verneinung: nadie (mit a)."},{"q":"Este pastel tiene ___ raro, ¿no?","options":["algo","alguien","nadie"],"a":0,"why":"etwas Seltsames = algo raro."},{"q":"___ me ha dicho que hoy no hay clase.","options":["Nada","Alguien","Algo"],"a":1,"why":"Jemand (Person, bejaht) hat es gesagt."},{"q":"No pasa ___, tranquila.","options":["nadie","algo","nada"],"a":2,"why":"Feste Wendung: No pasa nada (Kein Problem)."},{"q":"¿Has visto a ___ sospechoso?","options":["alguien","algo","nada"],"a":0,"why":"Personales a + Person: a alguien."}]},{"type":"gap","title":"algún, alguno, ningún, ninguno","task":"Setze die richtige Form von alguno oder ninguno ein (Hinweis in Klammern).","items":[{"q":"¿Tienes ___ libro de cocina vegetariana? (irgendein)","a":["algún"],"de":"Hast du irgendein vegetarisches Kochbuch?"},{"q":"No tengo ___ prisa. (kein)","a":["ninguna"],"de":"Ich habe keine Eile."},{"q":"___ alumnas ya han entregado el trabajo. (einige)","a":["Algunas"],"de":"Einige Schülerinnen haben die Arbeit schon abgegeben."},{"q":"No hay ___ problema. (kein)","a":["ningún"],"de":"Es gibt kein Problem."},{"q":"De todos los vestidos, no me queda bien ___. (keines)","a":["ninguno"],"de":"Von allen Kleidern steht mir keines."},{"q":"Si necesitas ___ cosa, llámame. (irgendeine)","a":["alguna"],"de":"Wenn du irgendetwas brauchst, ruf mich an."},{"q":"¿Queda alguna entrada para esta noche? – No, no queda ___. (keine)","a":["ninguna"],"de":"Gibt es noch eine Karte für heute Abend? – Nein, es ist keine mehr übrig."},{"q":"He leído ___ de sus novelas, pero no todas. (einige)","a":["algunas"],"de":"Ich habe einige seiner Romane gelesen, aber nicht alle."}]},{"type":"choice","title":"todo, cada, otro, cualquier","task":"Wähle die richtige Lösung.","items":[{"q":"Ayer llovió ___ y no salimos de casa.","options":["todos los días","todo el día","cada día"],"a":1,"why":"Den ganzen Tag (ein Tag) = todo el día."},{"q":"Voy al gimnasio ___ (jeden Montag – regelmäßig).","options":["todo el lunes","todos los lunes","todo los lunes"],"a":1,"why":"Regelmäßig jeden Montag = todos los lunes."},{"q":"¿Me traes ___ cerveza, por favor?","options":["una otra","otra","la otra una"],"a":1,"why":"otro steht ohne unbestimmten Artikel."},{"q":"Puedes llamarme a ___ hora.","options":["cualquiera","cualquier","cualesquiera"],"a":1,"why":"Vor dem Substantiv: cualquier."},{"q":"Tomo la pastilla ___ ocho horas.","options":["todas","cada","cualquier"],"a":1,"why":"alle acht Stunden = cada ocho horas."},{"q":"Te cuento ___ sé.","options":["todo que","todo lo que","todo el que"],"a":1,"why":"alles, was = todo lo que."},{"q":"No necesito un móvil caro, me vale uno ___.","options":["cualquier","cualquiera","cada"],"a":1,"why":"Nach dem Substantiv/Pronomen bleibt cualquiera."},{"q":"___ uno tiene que traer su comida.","options":["Todo","Cada","Otro"],"a":1,"why":"Jeder einzelne = cada uno."}]},{"type":"gap","title":"Mengenwörter","task":"Setze das Wort in Klammern in der richtigen Form ein (veränderlich oder nicht?).","items":[{"q":"En esta calle hay (demasiado) ___ bares.","a":["demasiados"],"de":"In dieser Straße gibt es zu viele Bars."},{"q":"Mis abuelos caminan (mucho) ___.","a":["mucho"],"de":"Meine Großeltern gehen viel spazieren."},{"q":"Tengo (poco) ___ ganas de salir hoy.","a":["pocas"],"de":"Ich habe heute wenig Lust auszugehen."},{"q":"Hemos esperado (bastante) ___ horas.","a":["bastantes"],"de":"Wir haben ziemlich viele Stunden gewartet."},{"q":"La sopa está (demasiado) ___ salada.","a":["demasiado"],"de":"Die Suppe ist zu salzig."},{"q":"Lo he intentado (varios) ___ veces.","a":["varias"],"de":"Ich habe es mehrmals versucht."},{"q":"(ambos) ___ hermanas estudian Medicina.","a":["Ambas"],"de":"Beide Schwestern studieren Medizin."},{"q":"Esa chica es (mucho) ___ más alta que yo.","a":["mucho"],"de":"Das Mädchen ist viel größer als ich."}]},{"type":"choice","title":"Doppelte Verneinung","task":"Welcher Satz ist korrekt?","items":[{"q":"Niemand hat angerufen.","options":["Ha llamado nadie.","No ha llamado nadie.","Nadie no ha llamado."],"a":1,"why":"nadie nach dem Verb → no davor."},{"q":"Ich gehe nie ins Kino.","options":["Nunca voy al cine.","Nunca no voy al cine.","Voy nunca al cine."],"a":0,"why":"nunca vor dem Verb → kein no."},{"q":"Er hat mir nichts gesagt.","options":["Me ha dicho nada.","No me ha dicho nada.","No me ha dicho algo."],"a":1,"why":"no … nada."},{"q":"– No me gusta el fútbol. – Mir auch nicht.","options":["A mí también.","A mí tampoco.","A mí no también."],"a":1,"why":"Verneinte Aussage bestätigen: tampoco."},{"q":"Weder Marta noch Juan sind gekommen.","options":["Ni Marta ni Juan han venido.","No Marta ni Juan han venido.","Ni Marta ni Juan ha no venido."],"a":0,"why":"ni … ni vor dem Verb, Verb im Plural."},{"q":"Ich habe keine Ahnung.","options":["Tengo ninguna idea.","No tengo ninguna idea.","No tengo ningunas ideas."],"a":1,"why":"no + Verb + ninguna (Singular)."},{"q":"Ich sage niemandem nie etwas. (= Ich sage nie jemandem etwas.)","options":["Nunca digo algo a alguien.","Nunca le digo nada a nadie.","No nunca digo nada a nadie."],"a":1,"why":"Alle Indefinita werden verneint: nunca … nada … nadie."},{"q":"Er hat nicht einmal danke gesagt.","options":["No ha dicho ni gracias.","Ha dicho ni gracias no.","No ha dicho tampoco gracias."],"a":0,"why":"ni = nicht einmal, mit no vor dem Verb."}]},{"type":"gap","title":"ya no, todavía no, también, tampoco","task":"Ergänze das passende Wort/die passende Wendung.","items":[{"q":"Antes fumaba, pero ___ fumo. (nicht mehr)","a":["ya no"],"de":"Früher habe ich geraucht, aber jetzt rauche ich nicht mehr."},{"q":"Son las diez y el autobús ___ ha llegado. (noch nicht)","a":["todavía no","aún no"],"de":"Es ist zehn Uhr und der Bus ist noch nicht gekommen."},{"q":"– Yo hablo francés. – Mi hermana ___. (auch)","a":["también"],"de":"– Ich spreche Französisch. – Meine Schwester auch."},{"q":"– No he visto esa serie. – Nosotros ___. (auch nicht)","a":["tampoco"],"de":"– Ich habe diese Serie nicht gesehen. – Wir auch nicht."},{"q":"¿___ vives con tus padres? (noch)","a":["Todavía","Aún"],"de":"Wohnst du noch bei deinen Eltern?"},{"q":"Lucía ___ trabaja en el banco; ahora es profesora. (nicht mehr)","a":["ya no"],"de":"Lucía arbeitet nicht mehr in der Bank; jetzt ist sie Lehrerin."},{"q":"No sé nadar y ___ sé montar en bici. (auch nicht)","a":["tampoco"],"de":"Ich kann nicht schwimmen und auch nicht Rad fahren."},{"q":"No quiero ___ postre, gracias. (kein … mehr)","a":["más"],"de":"Ich möchte keinen Nachtisch mehr, danke."}]}],"cards":[{"f":"jemand / niemand","b":"alguien / nadie"},{"f":"etwas / nichts","b":"algo / nada"},{"f":"Kennst du jemanden hier?","b":"¿Conoces a alguien aquí? (personales a)"},{"f":"etwas Neues","b":"algo nuevo (ohne de)"},{"f":"alguno vor mask. Sg.","b":"algún (algún día) – ebenso ningún"},{"f":"Ich habe kein Problem.","b":"No tengo ningún problema. (ninguno nur Sg.)"},{"f":"ohne jeden Zweifel","b":"sin duda alguna"},{"f":"cualquiera vor Substantiv","b":"cualquier (cualquier día, cualquier persona)"},{"f":"Das weiß jeder.","b":"Eso lo sabe cualquiera."},{"f":"den ganzen Tag ↔ jeden Tag","b":"todo el día ↔ todos los días"},{"f":"alles, was","b":"todo lo que"},{"f":"alle zwei Stunden","b":"cada dos horas"},{"f":"jeder (einzelne, Pronomen)","b":"cada uno / cada una"},{"f":"noch ein Kaffee","b":"otro café (nie *un otro)"},{"f":"zwei weitere Tage","b":"otros dos días"},{"f":"zu viele Autos / zu teuer","b":"demasiados coches / demasiado caro"},{"f":"mehrere Male","b":"varias veces"},{"f":"beide Hände","b":"ambas manos / las dos manos"},{"f":"ein bisschen Salz ↔ wenig Salz","b":"un poco de sal ↔ poca sal"},{"f":"Regel: doppelte Verneinung","b":"Verneinungswort nach dem Verb → no davor: No viene nadie."},{"f":"Regel: Verneinungswort vorn","b":"kein no: Nadie viene. Nunca llueve."},{"f":"Ich auch. / Ich auch nicht.","b":"Yo también. / Yo tampoco."},{"f":"weder … noch","b":"ni … ni (No bebo ni vino ni cerveza.)"},{"f":"nicht einmal","b":"ni / ni siquiera"},{"f":"nicht mehr (zeitlich)","b":"ya no"},{"f":"noch nicht","b":"todavía no / aún no"},{"f":"nie im Leben","b":"nunca jamás"},{"f":"Kein Problem! / Macht nichts!","b":"¡No pasa nada!"}],"id":"k06"},{"nr":7,"title":"Die Relativpronomen","teil":"Das Substantiv und seine Begleiter","intro":"Relativpronomen verbinden Sätze und machen deine Sprache flüssiger. Das Spanische hat dafür mehrere Formen – die Wahl hängt von Präposition, Bezugswort und Stil ab.","sections":[{"h":"que – das Allzweck-Relativpronomen","html":"<p><em>que<\/em> ist unveränderlich und bezieht sich auf Personen und Sachen, als Subjekt oder direktes Objekt. Es ist mit Abstand die häufigste Form.<\/p><p><em>El tren que sale a las nueve va a Burgos.<\/em> – Der Zug, der um neun abfährt, fährt nach Burgos. (Subjekt)<br><em>La chaqueta que me compré ya está rota.<\/em> – Die Jacke, die ich mir gekauft habe, ist schon kaputt. (Objekt)<br><em>El médico que me atendió era muy amable.<\/em> – Der Arzt, der mich behandelt hat, war sehr nett.<\/p><p>Bei Personen als direktes Objekt genügt <em>que<\/em> ohne <em>a<\/em>: <em>la vecina que conocimos ayer<\/em> – die Nachbarin, die wir gestern kennengelernt haben.<\/p><div class=\"warn\">Achtung: Das Relativpronomen darf im Spanischen nie wegfallen (anders als im Englischen). Und es steht <b>ohne Akzent<\/b>: <em>que<\/em>, nicht <em>qué<\/em>.<\/div><div class=\"tip\">Kein Komma vor <em>que<\/em> = einschränkender Relativsatz (welcher genau?). Mit Kommas = Zusatzinformation: <em>Mi hermano, que vive en Cádiz, viene mañana.<\/em><\/div>"},{"h":"el que, la que, los que, las que","html":"<p><b>1. Nach Präpositionen<\/b> verwendet man meist Artikel + <em>que<\/em>. Der Artikel richtet sich nach dem Bezugswort:<\/p><p><em>la empresa para la que trabajo<\/em> – die Firma, für die ich arbeite<br><em>el amigo con el que viajé<\/em> – der Freund, mit dem ich gereist bin<br><em>los temas de los que hablamos<\/em> – die Themen, über die wir gesprochen haben<br><em>la chica a la que escribí<\/em> – das Mädchen, dem ich geschrieben habe<\/p><p>Nach kurzen Präpositionen (<em>en, con, de, a<\/em>) geht bei Sachen auch <em>que<\/em> allein: <em>la casa en que nací<\/em> = <em>la casa en la que nací<\/em>.<\/p><p><b>2. Ohne Bezugswort<\/b> bedeutet es „derjenige, der / diejenige, die / die(jenigen), die“:<\/p><p><em>El que termine primero puede irse.<\/em> – Wer zuerst fertig ist, darf gehen.<br><em>Las que quieran participar, que levanten la mano.<\/em> – Diejenigen, die mitmachen wollen, sollen die Hand heben.<br><em>Esta camisa no me gusta; prefiero la que llevabas ayer.<\/em> – Dieses Hemd gefällt mir nicht; mir ist das lieber, das du gestern anhattest.<\/p><div class=\"warn\">Achtung: Die Präposition steht immer <b>vor<\/b> dem Relativpronomen, nie am Satzende: <em>la persona con la que hablé<\/em>, nicht <em>*la persona que hablé con<\/em>.<\/div>"},{"h":"quien / quienes","html":"<p><em>quien<\/em> (Sg.) und <em>quienes<\/em> (Pl.) beziehen sich <b>nur auf Personen<\/b>. Sie stehen vor allem:<\/p><p><b>nach Präpositionen<\/b> (gleichwertig mit <em>el que<\/em>):<br><em>la profesora con quien hablé<\/em> = <em>con la que hablé<\/em><br><em>los clientes a quienes enviamos la oferta<\/em> – die Kunden, denen wir das Angebot geschickt haben<\/p><p><b>in nicht einschränkenden Relativsätzen<\/b> (zwischen Kommas):<br><em>Mi abuela, quien nunca había volado, estaba nerviosa.<\/em> – Meine Großmutter, die nie geflogen war, war nervös.<\/p><p><b>ohne Bezugswort<\/b> im Sinne von „wer“ – typisch für Sprichwörter:<br><em>Quien ríe el último ríe mejor.<\/em> – Wer zuletzt lacht, lacht am besten.<br><em>Quien quiera ayudar, que me avise.<\/em> – Wer helfen will, soll mir Bescheid geben.<\/p><div class=\"warn\">Achtung: In einem einschränkenden Relativsatz ohne Präposition steht nicht <em>quien<\/em>, sondern <em>que<\/em>: <em>El chico que vino ayer<\/em>, nicht <em>*El chico quien vino ayer<\/em>.<\/div>"},{"h":"el cual, la cual, los cuales, las cuales","html":"<p><em>el cual<\/em> usw. ist die <b>formelle<\/b>, schriftsprachliche Variante von <em>el que<\/em>. Es steht vor allem nach Präpositionen (besonders nach längeren wie <em>durante, mediante, a pesar de, gracias a<\/em>) und in Einschüben.<\/p><p><em>Es la razón por la cual dimití.<\/em> – Das ist der Grund, aus dem ich zurückgetreten bin.<br><em>El contrato, según el cual la empresa debe pagar los gastos, se firmó en mayo.<\/em> – Der Vertrag, laut dem die Firma die Kosten tragen muss, wurde im Mai unterzeichnet.<\/p><p>Es hilft auch, Bezüge eindeutig zu machen: <em>la hermana de Pedro, la cual vive en Roma<\/em> – eindeutig die Schwester.<\/p><div class=\"warn\">Achtung: <em>el cual<\/em> steht nie direkt nach dem Bezugswort in einem einschränkenden Satz: <em>*El libro el cual leo<\/em> ist falsch → <em>El libro que leo<\/em>.<\/div>"},{"h":"lo que / lo cual","html":"<p><em>lo que<\/em> und <em>lo cual<\/em> beziehen sich auf einen <b>ganzen Satz<\/b> oder Sachverhalt (deutsch: „was“):<\/p><p><em>Ha aprobado todos los exámenes, lo que (lo cual) nos alegra mucho.<\/em> – Er hat alle Prüfungen bestanden, was uns sehr freut.<br><em>No me llamó, lo cual me pareció raro.<\/em> – Er rief mich nicht an, was ich seltsam fand.<\/p><p>Nur <em>lo que<\/em> (nicht <em>lo cual<\/em>) bedeutet außerdem „das, was“ ohne vorhergehenden Satz:<\/p><p><em>Lo que necesito es dormir.<\/em> – Was ich brauche, ist Schlaf.<br><em>No entiendo lo que dices.<\/em> – Ich verstehe nicht, was du sagst.<br><em>todo lo que tengo<\/em> – alles, was ich habe<\/p><div class=\"warn\">Achtung: „Alles, was …“ heißt <em>todo lo que<\/em>, nicht <em>*todo que<\/em> – und „was“ als Relativ nie <em>*qué<\/em>.<\/div>"},{"h":"cuyo, cuya, cuyos, cuyas","html":"<p><em>cuyo<\/em> entspricht „dessen / deren“. Es richtet sich in Geschlecht und Zahl <b>nach dem Besessenen<\/b> (dem folgenden Substantiv), nicht nach dem Besitzer:<\/p><table><tr><th>Spanisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>el autor cuya novela leí<\/em><\/td><td>der Autor, dessen Roman ich las<\/td><\/tr><tr><td><em>la señora cuyo perro ladra<\/em><\/td><td>die Frau, deren Hund bellt<\/td><\/tr><tr><td><em>el pueblo cuyas calles son estrechas<\/em><\/td><td>das Dorf, dessen Straßen eng sind<\/td><\/tr><tr><td><em>los vecinos cuyos hijos juegan aquí<\/em><\/td><td>die Nachbarn, deren Kinder hier spielen<\/td><\/tr><\/table><p>Mit Präposition: <em>la amiga en cuya casa dormí<\/em> – die Freundin, in deren Haus ich geschlafen habe.<\/p><div class=\"warn\">Achtung: Nach <em>cuyo<\/em> steht kein Artikel (<em>*cuyo el perro<\/em>). <em>cuyo<\/em> ist schriftsprachlich; im Alltag umgeht man es oft: <em>la señora que tiene un perro que ladra<\/em>. Die Form <em>*que su perro<\/em> gilt als fehlerhaft.<\/div>"},{"h":"donde, adonde, cuando, como","html":"<p><b><em>donde<\/em><\/b> (wo) bezieht sich auf Orte und ersetzt <em>en el que<\/em>:<br><em>el bar donde nos conocimos<\/em> = <em>el bar en el que nos conocimos<\/em><br><em>la ciudad de donde vengo<\/em> – die Stadt, aus der ich komme<\/p><p><b><em>adonde<\/em><\/b> (wohin) bei Bewegung mit Bezugswort: <em>el pueblo adonde vamos cada verano<\/em>. Ohne Bezugswort schreibt man getrennt: <em>Vamos a donde tú quieras.<\/em><\/p><p><b><em>cuando<\/em><\/b> (als, wo) bezieht sich auf Zeiten, vor allem in Einschüben und Hervorhebungen:<br><em>En 2010, cuando vivía en Lima, aprendí a surfear.<\/em><br><em>Fue en verano cuando la conocí.<\/em> – Im Sommer habe ich sie kennengelernt.<br>Nach einem Zeitbegriff ist <em>en que<\/em> üblicher: <em>el día en que nació mi hija<\/em>.<\/p><p><b><em>como<\/em><\/b> (wie) bezieht sich auf die Art und Weise:<br><em>Me gusta la manera como explica.<\/em> = <em>la manera en que explica<\/em><br><em>Así es como se hace.<\/em> – So macht man das.<\/p><div class=\"tip\">Als Relativwörter stehen <em>donde, adonde, cuando, como<\/em> <b>ohne Akzent<\/b> – den Akzent bekommen sie nur in (auch indirekten) Fragen und Ausrufen.<\/div>"},{"h":"Deutsche Relativsätze wiedergeben","html":"<p>Der deutsche Kasus des Relativpronomens zeigt, welche Form man braucht:<\/p><table><tr><th>Deutsch<\/th><th>Spanisch<\/th><\/tr><tr><td>der / die / das (Nom.)<\/td><td><em>que<\/em><\/td><\/tr><tr><td>den / die / das (Akk.)<\/td><td><em>que<\/em> (Person auch <em>a quien / al que<\/em>)<\/td><\/tr><tr><td>dem / der / denen (Dat.)<\/td><td><em>al que / a la que / a quien(es)<\/em><\/td><\/tr><tr><td>dessen / deren (Gen.)<\/td><td><em>cuyo / cuya / cuyos / cuyas<\/em><\/td><\/tr><tr><td>Präp. + dem/den …<\/td><td>Präp. + <em>el que / quien / el cual<\/em><\/td><\/tr><tr><td>was<\/td><td><em>lo que / lo cual<\/em><\/td><\/tr><tr><td>wo / worin<\/td><td><em>donde / en el que<\/em><\/td><\/tr><\/table><p><em>El hombre al que le vendí el piso es arquitecto.<\/em> – Der Mann, dem ich die Wohnung verkauft habe, ist Architekt.<br><em>La ciudad en la que vivo es pequeña.<\/em> – Die Stadt, in der ich lebe, ist klein.<br><em>Es algo con lo que no contaba.<\/em> – Das ist etwas, womit ich nicht gerechnet habe.<\/p><div class=\"tip\">Deutsche „wo“-Verbindungen (womit, worüber, wofür) → Präposition + <em>lo que<\/em>: <em>de lo que hablamos<\/em> – worüber wir sprechen.<\/div>"}],"exercises":[{"type":"gap","title":"que oder lo que?","task":"Setze que oder lo que ein.","items":[{"q":"La película ___ vimos anoche era muy larga.","a":["que"],"de":"Der Film, den wir gestern Abend gesehen haben, war sehr lang."},{"q":"No entiendo ___ quieres decir.","a":["lo que"],"de":"Ich verstehe nicht, was du sagen willst."},{"q":"El camarero ___ nos atendió era muy simpático.","a":["que"],"de":"Der Kellner, der uns bedient hat, war sehr nett."},{"q":"___ más me gusta de Asturias es la comida.","a":["Lo que"],"de":"Was mir an Asturien am meisten gefällt, ist das Essen."},{"q":"Perdí el autobús, ___ me hizo llegar tarde.","a":["lo que"],"de":"Ich habe den Bus verpasst, wodurch ich zu spät kam."},{"q":"Los zapatos ___ compré me hacen daño.","a":["que"],"de":"Die Schuhe, die ich gekauft habe, drücken."},{"q":"Haz todo ___ te diga el médico.","a":["lo que"],"de":"Tu alles, was der Arzt dir sagt."},{"q":"Tengo una amiga ___ habla seis idiomas.","a":["que"],"de":"Ich habe eine Freundin, die sechs Sprachen spricht."}]},{"type":"gap","title":"Präposition + el que / la que …","task":"Ergänze den passenden Artikel (el, la, los, las) vor que.","items":[{"q":"La empresa para ___ que trabajo está en Zaragoza.","a":["la"],"de":"Die Firma, für die ich arbeite, ist in Saragossa."},{"q":"Ese es el sofá en ___ que duerme el gato.","a":["el"],"de":"Das ist das Sofa, auf dem die Katze schläft."},{"q":"Los amigos con ___ que salgo son del barrio.","a":["los"],"de":"Die Freunde, mit denen ich ausgehe, sind aus dem Viertel."},{"q":"Las razones por ___ que se fue no están claras.","a":["las"],"de":"Die Gründe, aus denen er gegangen ist, sind nicht klar."},{"q":"Las montañas desde ___ que vimos el amanecer eran altísimas.","a":["las"],"de":"Die Berge, von denen aus wir den Sonnenaufgang sahen, waren sehr hoch."},{"q":"La llave con ___ que abres la puerta está rota.","a":["la"],"de":"Der Schlüssel, mit dem du die Tür aufschließt, ist kaputt."},{"q":"No conozco a los niños a ___ que les das clase.","a":["los"],"de":"Ich kenne die Kinder nicht, denen du Unterricht gibst."},{"q":"___ que llegue tarde no podrá entrar. (wer = derjenige, der)","a":["El"],"de":"Wer zu spät kommt, kann nicht hinein."}]},{"type":"choice","title":"que, quien oder el cual?","task":"Wähle die korrekte Form.","items":[{"q":"La mujer ___ vive enfrente es pianista.","options":["que","quien","la cual"],"a":0,"why":"Einschränkender Satz ohne Präposition: que."},{"q":"El compañero con ___ comparto despacho está de baja.","options":["que","quien","cual"],"a":1,"why":"Person nach Präposition: quien (oder el que)."},{"q":"___ mucho duerme, poco aprende.","options":["Que","Quien","Cual"],"a":1,"why":"Ohne Bezugswort im Sinne von „wer“: quien."},{"q":"Esta es la ley según ___ todos deben votar.","options":["que","la cual","quien"],"a":1,"why":"Nach según (formell, Sache): la cual."},{"q":"Mi tío, ___ es piloto, vive en Miami.","options":["quien","cual","cuyo"],"a":0,"why":"Nicht einschränkender Satz mit Person: quien (oder que)."},{"q":"Los vecinos a ___ invitamos no vinieron.","options":["que","quienes","quien"],"a":1,"why":"Plural von Personen nach a: quienes."},{"q":"Es un tema sobre ___ se ha escrito mucho.","options":["quien","el cual","cual"],"a":1,"why":"Sache nach Präposition: el cual (oder el que); quien nur für Personen."},{"q":"El paciente ___ operaron ayer ya se encuentra bien.","options":["que","quien","el cual"],"a":0,"why":"Direktes Objekt in einschränkendem Satz: que (oder al que)."}]},{"type":"gap","title":"cuyo, cuya, cuyos, cuyas","task":"Setze die richtige Form von cuyo ein.","items":[{"q":"Es el escritor ___ libros se venden en todo el mundo.","a":["cuyos"],"de":"Das ist der Schriftsteller, dessen Bücher auf der ganzen Welt verkauft werden."},{"q":"La niña ___ padre es bombero se llama Alba.","a":["cuyo"],"de":"Das Mädchen, dessen Vater Feuerwehrmann ist, heißt Alba."},{"q":"Visitamos un castillo ___ torres son del siglo XII.","a":["cuyas"],"de":"Wir besichtigten eine Burg, deren Türme aus dem 12. Jahrhundert stammen."},{"q":"Es un señor ___ casa está llena de gatos.","a":["cuya"],"de":"Das ist ein Herr, dessen Haus voller Katzen ist."},{"q":"Las empresas ___ beneficios aumentan contratan más.","a":["cuyos"],"de":"Die Firmen, deren Gewinne steigen, stellen mehr ein."},{"q":"El alumno ___ nota fue la mejor recibió un premio.","a":["cuya"],"de":"Der Schüler, dessen Note die beste war, bekam einen Preis."},{"q":"Mis amigos, en ___ piso me alojé, viven en Gràcia.","a":["cuyo"],"de":"Meine Freunde, in deren Wohnung ich übernachtet habe, wohnen in Gràcia."},{"q":"Es una ciudad ___ habitantes son muy hospitalarios.","a":["cuyos"],"de":"Das ist eine Stadt, deren Einwohner sehr gastfreundlich sind."}]},{"type":"choice","title":"donde, adonde, cuando, como, lo cual","task":"Wähle das passende Relativwort.","items":[{"q":"Este es el restaurante ___ celebramos la boda.","options":["donde","adonde","cuando"],"a":0,"why":"Ort ohne Bewegung: donde (= en el que)."},{"q":"La playa ___ vamos cada agosto está en Huelva.","options":["donde","adonde","cuyo"],"a":1,"why":"Bewegung zu einem Ort mit Bezugswort: adonde."},{"q":"Fue en enero ___ empezó a nevar.","options":["donde","cuando","como"],"a":1,"why":"Hervorhebung einer Zeit: cuando."},{"q":"No me gusta la forma ___ te habla.","options":["como","cuando","donde"],"a":0,"why":"Art und Weise: como (= en que)."},{"q":"Llovió todo el fin de semana, ___ arruinó la excursión.","options":["el cual","lo cual","la cual"],"a":1,"why":"Bezug auf den ganzen Satz: lo cual."},{"q":"Recuerdo el día ___ nos mudamos.","options":["en que","donde","adonde"],"a":0,"why":"Nach einem Zeitbegriff: en que."},{"q":"Es el pueblo de ___ es mi madre.","options":["donde","dónde","cuyo"],"a":0,"why":"Relativ ohne Akzent: de donde."},{"q":"Así es ___ se prepara una buena paella.","options":["como","cómo","cual"],"a":0,"why":"Hervorhebung der Art und Weise: como, ohne Akzent."}]},{"type":"choice","title":"Deutsch → Spanisch","task":"Wähle die richtige Übersetzung.","items":[{"q":"Die Kollegin, der ich das Paket gegeben habe …","options":["La compañera que di el paquete …","La compañera a la que le di el paquete …","La compañera cuya di el paquete …"],"a":1,"why":"Dativ (wem?) → a la que (+ verdoppelndes le)."},{"q":"Der Nachbar, dessen Auto in der Garage steht …","options":["El vecino cuyo coche está en el garaje …","El vecino que su coche está en el garaje …","El vecino cuyo el coche está en el garaje …"],"a":0,"why":"dessen → cuyo, ohne Artikel, angeglichen an coche."},{"q":"Das Projekt, an dem ich arbeite …","options":["El proyecto que trabajo en …","El proyecto en el que trabajo …","El proyecto donde trabajo en …"],"a":1,"why":"Präposition vor dem Relativpronomen: en el que."},{"q":"Das ist etwas, worüber wir nie sprechen.","options":["Es algo del que nunca hablamos.","Es algo de lo que nunca hablamos.","Es algo que nunca hablamos de."],"a":1,"why":"Bezug auf algo/Sachverhalt: de lo que."},{"q":"Die Leute, mit denen ich reise …","options":["La gente con la que viajo …","La gente con quien viajo de …","La gente que viajo con …"],"a":0,"why":"gente ist feminin Singular → con la que."},{"q":"Wer sucht, der findet.","options":["Que busca, encuentra.","Quien busca, encuentra.","Cual busca, encuentra."],"a":1,"why":"Verallgemeinerndes „wer“: quien."},{"q":"Die Ärztin, deren Patienten sehr zufrieden sind …","options":["La médica cuyo pacientes …","La médica cuyos pacientes …","La médica cuya pacientes …"],"a":1,"why":"Angleichung an pacientes (m. Pl.): cuyos."},{"q":"Das Haus, in dem ich geboren bin …","options":["La casa donde nací …","La casa dónde nací …","La casa que nací …"],"a":0,"why":"Ort: donde (oder en la que), ohne Akzent."}]}],"cards":[{"f":"häufigstes Relativpronomen","b":"que (Personen und Sachen, Subjekt und Objekt)"},{"f":"Relativpronomen weglassen?","b":"Nie! (anders als im Englischen)"},{"f":"nach Präposition","b":"Präp. + el que / la que / los que / las que"},{"f":"die Firma, für die ich arbeite","b":"la empresa para la que trabajo"},{"f":"der Freund, mit dem ich reise","b":"el amigo con el que (con quien) viajo"},{"f":"el que ohne Bezugswort","b":"derjenige, der / wer: El que quiera, que venga."},{"f":"quien / quienes","b":"nur Personen; nach Präposition, in Einschüben, als „wer“"},{"f":"*El chico quien vino","b":"falsch → El chico que vino"},{"f":"Wer zuletzt lacht, lacht am besten.","b":"Quien ríe el último ríe mejor."},{"f":"el cual – Register?","b":"formell, schriftlich; v. a. nach (längeren) Präpositionen"},{"f":"der Grund, aus dem …","b":"la razón por la cual / por la que"},{"f":"Bezug auf ganzen Satz","b":"lo que / lo cual: …, lo cual me sorprendió."},{"f":"Was ich brauche, ist …","b":"Lo que necesito es … (nicht lo cual)"},{"f":"alles, was","b":"todo lo que"},{"f":"cuyo – Angleichung?","b":"an das Besessene: el autor cuya novela"},{"f":"die Frau, deren Kinder …","b":"la mujer cuyos hijos …"},{"f":"der Ort, wo …","b":"el lugar donde / en el que …"},{"f":"der Ort, wohin …","b":"el lugar adonde / al que …"},{"f":"der Tag, an dem …","b":"el día en que …"},{"f":"So macht man das.","b":"Así es como se hace."},{"f":"Relativ: Akzent?","b":"nein: que, donde, cuando, como (Akzent nur in Fragen/Ausrufen)"},{"f":"dem / der (Dativ) → ?","b":"al que / a la que / a quien (+ oft le)"},{"f":"worüber / womit …","b":"de lo que / con lo que"},{"f":"Präposition am Satzende?","b":"Nie: la chica con la que hablé (nicht *que hablé con)"}],"id":"k08"},{"nr":8,"title":"Fragewörter und Ausrufe","teil":"Das Substantiv und seine Begleiter","intro":"Fragewörter tragen im Spanischen immer einen Akzent – in direkten wie in indirekten Fragen und in Ausrufen. Daneben musst du qué und cuál sowie die vier Formen von porque sicher unterscheiden.","sections":[{"h":"Überblick und Grundregeln","html":"<table><tr><th>Fragewort<\/th><th>Deutsch<\/th><\/tr><tr><td><em>¿qué?<\/em><\/td><td>was? welche(r/s)?<\/td><\/tr><tr><td><em>¿quién? / ¿quiénes?<\/em><\/td><td>wer?<\/td><\/tr><tr><td><em>¿cuál? / ¿cuáles?<\/em><\/td><td>welche(r/s)?<\/td><\/tr><tr><td><em>¿cuánto/a/os/as?<\/em><\/td><td>wie viel(e)?<\/td><\/tr><tr><td><em>¿dónde? ¿adónde? ¿de dónde?<\/em><\/td><td>wo? wohin? woher?<\/td><\/tr><tr><td><em>¿cuándo?<\/em><\/td><td>wann?<\/td><\/tr><tr><td><em>¿cómo?<\/em><\/td><td>wie?<\/td><\/tr><tr><td><em>¿por qué? ¿para qué?<\/em><\/td><td>warum? wozu?<\/td><\/tr><\/table><p>Fragewörter haben <b>immer einen Akzent<\/b>. Eine Präposition steht <b>vor<\/b> dem Fragewort, nie am Ende:<\/p><p><em>¿Con quién hablas?<\/em> – Mit wem sprichst du?<br><em>¿De qué trata el libro?<\/em> – Wovon handelt das Buch?<br><em>¿Desde cuándo vives aquí?<\/em> – Seit wann wohnst du hier?<br><em>¿Para cuándo lo necesitas?<\/em> – Bis wann brauchst du es?<\/p><div class=\"tip\">Das Subjekt steht in Fragen meist nach dem Verb: <em>¿Dónde trabaja tu hermana?<\/em> – Wo arbeitet deine Schwester?<\/div>"},{"h":"qué, quién, cuánto","html":"<p><b><em>qué<\/em><\/b> ist unveränderlich. Allein fragt es nach Sachen (was?), vor einem Substantiv bedeutet es „welche(r/s)“ oder „was für ein“:<\/p><p><em>¿Qué haces esta noche?<\/em> – Was machst du heute Abend?<br><em>¿Qué libro estás leyendo?<\/em> – Welches Buch liest du gerade?<br><em>¿Qué tipo de música te gusta?<\/em> – Was für Musik magst du?<\/p><p><b><em>quién / quiénes<\/em><\/b> fragt nach Personen und richtet sich in der Zahl nach der erwarteten Antwort:<\/p><p><em>¿Quién ha ganado?<\/em> – Wer hat gewonnen?<br><em>¿Quiénes vienen a la cena?<\/em> – Wer (alles) kommt zum Essen?<br><em>¿A quién has invitado?<\/em> – Wen hast du eingeladen?<br><em>¿De quién es este paraguas?<\/em> – Wem gehört dieser Schirm?<\/p><p><b><em>cuánto<\/em><\/b> richtet sich vor einem Substantiv nach diesem; vor einem Verb bleibt es unverändert:<\/p><p><em>¿Cuánta leche queda?<\/em> – Wie viel Milch ist noch da?<br><em>¿Cuántos años tienes?<\/em> – Wie alt bist du?<br><em>¿Cuántas veces has estado en Roma?<\/em><br><em>¿Cuánto cuesta?<\/em> – Wie viel kostet es?<\/p><div class=\"warn\">Achtung: „Wem gehört …?“ = <em>¿De quién es …?<\/em>, nicht <em>*¿A quién es …?<\/em>. „Wie alt?“ = <em>¿Cuántos años …?<\/em>, nicht <em>*¿Cómo viejo …?<\/em><\/div>"},{"h":"qué oder cuál?","html":"<p>Beide können „welche(r/s)“ bedeuten. Die Faustregeln (europäisches Spanisch):<\/p><p><b>Vor einem Substantiv → <em>qué<\/em>:<\/b> <em>¿Qué color prefieres?<\/em> – Welche Farbe magst du lieber?<\/p><p><b>Mit <em>ser<\/em> + Substantiv, wenn man eine bestimmte Angabe aus mehreren möglichen erfragt → <em>cuál<\/em>:<\/b><br><em>¿Cuál es tu dirección?<\/em> – Wie lautet deine Adresse?<br><em>¿Cuál es la capital de Perú?<\/em> – Was ist die Hauptstadt von Peru?<br><em>¿Cuál es tu número de teléfono?<\/em><\/p><p><b>Mit <em>ser<\/em>, wenn man eine Definition oder Erklärung will → <em>qué<\/em>:<\/b><br><em>¿Qué es un ornitorrinco?<\/em> – Was ist ein Schnabeltier?<\/p><p><b>Auswahl aus einer bekannten Gruppe, ohne Substantiv → <em>cuál / cuáles<\/em>:<\/b><br><em>Tengo dos chaquetas. ¿Cuál te gusta más?<\/em><br><em>¿Cuáles de estos zapatos son tuyos?<\/em><\/p><div class=\"warn\">Achtung: „Wie ist dein Name / deine Adresse?“ heißt nicht <em>*¿Qué es tu dirección?<\/em>, sondern <em>¿Cuál es tu dirección?<\/em> – bzw. <em>¿Cómo te llamas?<\/em><\/div><div class=\"tip\">In Lateinamerika hört man auch <em>cuál<\/em> + Substantiv: <em>¿Cuál libro quieres?<\/em> – in Spanien sagt man <em>¿Qué libro quieres?<\/em><\/div>"},{"h":"dónde, adónde, de dónde – cuándo, cómo","html":"<p><em>¿Dónde está la farmacia?<\/em> – Wo ist die Apotheke?<br><em>¿Adónde vais en verano?<\/em> – Wohin fahrt ihr im Sommer? (auch: <em>¿A dónde?<\/em>)<br><em>¿De dónde eres?<\/em> – Woher kommst du?<br><em>¿Por dónde se va al puerto?<\/em> – Wie (auf welchem Weg) kommt man zum Hafen?<\/p><p><em>¿Cuándo empieza el curso?<\/em> – Wann beginnt der Kurs?<br><em>¿Hasta cuándo te quedas?<\/em> – Bis wann bleibst du?<\/p><p><em>cómo<\/em> fragt nach Art und Weise, Zustand oder Beschaffenheit:<\/p><p><em>¿Cómo vas al trabajo?<\/em> – Wie fährst du zur Arbeit?<br><em>¿Cómo estás?<\/em> – Wie geht es dir? (Befinden)<br><em>¿Cómo es tu novio?<\/em> – Wie ist dein Freund? (Charakter, Aussehen)<br><em>¿Cómo?<\/em> – Wie bitte?<\/p><div class=\"warn\">Achtung: Bei Bewegungsverben wie <em>ir<\/em> fragt man <em>¿adónde?<\/em> und nicht <em>*¿dónde vas?<\/em> – auch wenn man es umgangssprachlich hört. <em>¿Cómo es?<\/em> und <em>¿Cómo está?<\/em> nicht verwechseln!<\/div>"},{"h":"por qué, porque, el porqué, por que","html":"<table><tr><th>Form<\/th><th>Funktion<\/th><th>Deutsch<\/th><\/tr><tr><td><em>por qué<\/em><\/td><td>Fragewort<\/td><td>warum<\/td><\/tr><tr><td><em>porque<\/em><\/td><td>Konjunktion<\/td><td>weil<\/td><\/tr><tr><td><em>el porqué<\/em><\/td><td>Substantiv<\/td><td>der Grund<\/td><\/tr><tr><td><em>por que<\/em><\/td><td>Präp. + Relativ<\/td><td>aus dem / für den<\/td><\/tr><\/table><p><em>– ¿Por qué no comes? – Porque no tengo hambre.<\/em> – Warum isst du nicht? – Weil ich keinen Hunger habe.<br><em>No sé por qué se ha enfadado.<\/em> – Ich weiß nicht, warum er sich geärgert hat.<br><em>Nadie entiende el porqué de su decisión.<\/em> – Niemand versteht den Grund für ihre Entscheidung. (Plural: <em>los porqués<\/em>)<br><em>Ese es el motivo por (el) que no vine.<\/em> – Das ist der Grund, aus dem ich nicht gekommen bin.<\/p><p><em>para qué<\/em> fragt nach dem Zweck: <em>¿Para qué sirve este botón?<\/em> – Wozu dient dieser Knopf? Antwort mit <em>para<\/em> + Infinitiv / <em>para que<\/em> + subjuntivo.<\/p><div class=\"tip\">Test: Lässt sich ein Artikel einfügen (<em>por <b>el<\/b> que<\/em>), ist es getrennt und ohne Akzent: <em>por que<\/em>. Steht ein Artikel davor (<em>el porqué<\/em>), ist es ein Substantiv.<\/div>"},{"h":"Indirekte Fragen","html":"<p>Auch in indirekten Fragen (nach <em>saber, preguntar, decir, no entender …<\/em>) <b>behalten<\/b> die Fragewörter ihren Akzent:<\/p><p><em>No sé dónde vive.<\/em> – Ich weiß nicht, wo er wohnt.<br><em>Pregúntale cuánto cuesta.<\/em> – Frag ihn, wie viel es kostet.<br><em>Dime qué quieres.<\/em> – Sag mir, was du willst.<br><em>No entiendo cómo funciona.<\/em> – Ich verstehe nicht, wie es funktioniert.<\/p><p>Bei Ja/Nein-Fragen leitet <em>si<\/em> (ob, ohne Akzent) die indirekte Frage ein:<\/p><p><em>¿Vienes?<\/em> → <em>Me pregunta si vengo.<\/em> – Er fragt mich, ob ich komme.<\/p><div class=\"warn\">Achtung: Nach <em>preguntar<\/em> hört man oft <em>que<\/em> vor dem Fragewort: <em>Me preguntó que dónde vivía.<\/em> Das ist umgangssprachlich korrekt, aber nicht nötig. Der Akzent auf <em>dónde<\/em> bleibt in jedem Fall.<\/div><div class=\"tip\">Unterscheide: <em>No sé qué dice.<\/em> (was – Frage) ↔ <em>No me gusta lo que dice.<\/em> (das, was – Relativ, ohne Akzent).<\/div>"},{"h":"Ausrufe","html":"<p>Ausrufe stehen zwischen <em>¡ … !<\/em>, und das Ausrufewort trägt einen Akzent.<\/p><p><b><em>¡Qué<\/em> + Adjektiv / Adverb / Substantiv!<\/b><br><em>¡Qué bonito!<\/em> – Wie schön!<br><em>¡Qué bien cocinas!<\/em> – Wie gut du kochst!<br><em>¡Qué calor!<\/em> – Was für eine Hitze!<br><em>¡Qué pena!<\/em> – Wie schade!<\/p><p><b><em>¡Qué<\/em> + Substantiv + <em>más / tan<\/em> + Adjektiv!<\/b><br><em>¡Qué día más bonito!<\/em> = <em>¡Qué día tan bonito!<\/em> – Was für ein schöner Tag!<br><em>¡Qué niños tan educados!<\/em> – Was für gut erzogene Kinder!<\/p><p><b><em>¡Cuánto/a/os/as<\/em> + Substantiv!<\/b> und <b><em>¡Cuánto<\/em> + Verb!<\/b><br><em>¡Cuánta gente!<\/em> – Wie viele Leute!<br><em>¡Cuántos regalos!<\/em> – So viele Geschenke!<br><em>¡Cuánto te he echado de menos!<\/em> – Wie sehr ich dich vermisst habe!<\/p><p><b><em>¡Cómo<\/em> + Verb!<\/b><br><em>¡Cómo llueve!<\/em> – Wie es regnet!<br><em>¡Cómo has crecido!<\/em> – Wie du gewachsen bist!<\/p><div class=\"warn\">Achtung: Kein unbestimmter Artikel nach <em>qué<\/em>: „Was für ein Glück!“ = <em>¡Qué suerte!<\/em>, nicht <em>*¡Qué una suerte!<\/em><\/div>"}],"exercises":[{"type":"gap","title":"Das passende Fragewort","task":"Setze das passende Fragewort ein (mit Akzent!). Hinweis in Klammern.","items":[{"q":"¿___ se llama tu perro? (wie)","a":["Cómo"],"de":"Wie heißt dein Hund?"},{"q":"¿___ es ese chico tan alto? (wer)","a":["Quién"],"de":"Wer ist dieser große Junge?"},{"q":"¿___ hermanos tienes? (wie viele)","a":["Cuántos"],"de":"Wie viele Geschwister hast du?"},{"q":"¿De ___ son tus abuelos? (woher)","a":["dónde"],"de":"Woher sind deine Großeltern?"},{"q":"¿___ vuelves de Tenerife? (wann)","a":["Cuándo"],"de":"Wann kommst du aus Teneriffa zurück?"},{"q":"¿___ vas tan rápido? (wohin)","a":["Adónde","A dónde"],"de":"Wohin gehst du so schnell?"},{"q":"¿Con ___ vas al concierto? (wem)","a":["quién","quiénes"],"de":"Mit wem gehst du zum Konzert?"},{"q":"¿___ agua bebes al día? (wie viel)","a":["Cuánta"],"de":"Wie viel Wasser trinkst du am Tag?"},{"q":"¿___ sirve esta herramienta? (wozu)","a":["Para qué"],"de":"Wozu dient dieses Werkzeug?"}]},{"type":"choice","title":"qué oder cuál?","task":"Wähle qué, cuál oder cuáles.","items":[{"q":"¿___ es tu película favorita?","options":["Qué","Cuál"],"a":1,"why":"ser + bestimmte Angabe aus mehreren: cuál."},{"q":"¿___ película vemos esta noche?","options":["Qué","Cuál"],"a":0,"why":"Vor einem Substantiv (Spanien): qué."},{"q":"¿___ es la diferencia entre ser y estar?","options":["Qué","Cuál"],"a":1,"why":"Gefragt wird nach einer bestimmten Angabe: cuál."},{"q":"¿___ es un «chiringuito»?","options":["Qué","Cuál"],"a":0,"why":"Definition gefragt: qué."},{"q":"Hay tres tartas. ¿___ quieres probar?","options":["Qué","Cuál","Cuáles"],"a":1,"why":"Auswahl einer aus einer Gruppe, kein Substantiv: cuál."},{"q":"¿___ de estas maletas son vuestras?","options":["Qué","Cuál","Cuáles"],"a":2,"why":"Auswahl, Plural (son): cuáles."},{"q":"¿___ es tu correo electrónico?","options":["Qué","Cuál"],"a":1,"why":"Angabe wie Adresse, Nummer: cuál."},{"q":"¿___ hora es?","options":["Qué","Cuál"],"a":0,"why":"Vor Substantiv: qué (feste Frage)."}]},{"type":"choice","title":"por qué, porque, el porqué, por que","task":"Wähle die richtige Schreibung.","items":[{"q":"¿___ no me llamaste?","options":["Porque","Por qué","Porqué"],"a":1,"why":"Direkte Frage: por qué."},{"q":"No te llamé ___ no tenía batería.","options":["porque","por qué","por que"],"a":0,"why":"Begründung (weil): porque."},{"q":"Quiero saber ___ de tanta prisa.","options":["el porque","el porqué","el por qué"],"a":1,"why":"Mit Artikel = Substantiv: el porqué."},{"q":"No entiendo ___ está tan enfadada.","options":["porque","por qué","porqué"],"a":1,"why":"Indirekte Frage: Akzent bleibt."},{"q":"Esa es la razón ___ me fui.","options":["por que","porqué","por qué"],"a":0,"why":"Präposition + Relativ (= por la que): por que."},{"q":"Me explicó todos los ___ de su decisión.","options":["porqués","por qués","porques"],"a":0,"why":"Plural des Substantivs: los porqués."},{"q":"– ¿Por qué estudias alemán? – ___ quiero trabajar en Viena.","options":["Por qué","Porque","Por que"],"a":1,"why":"Antwort mit weil: porque."}]},{"type":"gap","title":"Indirekte Fragen","task":"Forme die Frage in eine indirekte Frage um. Setze das fehlende Wort ein.","items":[{"q":"¿Dónde está la estación? → No sé ___ está la estación.","a":["dónde"],"de":"Ich weiß nicht, wo der Bahnhof ist."},{"q":"¿Vienes mañana? → Me pregunta ___ vengo mañana.","a":["si"],"de":"Er fragt mich, ob ich morgen komme."},{"q":"¿Cuánto cuesta? → Pregunta ___ cuesta.","a":["cuánto"],"de":"Frag, wie viel es kostet."},{"q":"¿Qué quieres? → Dime ___ quieres.","a":["qué"],"de":"Sag mir, was du willst."},{"q":"¿Quién ha llamado? → No sabemos ___ ha llamado.","a":["quién"],"de":"Wir wissen nicht, wer angerufen hat."},{"q":"¿Cuándo llega el avión? → ¿Sabes ___ llega el avión?","a":["cuándo"],"de":"Weißt du, wann das Flugzeug landet?"},{"q":"¿Tienes tiempo? → Quiere saber ___ tienes tiempo.","a":["si"],"de":"Er will wissen, ob du Zeit hast."},{"q":"¿Cómo se abre esto? → No entiendo ___ se abre esto.","a":["cómo"],"de":"Ich verstehe nicht, wie man das aufmacht."}]},{"type":"gap","title":"Ausrufe","task":"Ergänze das passende Ausrufewort (qué, cuánto/a/os/as, cómo) oder más/tan.","items":[{"q":"¡___ frío hace hoy!","a":["Qué","Cuánto"],"de":"Wie kalt es heute ist!"},{"q":"¡___ gente hay en la playa! (wie viel)","a":["Cuánta"],"de":"Wie viele Leute am Strand sind!"},{"q":"¡___ baila tu hermano! Es increíble. (wie)","a":["Cómo"],"de":"Wie dein Bruder tanzt! Unglaublich."},{"q":"¡Qué casa ___ grande! (Variante mit tan)","a":["tan"],"de":"Was für ein großes Haus!"},{"q":"¡___ coches hay en esta calle! (wie viele)","a":["Cuántos"],"de":"Wie viele Autos in dieser Straße sind!"},{"q":"¡Qué vista ___ bonita! (Variante mit más)","a":["más"],"de":"Was für eine schöne Aussicht!"},{"q":"¡___ suerte has tenido!","a":["Qué","Cuánta"],"de":"Was für ein Glück du gehabt hast!"},{"q":"¡___ ganas tengo de verte!","a":["Qué","Cuántas"],"de":"Wie sehr ich mich darauf freue, dich zu sehen!"}]},{"type":"choice","title":"Gemischt: Fehler finden","task":"Welcher Satz ist korrekt?","items":[{"q":"Woher kommt ihr?","options":["¿De dónde sois?","¿Dónde sois de?","¿De donde sois?"],"a":0,"why":"Präposition vor dem Fragewort, mit Akzent."},{"q":"Wem gehört das Fahrrad?","options":["¿A quién es la bici?","¿De quién es la bici?","¿Quién es la bici?"],"a":1,"why":"Besitz: ¿De quién es …?"},{"q":"Was für ein Zufall!","options":["¡Qué una casualidad!","¡Qué casualidad!","¡Que casualidad!"],"a":1,"why":"Kein Artikel nach qué, Akzent auf qué."},{"q":"Ich weiß nicht, wo sie arbeitet.","options":["No sé donde trabaja.","No sé dónde trabaja.","No sé de dónde trabaja."],"a":1,"why":"Indirekte Frage: Akzent bleibt."},{"q":"Wie ist deine Schwester (Charakter)?","options":["¿Cómo está tu hermana?","¿Cómo es tu hermana?","¿Qué es tu hermana?"],"a":1,"why":"Beschaffenheit/Charakter: ¿Cómo es?"},{"q":"Wie viele Stunden schläfst du?","options":["¿Cuánto horas duermes?","¿Cuántas horas duermes?","¿Qué horas duermes?"],"a":1,"why":"cuánto gleicht sich an horas an."},{"q":"Wie gut du Gitarre spielst!","options":["¡Qué bien tocas la guitarra!","¡Qué bueno tocas la guitarra!","¡Cuánto bien tocas la guitarra!"],"a":0,"why":"Vor Verb wird das Adverb bien gebraucht."},{"q":"Er hat mich gefragt, was ich mache.","options":["Me preguntó lo que hacía.","Me preguntó qué hacía.","Me preguntó que hacía."],"a":1,"why":"Indirekte Frage mit qué (mit Akzent)."}]}],"cards":[{"f":"Fragewörter – Akzent?","b":"immer, auch in indirekten Fragen und Ausrufen"},{"f":"Mit wem …? / Wovon …?","b":"¿Con quién …? / ¿De qué …? (Präp. vorne)"},{"f":"Wem gehört …?","b":"¿De quién es …?"},{"f":"Wer (alles) kommt?","b":"¿Quiénes vienen?"},{"f":"Wie alt bist du?","b":"¿Cuántos años tienes?"},{"f":"cuánto vor Substantiv","b":"angeglichen: ¿Cuánta leche? ¿Cuántas veces?"},{"f":"qué + Substantiv","b":"¿Qué libro? – welches Buch (Spanien)"},{"f":"Wie ist deine Adresse?","b":"¿Cuál es tu dirección?"},{"f":"Was ist ein …? (Definition)","b":"¿Qué es un/una …?"},{"f":"Welche(s) davon? (ohne Subst.)","b":"¿Cuál? / ¿Cuáles?"},{"f":"wo? / wohin? / woher?","b":"¿dónde? / ¿adónde? / ¿de dónde?"},{"f":"Bis wann? / Seit wann?","b":"¿Hasta cuándo? / ¿Desde cuándo?"},{"f":"¿Cómo es? ↔ ¿Cómo está?","b":"Wie ist er (Wesen)? ↔ Wie geht es ihm?"},{"f":"Wie bitte?","b":"¿Cómo?"},{"f":"warum / weil","b":"por qué / porque"},{"f":"der Grund (Substantiv)","b":"el porqué (Pl. los porqués)"},{"f":"por que (getrennt, ohne Akzent)","b":"Präp. + Relativ: la razón por (la) que"},{"f":"wozu?","b":"¿para qué?"},{"f":"Ich weiß nicht, wo er wohnt.","b":"No sé dónde vive."},{"f":"indirekte Ja/Nein-Frage: ob","b":"si (ohne Akzent): No sé si viene."},{"f":"Wie schön!","b":"¡Qué bonito!"},{"f":"Was für ein schöner Tag!","b":"¡Qué día más bonito! / ¡Qué día tan bonito!"},{"f":"Wie viele Leute!","b":"¡Cuánta gente!"},{"f":"Wie es regnet!","b":"¡Cómo llueve!"},{"f":"Was für ein Glück!","b":"¡Qué suerte! (ohne una)"},{"f":"Wie schade!","b":"¡Qué pena!"}],"id":"k09"},{"nr":9,"title":"Die Personalpronomen","teil":"Das Substantiv und seine Begleiter","intro":"Spanische Personalpronomen sind kurz, aber zahlreich: Subjekt-, Objekt- und Präpositionalformen folgen eigenen Regeln für Form, Reihenfolge und Stellung. Wer sie sicher beherrscht, spricht sofort natürlicher.","sections":[{"h":"Subjektpronomen und ihr Weglassen","html":"<table><tr><th>Sg.<\/th><th>Pl.<\/th><\/tr><tr><td><em>yo<\/em> ich<\/td><td><em>nosotros / nosotras<\/em> wir<\/td><\/tr><tr><td><em>tú<\/em> du<\/td><td><em>vosotros / vosotras<\/em> ihr<\/td><\/tr><tr><td><em>él / ella<\/em> er / sie<\/td><td><em>ellos / ellas<\/em> sie<\/td><\/tr><tr><td><em>usted<\/em> Sie<\/td><td><em>ustedes<\/em> Sie (Pl.)<\/td><\/tr><\/table><p>Die Verbendung zeigt die Person bereits an, deshalb lässt man das Subjektpronomen normalerweise weg: <em>Trabajo en un hotel.<\/em> – Ich arbeite in einem Hotel.<\/p><p>Man setzt es nur zur <b>Betonung<\/b>, zum <b>Kontrast<\/b> oder bei <b>Mehrdeutigkeit<\/b>:<\/p><p><em>Yo pago la cena y tú pagas las copas.<\/em> – Ich zahle das Essen, und du zahlst die Drinks.<br><em>¿Quién ha roto el vaso? – Yo no.<\/em> – Wer hat das Glas zerbrochen? – Ich nicht.<br><em>Él estaba en casa, ella no.<\/em> – Er war zu Hause, sie nicht. (<em>estaba<\/em> allein wäre unklar)<\/p><div class=\"warn\">Achtung: Ständiges <em>yo<\/em> vor jedem Verb klingt ich-bezogen oder unbeholfen. Für „es“ als Subjekt gibt es kein Pronomen: <em>Es importante.<\/em> – Es ist wichtig. <em>Llueve.<\/em> – Es regnet.<\/div>"},{"h":"usted / ustedes, vosotros und Lateinamerika","html":"<p><em>usted<\/em> (abgekürzt <em>Ud.<\/em>) und <em>ustedes<\/em> (<em>Uds.<\/em>) sind die Höflichkeitsformen. Sie stehen mit der <b>3. Person<\/b> des Verbs und den Pronomen der 3. Person:<\/p><p><em>¿Usted es la señora Ortega?<\/em> – Sind Sie Frau Ortega?<br><em>Ustedes pueden sentarse aquí.<\/em> – Sie können sich hier hinsetzen.<br><em>Señor López, lo llamo mañana.<\/em> – Herr López, ich rufe Sie morgen an.<\/p><p>Da <em>está<\/em> auch „er/sie ist“ bedeuten kann, wird <em>usted<\/em> häufiger ausgesprochen als andere Pronomen – aus Höflichkeit und zur Klarheit.<\/p><div class=\"tip\">In Lateinamerika (und auf den Kanaren, teilweise in Andalusien) gibt es kein <em>vosotros<\/em>: <em>ustedes<\/em> ist dort die normale Mehrzahl von <em>tú<\/em>, auch unter Freunden. <em>¿Ustedes vienen a la fiesta?<\/em> – Kommt ihr z
