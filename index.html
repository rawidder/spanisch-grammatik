 / 22 / 26","b":"dieciséis / veintidós / veintiséis"},{"f":"21 Jahre / 21 Personen","b":"veintiún años / veintiuna personas"},{"f":"31","b":"treinta y uno (drei Wörter ab 31)"},{"f":"100 / 101","b":"cien / ciento uno"},{"f":"hundert Euro","b":"cien euros (nie „un cien“)"},{"f":"500 / 700 / 900","b":"quinientos / setecientos / novecientos"},{"f":"200 Personen","b":"doscientas personas (mit Angleichung)"},{"f":"2000","b":"dos mil (mil unveränderlich)"},{"f":"eine Million Einwohner","b":"un millón de habitantes"},{"f":"Milliarde / Billion","b":"mil millones / un billón"},{"f":"der erste Tag / der dritte Stock","b":"el primer día / el tercer piso"},{"f":"1.–10. (Ordnungszahlen)","b":"primero, segundo, tercero, cuarto, quinto, sexto, séptimo, octavo, noveno, décimo"},{"f":"Felipe VI / Alfonso XIII","b":"Felipe sexto / Alfonso trece"},{"f":"das 21. Jahrhundert","b":"el siglo XXI (veintiuno)"},{"f":"1/2, 1/3, 3/4","b":"un medio (la mitad), un tercio, tres cuartos"},{"f":"20 Prozent","b":"el 20 % (el veinte por ciento)"},{"f":"3 × 4 = 12","b":"Tres por cuatro son doce."},{"f":"etwa zwanzig","b":"unos veinte / una veintena"},{"f":"ein Dutzend / Hunderte von","b":"una docena / cientos de"},{"f":"Wie spät ist es?","b":"¿Qué hora es?"},{"f":"Es ist eins / Es ist drei","b":"Es la una. / Son las tres."},{"f":"Viertel nach / Viertel vor / halb","b":"y cuarto / menos cuarto / y media"},{"f":"halb vier","b":"las tres y media"},{"f":"um 8 Uhr abends","b":"a las ocho de la tarde / de la noche"},{"f":"Datum: 5. Mai 2025","b":"el 5 de mayo de 2025"},{"f":"der 1. Januar","b":"el uno / el primero de enero"},{"f":"Ich bin 40.","b":"Tengo cuarenta años."},{"f":"ein halbes Kilo / ein Stangenbrot","b":"medio kilo / una barra de pan"}],"id":"k27"},{"nr":27,"title":"Präpositionen und Verbanschlüsse – Übersicht","teil":"Anhang","intro":"Kompakte Nachschlagetabellen: wann a und de mit el verschmelzen und welche Präposition Verben und Adjektive vor einem Infinitiv oder Nomen verlangen. Gerade hier weicht das Spanische oft vom Deutschen ab.","sections":[{"h":"Verschmelzung: al und del","html":"<p>Die Präpositionen <em>a<\/em> und <em>de<\/em> verschmelzen mit dem männlichen Artikel <em>el<\/em> – und nur mit diesem.<\/p><table><tr><th>Form<\/th><th>Beispiel<\/th><\/tr><tr><td><em>a + el = al<\/em><\/td><td><em>Vamos al mercado.<\/em><br><small>Wir gehen zum Markt.<\/small><\/td><\/tr><tr><td><em>de + el = del<\/em><\/td><td><em>la llave del garaje<\/em><br><small>der Schlüssel der Garage<\/small><\/td><\/tr><tr><td><em>a la / a los / a las<\/em><\/td><td><em>Voy a la playa.<\/em> <small>(keine Verschmelzung)<\/small><\/td><\/tr><tr><td><em>de la / de los / de las<\/em><\/td><td><em>el final de los cursos<\/em> <small>(keine Verschmelzung)<\/small><\/td><\/tr><\/table><p><b>Keine Verschmelzung<\/b> gibt es in zwei Fällen:<\/p><ul><li>beim Personalpronomen <em>él<\/em>: <em>Hablo de él.<\/em> <small>Ich spreche von ihm.<\/small> / <em>Se lo di a él.<\/em> <small>Ich gab es ihm.<\/small><\/li><li>wenn <em>El<\/em> fester Teil eines Eigennamens ist (Länder, Städte, Zeitungen, Werktitel): <em>Viajamos a El Salvador.<\/em> <small>Wir reisen nach El Salvador.<\/small> / <em>un artículo de El País<\/em> / <em>una escena de El laberinto del fauno<\/em><\/li><\/ul><div class=\"tip\">Merke: Nur <em>al<\/em> und <em>del<\/em> – es gibt kein *<em>ala<\/em>, *<em>dela<\/em>, *<em>dels<\/em>.<\/div><div class=\"warn\">Achtung: Das persönliche <em>a<\/em> verschmilzt natürlich auch: <em>Conozco al profesor.<\/em> (nicht *<em>a el profesor<\/em>).<\/div>"},{"h":"Verben mit a und de + Infinitiv","html":"<p>Viele Verben verlangen vor einem Infinitiv eine feste Präposition. Am häufigsten sind <em>a<\/em> und <em>de<\/em>.<\/p><p><b>Verb + a + Infinitiv<\/b> (oft Beginn, Bewegung, Lernen, Veranlassen):<\/p><table><tr><th>Verb<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>empezar / comenzar a<\/em><\/td><td>anfangen zu<\/td><td><em>Empezó a llover.<\/em><\/td><\/tr><tr><td><em>aprender a<\/em><\/td><td>lernen zu<\/td><td><em>Aprendo a nadar.<\/em><\/td><\/tr><tr><td><em>ayudar a<\/em><\/td><td>helfen zu<\/td><td><em>¿Me ayudas a cocinar?<\/em><\/td><\/tr><tr><td><em>volver a<\/em><\/td><td>wieder tun<\/td><td><em>Volví a llamarla.<\/em> <small>Ich rief sie wieder an.<\/small><\/td><\/tr><tr><td><em>ir a<\/em><\/td><td>werden / gehen, um<\/td><td><em>Voy a estudiar.<\/em><\/td><\/tr><tr><td><em>enseñar a<\/em><\/td><td>beibringen<\/td><td><em>Me enseñó a conducir.<\/em><\/td><\/tr><tr><td><em>invitar a<\/em><\/td><td>einladen zu<\/td><td><em>Nos invitaron a cenar.<\/em><\/td><\/tr><tr><td><em>negarse a<\/em><\/td><td>sich weigern<\/td><td><em>Se negó a firmar.<\/em><\/td><\/tr><tr><td><em>atreverse a<\/em><\/td><td>sich trauen<\/td><td><em>No me atrevo a saltar.<\/em><\/td><\/tr><tr><td><em>acostumbrarse a<\/em><\/td><td>sich gewöhnen an<\/td><td><em>Me acostumbré a madrugar.<\/em><\/td><\/tr><\/table><p><b>Verb + de + Infinitiv<\/b> (oft Ende, Erinnerung, Gefühl):<\/p><table><tr><th>Verb<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>acabar de<\/em><\/td><td>gerade getan haben<\/td><td><em>Acabo de llegar.<\/em> <small>Ich bin gerade angekommen.<\/small><\/td><\/tr><tr><td><em>dejar de<\/em><\/td><td>aufhören zu<\/td><td><em>Dejó de fumar.<\/em><\/td><\/tr><tr><td><em>terminar de<\/em><\/td><td>fertig werden mit<\/td><td><em>Terminé de leer el libro.<\/em><\/td><\/tr><tr><td><em>tratar de<\/em><\/td><td>versuchen zu<\/td><td><em>Trata de dormir.<\/em><\/td><\/tr><tr><td><em>acordarse de<\/em><\/td><td>sich erinnern, daran denken<\/td><td><em>Acuérdate de comprar pan.<\/em><\/td><\/tr><tr><td><em>olvidarse de<\/em><\/td><td>vergessen<\/td><td><em>Me olvidé de cerrar la puerta.<\/em><\/td><\/tr><tr><td><em>alegrarse de<\/em><\/td><td>sich freuen über<\/td><td><em>Me alegro de verte.<\/em><\/td><\/tr><tr><td><em>cansarse de<\/em><\/td><td>es satt bekommen<\/td><td><em>Se cansó de esperar.<\/em><\/td><\/tr><tr><td><em>arrepentirse de<\/em><\/td><td>bereuen<\/td><td><em>Me arrepiento de haberlo dicho.<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: <em>recordar<\/em> und <em>olvidar<\/em> ohne <em>se<\/em> stehen ohne <em>de<\/em>: <em>Recuerda comprar pan.<\/em> / <em>Olvidé cerrar la puerta.<\/em> Mit Reflexivpronomen dagegen immer <em>de<\/em>: <em>acordarse de<\/em>, <em>olvidarse de<\/em>.<\/div><div class=\"tip\">Eselsbrücke: <em>a<\/em> zeigt nach vorn (Richtung, Beginn), <em>de<\/em> zeigt zurück (Herkunft, Ende) – <em>empezar a<\/em>, aber <em>acabar de<\/em>.<\/div>"},{"h":"Verben mit en, con und ohne Präposition","html":"<p><b>Verb + en<\/b><\/p><table><tr><th>Verb<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>insistir en<\/em><\/td><td>bestehen auf<\/td><td><em>Insiste en pagar él.<\/em><\/td><\/tr><tr><td><em>pensar en<\/em><\/td><td>denken an<\/td><td><em>Pienso en ti.<\/em><\/td><\/tr><tr><td><em>tardar en<\/em><\/td><td>(lange) brauchen, um<\/td><td><em>Tardó dos horas en volver.<\/em><\/td><\/tr><tr><td><em>quedar en<\/em><\/td><td>vereinbaren<\/td><td><em>Quedamos en vernos el lunes.<\/em><\/td><\/tr><tr><td><em>confiar en<\/em><\/td><td>vertrauen auf<\/td><td><em>Confío en ella.<\/em><\/td><\/tr><tr><td><em>consistir en<\/em><\/td><td>bestehen in<\/td><td><em>El juego consiste en adivinar.<\/em><\/td><\/tr><tr><td><em>fijarse en<\/em><\/td><td>achten auf<\/td><td><em>Fíjate en el color.<\/em><\/td><\/tr><\/table><p><b>Verb + con<\/b><\/p><table><tr><th>Verb<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>soñar con<\/em><\/td><td>träumen von<\/td><td><em>Sueña con vivir junto al mar.<\/em><\/td><\/tr><tr><td><em>contar con<\/em><\/td><td>rechnen mit, zählen auf<\/td><td><em>Cuento contigo.<\/em><\/td><\/tr><tr><td><em>casarse con<\/em><\/td><td>heiraten<\/td><td><em>Se casó con un médico.<\/em><\/td><\/tr><tr><td><em>amenazar con<\/em><\/td><td>drohen mit<\/td><td><em>Amenazó con irse.<\/em><\/td><\/tr><tr><td><em>conformarse con<\/em><\/td><td>sich zufriedengeben mit<\/td><td><em>Me conformo con poco.<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: <em>träumen von<\/em> = <em>soñar con<\/em> (nicht *<em>soñar de<\/em>), <em>heiraten<\/em> = <em>casarse con<\/em> (nicht *<em>casarse a alguien<\/em>), <em>denken an<\/em> = <em>pensar en<\/em> (nicht *<em>pensar a<\/em>, wie im Italienischen).<\/div><p><b>Verb direkt + Infinitiv<\/b> (ohne Präposition):<\/p><table><tr><th>Verb<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>querer<\/em><\/td><td>wollen<\/td><td><em>Quiero descansar.<\/em><\/td><\/tr><tr><td><em>poder<\/em><\/td><td>können, dürfen<\/td><td><em>¿Puedo entrar?<\/em><\/td><\/tr><tr><td><em>deber<\/em><\/td><td>sollen, müssen<\/td><td><em>Debes llamar a tu madre.<\/em><\/td><\/tr><tr><td><em>saber<\/em><\/td><td>können (gelernt)<\/td><td><em>Sé tocar la guitarra.<\/em><\/td><\/tr><tr><td><em>pensar<\/em><\/td><td>vorhaben<\/td><td><em>Pienso mudarme en verano.<\/em><\/td><\/tr><tr><td><em>decidir<\/em><\/td><td>beschließen<\/td><td><em>Decidimos quedarnos.<\/em><\/td><\/tr><tr><td><em>necesitar<\/em><\/td><td>brauchen, müssen<\/td><td><em>Necesito dormir más.<\/em><\/td><\/tr><tr><td><em>esperar<\/em><\/td><td>hoffen<\/td><td><em>Espero aprobar.<\/em><\/td><\/tr><tr><td><em>prometer<\/em><\/td><td>versprechen<\/td><td><em>Prometió volver pronto.<\/em><\/td><\/tr><tr><td><em>lograr / conseguir<\/em><\/td><td>schaffen<\/td><td><em>Logré abrir la caja.<\/em><\/td><\/tr><tr><td><em>intentar / preferir<\/em><\/td><td>versuchen / vorziehen<\/td><td><em>Prefiero caminar.<\/em><\/td><\/tr><\/table><div class=\"tip\">Merke: <em>pensar<\/em> + Infinitiv = vorhaben; <em>pensar en<\/em> + Infinitiv = an etwas denken: <em>Pienso viajar.<\/em> (Ich habe vor zu reisen.) – <em>Pienso en viajar.<\/em> (Ich denke ans Reisen.)<\/div><div class=\"warn\">Achtung: <em>deber<\/em> + Infinitiv = Pflicht (<em>Debes estudiar.<\/em>); <em>deber de<\/em> + Infinitiv = Vermutung (<em>Debe de ser tarde.<\/em> – Es wird wohl spät sein). Für die Vermutung lässt die RAE auch <em>deber<\/em> + Infinitiv zu (<em>Debe ser tarde.<\/em>); <em>deber de<\/em> für eine Pflicht gilt dagegen als Fehler.<\/div>"},{"h":"Adjektive mit Präposition","html":"<p>Auch viele Adjektive haben feste Präpositionen – vor Nomen wie vor Infinitiv.<\/p><table><tr><th>Adjektiv<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>contento de<\/em> + Inf.<\/td><td>froh, zu<\/td><td><em>Estoy contento de estar aquí.<\/em><\/td><\/tr><tr><td><em>contento con<\/em> + Nomen<\/td><td>zufrieden mit<\/td><td><em>Está contenta con su piso.<\/em><\/td><\/tr><tr><td><em>harto de<\/em><\/td><td>satt haben<\/td><td><em>Estoy harto de tanto ruido.<\/em><\/td><\/tr><tr><td><em>capaz de<\/em><\/td><td>fähig zu<\/td><td><em>Es capaz de todo.<\/em><\/td><\/tr><tr><td><em>fácil / difícil de<\/em><\/td><td>leicht / schwer zu<\/td><td><em>Este plato es fácil de preparar.<\/em><\/td><\/tr><tr><td><em>orgulloso de<\/em><\/td><td>stolz auf<\/td><td><em>Estoy orgullosa de ti.<\/em><\/td><\/tr><tr><td><em>seguro de<\/em><\/td><td>sicher (über)<\/td><td><em>¿Estás seguro de eso?<\/em><\/td><\/tr><tr><td><em>dispuesto a<\/em><\/td><td>bereit zu<\/td><td><em>Está dispuesto a ayudar.<\/em><\/td><\/tr><tr><td><em>acostumbrado a<\/em><\/td><td>gewöhnt an<\/td><td><em>No estoy acostumbrado al frío.<\/em><\/td><\/tr><tr><td><em>interesado en<\/em><\/td><td>interessiert an<\/td><td><em>Estoy interesada en el puesto.<\/em><\/td><\/tr><tr><td><em>enfadado con<\/em> + Person<\/td><td>böse auf<\/td><td><em>Está enfadado con su hermano.<\/em><\/td><\/tr><tr><td><em>enfadado por<\/em> + Sache<\/td><td>verärgert über<\/td><td><em>Está enfadado por el retraso.<\/em><\/td><\/tr><\/table><div class=\"tip\">Merke: <em>fácil de<\/em> steht, wenn das Ding Subjekt ist: <em>Esta pregunta es fácil de responder.<\/em> Ist der Infinitiv Subjekt, fällt <em>de<\/em> weg: <em>Es fácil responder a esta pregunta.<\/em><\/div><div class=\"warn\">Achtung: <em>stolz auf<\/em> = <em>orgulloso de<\/em>, <em>böse auf jemanden<\/em> = <em>enfadado con<\/em> – das deutsche „auf“ hilft hier nicht weiter. In Lateinamerika sagt man statt <em>enfadado<\/em> meist <em>enojado con<\/em>.<\/div>"}],"exercises":[{"type":"gap","title":"al, del oder nicht verschmolzen?","task":"Setze a/de + Artikel richtig ein (al, del, a el, de el, a la, de la …).","items":[{"q":"Mañana vamos (a + el) ___ cine.","a":["al"],"de":"Morgen gehen wir ins Kino."},{"q":"Es la casa (de + el) ___ alcalde.","a":["del"],"de":"Es ist das Haus des Bürgermeisters."},{"q":"El año pasado viajé (a + El) ___ Salvador.","a":["a El"],"de":"Letztes Jahr bin ich nach El Salvador gereist."},{"q":"No sé nada (de + él) ___.","a":["de él"],"de":"Ich weiß nichts von ihm."},{"q":"Llegamos tarde (a + la) ___ estación.","a":["a la"],"de":"Wir kamen zu spät zum Bahnhof."},{"q":"Saludé (a + el) ___ director.","a":["al"],"de":"Ich grüßte den Direktor."},{"q":"Leí la noticia en la web (de + El) ___ País.","a":["de El"],"de":"Ich las die Nachricht auf der Website von El País."},{"q":"Salimos (de + el) ___ teatro a medianoche.","a":["del"],"de":"Wir kamen um Mitternacht aus dem Theater."}]},{"type":"gap","title":"Welche Präposition?","task":"Setze a, de, en oder con ein.","items":[{"q":"Mi abuela me enseñó ___ hacer tortilla.","a":["a"],"de":"Meine Oma hat mir beigebracht, Tortilla zu machen."},{"q":"¿Ya has terminado ___ comer?","a":["de"],"de":"Bist du schon fertig mit Essen?"},{"q":"El tren tardó media hora ___ salir.","a":["en"],"de":"Der Zug brauchte eine halbe Stunde, bis er abfuhr."},{"q":"Marta sueña ___ ser piloto.","a":["con"],"de":"Marta träumt davon, Pilotin zu werden."},{"q":"Anoche volvimos ___ ver esa película.","a":["a"],"de":"Gestern Abend haben wir diesen Film noch einmal gesehen."},{"q":"Por fin he dejado ___ comer azúcar.","a":["de"],"de":"Endlich habe ich aufgehört, Zucker zu essen."},{"q":"Mis padres insisten ___ acompañarnos.","a":["en"],"de":"Meine Eltern bestehen darauf, uns zu begleiten."},{"q":"Cuando vio al perro, se negó ___ entrar.","a":["a"],"de":"Als er den Hund sah, weigerte er sich hineinzugehen."},{"q":"Mi hermana se casó ___ un chico de Bilbao.","a":["con"],"de":"Meine Schwester hat einen Jungen aus Bilbao geheiratet."},{"q":"No te olvides ___ apagar la luz.","a":["de"],"de":"Vergiss nicht, das Licht auszumachen."}]},{"type":"choice","title":"Feine Unterschiede","task":"Wähle die korrekte Variante.","items":[{"q":"Ich habe vor, im Sommer nach Chile zu fliegen.","options":["Pienso en volar a Chile en verano.","Pienso volar a Chile en verano."],"a":1,"why":"pensar + Infinitiv ohne Präposition bedeutet „vorhaben“."},{"q":"Ich habe vergessen, dich anzurufen.","options":["Olvidé de llamarte.","Me olvidé llamarte.","Me olvidé de llamarte."],"a":2,"why":"olvidarse verlangt de; olvidar ohne se stünde ohne de."},{"q":"Diese Übung ist schwer zu verstehen.","options":["Este ejercicio es difícil de entender.","Este ejercicio es difícil a entender.","Este ejercicio es difícil entender."],"a":0,"why":"Ist das Ding Subjekt, folgt difícil de + Infinitiv."},{"q":"Ich bin gerade aus dem Büro gekommen.","options":["Acabo salir de la oficina.","Acabo de salir de la oficina.","Acabo a salir de la oficina."],"a":1,"why":"acabar de + Infinitiv = gerade etwas getan haben."},{"q":"Sie ist böse auf ihren Chef.","options":["Está enfadada con su jefe.","Está enfadada a su jefe.","Está enfadada de su jefe."],"a":0,"why":"Bei Personen heißt es enfadado con."},{"q":"Wir haben uns für acht Uhr verabredet.","options":["Quedamos con a las ocho.","Quedamos en vernos a las ocho.","Quedamos a vernos a las ocho."],"a":1,"why":"quedar en + Infinitiv = etwas vereinbaren (in Mexiko auch quedar de)."},{"q":"Wir zählen auf dich.","options":["Contamos en ti.","Contamos contigo.","Contamos a ti."],"a":1,"why":"contar con = zählen auf; con + ti wird zu contigo."},{"q":"Er rief seine Freundin wieder an.","options":["Volvió a llamar a su novia.","Volvió llamar a su novia.","Volvió de llamar a su novia."],"a":0,"why":"volver a + Infinitiv drückt Wiederholung aus."},{"q":"Er ist bereit, alles zu geben.","options":["Está dispuesto de darlo todo.","Está dispuesto a darlo todo.","Está dispuesto en darlo todo."],"a":1,"why":"dispuesto verlangt a."}]}],"cards":[{"f":"a + el = ?","b":"al (Vamos al parque.)"},{"f":"de + el = ?","b":"del (la puerta del coche)"},{"f":"Wann keine Verschmelzung von a/de + el?","b":"bei él (de él) und bei Eigennamen mit El (a El Salvador, de El País)"},{"f":"anfangen zu","b":"empezar a / comenzar a + Inf."},{"f":"etwas wieder tun","b":"volver a + Inf. (Volví a intentarlo.)"},{"f":"sich weigern zu","b":"negarse a + Inf."},{"f":"jemandem beibringen, etwas zu tun","b":"enseñar a alguien a + Inf."},{"f":"gerade etwas getan haben","b":"acabar de + Inf. (Acabo de comer.)"},{"f":"aufhören zu","b":"dejar de + Inf."},{"f":"versuchen zu (2 Möglichkeiten)","b":"tratar de + Inf. / intentar + Inf."},{"f":"sich erinnern an / daran denken","b":"acordarse de / recordar (ohne de)"},{"f":"vergessen (2 Konstruktionen)","b":"olvidarse de + Inf. / olvidar + Inf."},{"f":"bestehen auf","b":"insistir en"},{"f":"lange brauchen, um","b":"tardar en + Inf. (Tardó mucho en contestar.)"},{"f":"vereinbaren, etwas zu tun","b":"quedar en + Inf."},{"f":"träumen von / heiraten","b":"soñar con / casarse con"},{"f":"pensar + Inf. vs. pensar en","b":"vorhaben vs. denken an"},{"f":"deber + Inf. vs. deber de + Inf.","b":"Pflicht (müssen) vs. Vermutung (wohl)"},{"f":"stolz auf / satt haben","b":"orgulloso de / harto de"},{"f":"böse auf jemanden / bereit zu","b":"enfadado con / dispuesto a"}],"id":"k30"},{"nr":28,"title":"Verbtabellen","teil":"Anhang","intro":"Nachschlageteil mit der vollständigen Konjugation der Musterverben und der wichtigsten unregelmäßigen Verben. Hier findest du jede Form schnell – und siehst, nach welchen Mustern sich die Unregelmäßigkeiten richten.","sections":[{"h":"Überblick: Zeiten und zusammengesetzte Formen","html":"<p>Dieser Anhang zeigt die vollständige Konjugation der wichtigsten Muster- und Grundverben. Die <b>einfachen Zeiten<\/b> stehen in den Tabellen der einzelnen Verben; die <b>zusammengesetzten Zeiten<\/b> bildet man immer mit <em>haber<\/em> + Partizip (unveränderlich):<\/p><table><tr><th>Zeit<\/th><th>haber<\/th><th>Beispiel<\/th><\/tr><tr><td>pretérito perfecto<\/td><td>Präsens<\/td><td><em>he hablado<\/em><\/td><\/tr><tr><td>pluscuamperfecto<\/td><td>Imperfekt<\/td><td><em>había hablado<\/em><\/td><\/tr><tr><td>pretérito anterior <small>(selten, schriftlich)<\/small><\/td><td>Indefinido<\/td><td><em>hube hablado<\/em><\/td><\/tr><tr><td>futuro perfecto<\/td><td>Futur<\/td><td><em>habré hablado<\/em><\/td><\/tr><tr><td>condicional perfecto<\/td><td>Konditional<\/td><td><em>habría hablado<\/em><\/td><\/tr><tr><td>subj. perfecto<\/td><td>Subj. Präs.<\/td><td><em>haya hablado<\/em><\/td><\/tr><tr><td>subj. pluscuamperfecto<\/td><td>Subj. Impf.<\/td><td><em>hubiera / hubiese hablado<\/em><\/td><\/tr><\/table><ul><li>Der <b>verneinte Imperativ<\/b> und die Imperativformen für <em>usted/ustedes/nosotros<\/em> stammen aus dem subjuntivo presente: <em>no hables, hable usted, hablemos<\/em>.<\/li><li>Die Formen auf <em>-ra<\/em> und <em>-se<\/em> des subjuntivo imperfecto sind gleichwertig; <em>-ra<\/em> ist im Gespräch häufiger.<\/li><li>In Lateinamerika entfällt <em>vosotros<\/em>; man nimmt die <em>ustedes<\/em>-Form.<\/li><\/ul>"},{"h":"hablar – sprechen","html":"<p><b><em>hablar<\/em><\/b> – sprechen<\/p><p><b>Indikativ<\/b><\/p><table><tr><th>Person<\/th><th>Präsens<\/th><th>Imperfekt<\/th><th>Indefinido<\/th><\/tr><tr><td>yo<\/td><td><em>hablo<\/em><\/td><td><em>hablaba<\/em><\/td><td><em>hablé<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>hablas<\/em><\/td><td><em>hablabas<\/em><\/td><td><em>hablaste<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>habla<\/em><\/td><td><em>hablaba<\/em><\/td><td><em>habló<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>hablamos<\/em><\/td><td><em>hablábamos<\/em><\/td><td><em>hablamos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>habláis<\/em><\/td><td><em>hablabais<\/em><\/td><td><em>hablasteis<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>hablan<\/em><\/td><td><em>hablaban<\/em><\/td><td><em>hablaron<\/em><\/td><\/tr><\/table><table><tr><th>Person<\/th><th>Futur<\/th><th>Konditional<\/th><th>Subj. Präs.<\/th><\/tr><tr><td>yo<\/td><td><em>hablaré<\/em><\/td><td><em>hablaría<\/em><\/td><td><em>hable<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>hablarás<\/em><\/td><td><em>hablarías<\/em><\/td><td><em>hables<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>hablará<\/em><\/td><td><em>hablaría<\/em><\/td><td><em>hable<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>hablaremos<\/em><\/td><td><em>hablaríamos<\/em><\/td><td><em>hablemos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>hablaréis<\/em><\/td><td><em>hablaríais<\/em><\/td><td><em>habléis<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>hablarán<\/em><\/td><td><em>hablarían<\/em><\/td><td><em>hablen<\/em><\/td><\/tr><\/table><p><b>subjuntivo imperfecto und Imperativ<\/b><\/p><table><tr><th>Person<\/th><th>Subj. Impf. -ra<\/th><th>Subj. Impf. -se<\/th><th>Imperativ<\/th><\/tr><tr><td>yo<\/td><td><em>hablara<\/em><\/td><td><em>hablase<\/em><\/td><td>–<\/td><\/tr><tr><td>tú<\/td><td><em>hablaras<\/em><\/td><td><em>hablases<\/em><\/td><td><em>habla<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>hablara<\/em><\/td><td><em>hablase<\/em><\/td><td><em>hable<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>habláramos<\/em><\/td><td><em>hablásemos<\/em><\/td><td><em>hablemos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>hablarais<\/em><\/td><td><em>hablaseis<\/em><\/td><td><em>hablad<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>hablaran<\/em><\/td><td><em>hablasen<\/em><\/td><td><em>hablen<\/em><\/td><\/tr><\/table><p>Verneinter Imperativ (tú/vosotros): <em>no hables / no habléis<\/em><br>gerundio: <em>hablando<\/em> – Partizip: <em>hablado<\/em><br>Zusammengesetzt (yo): <em>he hablado, había hablado, habré hablado, habría hablado, haya hablado, hubiera hablado<\/em><\/p><div class=\"tip\">Muster für alle regelmäßigen Verben auf <em>-ar<\/em>: <em>trabajar, estudiar, comprar, llamar …<\/em> Betonung beachten: <em>hablo<\/em> (ich spreche) – <em>habló<\/em> (er sprach).<\/div>"},{"h":"comer – essen","html":"<p><b><em>comer<\/em><\/b> – essen<\/p><p><b>Indikativ<\/b><\/p><table><tr><th>Person<\/th><th>Präsens<\/th><th>Imperfekt<\/th><th>Indefinido<\/th><\/tr><tr><td>yo<\/td><td><em>como<\/em><\/td><td><em>comía<\/em><\/td><td><em>comí<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>comes<\/em><\/td><td><em>comías<\/em><\/td><td><em>comiste<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>come<\/em><\/td><td><em>comía<\/em><\/td><td><em>comió<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>comemos<\/em><\/td><td><em>comíamos<\/em><\/td><td><em>comimos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>coméis<\/em><\/td><td><em>comíais<\/em><\/td><td><em>comisteis<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>comen<\/em><\/td><td><em>comían<\/em><\/td><td><em>comieron<\/em><\/td><\/tr><\/table><table><tr><th>Person<\/th><th>Futur<\/th><th>Konditional<\/th><th>Subj. Präs.<\/th><\/tr><tr><td>yo<\/td><td><em>comeré<\/em><\/td><td><em>comería<\/em><\/td><td><em>coma<\/em><\/td><\/tr><tr><td>tú<\/td><td><em>comerás<\/em><\/td><td><em>comerías<\/em><\/td><td><em>comas<\/em><\/td><\/tr><tr><td>él/ella/Ud.<\/td><td><em>comerá<\/em><\/td><td><em>comería<\/em><\/td><td><em>coma<\/em><\/td><\/tr><tr><td>nosotros<\/td><td><em>comeremos<\/em><\/td><td><em>comeríamos<\/em><\/td><td><em>comamos<\/em><\/td><\/tr><tr><td>vosotros<\/td><td><em>comeréis<\/em><\/td><td><em>comeríais<\/em><\/td><td><em>comáis<\/em><\/td><\/tr><tr><td>ellos/Uds.<\/td><td><em>comerán<\/em><\/td><td><em>comerían<\/em><\/td><td><em>coman<\/em><\/td><\/tr><\/table><p><b>subjuntivo imperfecto und Imperativ<\/b><\/p><table><tr><th>Person<\ ><tr><td><b><em>querer<\/em><\/b><\/td><td><em>quiero<\/em><br><em>quiera<\/em><\/td><td><em>quise<\/em><br><em>quiso<\/em><\/td><td><em>querré<\/em><br><em>querido<\/em><\/td><\/tr><tr><td><b><em>romper<\/em><\/b><\/td><td><em>rompo<\/em><br><em>rompa<\/em><\/td><td><em>rompí<\/em><br><em>rompió<\/em><\/td><td><em>romperé<\/em><br><em>roto<\/em><\/td><\/tr><tr><td><b><em>saber<\/em><\/b><\/td><td><em>sé<\/em><br><em>sepa<\/em><\/td><td><em>supe<\/em><br><em>supo<\/em><\/td><td><em>sabré<\/em><br><em>sabido<\/em><\/td><\/tr><tr><td><b><em>salir<\/em><\/b><\/td><td><em>salgo<\/em><br><em>salga<\/em><\/td><td><em>salí<\/em><br><em>salió<\/em><\/td><td><em>saldré<\/em><br><em>salido<\/em><\/td><\/tr><tr><td><b><em>seguir<\/em><\/b><\/td><td><em>sigo<\/em><br><em>siga<\/em><\/td><td><em>seguí<\/em><br><em>siguió<\/em><\/td><td><em>seguiré<\/em><br><em>seguido<\/em><\/td><\/tr><tr><td><b><em>sentir<\/em><\/b><\/td><td><em>siento<\/em><br><em>sienta<\/em><\/td><td><em>sentí<\/em><br><em>sintió<\/em><\/td><td><em>sentiré<\/em><br><em>sentido<\/em><\/td><\/tr><tr><td><b><em>ser<\/em><\/b><\/td><td><em>soy<\/em><br><em>sea<\/em><\/td><td><em>fui<\/em><br><em>fue<\/em><\/td><td><em>seré<\/em><br><em>sido<\/em><\/td><\/tr><tr><td><b><em>tener<\/em><\/b><\/td><td><em>tengo<\/em><br><em>tenga<\/em><\/td><td><em>tuve<\/em><br><em>tuvo<\/em><\/td><td><em>tendré<\/em><br><em>tenido<\/em><\/td><\/tr><tr><td><b><em>traducir<\/em><\/b><\/td><td><em>traduzco<\/em><br><em>traduzca<\/em><\/td><td><em>traduje<\/em><br><em>tradujo<\/em><\/td><td><em>traduciré<\/em><br><em>traducido<\/em><\/td><\/tr><tr><td><b><em>traer<\/em><\/b><\/td><td><em>traigo<\/em><br><em>traiga<\/em><\/td><td><em>traje<\/em><br><em>trajo<\/em><\/td><td><em>traeré<\/em><br><em>traído<\/em><\/td><\/tr><tr><td><b><em>valer<\/em><\/b><\/td><td><em>valgo<\/em><br><em>valga<\/em><\/td><td><em>valí<\/em><br><em>valió<\/em><\/td><td><em>valdré<\/em><br><em>valido<\/em><\/td><\/tr><tr><td><b><em>venir<\/em><\/b><\/td><td><em>vengo<\/em><br><em>venga<\/em><\/td><td><em>vine<\/em><br><em>vino<\/em><\/td><td><em>vendré<\/em><br><em>venido<\/em><\/td><\/tr><tr><td><b><em>ver<\/em><\/b><\/td><td><em>veo<\/em><br><em>vea<\/em><\/td><td><em>vi<\/em><br><em>vio<\/em><\/td><td><em>veré<\/em><br><em>visto<\/em><\/td><\/tr><tr><td><b><em>volver<\/em><\/b><\/td><td><em>vuelvo<\/em><br><em>vuelva<\/em><\/td><td><em>volví<\/em><br><em>volvió<\/em><\/td><td><em>volveré<\/em><br><em>vuelto<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: Die starken indefinido-Formen (<em>tuve, puse, hice, dije, vine …<\/em>) tragen <b>keinen Akzent<\/b>: <em>hizo, puso, vino<\/em>. Einsilbige Formen ebenfalls nicht: <em>di, dio, vi, vio, fui, fue<\/em>.<\/div><div class=\"warn\">Achtung: Nach <em>-j-<\/em> lautet die Endung der 3. Person Plural <em>-eron<\/em>, nicht „-ieron“: <em>dijeron, trajeron, condujeron<\/em>.<\/div>"},{"h":"Stammwechsel und andere Muster","html":"<p><b>Stammwechselverben<\/b> verändern den betonten Stammvokal in den „stammbetonten“ Formen (yo, tú, él, ellos) von Präsens, subjuntivo presente und Imperativ – nicht bei <em>nosotros/vosotros<\/em>:<\/p><table><tr><th>Gruppe<\/th><th>Beispiele<\/th><th>Präsens<\/th><\/tr><tr><td>e → ie<\/td><td><em>pensar, cerrar, empezar, entender, querer, preferir, sentir<\/em><\/td><td><em>pienso – pensamos<\/em><\/td><\/tr><tr><td>o → ue<\/td><td><em>poder, volver, contar, encontrar, dormir, morir<\/em><\/td><td><em>vuelvo – volvemos<\/em><\/td><\/tr><tr><td>u → ue<\/td><td><em>jugar<\/em><\/td><td><em>juego – jugamos<\/em><\/td><\/tr><tr><td>e → i <small>(nur -ir)<\/small><\/td><td><em>pedir, repetir, servir, seguir, vestirse, elegir<\/em><\/td><td><em>pido – pedimos<\/em><\/td><\/tr><\/table><p>Stammwechselnde <b>-ir-Verben<\/b> haben zusätzlich <b>e → i<\/b> bzw. <b>o → u<\/b> in der 3. Person des indefinido, im gerundio und bei <em>nosotros/vosotros<\/em> im subjuntivo:<\/p><ul><li><em>sentir<\/em>: <em>sintió, sintieron, sintiendo, sintamos<\/em><\/li><li><em>dormir<\/em>: <em>durmió, durmieron, durmiendo, durmamos<\/em><\/li><li><em>pedir<\/em>: <em>pidió, pidieron, pidiendo, pidamos<\/em><\/li><\/ul><p><b>Weitere Muster<\/b>:<\/p><table><tr><th>Muster<\/th><th>Beispiele<\/th><\/tr><tr><td>-zco (meist Vokal + -cer/-cir; nicht <em>hacer, decir<\/em>)<\/td><td><em>conocer → conozco, parecer → parezco, ofrecer → ofrezco, traducir → traduzco<\/em><\/td><\/tr><tr><td>-go (yo)<\/td><td><em>hacer → hago, poner → pongo, salir → salgo, venir → vengo, decir → digo, traer → traigo, oír → oigo<\/em><\/td><\/tr><tr><td>-uir → y<\/td><td><em>construir → construyo, incluir → incluyo, huir → huyo<\/em><\/td><\/tr><tr><td>Schreibänderung<\/td><td><em>buscar → busqué, llegar → llegué, empezar → empecé, coger → cojo<\/em><\/td><\/tr><\/table><div class=\"tip\">Merke: Ist ein Verb im Präsens <em>yo<\/em> unregelmäßig (<em>tengo, conozco, hago<\/em>), ist es der ganze subjuntivo presente auch: <em>tenga, tengamos, conozca, haga<\/em>. Ausnahmen: <em>ser, estar, ir, dar, saber, haber<\/em> (<em>sea, esté, vaya, dé, sepa, haya<\/em>); Stammwechsel gilt nur in den stammbetonten Formen (<em>piense – pensemos<\/em>).<\/div>"}],"exercises":[{"type":"gap","title":"Grundformen unregelmäßiger Verben","task":"Setze die verlangte Form ein.","items":[{"q":"hacer – indefinido (él): ___","a":["hizo"],"de":"er machte"},{"q":"poner – Partizip: ___","a":["puesto"],"de":"gelegt, gestellt"},{"q":"saber – Präsens (yo): ___","a":["sé"],"de":"ich weiß"},{"q":"venir – Futur (yo): ___","a":["vendré"],"de":"ich werde kommen"},{"q":"conocer – subjuntivo presente (yo): ___","a":["conozca"],"de":"(dass) ich kenne"},{"q":"dormir – indefinido (ellos): ___","a":["durmieron"],"de":"sie schliefen"},{"q":"decir – indefinido (ellos): ___","a":["dijeron"],"de":"sie sagten"},{"q":"volver – Partizip: ___","a":["vuelto"],"de":"zurückgekehrt"},{"q":"ir – Imperativ (tú), bejaht: ___","a":["ve"],"de":"geh!"},{"q":"tener – subjuntivo imperfecto -ra (nosotros): ___","a":["tuviéramos"],"de":"(dass) wir hätten"}]},{"type":"choice","title":"Welche Form ist richtig?","task":"Wähle die korrekte Form.","items":[{"q":"querer – Futur (yo)","options":["queriré","querré","quierré"],"a":1,"why":"Verkürzter Futurstamm querr-."},{"q":"pedir – gerundio","options":["pediendo","pidiendo","pidendo"],"a":1,"why":"-ir-Stammwechsel e → i auch im gerundio."},{"q":"dar – subjuntivo presente (él)","options":["de","dé","dá"],"a":1,"why":"Akzent zur Unterscheidung von der Präposition de."},{"q":"estar – indefinido (yo)","options":["estuve","estuví","esté"],"a":0,"why":"Starker Stamm estuv- ohne Akzent."},{"q":"pensar – Präsens (nosotros)","options":["piensamos","pensamos"],"a":1,"why":"Kein Stammwechsel bei nosotros (endungsbetont)."},{"q":"leer – indefinido (ellos)","options":["leieron","leyeron","lieron"],"a":1,"why":"i zwischen Vokalen wird zu y."},{"q":"ser – Imperativ (tú)","options":["sé","se","sea"],"a":0,"why":"Imperativ von ser: sé (mit Akzent)."},{"q":"traer – indefinido (ellos)","options":["trajieron","trajeron","traieron"],"a":1,"why":"Nach -j- steht -eron."},{"q":"salir – Konditional (yo)","options":["saliría","saldría","salería"],"a":1,"why":"Stamm sald- wie im Futur."}]},{"type":"gap","title":"Verben im Satz","task":"Setze das Verb in der angegebenen Zeit und Person ein.","items":[{"q":"Anoche no (dormir, yo – indefinido) ___ nada.","a":["dormí"],"de":"Letzte Nacht habe ich gar nicht geschlafen."},{"q":"¿Quién (romper – perfecto) ___ la ventana?","a":["ha roto"],"de":"Wer hat das Fenster kaputt gemacht?"},{"q":"Mis padres (venir – indefinido) ___ a verme en mayo.","a":["vinieron"],"de":"Meine Eltern kamen mich im Mai besuchen."},{"q":"Si (tener, yo – subj. imperf.) ___ tiempo, te ayudaría.","a":["tuviera","tuviese"],"de":"Wenn ich Zeit hätte, würde ich dir helfen."},{"q":"¡No (ir, tú – Imperativ verneint) ___ solo por la noche!","a":["vayas"],"de":"Geh nachts nicht allein!"},{"q":"Cuando era pequeño, (ir, yo – imperfecto) ___ al colegio andando.","a":["iba"],"de":"Als ich klein war, ging ich zu Fuß zur Schule."},{"q":"Mañana (hacer – futuro) ___ calor.","a":["hará"],"de":"Morgen wird es heiß."},{"q":"(Poner, vosotros – Imperativ) ___ la mesa, por favor.","a":["Poned","poned"],"de":"Deckt bitte den Tisch."},{"q":"Ella (seguir – indefinido) ___ estudiando hasta tarde.","a":["siguió"],"de":"Sie lernte bis spät weiter."}]}],"cards":[{"f":"Bildung: pretérito perfecto","b":"haber (Präsens) + Partizip: he hablado"},{"f":"Bildung: pluscuamperfecto","b":"haber (Imperfekt) + Partizip: había comido"},{"f":"subj. imperfecto – Ableitung","b":"3. Pl. indefinido ohne -ron + -ra/-se: tuvieron → tuviera/tuviese"},{"f":"verneinter Imperativ – Ableitung","b":"aus dem subjuntivo presente: no hables, no comáis"},{"f":"ser – Präsens","b":"soy, eres, es, somos, sois, son"},{"f":"ser / ir – indefinido","b":"fui, fuiste, fue, fuimos, fuisteis, fueron (identisch)"},{"f":"ser – Imperativ (tú / vosotros)","b":"sé / sed"},{"f":"estar – indefinido","b":"estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron"},{"f":"haber – Präsens","b":"he, has, ha (hay), hemos, habéis, han"},{"f":"haber – subjuntivo presente","b":"haya, hayas, haya, hayamos, hayáis, hayan"},{"f":"tener – Futur","b":"tendré, tendrás, tendrá, tendremos, tendréis, tendrán"},{"f":"ir – Präsens","b":"voy, vas, va, vamos, vais, van"},{"f":"ir – imperfecto","b":"iba, ibas, iba, íbamos, ibais, iban"},{"f":"ir – Imperativ (tú / vosotros) / gerundio","b":"ve / id – yendo"},{"f":"hacer – indef. / Futur / Partizip","b":"hice, hizo / haré / hecho"},{"f":"decir – indef. / Futur / Partizip","b":"dije, dijo / diré / dicho"},{"f":"poner – indef. / Futur / Partizip","b":"puse, puso / pondré / puesto"},{"f":"poder – indef. / Futur","b":"pude, pudo / podré"},{"f":"querer – indef. / Futur","b":"quise, quiso / querré"},{"f":"saber – Präsens yo / subj. / indef.","b":"sé / sepa / supe"},{"f":"venir – indef. / Futur","b":"vine, vino / vendré"},{"f":"salir / valer – Futur","b":"saldré / valdré"},{"f":"caber – Präsens yo / indef.","b":"quepo / cupe"},{"f":"conducir – indef. (yo / ellos)","b":"conduje / condujeron"},{"f":"unregelmäßige Partizipien","b":"abierto, cubierto, dicho, escrito, hecho, muerto, puesto, roto, visto, vuelto"},{"f":"Stammwechsel e → ie","b":"pensar: pienso, piensas, piensa, pensamos, pensáis, piensan"},{"f":"Stammwechsel o → ue","b":"volver: vuelvo, vuelves, vuelve, volvemos, volvéis, vuelven"},{"f":"-ir: e → i im indefinido","b":"pedir: pidió, pidieron; sentir: sintió, sintieron"},{"f":"gerundio dormir / pedir / leer","b":"durmiendo / pidiendo / leyendo"},{"f":"-zco / -go (yo)","b":"conozco, traduzco / hago, pongo, salgo, traigo, oigo"}],"id":"k28"},{"nr":29,"title":"Spanien und Lateinamerika","teil":"Anhang","intro":"Spanisch wird in über zwanzig Ländern gesprochen. Grammatik und Grundwortschatz sind überall gleich, doch Anrede, Aussprache und einige Wörter unterscheiden sich – das Wichtigste dazu im Überblick.","sections":[{"h":"ustedes statt vosotros, usted und Höflichkeit","html":"<p>In ganz Lateinamerika (und auf den Kanaren, teilweise in Westandalusien) gibt es <b>kein vosotros<\/b>. Für mehrere Personen sagt man immer <em>ustedes<\/em> – auch zu Freunden und Kindern. Das Verb steht in der 3. Person Plural:<\/p><table><tr><th>Spanien<\/th><th>Lateinamerika<\/th><\/tr><tr><td><em>¿Vosotros venís a la fiesta?<\/em><\/td><td><em>¿Ustedes vienen a la fiesta?<\/em><\/td><\/tr><tr><td><em>Os espero en la puerta.<\/em><\/td><td><em>Los espero en la puerta.<\/em><\/td><\/tr><tr><td><em>¡Sentaos!<\/em><\/td><td><em>¡Siéntense!<\/em><\/td><\/tr><tr><td><em>vuestra casa<\/em><\/td><td><em>su casa / la casa de ustedes<\/em><\/td><\/tr><\/table><p><b>usted<\/b> wird in vielen Ländern häufiger verwendet als in Spanien, wo man schnell zum <em>tú<\/em> übergeht. In Kolumbien oder Costa Rica siezen sich manchmal sogar Familienmitglieder (<em>ustedeo<\/em>).<\/p><ul><li>Typisch höflich: <em>¿Mande?<\/em> (Mexiko, „Wie bitte?“), <em>A la orden.<\/em> (Kolumbien, Venezuela: „Gern geschehen / Zu Diensten“), <em>Con permiso.<\/em><\/li><\/ul><div class=\"tip\">Für Reisen nach Lateinamerika: Im Zweifel mit <em>usted<\/em> beginnen und auf das Gegenüber achten.<\/div>"},{"h":"Der voseo","html":"<p>In Argentinien, Uruguay, Paraguay und weiten Teilen Mittelamerikas ersetzt <b>vos<\/b> das <em>tú<\/em>. Die Verbformen sind endungsbetont und meist <b>ohne Stammwechsel<\/b>:<\/p><table><tr><th>Infinitiv<\/th><th>tú<\/th><th>vos<\/th><\/tr><tr><td><em>hablar<\/em><\/td><td><em>hablas<\/em><\/td><td><em>hablás<\/em><\/td><\/tr><tr><td><em>comer<\/em><\/td><td><em>comes<\/em><\/td><td><em>comés<\/em><\/td><\/tr><tr><td><em>vivir<\/em><\/td><td><em>vives<\/em><\/td><td><em>vivís<\/em><\/td><\/tr><tr><td><em>tener<\/em><\/td><td><em>tienes<\/em><\/td><td><em>tenés<\/em><\/td><\/tr><tr><td><em>poder<\/em><\/td><td><em>puedes<\/em><\/td><td><em>podés<\/em><\/td><\/tr><tr><td><em>ser<\/em><\/td><td><em>eres<\/em><\/td><td><em>sos<\/em><\/td><\/tr><\/table><p><b>Imperativ<\/b>: Infinitiv ohne <em>-r<\/em>, mit Akzent: <em>hablá, comé, vení, decí, poné, salí<\/em>. Mit Pronomen: <em>decime<\/em> (sag mir), <em>contame<\/em> (erzähl mir), <em>sentate<\/em> (setz dich). Statt eines Imperativs von <em>ir<\/em> sagt man <em>andá<\/em>.<\/p><ul><li>Subjekt und nach Präposition: <em>vos<\/em> – <em>Esto es para vos.<\/em><\/li><li>Objekt- und Reflexivpronomen bleibt <em>te<\/em>, Possessiv <em>tu<\/em>: <em>¿Vos te acordás de tu primer día?<\/em><\/li><\/ul><div class=\"tip\">Als Lerner musst du den voseo nicht aktiv benutzen, solltest ihn aber verstehen – z. B. in argentinischen Filmen: <em>¿Vos qué querés?<\/em> – Was willst du?<\/div>"},{"h":"Aussprache: seseo und mehr","html":"<ul><li><b>seseo<\/b>: In Lateinamerika, auf den Kanaren und in Teilen Andalusiens werden <em>z<\/em> und <em>c<\/em> (vor e, i) wie <b>s<\/b> gesprochen. <em>cien<\/em> und <em>sien<\/em>, <em>casa<\/em> und <em>caza<\/em> klingen gleich.<\/li><li>In Nord- und Zentralspanien unterscheidet man: <em>z/ce/ci<\/em> wie englisches <b>th<\/b> in „think“, <em>s<\/em> wie s.<\/li><li><b>yeísmo<\/b>: <em>ll<\/em> und <em>y<\/em> klingen fast überall gleich (<em>pollo<\/em> = <em>poyo<\/em>). Am Río de la Plata klingen beide wie „sch“: <em>yo<\/em> ≈ „scho“, <em>calle<\/em> ≈ „casche“.<\/li><li>In der Karibik, in Andalusien und anderswo wird <em>s<\/em> am Silbenende oft gehaucht oder verschluckt: <em>los amigos<\/em> ≈ „loh amigo“.<\/li><\/ul><div class=\"warn\">Achtung: Die Aussprache ändert nichts an der Rechtschreibung. Wer <em>seseo<\/em> spricht, schreibt trotzdem <em>cerveza, hacer, zapato<\/em>.<\/div>"},{"h":"Wortschatzunterschiede","html":"<table><tr><th>Deutsch<\/th><th>Spanien<\/th><th>Lateinamerika<\/th><\/tr><tr><td>Auto<\/td><td><em>el coche<\/em><\/td><td><em>el carro<\/em> (Mex., Kol.), <em>el auto<\/em> (Arg., Chile)<\/td><\/tr><tr><td>Computer<\/td><td><em>el ordenador<\/em><\/td><td><em>la computadora<\/em><\/td><\/tr><tr><td>Handy<\/td><td><em>el móvil<\/em><\/td><td><em>el celular<\/em><\/td><\/tr><tr><td>Auto fahren<\/td><td><em>conducir<\/em><\/td><td><em>manejar<\/em><\/td><\/tr><tr><td>Saft<\/td><td><em>el zumo<\/em><\/td><td><em>el jugo<\/em><\/td><\/tr><tr><td>Kartoffel<\/td><td><em>la patata<\/em><\/td><td><em>la papa<\/em><\/td><\/tr><tr><td>Wohnung<\/td><td><em>el piso<\/em><\/td><td><em>el departamento / apartamento<\/em><\/td><\/tr><tr><td>Fahrkarte<\/td><td><em>el billete<\/em><\/td><td><em>el boleto<\/em><\/td><\/tr><tr><td>Brille<\/td><td><em>las gafas<\/em><\/td><td><em>los lentes / anteojos<\/em><\/td><\/tr><tr><td>okay<\/td><td><em>vale<\/em><\/td><td><em>dale<\/em> (Arg.), <em>órale<\/em> (Mex.)<\/td><\/tr><\/table><div class=\"warn\">Achtung: <em>coger<\/em> (nehmen, greifen) ist in Spanien völlig neutral: <em>Cojo el autobús.<\/em> In Mexiko, Argentinien und weiteren Ländern ist es vulgär. Dort sagt man <em>tomar<\/em> oder <em>agarrar<\/em>: <em>Tomo el colectivo.<\/em><\/div>"},{"h":"Zeiten, Pronomen und Diminutive","html":"<p><b>perfecto oder indefinido?<\/b> In Spanien steht für Handlungen in einem noch andauernden Zeitraum (heute, diese Woche) das <em>pretérito perfecto<\/em>. Lateinamerika (und Galicien, Asturien, die Kanaren) nimmt dafür meist das <em>indefinido<\/em>:<\/p><table><tr><th>Spanien<\/th><th>Lateinamerika<\/th><\/tr><tr><td><em>Hoy he desayunado tarde.<\/em><\/td><td><em>Hoy desayuné tarde.<\/em><\/td><\/tr><tr><td><em>¿Ya has hablado con ella?<\/em><\/td><td><em>¿Ya hablaste con ella?<\/em><\/td><\/tr><\/table><p><b>Pronomen<\/b>: In Teilen Spaniens hört man für männliche Personen <em>le<\/em> statt <em>lo<\/em> (<em>A Juan le vi ayer<\/em>, sog. leísmo). In Lateinamerika fast immer <em>lo<\/em>: <em>A Juan lo vi ayer.<\/em><\/p><p><b>Diminutive<\/b> auf <em>-ito/-ita<\/em> sind in Lateinamerika sehr verbreitet und machen Aussagen freundlicher oder höflicher: <em>un cafecito, un momentito, cerquita, despacito<\/em>.<\/p><ul><li><em>ahorita<\/em> (bes. Mexiko) = „gleich“ – aber das kann in fünf Minuten oder in zwei Stunden sein.<\/li><li>In Spanien gibt es regionale Endungen: <em>-illo<\/em> (Andalusien), <em>-ín<\/em> (Asturien), <em>-ico<\/em> (Aragón, Murcia).<\/li><\/ul><div class=\"tip\">Wer in Spanien gelernt hat, wird in Lateinamerika problemlos verstanden – und umgekehrt. Die Grammatik ist überall dieselbe; die Unterschiede betreffen vor allem Anrede, Aussprache und Wortschatz.<\/div>"}],"exercises":[{"type":"choice","title":"Spanien oder Lateinamerika?","task":"Welches Wort ist in Lateinamerika (z. B. Mexiko) üblich?","items":[{"q":"Handy","options":["el móvil","el celular"],"a":1,"why":"In Lateinamerika sagt man el celular."},{"q":"Computer","options":["el ordenador","la computadora"],"a":1,"why":"Lateinamerika: la computadora."},{"q":"Auto fahren","options":["manejar","conducir"],"a":0,"why":"Lateinamerika: manejar."},{"q":"Kartoffeln","options":["las patatas","las papas"],"a":1,"why":"Lateinamerika (und Kanaren): las papas."},{"q":"Orangensaft","options":["jugo de naranja","zumo de naranja"],"a":0,"why":"Lateinamerika: el jugo."},{"q":"„Ich nehme den Bus.“ (neutral in Mexiko)","options":["Cojo el autobús.","Tomo el camión."],"a":1,"why":"coger ist in Mexiko vulgär; Bus heißt dort umgangssprachlich camión."},{"q":"Fahrkarte","options":["el billete","el boleto"],"a":1,"why":"Lateinamerika: el boleto."},{"q":"Auto (Mexiko, Kolumbien)","options":["el coche","el carro"],"a":1,"why":"In Mexiko und Kolumbien: el carro."}]},{"type":"gap","title":"voseo","task":"Setze die vos-Form ein (Präsens oder Imperativ).","items":[{"q":"Vos (tener) ___ razón.","a":["tenés"],"de":"Du hast recht."},{"q":"¿De dónde (ser) ___ vos?","a":["sos"],"de":"Woher kommst du?"},{"q":"Vos (hablar) ___ muy bien alemán.","a":["hablás"],"de":"Du sprichst sehr gut Deutsch."},{"q":"¿(Poder) ___ venir mañana, vos?","a":["Podés","podés"],"de":"Kannst du morgen kommen?"},{"q":"¿Vos (vivir) ___ en Montevideo?","a":["vivís"],"de":"Wohnst du in Montevideo?"},{"q":"(venir, Imperativ) ___ acá un momento.","a":["Vení","vení"],"de":"Komm mal kurz her."},{"q":"(decir + me, Imperativ) ___ la verdad.","a":["Decime","decime"],"de":"Sag mir die Wahrheit."},{"q":"(mirar, Imperativ) ___ este video, es buenísimo.","a":["Mirá","mirá"],"de":"Schau dir dieses Video an, es ist super."}]},{"type":"choice","title":"Anrede und Zeiten","task":"Wähle die passende Form für die angegebene Region.","items":[{"q":"Mexiko, zu zwei Freunden: ¿___ venir al cine?","options":["Queréis","Quieren"],"a":1,"why":"In Lateinamerika gibt es kein vosotros → ustedes quieren."},{"q":"Madrid, zu zwei Freunden: ¿___ venir al cine?","options":["Queréis","Quieren"],"a":0,"why":"In Spanien duzt man mehrere Freunde mit vosotros."},{"q":"Bogotá, zu Kindern: „Setzt euch!“","options":["¡Sentaos!","¡Siéntense!"],"a":1,"why":"ustedes-Imperativ, auch gegenüber Kindern."},{"q":"Spanien: Hoy ___ temprano.","options":["me he levantado","me levanté"],"a":0,"why":"In Spanien steht bei „hoy“ meist das perfecto."},{"q":"Argentinien: Hoy ___ temprano.","options":["me he levantado","me levanté"],"a":1,"why":"Lateinamerika bevorzugt das indefinido."},{"q":"Buenos Aires: „Was willst du?“","options":["¿Qué querés?","¿Qué quieres vos?","¿Qué queréis?"],"a":0,"why":"voseo: vos querés (ohne Stammwechsel)."},{"q":"Sevilla, zu einer Freundin: „Ich warte auf euch“ (sie und ihr Bruder).","options":["Os espero.","Los espero."],"a":0,"why":"In Spanien: Pronomen os für vosotros."},{"q":"Mexiko: „gleich, sofort (aber vage)“","options":["ahorita","ahora mismo"],"a":0,"why":"ahorita ist das typisch mexikanische, oft dehnbare „gleich“."}]}],"cards":[{"f":"vosotros in Lateinamerika","b":"ustedes (immer, auch unter Freunden): ¿Ustedes vienen?"},{"f":"Os espero. (Lateinamerika)","b":"Los espero."},{"f":"voseo – Gebiete","b":"Argentinien, Uruguay, Paraguay, große Teile Mittelamerikas"},{"f":"vos + tener / poder / ser","b":"tenés / podés / sos"},{"f":"vos + hablar / comer / vivir","b":"hablás / comés / vivís"},{"f":"vos – Imperativ venir / decir + me","b":"vení / decime"},{"f":"vos – Imperativ von ir","b":"andá"},{"f":"seseo","b":"z und c (vor e, i) wie s: casa = caza"},{"f":"Auto (Spanien / Mex. / Arg.)","b":"el coche / el carro / el auto"},{"f":"Computer (Spanien / LA)","b":"el ordenador / la computadora"},{"f":"Handy (Spanien / LA)","b":"el móvil / el celular"},{"f":"Auto fahren (Spanien / LA)","b":"conducir / manejar"},{"f":"coger in Lateinamerika","b":"oft vulgär – besser tomar oder agarrar"},{"f":"Saft / Kartoffel (LA)","b":"el jugo / la papa"},{"f":"Hoy he comido. (LA)","b":"Hoy comí. (indefinido statt perfecto)"},{"f":"ahorita","b":"„gleich“ (Mexiko) – dehnbar"},{"f":"Diminutiv in LA","b":"sehr verbreitet: un cafecito, un momentito, cerquita"},{"f":"Wie bitte? (Mexiko)","b":"¿Mande?"}],"id":"k29"}]</script>
<script>
(function(){
const CH = JSON.parse(document.getElementById('data').textContent);
const byId = {}; CH.forEach(c=>byId[c.id]=c);
const $ = s=>document.querySelector(s);
const app=$('#app'), top=$('#top'), tabs=$('#tabs');

/* ---- per-viewer progress (best effort) ---- */
let P={};
try{ P=JSON.parse(localStorage.getItem('esgr-progress')||'{}')||{}; }catch(e){ P={}; }
function save(){ try{ localStorage.setItem('esgr-progress',JSON.stringify(P)); }catch(e){} }
function prog(id){ return P[id]||(P[id]={ex:{},cards:{}}); }
function chapterPct(c){
  const p=P[c.id]; if(!p) return 0;
  const tot=c.exercises.length + 1; let got=0;
  c.exercises.forEach((e,i)=>{ const s=p.ex[i]; if(s) got+=s.r/s.n; });
  const known=Object.values(p.cards||{}).filter(v=>v===1).length;
  got += c.cards.length? known/c.cards.length : 0;
  return Math.round(100*got/tot);
}

const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const label=c=> (String(c.nr).includes('.')? 'Überblick' : 'Kapitel '+c.nr);
function ring(p){
  const r=12, C=2*Math.PI*r, d=C*p/100;
  return `<svg class="ring" viewBox="0 0 30 30" aria-label="${p} Prozent"><circle cx="15" cy="15" r="${r}" fill="none" stroke="var(--line)" stroke-width="3"/>`+
    `<circle cx="15" cy="15" r="${r}" fill="none" stroke="${p>=80?'var(--green)':'var(--blue)'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${d} ${C}" transform="rotate(-90 15 15)"/>`+
    `<text x="15" y="18.5" text-anchor="middle" font-size="8.5" fill="var(--muted)" font-family="sans-serif">${p}</text></svg>`;
}

/* ---- routing: #home, #k11, #k11-ueben, #k11-karten, #mix ---- */
function go(h){ if(location.hash!=='#'+h) location.hash=h; else render(); }
window.addEventListener('hashchange',render);

function render(){
  const h=(location.hash||'#home').slice(1);
  window.scrollTo(0,0);
  if(h==='mix') return renderMix();
  const m=h.match(/^(k\d+b?)(?:-(ueben|karten))?$/);
  if(m && byId[m[1]]) return renderChapter(byId[m[1]], m[2]||'lernen');
  renderHome();
}

/* ---- home ---- */
function renderHome(){
  tabs.hidden=true;
  top.innerHTML=`<div class="t">Spanisch-Grammatik</div>`;
  const totalEx=CH.reduce((a,c)=>a+c.exercises.reduce((b,e)=>b+e.items.length,0),0);
  const totalCards=CH.reduce((a,c)=>a+c.cards.length,0);
  const known=CH.reduce((a,c)=>a+Object.values((P[c.id]||{}).cards||{}).filter(v=>v===1).length,0);
  let last=null; try{ last=localStorage.getItem('esgr-last'); }catch(e){}
  let html=`<section class="hero"><h1>Gramática española</h1>
    <p>Merkblätter, Übungen und Lernkarten zu allen Kapiteln der spanischen Grammatik, von der Aussprache bis zum subjuntivo. Antippen, lernen, prüfen.</p>
    <div class="stats"><div class="stat"><b>${CH.length}</b>Kapitel</div><div class="stat"><b>${totalEx}</b>Übungssätze</div><div class="stat"><b>${known}/${totalCards}</b>Karten gewusst</div></div>
    <div class="quick">
      ${last&&byId[last]?`<button class="qbtn" data-go="${last}">Weiterlernen<small>${esc(byId[last].title)}</small></button>`:`<button class="qbtn" data-go="k01">Loslegen<small>Kapitel 1</small></button>`}
      <button class="qbtn alt" data-go="mix">Gemischte Karten<small>20 aus allen Kapiteln</small></button>
    </div>
    <input class="search" id="q" type="search" placeholder="Suchen, z. B. por, subjuntivo, Uhrzeit" autocomplete="off">
    <div id="hits"></div></section>`;
  let teil=null;
  CH.forEach((c,i)=>{
    if(c.teil!==teil){ if(teil!==null) html+='</div>'; teil=c.teil; html+=`<div class="teil">${esc(teil)}</div><div class="list">`; }
    html+=`<button class="row" data-go="${c.id}"><span class="n">${String(c.nr).includes('.')?'·':c.nr}</span><span class="tt"><b>${esc(c.title)}</b><small>${c.sections.length} Abschnitte · ${c.exercises.length} Übungen · ${c.cards.length} Karten</small></span>${ring(chapterPct(c))}</button>`;
  });
  html+='</div>';
  app.innerHTML=html;
  const q=$('#q'), hits=$('#hits');
  q.addEventListener('input',()=>{
    const t=q.value.trim().toLowerCase();
    if(t.length<2){ hits.innerHTML=''; return; }
    const out=[];
    CH.forEach(c=>c.sections.forEach((s,si)=>{
      const plain=(s.h+' '+s.html.replace(/<[^>]+>/g,' ')).toLowerCase();
      if(plain.includes(t)) out.push({c,si,s});
    }));
    hits.innerHTML = out.length? `<div class="list" style="margin-top:8px">`+out.slice(0,25).map(o=>`<button class="hit" data-go="${o.c.id}" data-sec="${o.si}"><b>${esc(o.s.h)}</b><small>${label(o.c)} · ${esc(o.c.title)}</small></button>`).join('')+`</div>` : `<p class="empty">Nichts gefunden.</p>`;
  });
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-go]'); if(!b) return;
  const sec=b.dataset.sec;
  go(b.dataset.go);
  if(sec!=null) setTimeout(()=>{ const el=document.getElementById('s'+sec); if(el) el.scrollIntoView({behavior:'smooth'}); },60);
});

/* ---- chapter ---- */
function renderChapter(c,tab){
  try{ localStorage.setItem('esgr-last',c.id); }catch(e){}
  tabs.hidden=false;
  tabs.querySelectorAll('.tab').forEach(t=>{ t.setAttribute('aria-selected', t.dataset.tab===tab?'true':'false'); t.onclick=()=>go(c.id+(t.dataset.tab==='lernen'?'':'-'+t.dataset.tab)); });
  top.innerHTML=`<button class="back" data-home aria-label="Zur Übersicht"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg>Inhalt</button><div class="t">${esc(c.title)}</div><span class="num">${String(c.nr).includes('.')?'':c.nr}</span>`;
  top.querySelector('[data-home]').onclick=()=>go('home');
  const idx=CH.indexOf(c), prev=CH[idx-1], next=CH[idx+1];
  const nav=`<div class="next">${prev?`<button class="btn ghost" data-go="${prev.id}">‹ ${esc(prev.title)}</button>`:''}${next?`<button class="btn ghost" data-go="${next.id}">${esc(next.title)} ›</button>`:''}</div>`;
  const head=`<header class="chhead"><div class="kn">${label(c)} · ${esc(c.teil)}</div><h1>${esc(c.title)}</h1>${tab==='lernen'?`<p>${esc(c.intro)}</p>`:''}</header>`;
  if(tab==='lernen'){
    app.innerHTML=head+`<div class="toc">${c.sections.map((s,i)=>`<button class="chip" data-sec="${i}">${esc(s.h)}</button>`).join('')}</div>`+
      c.sections.map((s,i)=>`<section class="sec" id="s${i}"><h2>${esc(s.h)}</h2>${s.html.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>')}</section>`).join('')+
      `<div class="bar"><button class="btn" data-go="${c.id}-ueben">Jetzt üben</button><button class="btn sec2" data-go="${c.id}-karten">Lernkarten</button></div>`+nav;
    app.querySelectorAll('.toc .chip').forEach(b=>b.onclick=()=>document.getElementById('s'+b.dataset.sec).scrollIntoView({behavior:'smooth'}));
  } else if(tab==='ueben'){
    app.innerHTML=head+c.exercises.map((e,i)=>exHTML(c,e,i)).join('')+nav;
    c.exercises.forEach((e,i)=>wireEx(c,e,i));
  } else {
    app.innerHTML=head+`<div id="cards"></div>`+nav;
    runCards($('#cards'), c.cards.map((x,i)=>({...x,cid:c.id,i})), c.id);
  }
}

/* ---- exercises ---- */
function norm(s){ return String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/\s+/g,' ').replace(/\s*'\s*/g,"'").replace(/[!?.,;:]+$/,'').trim(); }
function deacc(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,''); }
function exHTML(c,e,i){
  const s=(P[c.id]&&P[c.id].ex[i]);
  let h=`<section class="ex" id="ex${i}"><span class="score" id="sc${i}">${s?`zuletzt ${s.r}/${s.n}`:''}</span><h2>${esc(e.title||('Übung '+(i+1)))}</h2><p class="task">${esc(e.task||'')}</p>`;
  e.items.forEach((it,j)=>{
    if(e.type==='gap'){
      const parts=it.q.split('___');
      h+=`<div class="it"><div class="q"><span class="ix">${j+1}.</span><em>${esc(parts[0])}</em><input class="gap" id="g${i}-${j}" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" aria-label="Lücke ${j+1}"><em>${esc(parts.slice(1).join('___'))}</em></div>${it.de?`<span class="de">${esc(it.de)}</span>`:''}<div class="fb" id="f${i}-${j}"></div></div>`;
    } else {
      h+=`<div class="it"><div class="q"><span class="ix">${j+1}.</span><em>${esc(it.q)}</em></div><div class="opts">${it.options.map((o,k)=>`<button class="opt" data-k="${k}" id="o${i}-${j}-${k}">${esc(o)}</button>`).join('')}</div><div class="why" id="w${i}-${j}" hidden></div></div>`;
    }
  });
  h+= e.type==='gap'
    ? `<div class="bar"><button class="btn" data-check>Prüfen</button><button class="btn sec2" data-show>Lösungen zeigen</button><button class="btn ghost" data-reset>Neu</button></div>`
    : `<div class="bar"><button class="btn ghost" data-reset>Neu</button></div>`;
  return h+`</section>`;
}
function record(c,i,r,n){ prog(c.id).ex[i]={r,n}; save(); const sc=document.getElementById('sc'+i); if(sc) sc.textContent=`${r}/${n} richtig`; }
function wireEx(c,e,i){
  const box=document.getElementById('ex'+i);
  if(e.type==='gap'){
    const check=()=>{
      let r=0;
      e.items.forEach((it,j)=>{
        const inp=document.getElementById(`g${i}-${j}`), fb=document.getElementById(`f${i}-${j}`);
        const v=norm(inp.value); const sols=it.a.map(norm);
        inp.classList.remove('ok','bad','near');
        if(!v){ fb.className='fb'; fb.textContent=''; return; }
        if(sols.includes(v)){ inp.classList.add('ok'); fb.className='fb ok'; fb.textContent='Richtig'+(it.a.length>1?' · auch: '+it.a.filter(a=>norm(a)!==v).join(', '):''); r++; }
        else if(sols.map(deacc).includes(deacc(v))){ inp.classList.add('near'); fb.className='fb near'; fb.textContent='Fast: Akzent prüfen → '+it.a[0]; }
        else { inp.classList.add('bad'); fb.className='fb bad'; fb.textContent='Lösung: '+it.a.join(' / '); }
      });
      record(c,i,r,e.items.length);
    };
    box.querySelector('[data-check]').onclick=check;
    box.querySelector('[data-show]').onclick=()=>e.items.forEach((it,j)=>{ const fb=document.getElementById(`f${i}-${j}`); fb.className='fb ok'; fb.textContent='Lösung: '+it.a.join(' / '); });
    box.querySelectorAll('.gap').forEach((inp,j,all)=>inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); if(all[j+1]) all[j+1].focus(); else { inp.blur(); check(); } } }));
  } else {
    let answered=0, right=0;
    e.items.forEach((it,j)=>{
      const opts=[...box.querySelectorAll(`[id^="o${i}-${j}-"]`)];
      opts.forEach(b=>b.onclick=()=>{
        const k=+b.dataset.k; opts.forEach(o=>o.disabled=true);
        opts[it.a].classList.add('ok'); if(k!==it.a) b.classList.add('bad'); else right++;
        answered++;
        const w=document.getElementById(`w${i}-${j}`); if(it.why){ w.textContent=it.why; w.hidden=false; }
        if(answered===e.items.length) record(c,i,right,e.items.length);
      });
    });
  }
  box.querySelector('[data-reset]').onclick=()=>{
    const fresh=document.createElement('div'); fresh.innerHTML=exHTML(c,e,i); box.replaceWith(fresh.firstElementChild); wireEx(c,e,i);
  };
}

/* ---- flashcards ---- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function runCards(el, deck, cid){
  let queue=shuffle(deck), pos=0, good=0, again=[];
  function show(){
    if(pos>=queue.length){
      if(again.length){ queue=shuffle(again); again=[]; pos=0; }
      else { el.innerHTML=`<div class="done"><h2>¡Muy bien!</h2><p class="empty">${good} Karten gewusst.</p><div class="bar" style="justify-content:center"><button class="btn" id="cagain">Nochmal mischen</button></div></div>`; $('#cagain').onclick=()=>runCards(el,deck,cid); return; }
    }
    const k=queue[pos]; const src=cid?'':`${esc(byId[k.cid].title)}`;
    el.innerHTML=`<div class="cardwrap"><div class="cardmeta"><span>Karte ${pos+1} von ${queue.length}</span><span>${again.length?again.length+' zum Wiederholen':''}</span></div>
      <div class="fc" id="fc" role="button" tabindex="0" aria-label="Karte umdrehen"><div class="inner">
        <div class="face"><span class="lab">Frage</span><div class="tx">${esc(k.f)}</div>${src?`<div class="src">${src}</div>`:''}</div>
        <div class="face back"><span class="lab">Antwort</span><div class="tx">${esc(k.b)}</div></div>
      </div></div>
      <div class="cardbtns"><button class="btn no" id="cno">Nochmal</button><button class="btn yes" id="cyes">Gewusst</button></div>
      <p class="empty" style="text-align:center;font-size:14px">Tippe auf die Karte zum Umdrehen.</p></div>`;
    const fc=$('#fc'); const flip=()=>fc.classList.toggle('flip');
    fc.onclick=flip; fc.onkeydown=ev=>{ if(ev.key===' '||ev.key==='Enter'){ ev.preventDefault(); flip(); } };
    $('#cyes').onclick=()=>{ prog(k.cid).cards[k.i]=1; save(); good++; pos++; show(); };
    $('#cno').onclick=()=>{ prog(k.cid).cards[k.i]=0; save(); again.push(k); pos++; show(); };
  }
  show();
}
function renderMix(){
  tabs.hidden=true;
  top.innerHTML=`<button class="back" data-home><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg>Inhalt</button><div class="t">Gemischte Karten</div>`;
  top.querySelector('[data-home]').onclick=()=>go('home');
  const all=[]; CH.forEach(c=>c.cards.forEach((x,i)=>all.push({...x,cid:c.id,i})));
  // bevorzugt Karten, die noch nicht gewusst wurden
  const unknown=all.filter(k=>((P[k.cid]||{}).cards||{})[k.i]!==1);
  const pool=shuffle(unknown.length>=20?unknown:all).slice(0,20);
  app.innerHTML=`<header class="chhead"><div class="kn">Alle Kapitel</div><h1>20 gemischte Karten</h1><p>Karten, die du noch nicht gewusst hast, kommen zuerst.</p></header><div id="cards"></div>`;
  runCards($('#cards'), pool, null);
}

render();
})();
</script>
